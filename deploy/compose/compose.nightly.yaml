# The nightly channel. Unsupported.
#
# A nightly build is whatever `main` was the night it was built, or when someone dispatched one. It carries no release
# promise: its schema may be ahead of any published migration, its configuration keys may have moved, and no version
# it reports means anything outside the commit it was built from. It is development output, published so a change can
# be tried, and it is never a release.
#
# This overlay exists so that using one is a decision rather than an accident, and it is deliberately awkward:
#
#   MAILFATHOM_NIGHTLY_ACKNOWLEDGED=i-understand-this-is-unsupported \
#   MAILFATHOM_NIGHTLY_TAG=<the nightly identifier> \
#   docker compose -f compose.yaml -f compose.nightly.yaml up -d
#
# Leaving either variable out fails immediately with the reason. Nothing in compose.yaml names a nightly image, so a
# deployment that does not name this file cannot reach one however it is configured.
#
# What the acknowledgement is, precisely: Compose's `${VAR:?…}` can require that a variable *has* a value and nothing
# more — it has no equality operator — so any non-empty string gets past it and the phrase above is the one to use
# rather than one that is checked. That is the whole guarantee here, and it is deliberately a smaller one than the
# chart's: the Helm equivalent runs a template function and does compare the phrase exactly. What both actually buy is
# the same thing, and it is not enforcement — it is that nobody reaches a nightly image without reading a sentence
# saying it is not a release.
#
# The identifier to name is the `<x.y.z>-nightly.<n>-<short revision>` tag of one night's build rather than the moving
# `nightly` tag, so what a deployment runs does not change under it. That identifier is also what makes a nightly a
# nightly: both registries carry both channels, so the reference says which one it is and the hostname says nothing.
# The package is public, so the pull needs no registry login.
#
# `MAILFATHOM_NIGHTLY_REGISTRY` is therefore a convenience rather than a control. It defaults to the registry this
# overlay was written against and accepts the other, because the two carry the same digest under the same tag.

services:
  mailfathom:
    image: ${MAILFATHOM_NIGHTLY_REGISTRY:-ghcr.io}/krzysztof318/mailfathom:${MAILFATHOM_NIGHTLY_TAG:?Name the nightly identifier to deploy. Nightly builds are unsupported development output and carry no release promise.}
    build: !reset null
    labels:
      # Readable from `docker inspect` and from any monitoring that reads labels, so a container started from this
      # overlay months ago still says what it is. The value is the one the image itself carries under the same name, so
      # a query for the channel gets one answer whether it asks the container or the image it was started from.
      io.mailfathom.release-channel: "nightly"
    environment:
      MAILFATHOM_NIGHTLY_ACKNOWLEDGED: ${MAILFATHOM_NIGHTLY_ACKNOWLEDGED:?Set MAILFATHOM_NIGHTLY_ACKNOWLEDGED=i-understand-this-is-unsupported to deploy a nightly build. It is not a release, its schema and configuration may move without notice, and no support or upgrade path applies to it. Compose can only require that this variable is set; it cannot compare the phrase, which the Helm chart does.}
