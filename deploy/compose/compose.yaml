# The supported Docker Compose deployment for MailFathom.
#
# Read deploy/compose/.env.example before the first start: every value this file reads has a documented default, and
# the three files under secrets/ have to exist before anything comes up.
#
#   cp .env.example .env
#   docker compose up -d postgres
#   # apply the database schema — see docs/operations/deployment-compose.md
#   docker compose up -d
#
# This file applies no schema and contains nothing that can. MailFathom never applies a schema change while starting — it
# verifies the schema and refuses to serve against one it does not recognize — so bringing the stack up after a version
# change tells you whether a migration is outstanding rather than silently applying one. What answers that refusal is
# the release's own `mailfathom-schema-<version>.sql`, applied as an explicit operator action; the sequence and the
# command are in docs/operations/deployment-compose.md and docs/operations/database-schema.md.

name: mailfathom

services:
  postgres:
    # pgvector rather than plain postgres: the schema declares the `vector` extension, and the stock image cannot
    # create it. This is the same pin the local Aspire orchestration uses, so a schema reviewed locally is reviewed
    # against this server version.
    image: ${MAILFATHOM_POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg18}
    restart: unless-stopped
    environment:
      # The superuser of this container, used by initdb and by nothing else afterwards. The role MailFathom connects as is
      # created by the script below and is deliberately not this one.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser-password
      POSTGRES_DB: postgres
      MAILFATHOM_DATABASE: ${MAILFATHOM_DATABASE:-mailfathom}
      MAILFATHOM_DATABASE_ROLE: ${MAILFATHOM_DATABASE_ROLE:-mailfathom}
    secrets:
      - postgres-superuser-password
      - mailfathom-database-password
    volumes:
      # The parent rather than the data directory itself. PostgreSQL 18 moved this image's PGDATA into a
      # version-specific subdirectory and moved the declared volume up to `/var/lib/postgresql` with it, so mounting
      # the old path would leave the database in the container's writable layer and lose it with the container.
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory. It creates the unprivileged role and the database MailFathom uses, and
      # installs the `vector` extension while a superuser is still the one connected.
      - ./postgres/10-create-mailfathom-database.sh:/docker-entrypoint-initdb.d/10-create-mailfathom-database.sh:ro
    healthcheck:
      # Over TCP on purpose. The image's entrypoint runs `docker-entrypoint-initdb.d` against a temporary server that
      # listens on a Unix socket only, so a socket check can report ready while the initialization script has not yet
      # created the role, the database, or the extension — and `depends_on: service_healthy` would then start MailFathom
      # against a database that does not exist. Naming a host forces the check onto the final, TCP-listening server.
      # The database and user are given for readability rather than for enforcement: pg_isready reports the server's
      # state and does not verify either.
      test: ["CMD-SHELL", "pg_isready --quiet --host 127.0.0.1 --port 5432 --username postgres --dbname \"$${MAILFATHOM_DATABASE}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
    # No published port. The database is reachable from the service and from anything else an operator attaches to this
    # network, and from nothing else; publish one explicitly and temporarily when a backup, a schema step, or an
    # inspection needs it.
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_POSTGRES_CPU_LIMIT:-2}
          memory: ${MAILFATHOM_POSTGRES_MEMORY_LIMIT:-1g}

  mailfathom:
    # `mailfathom:local` is a name no registry can serve, so an operator who has configured nothing gets the image this
    # checkout builds and never a tag pulled from somewhere. Point MAILFATHOM_IMAGE at a published release to run one
    # instead — `krzysztof318/mailfathom:<version>` on ghcr.io or docker.io, the same digest either way. ADR 0004
    # defines the channels and the tags they carry.
    image: ${MAILFATHOM_IMAGE:-mailfathom:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: runtime
    # Build rather than pull. Without this, Compose treats a service carrying both `image` and `build` as pullable
    # first and only builds when the pull fails — and `mailfathom:local` is an unqualified name, so the attempt goes to
    # the configured registry, where an unrelated image published under that name would silently replace the checkout
    # this file promises to run. Set MAILFATHOM_PULL_POLICY=missing in the same edit that points MAILFATHOM_IMAGE at a
    # published release, so the two decisions stay one decision.
    pull_policy: ${MAILFATHOM_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The MCP endpoint's own port. MailFathom refuses ASPNETCORE_HTTP_PORTS: each surface states where it is served
      # in its own configuration section.
      McpEndpoint__Port: "8080"
      # The directory of JSON files below becomes ordinary configuration, layered under the environment block. See
      # docs/operations/configuration-sources.md for the precedence and for what a directory contributes.
      ConfigurationSources__Directory: /etc/mailfathom/config
      # Composed here from parts the operator configures separately, so the file holding the password stays a file:
      # only the password arrives through Persistence__Password, as a reference to the mounted secret.
      ConnectionStrings__mailfathom: "Host=postgres;Port=5432;Database=${MAILFATHOM_DATABASE:-mailfathom};Username=${MAILFATHOM_DATABASE_ROLE:-mailfathom}"
      Persistence__Password__Name: mailfathom-database-password
      Persistence__Password__SecretReference: file:/run/secrets/mailfathom-database-password
      # Personal-data scanning, off by default like the product. Turning it on is two variables in `.env` — this one and
      # COMPOSE_PROFILES=personal-data-scanning — because Compose cannot make an environment entry conditional on a
      # profile: the profile decides whether the analyzer container exists and this decides whether MailFathom asks it,
      # and enabling either alone is a deployment that does not work. The address defaults to the analyzer this file
      # starts, so an operator running their own analyzer overrides it and enables no profile.
      SensitiveContent__Pii__Enabled: ${MAILFATHOM_PERSONAL_DATA_SCANNING:-false}
      SensitiveContent__PersonalDataAnalyzer__Endpoint: ${MAILFATHOM_PERSONAL_DATA_ANALYZER:-http://presidio-analyzer:3000}
      # One entry per language the analyzer is asked in. An indexed key is how a list reaches .NET configuration through
      # the environment, and Compose expands no variable into several of them — so a second language is a second line
      # added here rather than a value in `.env`, and the numbering starts at zero and leaves no gap.
      SensitiveContent__PersonalDataAnalyzer__Languages__0: ${MAILFATHOM_PERSONAL_DATA_LANGUAGE:-en}
      #SensitiveContent__PersonalDataAnalyzer__Languages__1: pl
      SensitiveContent__PersonalDataAnalyzer__MinimumConfidence: ${MAILFATHOM_PERSONAL_DATA_MINIMUM_CONFIDENCE:-0.4}
      # Spam classification with a scanner, paired with the `spam-scanning` profile the same way: the profile decides
      # whether the daemon container exists and these decide whether MailFathom classifies and asks it. Both switches
      # are one variable because MailFathom refuses to start with a scanner switched on and classification off, and the
      # address defaults to the daemon this file starts. Classification without a scanner is the other half of the
      # feature and is set in ./config instead, where the folders it covers and the threshold it judges by already live.
      SpamClassification__Enabled: ${MAILFATHOM_SPAM_SCANNING:-false}
      SpamClassification__UseScanner: ${MAILFATHOM_SPAM_SCANNING:-false}
      SpamClassification__Scanner__Host: ${MAILFATHOM_SPAM_SCANNER_HOST:-spamassassin}
      SpamClassification__Scanner__Port: ${MAILFATHOM_SPAM_SCANNER_PORT:-783}
      SpamClassification__Scanner__ScanTimeoutSeconds: ${MAILFATHOM_SPAM_SCAN_TIMEOUT_SECONDS:-30}
      SpamClassification__Scanner__MaximumMessageBytes: ${MAILFATHOM_SPAM_SCAN_MAXIMUM_MESSAGE_BYTES:-512000}
      SpamClassification__Scanner__MaximumConcurrentScans: ${MAILFATHOM_SPAM_SCAN_MAXIMUM_CONCURRENT:-5}
    secrets:
      - mailfathom-database-password
    volumes:
      - type: bind
        source: ./config
        target: /etc/mailfathom/config
        read_only: true
      # Whatever the operator provisions: mailbox passwords, MCP API keys, a private trust anchor. A directory rather
      # than one Compose secret per credential, because adding an account would otherwise mean editing this tracked
      # file, and because /etc/mailfathom/secrets is the same path the Kubernetes deployment mounts its Secret at — a
      # `SecretReference` therefore reads identically in both shapes. The two database credentials stay Compose
      # secrets below, so the database superuser password is never on a path this service can read.
      - type: bind
        source: ./secrets/mailfathom
        target: /etc/mailfathom/secrets
        read_only: true
    ports:
      # Bound to loopback by default. MailFathom speaks plain HTTP and terminates no TLS of its own, so exposing this
      # port to a network means exposing synchronized mail without transport protection; put a reverse proxy in front
      # of it and change MAILFATHOM_HTTP_BIND only once that proxy is what listens publicly.
      - "${MAILFATHOM_HTTP_BIND:-127.0.0.1}:${MAILFATHOM_HTTP_PORT:-8080}:8080"
      # No port for the administrative endpoint, which this file leaves disabled. Its own default is 8080 as well, so
      # enabling it without stating a port serves it on the socket above rather than on one nobody published — which is
      # why enabling it is worth pairing with an AdminEndpoint__Port of its own and a mapping for that port here.
      # The probes, on a listener of their own. They answer without a credential, so what controls who can ask them is
      # which network the port is published to — here loopback, and never the same port the MCP endpoint is served on.
      # A probe path asked on 8080 is answered with 404, and so is `/mcp` asked on this one.
      - "${MAILFATHOM_HEALTH_BIND:-127.0.0.1}:${MAILFATHOM_HEALTH_PORT:-8081}:8081"
    # No health check. The image declares none — a chiseled image has no shell or HTTP client to run one in — and one
    # written here would need the same thing: a client inside the container. The probes are asked from outside instead,
    # on the port published above; docs/operations/health-endpoints.md states what each one answers.
    read_only: true
    tmpfs:
      # The one path the runtime needs to write. Everything else, /app included, is owned by root and mounted
      # read-only, so the process cannot rewrite its own code.
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Longer than the host's own shutdown budget, which is derived from MailSynchronization:ShutdownDrainTimeout, so
    # the process finishes draining and exits rather than being killed mid-run. Raise both together if a deployment
    # configures a longer drain.
    stop_grace_period: 60s
    networks:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_CPU_LIMIT:-2}
          memory: ${MAILFATHOM_MEMORY_LIMIT:-1g}

  presidio-analyzer:
    # Started only under its profile, which is what makes an opt-in nobody took cost nothing: no image is pulled, no
    # container exists, and none of the memory below is held. `docker compose up` without the profile brings up the same
    # two services it always did.
    profiles:
      - personal-data-scanning
    # An immutable tag, like the database image and unlike MailFathom's own: this is a dependency the deployment operates
    # rather than a version it chooses. It is the same pin the Helm chart and the integration suite use, so an analyzer
    # reviewed against one is the analyzer running in the others. MIT-licensed, and it loads an MIT-licensed spaCy model —
    # both are recorded in THIRD_PARTY_LICENSES.md. It is built for English alone, and a model is installed while the
    # image is built rather than while it starts, so an override here is how a deployment runs the analyzer in another
    # language — docs/operations/personal-data-analyzer-languages.md states what that takes.
    image: ${MAILFATHOM_PRESIDIO_IMAGE:-ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364}
    restart: unless-stopped
    healthcheck:
      # The analyzer's own route, and the reason the service has a check at all: the container loads a language model
      # before it serves anything, so a merely running analyzer answers nothing. Nothing in this file waits on the check
      # — see the comment on MailFathom's missing `depends_on` below — so what it buys is an operator reading `docker
      # compose ps` and seeing why the stack is not up yet.
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    # No `depends_on` in either direction. MailFathom deliberately does not declare one on this service: a dependency on
    # a service behind a profile is a dependency Compose resolves differently depending on which profiles are active, and
    # the behaviour is not something this file should rest on. Nothing here has to order the two: MailFathom starts
    # whether or not the analyzer answers, reports itself unready on `/health` while it does not, and becomes ready by
    # itself once the model has loaded.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # The internal network only. The analyzer receives mail content in the clear and answers where the identifiers in
      # it are, so nothing publishes a port for it and it has no route out of the host.
      - backend
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_PRESIDIO_CPU_LIMIT:-2}
          # Generous by the standards of everything else here, because the model is held in memory for the life of the
          # container. Below roughly a gigabyte it is killed while loading, which reaches MailFathom as an analyzer that
          # never became ready.
          memory: ${MAILFATHOM_PRESIDIO_MEMORY_LIMIT:-2g}

  spamassassin:
    # Started only under its profile, for the reason the analyzer is: an opt-in nobody took pulls no image, runs no
    # container, and holds none of the memory below.
    profiles:
      - spam-scanning
    # A digest rather than a tag, because the upstream publishes no immutable version tag — the digest is the only pin
    # that names one artifact, and it is the same pin the Helm chart and the integration suite use. It runs Apache
    # SpamAssassin 4.0.2 on Alpine under an MIT-licensed build and bundles no Razor2, no Pyzor, and no DCC, so nothing
    # in it sends anything derived from the owner's mail anywhere. THIRD_PARTY_LICENSES.md records all of it.
    image: ${MAILFATHOM_SPAMASSASSIN_IMAGE:-docker.io/axllent/spamassassin@sha256:9bea393891c92a3531cb7081e9b2c478a654a048c9a6fa6f9d1df4300bf3ab8b}
    restart: unless-stopped
    environment:
      # **The DNS posture, and it is off.** The daemon's blocklist rules would send sending addresses and URI host names
      # out of the owner's mail to third-party lists, which is what scanning inside the trust boundary exists to avoid.
      # Off, it runs local rules only. docs/features/spam-classification.md says what each choice costs.
      DNS_CHECKS: ${MAILFATHOM_SPAM_SCANNER_DNS_CHECKS:-0}
    healthcheck:
      # The daemon speaks a line protocol of its own, so the check asks it the one command that answers without scanning
      # anything. It exists for the same reason the analyzer's does: the container fetches its rule updates and compiles
      # the corpus before it listens, so a merely running daemon answers nothing.
      test: ["CMD-SHELL", "printf 'PING SPAMC/1.5\\r\\n\\r\\n' | nc -w 3 127.0.0.1 783 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    # No `depends_on` in either direction, for the reason the analyzer has none. MailFathom's own startup gate refuses to
    # serve while the daemon is not answering, and `restart: unless-stopped` turns that refusal into a retry.
    cap_drop:
      - ALL
    cap_add:
      # **What the daemon needs in order to give up privilege**, and the one place this file adds a capability back. It
      # binds its port as root and then runs every scan as `nobody`, which is the account that parses the mail; without
      # these two it cannot make that switch and refuses to start. Nothing else is granted and no privilege can be
      # regained, which the option below enforces.
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      # The internal network is how MailFathom reaches it. The second one is a route out of the host, and it is here for
      # exactly one thing: the daemon fetches its rule updates over HTTP on start and daily afterwards, and a corpus
      # frozen at whatever the image was built with scores today's mail badly. Nothing derived from the owner's mail
      # goes out that route — the blocklist rules that would are off above, and the image carries no plugin that reports
      # checksums anywhere. Remove this line for a daemon that can reach nothing at all, at the cost of those updates.
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_SPAMASSASSIN_CPU_LIMIT:-1}
          # Modest: the daemon holds its compiled rule corpus in memory and forks a child per scan. Below roughly 256m
          # it is killed while compiling rules, which reaches MailFathom as a scanner that never answered.
          memory: ${MAILFATHOM_SPAMASSASSIN_MEMORY_LIMIT:-512m}

networks:
  # What the database is reachable on, and nothing that is not on it can reach the database. `internal` keeps this
  # network without a route out of the host.
  backend:
    internal: true
  # What the published port attaches to. Put a reverse proxy on this network to terminate TLS in front of MailFathom.
  frontend:

volumes:
  postgres-data:
    # Named rather than anonymous, so `docker compose down` leaves the mail behind and only `down --volumes` destroys
    # it. Synchronized mail is expensive to rebuild: a lost volume costs a full IMAP resynchronization.
    name: ${MAILFATHOM_POSTGRES_VOLUME:-mailfathom-postgres-data}

secrets:
  postgres-superuser-password:
    file: ./secrets/postgres-superuser-password
  mailfathom-database-password:
    file: ./secrets/mailfathom-database-password
