# The supported Docker Compose deployment for MailFathom.
#
# Read deploy/compose/.env.example before the first start: every value this file reads has a documented default, and
# the three files under secrets/ have to exist before anything comes up.
#
#   cp .env.example .env
#   docker compose up -d postgres
#   # apply the database schema — see docs/operations/deployment-compose.md
#   docker compose up -d
#
# This file applies no schema and contains nothing that can. MailFathom never applies a schema change while starting — it
# verifies the schema and refuses to serve against one it does not recognize — so bringing the stack up after a version
# change tells you whether a migration is outstanding rather than silently applying one. What answers that refusal is
# the release's own `mailfathom-schema-<version>.sql`, applied as an explicit operator action; the sequence and the
# command are in docs/operations/deployment-compose.md and docs/operations/database-schema.md.

name: mailfathom

services:
  postgres:
    # pgvector rather than plain postgres: the schema declares the `vector` extension, and the stock image cannot
    # create it. This is the same pin the local Aspire orchestration uses, so a schema reviewed locally is reviewed
    # against this server version.
    image: ${MAILFATHOM_POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg18}
    restart: unless-stopped
    environment:
      # The superuser of this container, used by initdb and by nothing else afterwards. The role MailFathom connects as is
      # created by the script below and is deliberately not this one.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser-password
      POSTGRES_DB: postgres
      MAILFATHOM_DATABASE: ${MAILFATHOM_DATABASE:-mailfathom}
      MAILFATHOM_DATABASE_ROLE: ${MAILFATHOM_DATABASE_ROLE:-mailfathom}
    secrets:
      - postgres-superuser-password
      - mailfathom-database-password
    volumes:
      # The parent rather than the data directory itself. PostgreSQL 18 moved this image's PGDATA into a
      # version-specific subdirectory and moved the declared volume up to `/var/lib/postgresql` with it, so mounting
      # the old path would leave the database in the container's writable layer and lose it with the container.
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory. It creates the unprivileged role and the database MailFathom uses, and
      # installs the `vector` extension while a superuser is still the one connected.
      - ./postgres/10-create-mailfathom-database.sh:/docker-entrypoint-initdb.d/10-create-mailfathom-database.sh:ro
    healthcheck:
      # Over TCP on purpose. The image's entrypoint runs `docker-entrypoint-initdb.d` against a temporary server that
      # listens on a Unix socket only, so a socket check can report ready while the initialization script has not yet
      # created the role, the database, or the extension — and `depends_on: service_healthy` would then start MailFathom
      # against a database that does not exist. Naming a host forces the check onto the final, TCP-listening server.
      # The database and user are given for readability rather than for enforcement: pg_isready reports the server's
      # state and does not verify either.
      test: ["CMD-SHELL", "pg_isready --quiet --host 127.0.0.1 --port 5432 --username postgres --dbname \"$${MAILFATHOM_DATABASE}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
    # No published port. The database is reachable from the service and from anything else an operator attaches to this
    # network, and from nothing else; publish one explicitly and temporarily when a backup, a schema step, or an
    # inspection needs it.
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_POSTGRES_CPU_LIMIT:-2}
          memory: ${MAILFATHOM_POSTGRES_MEMORY_LIMIT:-1g}

  mailfathom:
    # `mailfathom:local` is a name no registry can serve, so an operator who has configured nothing gets the image this
    # checkout builds and never a tag pulled from somewhere. Point MAILFATHOM_IMAGE at a published release to run one
    # instead — `krzysztof318/mailfathom:<version>` on ghcr.io or docker.io, the same digest either way. ADR 0004
    # defines the channels and the tags they carry.
    image: ${MAILFATHOM_IMAGE:-mailfathom:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: runtime
    # Build rather than pull. Without this, Compose treats a service carrying both `image` and `build` as pullable
    # first and only builds when the pull fails — and `mailfathom:local` is an unqualified name, so the attempt goes to
    # the configured registry, where an unrelated image published under that name would silently replace the checkout
    # this file promises to run. Set MAILFATHOM_PULL_POLICY=missing in the same edit that points MAILFATHOM_IMAGE at a
    # published release, so the two decisions stay one decision.
    pull_policy: ${MAILFATHOM_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The MCP endpoint's own port. MailFathom refuses ASPNETCORE_HTTP_PORTS: each surface states where it is served
      # in its own configuration section.
      McpEndpoint__Port: "8080"
      # The directory of JSON files below becomes ordinary configuration, layered under the environment block. See
      # docs/operations/configuration-sources.md for the precedence and for what a directory contributes.
      ConfigurationSources__Directory: /etc/mailfathom/config
      # Composed here from parts the operator configures separately, so the file holding the password stays a file:
      # only the password arrives through Persistence__Password, as a reference to the mounted secret.
      ConnectionStrings__mailfathom: "Host=postgres;Port=5432;Database=${MAILFATHOM_DATABASE:-mailfathom};Username=${MAILFATHOM_DATABASE_ROLE:-mailfathom}"
      Persistence__Password__Name: mailfathom-database-password
      Persistence__Password__SecretReference: file:/run/secrets/mailfathom-database-password
      # Where the raw MIME of the messages stored next is written: `Database`, which keeps every payload in PostgreSQL
      # beside the metadata and is what this deployment has always done, or `ObjectStorage`, which writes new payloads
      # into the S3-compatible bucket named below. Everything else still goes through PostgreSQL either way.
      #
      # **It decides only where the next write goes.** Every content row names the store holding its own payload, so
      # switching moves nothing already stored and switching back re-encodes nothing. And a `pg_dump` stops being a
      # whole backup the moment this says ObjectStorage: docs/operations/deployment-compose.md § Backup and what
      # survives removal states the order the two stores are backed up and restored in.
      #
      # The settings below are read only under the object backend, so they are set unconditionally like the spam
      # scanner's address further down and cost a Database deployment nothing. Under ObjectStorage the address, the
      # bucket, and both credential files are required, and MailFathom refuses to start without them rather than signing
      # requests as whatever identity the host carries.
      ContentStorage__Backend: ${MAILFATHOM_CONTENT_STORAGE:-Database}
      ContentStorage__ObjectStorage__Endpoint: ${MAILFATHOM_OBJECT_STORAGE_ENDPOINT:-}
      ContentStorage__ObjectStorage__Bucket: ${MAILFATHOM_OBJECT_STORAGE_BUCKET:-}
      ContentStorage__ObjectStorage__KeyPrefix: ${MAILFATHOM_OBJECT_STORAGE_KEY_PREFIX:-}
      ContentStorage__ObjectStorage__Region: ${MAILFATHOM_OBJECT_STORAGE_REGION:-}
      ContentStorage__ObjectStorage__UsePathStyleAddressing: ${MAILFATHOM_OBJECT_STORAGE_PATH_STYLE:-true}
      # Two files under ./secrets/mailfathom/, like every mailbox password and API key, rather than two Compose secrets:
      # the identifier names an identity at the endpoint and is half of what an attacker needs, so it is provisioned and
      # rotated by exactly the machinery its secret is. Both are resolved before every request, so replacing a file
      # takes effect on the next call with no restart.
      ContentStorage__ObjectStorage__AccessKeyId__Name: mailfathom-object-storage-access-key-id
      ContentStorage__ObjectStorage__AccessKeyId__SecretReference: file:/etc/mailfathom/secrets/mailfathom-object-storage-access-key-id
      ContentStorage__ObjectStorage__SecretAccessKey__Name: mailfathom-object-storage-secret-access-key
      ContentStorage__ObjectStorage__SecretAccessKey__SecretReference: file:/etc/mailfathom/secrets/mailfathom-object-storage-secret-access-key
      # The certificate authority that signed the endpoint's certificate, for an endpoint you run yourself. Commented
      # out rather than defaulted to an empty reference: an endpoint the host already trusts needs none, and a block
      # present with nothing in it is a credential MailFathom cannot read rather than an anchor it does not need. There
      # is no setting anywhere that turns validation off instead — see docs/operations/platform-tls-policy.md.
      #ContentStorage__ObjectStorage__TrustAnchor__Name: mailfathom-object-storage-trust-anchor
      #ContentStorage__ObjectStorage__TrustAnchor__SecretReference: file:/etc/mailfathom/secrets/mailfathom-object-storage-trust-anchor
      # MailFathom's own client, served by the application as a page at the same address its client surface answers on.
      # The bundle is inside the image, so this pulls nothing and starts no second container; what it needs beside it is
      # ClientEndpoint:Enabled in ./config, since the page is served on that surface's listeners and calls them.
      #
      # Both keys are one variable, and the second one is a statement about this deployment's shape rather than a
      # convenience. MailFathom refuses to serve the client over a clear-text socket, because the page and every token
      # it then presents cross a public hop — and this container speaks plain HTTP by design, publishing on loopback for
      # a reverse proxy to terminate TLS in front of. Enabling the client here therefore says that proxy exists. Keep
      # MAILFATHOM_HTTP_BIND on loopback until it does: with the port on a network and no TLS in front, this variable
      # serves the client, and everything a browser sends back, in the clear.
      ClientEndpoint__Application__Enabled: ${MAILFATHOM_CLIENT:-false}
      ClientEndpoint__Application__AllowClearText: ${MAILFATHOM_CLIENT:-false}
      # Personal-data scanning, off by default like the product. Turning it on is two variables in `.env` — this one and
      # COMPOSE_PROFILES=personal-data-scanning — because Compose cannot make an environment entry conditional on a
      # profile: the profile decides whether the analyzer container exists and this decides whether MailFathom asks it,
      # and enabling either alone is a deployment that does not work. The address defaults to the analyzer this file
      # starts, so an operator running their own analyzer overrides it and enables no profile.
      SensitiveContent__Pii__Enabled: ${MAILFATHOM_PERSONAL_DATA_SCANNING:-false}
      SensitiveContent__PersonalDataAnalyzer__Endpoint: ${MAILFATHOM_PERSONAL_DATA_ANALYZER:-http://presidio-analyzer:3000}
      # One entry per language the analyzer is asked in. An indexed key is how a list reaches .NET configuration through
      # the environment, and Compose expands no variable into several of them — so a second language is a second line
      # added here rather than a value in `.env`, and the numbering starts at zero and leaves no gap.
      SensitiveContent__PersonalDataAnalyzer__Languages__0: ${MAILFATHOM_PERSONAL_DATA_LANGUAGE:-en}
      #SensitiveContent__PersonalDataAnalyzer__Languages__1: pl
      SensitiveContent__PersonalDataAnalyzer__MinimumConfidence: ${MAILFATHOM_PERSONAL_DATA_MINIMUM_CONFIDENCE:-0.4}
      # Spam classification with a scanner, paired with the `spam-scanning` profile the same way: the profile decides
      # whether the daemon container exists and these decide whether MailFathom classifies and asks it. Both switches
      # are one variable because MailFathom refuses to start with a scanner switched on and classification off, and the
      # address defaults to the daemon this file starts. Classification without a scanner is the other half of the
      # feature and is set in ./config instead, where the folders it covers and the threshold it judges by already live.
      SpamClassification__Enabled: ${MAILFATHOM_SPAM_SCANNING:-false}
      SpamClassification__UseScanner: ${MAILFATHOM_SPAM_SCANNING:-false}
      SpamClassification__Scanner__Host: ${MAILFATHOM_SPAM_SCANNER_HOST:-spamassassin}
      SpamClassification__Scanner__Port: ${MAILFATHOM_SPAM_SCANNER_PORT:-783}
      SpamClassification__Scanner__ScanTimeoutSeconds: ${MAILFATHOM_SPAM_SCAN_TIMEOUT_SECONDS:-30}
      SpamClassification__Scanner__MaximumMessageBytes: ${MAILFATHOM_SPAM_SCAN_MAXIMUM_MESSAGE_BYTES:-512000}
      SpamClassification__Scanner__MaximumConcurrentScans: ${MAILFATHOM_SPAM_SCAN_MAXIMUM_CONCURRENT:-5}
      # The RESP endpoint this deployment's replicas carry client signals to each other over. Commented out rather than
      # defaulted to an empty reference, for the reason the trust anchor above is: writing the section at all is what
      # says a backplane exists, so a block present with nothing in it is refused at startup rather than read as a
      # deployment that runs without one. Uncommenting the two lines is the whole of enabling it — the `signal-backplane`
      # profile then decides whether the server they name is one this file starts.
      #
      # **On one host it changes nothing an operator can observe**, and that is the expected state rather than a
      # misconfiguration: a signal raised here already reaches every client connection this deployment holds, because
      # there is only one process holding them. What it is for is a second instance, and #1295 is where running one is
      # decided. Until then this is the same component the chart offers, provisioned ahead of needing it.
      #
      # The reference is a file under ./secrets/mailfathom/ like every other credential MailFathom reads, and what it
      # holds is a whole StackExchange.Redis connection string rather than a bare password: `valkey:6379,password=...`
      # for the server below, or the address of a RESP endpoint you already operate — Redis, Garnet, Valkey, or a
      # managed equivalent, in which case enable no profile and start nothing. What MailFathom asks of the endpoint is
      # `PUBLISH`, `SUBSCRIBE`, and `PSUBSCRIBE`, so the protocol is the whole of the contract and the server below is
      # what this project deploys and pins rather than what it requires. Both halves of the password are one decision:
      # the string here presents it and ./secrets/valkey-acl is what accepts it.
      #
      # The material is read once, when a connection is first wanted, and kept for the life of the process — so rotating
      # it is a restart to schedule. docs/operations/secret-rotation.md states the order.
      #SignalBackplane__ConnectionString__Name: signal-backplane-connection-string
      #SignalBackplane__ConnectionString__SecretReference: file:/etc/mailfathom/secrets/signal-backplane-connection-string
      # Optional, and only where two applications share one RESP endpoint: it prefixes every channel this deployment
      # publishes and subscribes to, and it defaults to `mailfathom`. Two MailFathom deployments on one endpoint collide
      # under that default and have to be told apart here.
      #SignalBackplane__ChannelPrefix: mailfathom
    secrets:
      - mailfathom-database-password
    volumes:
      - type: bind
        source: ./config
        target: /etc/mailfathom/config
        read_only: true
      # Whatever the operator provisions: mailbox passwords, MCP API keys, a private trust anchor. A directory rather
      # than one Compose secret per credential, because adding an account would otherwise mean editing this tracked
      # file, and because /etc/mailfathom/secrets is the same path the Kubernetes deployment mounts its Secret at — a
      # `SecretReference` therefore reads identically in both shapes. The two database credentials stay Compose
      # secrets below, so the database superuser password is never on a path this service can read.
      - type: bind
        source: ./secrets/mailfathom
        target: /etc/mailfathom/secrets
        read_only: true
    ports:
      # Bound to loopback by default. MailFathom speaks plain HTTP and terminates no TLS of its own, so exposing this
      # port to a network means exposing synchronized mail without transport protection; put a reverse proxy in front
      # of it and change MAILFATHOM_HTTP_BIND only once that proxy is what listens publicly.
      - "${MAILFATHOM_HTTP_BIND:-127.0.0.1}:${MAILFATHOM_HTTP_PORT:-8080}:8080"
      # The administrative endpoint, on the port config/10-mailfathom.json.example gives it. Its own default is 8080 as
      # well, which is the socket above, so the example states 8090 and this publishes that — on loopback, because it is
      # where the mailboxes this deployment reads are recorded, and mfctl reaches it from this machine.
      - "${MAILFATHOM_ADMIN_BIND:-127.0.0.1}:${MAILFATHOM_ADMIN_PORT:-8090}:8090"
      # The probes, on a listener of their own. They answer without a credential, so what controls who can ask them is
      # which network the port is published to — here loopback, and never the same port the MCP endpoint is served on.
      # A probe path asked on 8080 is answered with 404, and so is `/mcp` asked on this one.
      - "${MAILFATHOM_HEALTH_BIND:-127.0.0.1}:${MAILFATHOM_HEALTH_PORT:-8081}:8081"
    # No health check. The image declares none — a chiseled image has no shell or HTTP client to run one in — and one
    # written here would need the same thing: a client inside the container. The probes are asked from outside instead,
    # on the port published above; docs/operations/health-endpoints.md states what each one answers.
    read_only: true
    tmpfs:
      # The one path the runtime needs to write. Everything else, /app included, is owned by root and mounted
      # read-only, so the process cannot rewrite its own code.
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Longer than the host's own shutdown budget, which is derived from MailSynchronization:ShutdownDrainTimeout, so
    # the process finishes draining and exits rather than being killed mid-run. Raise both together if a deployment
    # configures a longer drain.
    stop_grace_period: 60s
    networks:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_CPU_LIMIT:-2}
          memory: ${MAILFATHOM_MEMORY_LIMIT:-1g}

  presidio-analyzer:
    # Started only under its profile, which is what makes an opt-in nobody took cost nothing: no image is pulled, no
    # container exists, and none of the memory below is held. `docker compose up` without the profile brings up the same
    # two services it always did.
    profiles:
      - personal-data-scanning
    # An immutable tag, like the database image and unlike MailFathom's own: this is a dependency the deployment operates
    # rather than a version it chooses. It is the same pin the Helm chart and the integration suite use, so an analyzer
    # reviewed against one is the analyzer running in the others. MIT-licensed, and it loads an MIT-licensed spaCy model —
    # both are recorded in THIRD_PARTY_LICENSES.md. It is built for English alone, and a model is installed while the
    # image is built rather than while it starts, so an override here is how a deployment runs the analyzer in another
    # language — docs/operations/personal-data-analyzer-languages.md states what that takes.
    image: ${MAILFATHOM_PRESIDIO_IMAGE:-ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364}
    restart: unless-stopped
    healthcheck:
      # The analyzer's own route, and the reason the service has a check at all: the container loads a language model
      # before it serves anything, so a merely running analyzer answers nothing. Nothing in this file waits on the check
      # — see the comment on MailFathom's missing `depends_on` below — so what it buys is an operator reading `docker
      # compose ps` and seeing why the stack is not up yet.
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    # No `depends_on` in either direction. MailFathom deliberately does not declare one on this service: a dependency on
    # a service behind a profile is a dependency Compose resolves differently depending on which profiles are active, and
    # the behaviour is not something this file should rest on. Nothing here has to order the two: MailFathom starts
    # whether or not the analyzer answers, reports itself unready on `/health` while it does not, and becomes ready by
    # itself once the model has loaded.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # The internal network only. The analyzer receives mail content in the clear and answers where the identifiers in
      # it are, so nothing publishes a port for it and it has no route out of the host.
      - backend
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_PRESIDIO_CPU_LIMIT:-2}
          # Generous by the standards of everything else here, because the model is held in memory for the life of the
          # container. Below roughly a gigabyte it is killed while loading, which reaches MailFathom as an analyzer that
          # never became ready.
          memory: ${MAILFATHOM_PRESIDIO_MEMORY_LIMIT:-2g}

  spamassassin:
    # Started only under its profile, for the reason the analyzer is: an opt-in nobody took pulls no image, runs no
    # container, and holds none of the memory below.
    profiles:
      - spam-scanning
    # A digest rather than a tag, because the upstream publishes no immutable version tag — the digest is the only pin
    # that names one artifact, and it is the same pin the Helm chart and the integration suite use. It runs Apache
    # SpamAssassin 4.0.2 on Alpine under an MIT-licensed build and bundles no Razor2, no Pyzor, and no DCC, so nothing
    # in it sends anything derived from the user's mail anywhere. THIRD_PARTY_LICENSES.md records all of it.
    image: ${MAILFATHOM_SPAMASSASSIN_IMAGE:-docker.io/axllent/spamassassin@sha256:9bea393891c92a3531cb7081e9b2c478a654a048c9a6fa6f9d1df4300bf3ab8b}
    restart: unless-stopped
    environment:
      # **The DNS posture, and it is off.** The daemon's blocklist rules would send sending addresses and URI host names
      # out of the user's mail to third-party lists, which is what scanning inside the trust boundary exists to avoid.
      # Off, it runs local rules only. docs/features/spam-classification.md says what each choice costs.
      DNS_CHECKS: ${MAILFATHOM_SPAM_SCANNER_DNS_CHECKS:-0}
    healthcheck:
      # The daemon speaks a line protocol of its own, so the check asks it the one command that answers without scanning
      # anything. It exists for the same reason the analyzer's does: the container fetches its rule updates and compiles
      # the corpus before it listens, so a merely running daemon answers nothing.
      test: ["CMD-SHELL", "printf 'PING SPAMC/1.5\\r\\n\\r\\n' | nc -w 3 127.0.0.1 783 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    # No `depends_on` in either direction, for the reason the analyzer has none. MailFathom's own startup gate refuses to
    # serve while the daemon is not answering, and `restart: unless-stopped` turns that refusal into a retry.
    cap_drop:
      - ALL
    cap_add:
      # **What the daemon needs in order to give up privilege**, and the one place this file adds a capability back. It
      # binds its port as root and then runs every scan as `nobody`, which is the account that parses the mail; without
      # these two it cannot make that switch and refuses to start. Nothing else is granted and no privilege can be
      # regained, which the option below enforces.
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      # The internal network is how MailFathom reaches it. The second one is a route out of the host, and it is here for
      # exactly one thing: the daemon fetches its rule updates over HTTP on start and daily afterwards, and a corpus
      # frozen at whatever the image was built with scores today's mail badly. Nothing derived from the user's mail
      # goes out that route — the blocklist rules that would are off above, and the image carries no plugin that reports
      # checksums anywhere. Remove this line for a daemon that can reach nothing at all, at the cost of those updates.
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_SPAMASSASSIN_CPU_LIMIT:-1}
          # Modest: the daemon holds its compiled rule corpus in memory and forks a child per scan. Below roughly 256m
          # it is killed while compiling rules, which reaches MailFathom as a scanner that never answered.
          memory: ${MAILFATHOM_SPAMASSASSIN_MEMORY_LIMIT:-512m}

  silo:
    # Started only under its profile, for the reason the two services above are: an opt-in nobody took pulls no image,
    # runs no container, and holds none of the disk below. A deployment that leaves MAILFATHOM_CONTENT_STORAGE at
    # Database brings up exactly the two services it always did.
    profiles:
      - object-storage
    # An immutable tag, and the same pin the Helm chart, the Quadlet units, and the integration suite carry — so the
    # server the suite verified the S3 adapter against is the server this starts. Silo is PGSTY's maintained fork of the
    # open-source MinIO server, keeping one release line alive after upstream ended community distribution. It is
    # AGPL-3.0-or-later: this file names an image your host pulls from PGSTY's own registry and carries no part of it,
    # which is the reading THIRD_PARTY_LICENSES.md records.
    image: ${MAILFATHOM_SILO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-08-06T00-00-00Z}
    restart: unless-stopped
    # The server's own start command, which every MinIO-derived image takes as arguments rather than as configuration;
    # the image's entrypoint puts the executable in front of them. One directory, because a single-node single-drive
    # pool is the only topology one volume could hold and the only one this deployment supports.
    #
    # `--console-address` is stated unconditionally and costs nothing while the console is off: the server reads it only
    # when the browser is enabled, and with MINIO_BROWSER=off below there is no administrative listener at all. Naming
    # it is what keeps the console on a port an operator chose rather than on the free one the server would otherwise
    # pick for itself the moment somebody turns it on.
    command:
      - server
      - /data
      - --certs-dir
      - /etc/silo/certs
      - --address
      - ":9000"
      - --console-address
      - ":9001"
    environment:
      # Both halves of the root credential as files rather than as values, like every other credential here. The server
      # reads each path itself; these are the paths the secrets below are mounted at.
      MINIO_ROOT_USER_FILE: /run/secrets/silo-root-access-key-id
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/silo-root-secret-access-key
      # **The administrative console, and it is off.** It is a management interface over every object the store holds —
      # bucket contents, access keys, the server's own configuration — so it is a second surface onto the mail rather
      # than a convenience, and with it off the server never starts that listener. Turning it on also means publishing
      # the port below, which this file binds to loopback. It authenticates with the root credential, which administers
      # the whole server rather than the one bucket.
      MINIO_BROWSER: ${MAILFATHOM_SILO_CONSOLE:-off}
    secrets:
      - silo-root-access-key-id
      - silo-root-secret-access-key
      # The certificate the store answers with, under the two names the server reads, because MailFathom refuses a plain
      # http endpoint: a request carries a signature and, on a write, the message itself. Both are secrets rather than a
      # mounted directory so that a missing file fails the container rather than starting a server that quietly serves
      # plain HTTP — and the certificate has to name `silo`, which is the host MailFathom reaches it at and therefore
      # the name it validates. The authority that signed it is a third file, in ./secrets/mailfathom/, because it is
      # MailFathom that has to trust it.
      - source: silo-public-crt
        target: /etc/silo/certs/public.crt
      - source: silo-private-key
        target: /etc/silo/certs/private.key
    volumes:
      - silo-data:/data
    healthcheck:
      # The server's own liveness route, which answers before any bucket exists — every other route on this port is a
      # request about a bucket, and the root answers 403 to an unsigned one. `--insecure` because the call is to the
      # container's own loopback address, which the certificate names nowhere: what it names is `silo`, and that is what
      # MailFathom validates. The image carries a static curl for exactly this.
      test: ["CMD-SHELL", "curl --fail --silent --insecure --output /dev/null https://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # No `depends_on` in either direction, for the reason the two services above have none. MailFathom starts whether or
    # not the store answers, reports itself unready on `/health` while it does not, and becomes ready by itself.
    ports:
      # The console, and nothing else: the S3 API is reachable from MailFathom over the internal network and from
      # nothing outside the host, exactly as the database is. This port is bound to loopback and answers only once
      # MAILFATHOM_SILO_CONSOLE is on — until then the mapping routes to a listener the server never started.
      - "${MAILFATHOM_SILO_CONSOLE_BIND:-127.0.0.1}:${MAILFATHOM_SILO_CONSOLE_PORT:-9001}:9001"
    read_only: true
    tmpfs:
      # The one path outside the volume the server writes to: the image points HOME here, and the server probes its own
      # configuration directory beneath it while starting. The management client the provisioning commands use keeps its
      # alias file here too, which is why that file does not outlive the container.
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # The internal network only. What answers here is the raw MIME of every message this deployment has stored, so it
      # has no route out of the host and nothing outside reaches it.
      - backend
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_SILO_CPU_LIMIT:-2}
          # Modest: the server holds no index in memory and streams what it serves. What it wants is disk.
          memory: ${MAILFATHOM_SILO_MEMORY_LIMIT:-1g}

  valkey:
    # Started only under its profile, for the reason the three services above are: an opt-in nobody took pulls no image,
    # runs no container, and holds none of the memory below.
    #
    # **On one host it does nothing, and that is the expected state.** A backplane carries a client signal from the
    # replica that raised it to the replicas holding the connections that have to hear about it, and this file runs one
    # MailFathom — so every signal already reaches every connection this deployment holds, and the server relays each
    # one back to the single subscriber that published it. It is here so that this shape offers the same component the
    # chart does, and so that a deployment which grows a second instance has the piece already provisioned.
    profiles:
      - signal-backplane
    # A digest rather than a tag, and the same digest the Helm chart renders — Valkey 9.1.2 — so the server this starts
    # is the server the other deployment shape starts. Valkey publishes its release tags beside moving `9`, `9.1`, and
    # `latest` ones, so a digest is the only reference that names one artifact. Valkey is a BSD-3-Clause RESP server
    # maintained under the Linux Foundation; THIRD_PARTY_LICENSES.md records the reading, including the base image it is
    # built on. Any RESP endpoint answers the same protocol — Redis, Garnet, Valkey, or a managed equivalent — which is
    # what makes pointing the setting above at one you already operate the other supported shape, and what makes this
    # server the default rather than a requirement.
    image: ${MAILFATHOM_VALKEY_IMAGE:-valkey/valkey@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d}
    restart: unless-stopped
    # **The account is stated here because the image states none.** Its entrypoint takes a root branch when nothing
    # else has chosen an account: it chowns the working directory and then re-execs itself as `valkey`. Both halves
    # need capabilities `cap_drop: ALL` below has taken away, so the entrypoint would fail on the chown and the server
    # would never start. The chart states the same account in its pod's security context and the Quadlet unit states it
    # as a user-namespace mapping; this is the same decision in the form Compose reads.
    user: "999:999"
    # **The password arrives as a file, which on this server means an ACL file.** This is the one place this deployment
    # differs from the chart, which expands the password into `--requirepass` from a Secret the kubelet reads. Nothing
    # here has that expansion: Compose interpolates `${...}` from `.env` while it parses this file, so that route would
    # put the password in `.env`, in `docker inspect`, and in this host's process list rather than in the secrets
    # directory beside every other credential. `--aclfile` is the one way Valkey reads a credential from a path, so the
    # secret below carries a single ACL line with the password inside it. The default user is what a RESP client
    # authenticating with a password alone becomes, and this server holds nothing but subscriptions, so it is granted
    # every key, every channel, and every command rather than a subset nobody could enumerate from the client library's
    # own handshake.
    #
    # Persistence is off on the same line, and it is off deliberately rather than by default: Valkey snapshots on a
    # schedule unless `--save` is given nothing to do.
    command:
      - --aclfile
      - /run/secrets/valkey-acl
      - --save
      - ""
      - --appendonly
      - "no"
    secrets:
      - valkey-acl
    # No volume, and nothing to persist. A backplane holds a live subscription rather than a record: a restart loses
    # nothing, and a server that kept anything across one would replay a statement whose subject has already moved.
    #
    # No health check either: one would have to authenticate, which would put the password in a second place. A replica
    # whose backplane is down reports itself through `/health` and says so in its telemetry.
    read_only: true
    tmpfs:
      # Two writable paths on an otherwise read-only root filesystem, which is what the chart's pod gives this image as
      # well: the runtime's scratch directory, and the working directory the server insists on whether or not it ever
      # writes a file into it. In memory rather than on disk so that nothing derived from a signal outlives the
      # container. A tmpfs is created owned by `root`, which the account above cannot change with every capability
      # dropped, so mode 1777 is what makes both writable by the server rather than ownership.
      - /tmp:mode=1777,size=64m
      - /data:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # The internal network only, and no published port. What crosses this server is which mailbox changed and for
      # whom — enough to be personal data on its own — so it is reachable from MailFathom and from nothing outside the
      # host, exactly as the database is.
      - backend
    logging:
      driver: json-file
      options:
        max-size: ${MAILFATHOM_LOG_MAX_SIZE:-10m}
        max-file: ${MAILFATHOM_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILFATHOM_VALKEY_CPU_LIMIT:-1}
          # No key is ever written here, so what the limit covers is the process and its allocator's arenas rather than
          # anything this deployment stores. Persistence being off means it never covers a fork copying a dataset
          # either — there is none to copy.
          memory: ${MAILFATHOM_VALKEY_MEMORY_LIMIT:-256m}

networks:
  # What the database is reachable on, and nothing that is not on it can reach the database. `internal` keeps this
  # network without a route out of the host.
  backend:
    internal: true
  # What the published port attaches to. Put a reverse proxy on this network to terminate TLS in front of MailFathom.
  frontend:

volumes:
  postgres-data:
    # Named rather than anonymous, so `docker compose down` leaves the mail behind and only `down --volumes` destroys
    # it. Synchronized mail is expensive to rebuild: a lost volume costs a full IMAP resynchronization.
    name: ${MAILFATHOM_POSTGRES_VOLUME:-mailfathom-postgres-data}

  silo-data:
    # Named for the reason the database's is, and it holds the other half of what a backup covers once the object
    # backend is selected: the payload of every message written since. A lost volume here is not a resynchronization —
    # the database still holds a row for every object, and each of those reads as content unavailable.
    name: ${MAILFATHOM_SILO_VOLUME:-mailfathom-silo-data}

secrets:
  postgres-superuser-password:
    file: ./secrets/postgres-superuser-password
  mailfathom-database-password:
    file: ./secrets/mailfathom-database-password
  # The object store's own, read by the `silo` service alone and never on a path the MailFathom container can see —
  # the line the database superuser password is on the other side of, and for the same reason. The root credential
  # administers the whole server; what MailFathom presents is an access key scoped to the one bucket, provisioned into
  # ./secrets/mailfathom/ like every other credential it reads. None of these four files exists until an operator
  # creates it, and a missing one fails the container rather than starting a server with whatever it would default to.
  silo-root-access-key-id:
    file: ./secrets/silo-root-access-key-id
  silo-root-secret-access-key:
    file: ./secrets/silo-root-secret-access-key
  silo-public-crt:
    file: ./secrets/silo-public.crt
  silo-private-key:
    file: ./secrets/silo-private.key
  # The backplane server's own, read by the `valkey` service alone. It is beside the store's credentials rather than
  # under ./secrets/mailfathom/ for the same reason they are: this file is the server's authority to accept a
  # connection, and what MailFathom reads is the connection string that presents the password to it. It does not exist
  # until an operator creates it, and a missing one fails the container rather than starting a RESP server that accepts
  # every connection unauthenticated.
  valkey-acl:
    file: ./secrets/valkey-acl
