# The supported Docker Compose deployment for MailMcp.
#
# Read deploy/compose/.env.example before the first start: every value this file reads has a documented default, and
# the three files under secrets/ have to exist before anything comes up.
#
#   cp .env.example .env
#   docker compose up -d postgres
#   docker compose --profile migrate run --rm migrations      # explicit, and only when you mean it
#   docker compose up -d
#
# The migration step is separate on purpose. MailMcp never applies a schema change while starting — it verifies the
# schema and refuses to serve against one it does not recognize — so bringing the stack up after a version change tells
# you whether a migration is outstanding rather than silently applying one.

name: mailmcp

services:
  postgres:
    # pgvector rather than plain postgres: the schema declares the `vector` extension, and the stock image cannot
    # create it. This is the same pin the local Aspire orchestration uses, so a schema reviewed locally is reviewed
    # against this server version.
    image: ${MAILMCP_POSTGRES_IMAGE:-pgvector/pgvector:0.8.2-pg17}
    restart: unless-stopped
    environment:
      # The superuser of this container, used by initdb and by nothing else afterwards. The role MailMcp connects as is
      # created by the script below and is deliberately not this one.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser-password
      POSTGRES_DB: postgres
      MAILMCP_DATABASE: ${MAILMCP_DATABASE:-mailmcp}
      MAILMCP_DATABASE_ROLE: ${MAILMCP_DATABASE_ROLE:-mailmcp}
    secrets:
      - postgres-superuser-password
      - mailmcp-database-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory. It creates the unprivileged role and the database MailMcp uses, and
      # installs the `vector` extension while a superuser is still the one connected.
      - ./postgres/10-create-mailmcp-database.sh:/docker-entrypoint-initdb.d/10-create-mailmcp-database.sh:ro
    healthcheck:
      # Asks for the database MailMcp will use rather than for the server as a whole, so the check does not report
      # ready while the initialization script is still creating it.
      test: ["CMD-SHELL", "pg_isready --quiet --username postgres --dbname \"$${MAILMCP_DATABASE}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
    # No published port. The database is reachable from the service and from a one-shot migration container on the same
    # network, and from nothing else; publish one explicitly and temporarily when a backup or an inspection needs it.
    logging:
      driver: json-file
      options:
        max-size: ${MAILMCP_LOG_MAX_SIZE:-10m}
        max-file: ${MAILMCP_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILMCP_POSTGRES_CPU_LIMIT:-2}
          memory: ${MAILMCP_POSTGRES_MEMORY_LIMIT:-1g}

  mailmcp:
    # `mailmcp:local` is a name no registry can serve, so an operator who has configured nothing gets the image this
    # checkout builds and never a tag pulled from somewhere. Point MAILMCP_IMAGE at a published release when one
    # exists; the release channels and the tags they carry are #156 and #116 and do not exist yet.
    image: ${MAILMCP_IMAGE:-mailmcp:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # The directory of JSON files below becomes ordinary configuration, layered under the environment block. See
      # docs/operations/configuration-sources.md for the precedence and for what a directory contributes.
      ConfigurationSources__Directory: /etc/mailmcp/config
      # Composed here from parts the operator configures separately, so the file holding the password stays a file:
      # only the password arrives through Persistence__Password, as a reference to the mounted secret.
      ConnectionStrings__mailmcp: "Host=postgres;Port=5432;Database=${MAILMCP_DATABASE:-mailmcp};Username=${MAILMCP_DATABASE_ROLE:-mailmcp}"
      Persistence__Password__Name: mailmcp-database-password
      Persistence__Password__SecretReference: file:/run/secrets/mailmcp-database-password
    secrets:
      - mailmcp-database-password
    volumes:
      - type: bind
        source: ./config
        target: /etc/mailmcp/config
        read_only: true
      # Whatever the operator provisions: mailbox passwords, MCP API keys, a private trust anchor. A directory rather
      # than one Compose secret per credential, because adding an account would otherwise mean editing this tracked
      # file, and because /etc/mailmcp/secrets is the same path the Kubernetes deployment mounts its Secret at — a
      # `SecretReference` therefore reads identically in both shapes. The two database credentials stay Compose
      # secrets below, so the database superuser password is never on a path this service can read.
      - type: bind
        source: ./secrets/mailmcp
        target: /etc/mailmcp/secrets
        read_only: true
    ports:
      # Bound to loopback by default. MailMcp speaks plain HTTP and terminates no TLS of its own, so exposing this
      # port to a network means exposing synchronized mail without transport protection; put a reverse proxy in front
      # of it and change MAILMCP_HTTP_BIND only once that proxy is what listens publicly.
      - "${MAILMCP_HTTP_BIND:-127.0.0.1}:${MAILMCP_HTTP_PORT:-8080}:8080"
    # The image declares its own health check, which asks the readiness endpoint from inside the container. Nothing is
    # restated here; `docker compose ps` reports it.
    read_only: true
    tmpfs:
      # The one path the runtime needs to write. Everything else, /app included, is owned by root and mounted
      # read-only, so the process cannot rewrite its own code.
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Longer than the host's own shutdown budget, which is derived from MailSynchronization:ShutdownDrainTimeout, so
    # the process finishes draining and exits rather than being killed mid-run. Raise both together if a deployment
    # configures a longer drain.
    stop_grace_period: 60s
    networks:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: ${MAILMCP_LOG_MAX_SIZE:-10m}
        max-file: ${MAILMCP_LOG_MAX_FILES:-3}
    deploy:
      resources:
        limits:
          cpus: ${MAILMCP_CPU_LIMIT:-2}
          memory: ${MAILMCP_MEMORY_LIMIT:-1g}

  migrations:
    # Behind a profile, so `docker compose up` never starts it. It runs once, exits, and is the only thing in this file
    # that changes a schema.
    profiles:
      - migrate
    image: ${MAILMCP_MIGRATIONS_IMAGE:-mailmcp-migrations:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${MAILMCP_DATABASE:-mailmcp}
      PGUSER: ${MAILMCP_DATABASE_ROLE:-mailmcp}
      MAILMCP_MIGRATION_PASSWORD_FILE: /run/secrets/mailmcp-database-password
    secrets:
      - mailmcp-database-password
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - backend

networks:
  # What the database is reachable on, and nothing that is not on it can reach the database. `internal` keeps this
  # network without a route out of the host.
  backend:
    internal: true
  # What the published port attaches to. Put a reverse proxy on this network to terminate TLS in front of MailMcp.
  frontend:

volumes:
  postgres-data:
    # Named rather than anonymous, so `docker compose down` leaves the mail behind and only `down --volumes` destroys
    # it. Synchronized mail is expensive to rebuild: a lost volume costs a full IMAP resynchronization.
    name: ${MAILMCP_POSTGRES_VOLUME:-mailmcp-postgres-data}

secrets:
  postgres-superuser-password:
    file: ./secrets/postgres-superuser-password
  mailmcp-database-password:
    file: ./secrets/mailmcp-database-password
