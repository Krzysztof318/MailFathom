apiVersion: v2
name: mailfathom
description: A read-only MCP server over synchronized IMAP mailboxes, backed by PostgreSQL.
type: application

# The chart's own version, moved when anything under this directory changes. It is not the application's version and
# never follows it: a values default corrected without touching the image is a chart release on its own.
#
# It still reads its initial value because no chart has been published. Moving it distinguishes what an installer can
# already have from what this directory now says, and nobody can have anything yet, so a bump before the first
# publication only counts edits. #156 owns that publication; from it onward the rule above applies literally.
version: 0.1.0

# No `appVersion` here, deliberately. A version written in this file would be a second place to remember one, and the
# whole point of ADR 0004's scheme is that `<VersionPrefix>` in `Directory.Build.props` is the only place a version
# number is written. The release run supplies it instead, from that same declaration:
#
#   helm package deploy/helm/mailfathom --app-version "$(scripts/read-declared-version.sh)"
#
# A packaged chart therefore always states the application version it deploys, and the chart as it sits in the
# repository states none — which is honest, because an unpackaged chart directory is not a release of anything. The
# image/appVersion drift check in `_helpers.tpl` binds on a packaged chart and stands down without one.

home: https://github.com/Krzysztof318/MailFathom
sources:
  - https://github.com/Krzysztof318/MailFathom

# The project icon, absolute because a chart is consumed as a packaged archive with no repository beside it to resolve a
# relative path against. A chart listing is the only place this field is read, and the container image states the same
# asset as `io.artifacthub.package.logo-url`, so the chart and the image it deploys cannot come to show different
# projects.
icon: https://raw.githubusercontent.com/Krzysztof318/MailFathom/main/assets/icon-1254.png

keywords:
  - mcp
  - imap
  - email

maintainers:
  - name: Krzysztof Kasprowicz
    url: https://github.com/Krzysztof318

# MailFathom's own license, in the SPDX form Artifact Hub reads, matching the image's `org.opencontainers.image.licenses`
# label and the root LICENSE. It covers the chart and the application it deploys, both of which are this repository,
# and says nothing about the PostgreSQL server the operator supplies under its own terms.
annotations:
  artifacthub.io/license: Apache-2.0

# No dependencies, deliberately. The chart installs no database: MailFathom needs PostgreSQL with the `vector` extension,
# and a subchart bundled here would make the chart responsible for the durability, backup, and upgrade of the store
# that holds every synchronized message. `database` in values.yaml points at one the operator owns.
