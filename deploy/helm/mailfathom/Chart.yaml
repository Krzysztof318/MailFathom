apiVersion: v2
name: mailfathom

# The one line a chart listing shows, so it says what the product is rather than which protocol reaches it. MCP is how
# an agent connects and is named last for that reason; a listing of MCP servers is not what somebody browsing charts is
# trying to tell this one apart from. The wording is the repository's own — the README's opening line and the GitHub
# description say the same thing — and it stops at what the release implements, because a chart description is read by
# an operator deciding what to install rather than by a reader of the roadmap.
#
# Artifact Hub sets no length limit here, so the length is a choice rather than a constraint. The first sentence says
# what the product is and stands on its own; the second is for a reader who has not already moved on.
description: >-
  A brain for your mail: MailFathom turns IMAP mailboxes into a self-hosted, AI-native service. Mail synchronizes into
  your own PostgreSQL and is served read-only to AI agents over the Model Context Protocol.
type: application

# A placeholder, and as close as a required field can come to declaring nothing. The release run supplies the real
# value, which is the same one it supplies as `appVersion`:
#
#   helm package deploy/helm/mailfathom --version "$V" --app-version "$V"
#
# The two carry one number rather than two. A published chart version is immutable and a packaged chart embeds its
# `appVersion`, so every release produces chart content that has to be published under a new chart version; a version
# counting edits to this directory would need bumping on every release anyway, and would leave an operator mapping two
# numbers onto one artifact. `<VersionPrefix>` in `Directory.Build.props` stays the only place in this repository where
# a version is written — see docs/operations/release-procedure.md.
version: 0.0.0

# No `appVersion` here, deliberately, and this field can say nothing where `version` above cannot: it is optional. A
# version written here would be a second place to remember one, and the release run supplies it from the declaration
# named above. A packaged chart therefore always states the application version it deploys, and the chart as it sits in
# the repository states none — which is honest, because an unpackaged chart directory is not a release of anything. The
# image/appVersion drift check in `_helpers.tpl` binds on a packaged chart and stands down without one.

home: https://github.com/Krzysztof318/MailFathom
sources:
  - https://github.com/Krzysztof318/MailFathom

# The project icon, absolute because a chart is consumed as a packaged archive with no repository beside it to resolve a
# relative path against. A chart listing is the only place this field is read, and the container image states the same
# asset as `io.artifacthub.package.logo-url`, so the chart and the image it deploys cannot come to show different
# projects.
icon: https://raw.githubusercontent.com/Krzysztof318/MailFathom/main/assets/icon-1254.png

# What a chart search matches on. These are the repository's own topics, narrowed twice. The implementation topics are
# left out — `csharp`, `dotnet`, `aspnet-core`, `dotnet-aspire`, `clean-architecture` describe the source, and nobody
# searching a chart registry for something to install searches for the language it was written in. So is the one topic
# naming a capability this release does not implement: `smtp` is the roadmap, and a keyword is a claim about the
# artifact it is attached to. `rag` and `semantic-search` are here because they are now claims this artifact can carry —
# a configured embedding model gives a search ranked by embedding similarity beside the lexical one, and `ask_mail`
# answers from the mail it retrieves while citing it.
keywords:
  - mcp
  - mcp-server
  - model-context-protocol
  - ai
  - ai-agents
  - rag
  - email
  - email-search
  - semantic-search
  - imap
  - postgresql
  - self-hosted
  - privacy

maintainers:
  - name: Krzysztof Kasprowicz
    url: https://github.com/Krzysztof318

# What a chart listing renders beyond the fields above. `license` is MailFathom's own, in the SPDX form Artifact Hub
# reads, matching the image's `org.opencontainers.image.licenses` label and the root LICENSE; it covers the chart and
# the application it deploys, both of which are this repository, and says nothing about the PostgreSQL server the
# operator supplies under its own terms.
#
# `links` is what a listing has instead of a repository's own navigation. The `support` key is the one Artifact Hub
# treats specially, rendering it as where a problem is reported.
#
# `category` is stated because Artifact Hub otherwise predicts one from the keywords with a machine-learning model, and
# a filed category is not something to leave to a guess about a package whose keywords name a protocol, a mail server,
# and a database. `ai-machine-learning` is one of the eight values Artifact Hub accepts and is the one this belongs
# under: what the chart deploys exists to put mail in front of an agent.
#
# The overview beside them is not an annotation: Artifact Hub renders the `README.md` inside the package, which is the
# committed `README.md` in this directory. It is written for the reader a chart listing has — somebody who has already
# chosen Kubernetes and Helm — rather than for the reader deciding whether to adopt the project, which is what the root
# README is for and what this listing used to be handed.
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/Krzysztof318/MailFathom/tree/main/docs
    - name: Deploying to Kubernetes
      url: https://github.com/Krzysztof318/MailFathom/blob/main/docs/operations/deployment-kubernetes.md
    - name: support
      url: https://github.com/Krzysztof318/MailFathom/issues

# No dependencies, deliberately, which is not the same as no database. The chart deploys PostgreSQL itself — a
# single-replica StatefulSet on a retained claim, from templates in this directory — so that an install needs nothing
# but a Secret and an image reference, and `database.deploy.enabled=false` hands the server back to an operator who has
# one. What is refused is a *subchart*: a bundled dependency would put another project's templates, values, and release
# cadence between this chart and the store holding every synchronized message, and its upgrade path would become part
# of MailFathom's. Templates the repository owns can be read in the diff that changes them.
