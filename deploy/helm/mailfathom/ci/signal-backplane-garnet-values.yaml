# The backplane the chart runs itself, which is the branch that renders the Garnet Deployment and its Service and points
# the application at the connection string naming them. The values document beside this one renders the other branch,
# and every other document here leaves the block off — so all three shapes are produced by the repository's own
# verification, and the off shape is byte for byte what the chart produced before this block existed.
#
# It is also the shape the refusal is about, from the other side: more than one replica with the client surface served
# is exactly the combination the chart refuses without a backplane, so this document renders what configuring one
# produces. The refusal itself is under `ci/refusals/`.
image:
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

secrets:
  existingSecret: mailfathom-secrets

database:
  deploy:
    superuserPasswordSecret: mailfathom-postgres-superuser

# Two replicas, because one replica needs none of this and the whole point of the block is the shape where a signal has
# to cross between processes.
replicaCount: 2

# The page and the surface behind it, in the pairing `ci/release-values.yaml` uses: `client.enabled` serves the bundle
# and the configuration file turns the endpoint it calls on, and the application refuses to start with one without the
# other. Naming only the page would render a manifest describing a pod that could never run, which would prove that the
# backplane's own branch renders rather than that the shape works.
client:
  enabled: true

config:
  files:
    10-mailfathom.json: |
      {
        "ClientEndpoint": {
          "Enabled": true,
          "Authentication": [
            { "Method": "password" }
          ]
        }
      }

# The ingress terminates TLS, which is what makes the chart write the clear-text permission the application requires of
# a socket serving the page. Without it the same refusal at startup applies.
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: mailfathom.example.test
      paths:
        - path: /api/client
          pathType: Prefix
        - path: /
          pathType: Prefix
  tls:
    - secretName: mailfathom-tls
      hosts:
        - mailfathom.example.test

# The channel prefix is stated rather than left at its default, so the rendering shows the key the application is given
# rather than the key being absent — this deployment shares its endpoint with nothing, and naming a prefix anyway is
# what an operator on a shared one has to do.
signalBackplane:
  enabled: true
  channelPrefix: mailfathom-verification
