# The object store as a pool, which is the half of `contentStorage.objectStorage.deploy` that `object-store-values.yaml`
# does not render: there one pod is governed by the ClusterIP Service and given one directory, and here four pods are
# governed by a headless Service of their own, started in parallel, and given every member of the pool at once. Between
# the two files both branches of `deploy.replicas` are rendered by the repository's own verification, exactly as the
# two content-storage documents do for `deploy.enabled`.
#
# Four rather than two, because four is what an operator installing this for durability would actually write: the
# server forms one erasure set across the pods either way, and a set of four is the smallest that survives a lost pod
# while still holding a majority. The rendering is the same shape at any count between two and sixteen — only the
# ellipsis in the server's arguments and the replica count move — so one document covers the branch.
#
# Everything else is the smallest values document the chart installs from, so what the golden manifest shows against
# `object-store.yaml` is the pool and nothing else.
image:
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

secrets:
  existingSecret: mailfathom-secrets

database:
  deploy:
    superuserPasswordSecret: mailfathom-postgres-superuser

# The certificate authority is the one setting a pool adds beyond the count. Each pod validates the certificate the next
# one presents, so the authority that signed it is mounted where the server reads a private one from — out of the
# store's own TLS Secret rather than out of `secrets.existingSecret`, which the store never mounts.
contentStorage:
  backend: objectStorage
  objectStorage:
    bucket: mailfathom-content
    trustAnchorSecretKey: mailfathom-object-storage-trust-anchor
    deploy:
      enabled: true
      replicas: 4
      tls:
        existingSecret: mailfathom-silo-tls
        certificateAuthoritySecretKey: ca.crt
      rootCredentialSecret: mailfathom-silo-root
