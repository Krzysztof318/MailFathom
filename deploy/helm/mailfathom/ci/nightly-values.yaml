# The unsupported channel, rendered so the repository's verification proves that selecting it requires the
# acknowledgement, requires a reference that calls itself a nightly, and marks every rendered object as unsupported.
# Nothing installs from this file.
#
# The tag is shaped like a real nightly identifier because that is what the chart now checks: the channel is decided by
# what the reference says rather than by the registry it names, so a tag that could belong to a release is refused here.
image:
  channel: nightly
  registry: ghcr.io
  repository: krzysztof318/mailfathom
  tag: 0.0.0-nightly.1-0000000
  nightlyAcknowledgement: i-understand-this-is-unsupported

# Nothing here names a database host, which is the point: the chart deploys one by default, so this file also renders
# the StatefulSet, its Service, and its initialization ConfigMap that the release values deliberately do not. The
# superuser password names a second Secret because the chart refuses to put that credential in the one the application
# pod mounts whole.
database:
  deploy:
    superuserPasswordSecret: mailfathom-postgres-superuser

secrets:
  existingSecret: mailfathom-secrets

# Personal-data scanning with the analyzer the chart runs itself, which is the branch that renders the analyzer
# Deployment, its Service, and the derived address the application is pointed at. The release values render the other
# branch, so between the two files every shape of this block is produced by the repository's verification — and the
# default, which renders none of it, is what `helm template` over the chart's own values shows.
personalDataScanning:
  enabled: true

# The spam scanner the chart runs itself, which is the branch that renders the scanner Deployment, its Service, and the
# derived address the application is pointed at. The release values render the other branch, so between the two files
# every shape of this block is produced by the repository's verification.
spamScanning:
  enabled: true
