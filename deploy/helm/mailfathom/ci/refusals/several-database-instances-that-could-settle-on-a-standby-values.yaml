# refuses: database.host names several PostgreSQL instances while database.extraConnectionParameters does not set Target Session Attributes to primary or to read-write

# A replicated PostgreSQL named instance by instance, with nothing saying which of them MailFathom may write to. The
# rendering this would otherwise produce is correct in every visible way — the connection string names three hosts and
# the pod mounts the same Secret it always did — so no golden manifest could hold this. What is missing shows up as a
# deployment that starts, serves every read, and fails on the first write inside a synchronization run.
image:
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

secrets:
  existingSecret: mailfathom-secrets

database:
  deploy:
    enabled: false
  host: postgres-1.example.test,postgres-2.example.test,postgres-3.example.test
  extraConnectionParameters: SslMode=VerifyFull;
