# refuses: signalBackplane.enabled is false while replicaCount is 2

# More than one replica with `client.enabled`, which is the first of the three ways a deployment turns the client
# surface on, and what this document proves is that the chart reads it. The page alone is not a shape that would run —
# the application refuses to start with the page served and `ClientEndpoint` off, which `values.yaml` states where the
# switch is described — so the deployment that installs, serves, and silently tells its clients nothing is the one the
# document beside this one renders. Each of the three is refused at `helm install` rather than found from a mailbox
# that stopped updating.
image:
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

secrets:
  existingSecret: mailfathom-secrets

database:
  deploy:
    superuserPasswordSecret: mailfathom-postgres-superuser

replicaCount: 2

client:
  enabled: true
