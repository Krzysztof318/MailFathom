# refuses: signalBackplane.enabled is false while replicaCount is 2

# More than one replica serving MailFathom's own page, with no backplane configured. Everything here is valid on its
# own and the deployment would install, start, and answer every request — and its clients would be told nothing,
# because a signal raised by the replica holding an account reaches only the connections that replica holds. That is
# the one configuration in this chart that looks healthy and silently cannot do what it was configured for, so it is
# refused at `helm install` rather than found from a mailbox that stopped updating.
image:
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

secrets:
  existingSecret: mailfathom-secrets

database:
  deploy:
    superuserPasswordSecret: mailfathom-postgres-superuser

replicaCount: 2

client:
  enabled: true
