# refuses: service.externalTrafficPolicy is "Local" while service.type is ClusterIP

# A traffic policy on a Service nothing outside the cluster reaches. The API server refuses it too, but only once the
# release is being applied and in words about a field rather than about the client address the operator meant to keep,
# which belongs on the ingress controller's Service when an ingress stands in front.
image:
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

secrets:
  existingSecret: mailfathom-secrets

database:
  deploy:
    superuserPasswordSecret: mailfathom-postgres-superuser

service:
  type: ClusterIP
  port: 8080
  externalTrafficPolicy: Local
