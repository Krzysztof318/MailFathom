# refuses: signalBackplane.enabled is false while replicaCount is 2

# The document beside this one, with the client surface switched on from a YAML file instead of a JSON one. The chart
# reads a file in the format its extension names, exactly as MailFathom does, so a surface a YAML file serves is still a
# surface several replicas serve — and a chart that parsed every file as JSON would see nothing here and render it.
image:
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

secrets:
  existingSecret: mailfathom-secrets

database:
  deploy:
    superuserPasswordSecret: mailfathom-postgres-superuser

replicaCount: 2

config:
  files:
    10-mailfathom.yml: |
      clientEndpoint:
        enabled: true
        authentication:
          - method: password
