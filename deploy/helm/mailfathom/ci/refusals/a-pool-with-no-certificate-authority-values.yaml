# refuses: contentStorage.objectStorage.deploy.tls.certificateAuthoritySecretKey is not set while contentStorage.objectStorage.deploy.replicas is above one

# A pool asked for without the authority its pods validate each other with. This is the refusal that cannot be a golden
# manifest, because what the chart would otherwise produce looks entirely correct: four pods, a headless Service, and
# the server started against every member. What is missing only shows up in the cluster, as pods that come up, fail to
# connect to one another, and never form the pool — with nothing in the rendering to say why.
image:
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

secrets:
  existingSecret: mailfathom-secrets

database:
  deploy:
    superuserPasswordSecret: mailfathom-postgres-superuser

contentStorage:
  backend: objectStorage
  objectStorage:
    bucket: mailfathom-content
    trustAnchorSecretKey: mailfathom-object-storage-trust-anchor
    deploy:
      enabled: true
      replicas: 4
      tls:
        existingSecret: mailfathom-silo-tls
      rootCredentialSecret: mailfathom-silo-root
