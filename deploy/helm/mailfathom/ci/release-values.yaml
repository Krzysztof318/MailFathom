# The values the repository's own verification renders the chart with, standing in for a deployment on the supported
# release channel. Nothing here names a real image or a real database, deliberately: the point of this file is to give
# `helm lint` and `helm template` a values document that satisfies the schema, so the templates themselves are what
# gets checked rather than a deployment somebody would have to keep current.
image:
  channel: release
  registry: docker.io
  repository: example/mailfathom
  tag: 0.1.0-verification
  allowVersionMismatch: true

# The external-database shape, which is the half of the choice the nightly values do not render: nothing of the
# StatefulSet, its Service, or its initialization script is produced, and the connection string names the server given
# here. Between the two files both branches of `database.deploy.enabled` are rendered by the repository's verification.
database:
  deploy:
    enabled: false
  host: postgres.mailfathom.svc.cluster.local
  name: mailfathom
  user: mailfathom

secrets:
  existingSecret: mailfathom-secrets

config:
  files:
    10-mailfathom.json: |
      {
        "McpEndpoint": {
          "Enabled": true,
          "Authentication": [
            { "Method": "api-key" }
          ]
        },
        "ClientEndpoint": {
          "Enabled": true,
          "Cors": {
            "AllowedOrigins": [ "https://mailfathom.example.test" ]
          },
          "Authentication": [
            {
              "Method": "oauth-subject",
              "OAuth": {
                "Resource": "https://mailfathom.example.test/api/client",
                "AuthorizationServers": [
                  {
                    "Name": "workforce",
                    "Issuer": "https://sso.example.test/realms/mailfathom"
                  }
                ]
              }
            }
          ]
        }
      }

# The external-analyzer shape, matching the external-database choice above: nothing of the analyzer Deployment or its
# Service is rendered, and the application is pointed at the address given here. An address inside the cluster, because
# that is the only arrangement the documentation supports — the whole point of scanning is that content is inspected
# before it leaves the trust boundary.
personalDataScanning:
  enabled: true
  analyzer:
    deploy: false
    endpoint: http://presidio-analyzer.mailfathom.svc.cluster.local:3000

# The external-scanner shape, matching the external-analyzer choice above: nothing of the scanner Deployment or its
# Service is rendered, and the application is pointed at the daemon named here. An address inside the cluster, because
# that is the only arrangement the documentation supports — a scan sends the whole message, unredacted, to whatever
# answers there.
spamScanning:
  enabled: true
  scanner:
    deploy: false
    host: spamassassin.mailfathom.svc.cluster.local

# The client served as a page, which is the half of the choice the other two values documents do not render: with the
# ingress below terminating TLS, the chart writes the switch and the clear-text permission together. Between this file
# and the two beside it, both branches of `client.enabled` are rendered by the repository's own verification.
client:
  enabled: true

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: mailfathom.example.test
      paths:
        - path: /mcp
          pathType: Prefix

        # The client surface is published beside the MCP one, because the shape it is enabled in above is the one whose
        # caller is a browser on somebody's own machine rather than a workload inside the cluster.
        - path: /api/client
          pathType: Prefix

        # The page itself, at the root of the same host it calls. Same origin is what lets the bundle carry no address
        # at all, so publishing it anywhere else would be publishing a client that reaches nothing.
        - path: /
          pathType: Prefix
  tls:
    - secretName: mailfathom-tls
      hosts:
        - mailfathom.example.test
