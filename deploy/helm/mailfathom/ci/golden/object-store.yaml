            - name: superuser
              mountPath: /etc/mailfathom/postgres-superuser
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --quiet
                - --host=127.0.0.1
                - --username=postgres
                - --dbname=mailfathom
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - pg_isready
                - --quiet
                - --host=127.0.0.1
                - --username=postgres
                - --dbname=mailfathom
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: initialization
          configMap:
            name: mailfathom-postgres-init
            defaultMode: 0555
        - name: secrets
