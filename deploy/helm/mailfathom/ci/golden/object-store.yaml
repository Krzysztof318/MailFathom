          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: postgres
          image: "docker.io/pgvector/pgvector:0.8.6-pg18"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
