              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: "/etc/mailfathom/postgres-superuser/postgres-superuser-password"
            - name: MAILFATHOM_DATABASE
              value: "mailfathom"
            - name: MAILFATHOM_DATABASE_ROLE
              value: "mailfathom"
            - name: MAILFATHOM_DATABASE_PASSWORD_FILE
              value: "/etc/mailfathom/secrets/mailfathom-database-password"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initialization
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: secrets
              mountPath: /etc/mailfathom/secrets
              readOnly: true
            - name: superuser
              mountPath: /etc/mailfathom/postgres-superuser
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --quiet
                - --host=127.0.0.1
                - --username=postgres
                - --dbname=mailfathom
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - pg_isready
                - --quiet
                - --host=127.0.0.1
                - --username=postgres
                - --dbname=mailfathom
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
