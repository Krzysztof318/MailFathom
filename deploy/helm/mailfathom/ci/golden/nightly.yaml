  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          helm.sh/chart: mailfathom-0.0.0
          app.kubernetes.io/name: mailfathom-postgres
