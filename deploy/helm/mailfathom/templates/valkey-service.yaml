{{- if and .Values.signalBackplane.enabled .Values.signalBackplane.valkey.deploy }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailfathom.backplaneFullname" . }}
  labels:
    {{- include "mailfathom.backplaneLabels" . | nindent 4 }}
spec:
  {{- /*
    ClusterIP, and there is no value to make it anything else. Anyone who can subscribe here reads every signal of every
    user of this deployment — account and folder aliases, stored identities, flags, and a notification's two lines — so
    the one shape this chart supports is one where nothing outside the cluster can reach it, which is also why no ingress
    rule is rendered for it. The server's password is what limits who inside the cluster can ask.
  */}}
  type: ClusterIP
  {{- /*
    One pod rather than the set, always. A RESP server's replicas do not share subscriptions, so a Service that
    load-balanced across them would deliver a subscription to one instance and a publication to another and lose the
    signal in between. Ordinal 0 is the instance the set starts as the primary, which is what this names.

    **It does not follow a promotion**, because nothing in this chart performs one: promoting a standby is an
    operator's `REPLICAOF NO ONE` and this selector repointed at the pod they promoted. It is also the address a scrape,
    a `valkey-cli`, or an operator reading `INFO` reaches a known instance at.
  */}}
  selector:
    {{- include "mailfathom.backplaneSelectorLabels" . | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "mailfathom.backplaneFullname" . }}-0
  ports:
    - name: resp
      port: {{ .Values.signalBackplane.valkey.service.port }}
      targetPort: resp
      protocol: TCP
{{- end }}
