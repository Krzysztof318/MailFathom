{{- include "mailfathom.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailfathom.fullname" . }}
  labels:
    {{- include "mailfathom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mailfathom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /*
          Restarts the pods when the configuration they mount changes. A ConfigMap edit is picked up without one for
          the settings MailFathom classifies reloadable, but adding or removing a *key* is restart-required: the directory
          is enumerated once while the host composes itself, so a new key produces a file no provider reads.
        */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mailfathom.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mailfathom.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mailfathom
          image: {{ include "mailfathom.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- /*
              The probes get a listener of their own so that reaching them never means reaching the MCP endpoint. It is
              a container port and not a Service port: the kubelet dials it on the pod's address, and nothing the
              Service publishes reaches it.
            */}}
            - name: health
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            {{- /*
              The MCP endpoint's own port. MailFathom refuses ASPNETCORE_HTTP_PORTS and every other URL-shaped
              address, because each surface states where it is served in its own configuration section. It restates
              the container port above rather than reading .Values.service.port, which is what the Service publishes
              and is free to differ from what the container listens on.
            */}}
            - name: McpEndpoint__Port
              value: "8080"
            - name: HealthEndpoints__Port
              value: {{ .Values.probes.port | quote }}
            - name: ConfigurationSources__Directory
              value: {{ .Values.config.mountPath | quote }}
            {{- if .Values.config.pollForChanges }}
            {{- /*
              The kubelet updates a mounted ConfigMap by swapping a symbolic link, which FileSystemWatcher does not
              reliably observe. Polling is what makes an edited value reach the running process; the four-second
              interval is the runtime's and is not configurable.
            */}}
            - name: DOTNET_USE_POLLING_FILE_WATCHER
              value: "1"
            {{- end }}
            - name: ConnectionStrings__mailfathom
              value: {{ include "mailfathom.connectionString" . | quote }}
            {{- /*
              The password is never read into this object. MailFathom resolves the reference below per use and erases the
              material immediately, which is also why a Secret the cluster rotates behind an unchanged mount path
              reaches the next database connection without a restart.
            */}}
            - name: Persistence__Password__Name
              value: {{ .Values.database.passwordSecretKey | quote }}
            - name: Persistence__Password__SecretReference
              value: {{ printf "file:%s/%s" (trimSuffix "/" .Values.secrets.mountPath) .Values.database.passwordSecretKey | quote }}
            {{- if .Values.client.enabled }}
            {{- /*
              The switch that puts the page in front of the mailbox, and — separately — the statement that its hop is
              protected. MailFathom refuses to serve the client over a clear-text socket unless a deployment says
              something in front of it terminates TLS, and this pod never does: it speaks plain HTTP by design. So the
              permission is written exactly when the chart can see the ingress terminating TLS, and withheld otherwise
              — where TLS terminates somewhere this chart cannot read, the application refuses to start and names the
              setting, which is the honest outcome for a posture no template can verify.
            */}}
            - name: ClientEndpoint__Application__Enabled
              value: "true"
            {{- if and .Values.ingress.enabled .Values.ingress.tls }}
            - name: ClientEndpoint__Application__AllowClearText
              value: "true"
            {{- end }}
            {{- end }}
            {{- if .Values.personalDataScanning.enabled }}
            {{- /*
              The switch and the analyzer's address are written together, from the one value that decided whether the
              analyzer is deployed at all. Splitting them across this file and a mounted configuration file is what would
              let a deployment switch the scanner on and point it nowhere — which MailFathom refuses to start with, as it
              should, but the refusal would be about a file an operator did not think they were editing.
            */}}
            - name: SensitiveContent__Pii__Enabled
              value: "true"
            - name: SensitiveContent__PersonalDataAnalyzer__Endpoint
              value: {{ include "mailfathom.analyzerEndpoint" . | quote }}
            {{- /*
              A list reaches .NET configuration as indexed keys, so each language becomes an environment entry of its
              own numbered from zero. Ranging over the value is what keeps the numbering contiguous: a gap ends the
              bound list at it, so a chart writing a fixed set of slots would silently drop every language after an
              empty one.
            */}}
            {{- range $index, $language := .Values.personalDataScanning.analyzer.languages }}
            - name: SensitiveContent__PersonalDataAnalyzer__Languages__{{ $index }}
              value: {{ $language | quote }}
            {{- end }}
            - name: SensitiveContent__PersonalDataAnalyzer__MinimumConfidence
              value: {{ .Values.personalDataScanning.analyzer.minimumConfidence | quote }}
            {{- end }}
            {{- if .Values.spamScanning.enabled }}
            {{- /*
              Both switches are written here rather than one of them being left to a config file, for the reason the
              analyzer's are: MailFathom refuses to start with a scanner switched on and classification off, and it
              refuses again with a scanner switched on and nowhere to ask — and both refusals would be about a file an
              operator did not think they were editing. Which folders are classified and what threshold a score is
              judged by stay in `config.files`, because they are decisions about mail rather than about deployment.
            */}}
            - name: SpamClassification__Enabled
              value: "true"
            - name: SpamClassification__UseScanner
              value: "true"
            - name: SpamClassification__Scanner__Host
              value: {{ include "mailfathom.spamScannerHost" . | quote }}
            - name: SpamClassification__Scanner__Port
              value: {{ include "mailfathom.spamScannerPort" . | quote }}
            - name: SpamClassification__Scanner__ScanTimeoutSeconds
              value: {{ .Values.spamScanning.scanner.scanTimeoutSeconds | quote }}
            - name: SpamClassification__Scanner__MaximumMessageBytes
              value: {{ .Values.spamScanning.scanner.maximumMessageBytes | quote }}
            - name: SpamClassification__Scanner__MaximumConcurrentScans
              value: {{ .Values.spamScanning.scanner.maximumConcurrentScans | quote }}
            {{- end }}
            {{- range $name, $value := .Values.config.extraEnvironment }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
            {{- /* The one path the runtime writes to, which is what makes a read-only root filesystem workable. */}}
            - name: temporary
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: health
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mailfathom.fullname" . }}-config
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0400
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.temporaryDirectory.sizeLimit }}
