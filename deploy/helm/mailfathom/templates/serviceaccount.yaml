{{- if .Values.serviceAccount.create }}
{{- include "mailfathom.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mailfathom.serviceAccountName" . }}
  labels:
    {{- include "mailfathom.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
  MailFathom calls no Kubernetes API, so a projected service-account token in the pod would be a credential with nothing
  to authenticate to and one more thing to steal. The Deployment sets `automountServiceAccountToken` as well, because
  the pod-level setting is the one that binds when both are present.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
