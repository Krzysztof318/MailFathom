# Default values for the MailFathom chart.
#
# Two things have no default and must be supplied: the image, and the Secret carrying the credentials. Everything else
# below is a working value that a deployment may leave alone — including the database, which the chart runs itself
# unless told to use one you already operate. `values.schema.json` beside this file rejects a values document that omits
# what is required or that combines settings which cannot both hold, so a mistake fails at `helm install` rather than
# as a pod that never becomes ready.

### Naming
#
# Every object is named after the release. Override only where a cluster already reserves the name a release would
# produce; changing either after an install renames objects the previous release owned.
nameOverride: ""
fullnameOverride: ""

### The image
#
# There is no default repository or tag, deliberately. A default would pin every install to whichever version this
# file happened to name or, worse, name a moving tag that a cluster would silently follow. Set the values below to the
# immutable reference your deployment runs; `krzysztof318/mailfathom` on either registry named under `registry`.
image:
  # `release` or `nightly`.
  #
  # `release` is a published release image and the only supported channel. `nightly` is whatever `main` was the night
  # it was built: it carries no release promise, may expect a schema no published migration produces, is deleted once
  # thirty newer nightlies exist, and is never what `appVersion` describes. Selecting it requires the acknowledgement
  # below, and the chart's notes say so on every install and upgrade.
  #
  # Both channels are published to both registries under the same digest, so the channel is decided by what the
  # reference calls itself rather than by where it came from: a nightly tag carries a `-nightly.` identifier and a
  # release tag never does. The chart refuses the two combinations that would misrepresent one as the other.
  channel: release

  # Whichever registry you pull from. Both carry every version under the same digest, so this is a question about your
  # environment rather than about the artifact: `ghcr.io` or `docker.io`.
  registry: ""
  repository: ""

  # Supply exactly one. A digest is preferred: it is the only reference a registry cannot repoint, so a rollback goes
  # back to the same bytes. A tag is accepted when it is immutable — never `latest`, and never a floating major or
  # minor, both of which the schema rejects.
  tag: ""
  digest: ""

  pullPolicy: IfNotPresent
  pullSecrets: []

  # Required, and rejected unless it reads exactly `i-understand-this-is-unsupported`, when `channel` is `nightly`.
  nightlyAcknowledgement: ""

  # The chart compares `image.tag` against `Chart.appVersion` on the release channel and refuses an install where the
  # two disagree, so a chart upgrade cannot quietly deploy a different application version than it documents. Two
  # cases carry nothing to compare and are not refusals: naming the image by `image.digest`, which publishes no
  # version, and installing the unpackaged chart directory, which states no `appVersion` because only the release run
  # supplies one. Set this to true only to deploy a deliberate combination, and say why in your own values file.
  allowVersionMismatch: false

### The database
#
# MailFathom needs PostgreSQL with the `vector` extension. The chart runs one for you by default, as a single-replica
# StatefulSet on a PersistentVolumeClaim, so an install needs nothing beyond a Secret and an image reference. Point it
# at a server you already operate instead by turning `deploy.enabled` off and naming the host — which is the shape to
# choose once backup, durability, failover, and the upgrade path are somebody's job rather than a volume's.
database:
  deploy:
    # The one value here that changes what the chart renders rather than what it connects to. On, the chart creates the
    # StatefulSet, its Service, and its initialization script, and `host` below is derived from the release name and
    # must be left empty. Off, nothing of the sort is rendered and `host` is required.
    enabled: true

    # pgvector rather than plain postgres: the schema declares the `vector` extension, and the stock image cannot create
    # it. This is the same pin the Compose deployment and the local orchestration use, so a schema reviewed against one
    # is reviewed against the same server version everywhere.
    #
    # Unlike the application image above, this one carries a default, and the two are different questions: MailFathom's
    # own version is what a deployment chooses and this is a dependency the chart operates. It is still an immutable
    # tag naming both halves — the extension's version, then the PostgreSQL major.
    image:
      registry: docker.io
      repository: pgvector/pgvector
      tag: 0.8.6-pg18
      pullPolicy: IfNotPresent
      pullSecrets: []

    # The superuser password, used by `initdb` on the first start and by nothing afterwards. MailFathom never connects
    # as this role: the initialization script uses it once to create the unprivileged role that owns the database and
    # to install the `vector` extension, which are the only two things a superuser is needed for.
    #
    # It lives in a Secret of its own, and the chart refuses one that is also `secrets.existingSecret`. That Secret is
    # mounted whole into the application pod — it has to be, because the keys MailFathom reads are named by your own
    # configuration and the chart cannot enumerate them — so a superuser credential placed in it would be readable
    # from the network-facing pod that parses untrusted MIME, which is exactly the boundary the unprivileged role
    # exists to draw. The Compose deployment separates the two the same way, by leaving this credential off the
    # application service's own secret list.
    superuserPasswordSecret: ""
    superuserPasswordSecretKey: postgres-superuser-password

    # The claim holding every synchronized message. It outlives the pod and is deliberately not deleted when the
    # release is: `helm uninstall` leaves the claim behind, and removing the data is a separate `kubectl delete pvc`.
    persistence:
      size: 20Gi
      # Empty uses the cluster's default StorageClass. Name one whose volumes suit a database rather than a cache.
      storageClassName: ""
      accessMode: ReadWriteOnce

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Everything except the password. The password arrives as a mounted secret, named below, because a connection string
  # in a ConfigMap would put a credential into an object that is neither encrypted at rest nor access-controlled like
  # a Secret.
  #
  # `host` is required when `deploy.enabled` is off and refused when it is on, where the chart derives it from the
  # release name: two values naming one server is how a deployment ends up connecting somewhere it did not install.
  #
  # **A replicated cluster is named here in one of two ways, and the chart deploys neither.** One address that follows
  # the primary through a failover is the ordinary one — a CloudNativePG cluster's `-rw` Service is exactly that, and
  # nothing else here changes for it. Or name the instances themselves, comma separated, and let the driver find the
  # primary among them; that shape survives the address in front of the cluster being unavailable, and it requires
  # `Target Session Attributes` below. Reads are never sent to a replica in either shape.
  host: ""
  port: 5432
  name: mailfathom
  user: mailfathom

  # Extra Npgsql keywords appended verbatim, for example `SslMode=VerifyFull;`. Keep credentials out of it; the schema
  # rejects a value that names a password.
  #
  # `Target Session Attributes=primary;` belongs here whenever `host` above names more than one instance, and the chart
  # refuses that shape without it. MailFathom writes to the instance it connects to, so `any`, `prefer-primary`, and
  # `prefer-standby` all permit the driver to settle on a hot standby — a deployment whose reads work and whose first
  # write fails. `read-write` is the stronger of the two accepted values and refuses a session that is read-only for
  # any reason, not only a standby.
  extraConnectionParameters: ""

  # The key inside the mounted secret holding the password. The reference MailFathom binds is
  # `file:/etc/mailfathom/secrets/<key>`, which is the same shape the Compose deployment uses, so a `SecretReference`
  # written for one deployment reads correctly in the other.
  passwordSecretKey: mailfathom-database-password

### Where message content is stored
#
# The raw MIME of every message this deployment stores next: in PostgreSQL beside the metadata, which is the default and
# what every deployment that has never heard of this setting is already running, or in an S3-compatible bucket you
# operate, rent, or have the chart run for you under `objectStorage.deploy` below. Selecting the bucket changes nothing
# else — the metadata, the indexes, and every job still run through PostgreSQL — so this is a decision about payload
# bytes rather than about the database.
#
# **It decides only where the next write goes.** Every content row names the store holding its own payload, so turning
# this on moves nothing already stored and turning it back off re-encodes nothing. Getting content out of one store and
# into the other is a move an operator runs, not a setting they flip, and until it has run a deployment reads from both.
#
# **A `pg_dump` stops being a whole backup the moment this is on.** The rows point at objects in the bucket, so the two
# stores are backed up and restored together, database first;
# docs/operations/deployment-kubernetes.md states the order and what a mismatch between them looks like.
#
# The chart writes nothing when `backend` is `database`, which is what makes a rendering that sets none of this
# identical to one from a chart that never carried it. Enabling it requires an `https` endpoint, a bucket, and both
# halves of a credential — MailFathom presents an explicit credential on every request and never acquires the host's own
# identity from the environment, so a deployment that named none is refused at startup rather than signing as whoever
# the node is. The timeouts, the reclamation sweep, and the bounds on moving what is already stored are tuning rather
# than deployment shape and belong in
# `config.files`; docs/operations/configuration-runtime.md holds every key.
contentStorage:
  # `database` or `objectStorage`.
  backend: database

  objectStorage:
    # The endpoint, not the bucket: the bucket is named below and reached by whichever addressing style the flag further
    # down selects. An absolute `https` address — a plain `http` one is refused, because a request carries a signature
    # and, on a write, the message itself.
    endpoint: ""

    # The one bucket every object is written into and read from. It is not created for you.
    bucket: ""

    # The prefix every key this deployment writes begins with. Empty is a bucket MailFathom has to itself, which is the
    # ordinary shape; a prefix is what makes a shared bucket safe, and nothing here can check that two deployments
    # sharing one arranged disjoint prefixes. The reclamation sweep lists beneath this prefix and nowhere else.
    keyPrefix: ""

    # The region a request is signed under. Empty takes `us-east-1`, which is what an endpoint with no notion of a
    # region accepts; a request always carries one, because SigV4 puts a region into the credential scope either way.
    region: ""

    # On by default, because virtual-hosted addressing needs a wildcard DNS name and a certificate to match it, which an
    # endpoint reached by a Service name inside a cluster has neither of.
    usePathStyleAddressing: true

    # The two halves of the credential, as **keys inside `secrets.existingSecret`** rather than as values. The chart
    # templates no credential and creates no Secret, so what is named here is a file in the Secret the pod already
    # mounts, and MailFathom reads it as `file:<secrets.mountPath>/<key>` before every request — which is what lets a
    # key rotated behind an unchanged mount reach the next call with no restart to schedule.
    #
    # The access key identifier is a secret like the secret beside it. It names an identity at the endpoint, it is one
    # half of what an attacker needs, and every provider that issues one issues it together with its secret from the
    # same place.
    accessKeyIdSecretKey: mailfathom-object-storage-access-key-id
    secretAccessKeySecretKey: mailfathom-object-storage-secret-access-key

    # The certificate authority that signed the endpoint's certificate, as a key inside the same Secret. Leave it empty
    # for an endpoint the cluster's own trust store already answers for, which is every hosted provider; name a key for
    # an endpoint you run yourself. It is the only supported way to reach one — no setting anywhere turns validation off.
    #
    # Required with `deploy.enabled` below: the endpoint is then a Service name inside the cluster, which no public
    # authority issues for, so the certificate that answers there is one you signed.
    trustAnchorSecretKey: ""

    # An object store the chart runs beside MailFathom, for a deployment that wants payload bytes out of PostgreSQL and
    # does not already operate one. Off, and with it off the chart renders no object-store workload, no volume for one,
    # and no Service: an opt-in you did not take pulls no image and holds no disk. The endpoint above is then yours to
    # name, which is the ordinary shape — a bucket you rent, or a store you already run.
    #
    # **One node on one volume by default, and a pool where `replicas` below says so.** A single node has no erasure
    # coding and no redundancy of any kind: what it protects against is a container being replaced, and a disk that
    # fails takes the payloads with it, so the backup order in docs/operations/deployment-kubernetes.md is what stands
    # between that shape and losing them.
    #
    # Silo is PGSTY's maintained fork of the open-source MinIO server, keeping one release line alive after upstream
    # ended community distribution. It is AGPL-3.0-or-later; the chart names an image your cluster pulls from PGSTY's
    # own registry and carries no part of it, which THIRD_PARTY_LICENSES.md records as the reading it is used under.
    deploy:
      enabled: false

      # **How many Silo pods the pool is made of, and it is decided once.** One is a single node on a single drive,
      # which is what a default install gets and what the paragraph above describes. Anything from 2 to 16 is a
      # distributed pool: the server forms one erasure set across the pods, one drive each, and an object survives the
      # loss of as many pods as the set has parity — which is what makes this different from running the same image
      # more times.
      #
      # **The width of a pool is fixed when the pool is created.** Raising this on a running release does not widen the
      # pool and does not rebalance anything, because the erasure set was decided the first time the server started
      # against these drives. Deciding it afterwards means a second pool with its own claims and a copy of every object
      # into it, which is an operator's migration rather than a value this chart changes for you.
      #
      # Above one, three things follow and the chart renders each of them: the pods are started in parallel rather than
      # in order, because none of them becomes ready until the pool has quorum; a headless Service gives each pod a
      # name of its own that a rescheduling does not change; and the peers reach each other over the same HTTPS
      # listener MailFathom reaches, which is what `tls.certificateAuthoritySecretKey` below is for.
      #
      # Sixteen is the largest erasure set the server forms, so it is the ceiling here rather than a preference. **Four
      # is where a pool starts being worth having**: below it the set carries one parity drive, so a lost pod leaves the
      # store readable and not writable, while from four the set carries two and stays writable through the first loss.
      # Two and three are allowed because the server allows them, not because they buy what the count above suggests.
      #
      # Spread the pods over nodes with `affinity` below — a pool whose pods share one node survives the loss of a drive
      # and not the loss of that node.
      replicas: 1

      # An immutable tag, like every dependency the deployment operates rather than a version it chooses. It is the same
      # pin the Compose deployment, the Quadlet units, and the integration suite carry, so a server the suite verified
      # the S3 adapter against is the server this renders.
      image:
        registry: docker.io
        repository: pgsty/silo
        tag: RELEASE.2026-08-06T00-00-00Z
        pullPolicy: IfNotPresent
        pullSecrets: []

      # **The certificate the object store answers with, and there is no way to run it without one.** MailFathom refuses
      # a plain `http` endpoint — a request carries a signature and, on a write, the message itself — so the store this
      # chart runs terminates TLS itself. Name a Secret the cluster already holds, whose certificate covers the Service
      # name the chart derives the endpoint from:
      #
      #   <release>-silo, <release>-silo.<namespace>, and <release>-silo.<namespace>.svc
      #
      # A `kubernetes.io/tls` Secret is the ordinary shape and needs no key names changed; cert-manager issues one from
      # a private issuer with those names in a `Certificate`. The chart templates no certificate and issues none. The
      # authority that signed it is what `trustAnchorSecretKey` above names, as a key inside `secrets.existingSecret`,
      # because that is the Secret MailFathom's own process mounts.
      #
      # **A pool needs two more things of the same certificate.** Every pod talks to every other over this listener, so
      # the certificate has to cover the peer names as well as the Service name —
      #
      #   *.<release>-silo-peers.<namespace>.svc.cluster.local
      #
      # covers all of them, and cert-manager takes that as a `dnsNames` entry like any other. And the authority that
      # signed it has to be readable by the server itself, which is what the key below is for: a peer's certificate is
      # validated against the cluster's trust store and this authority, and nothing anywhere turns that off.
      #
      # `certificateAuthoritySecretKey` names a key inside `tls.existingSecret` rather than inside
      # `secrets.existingSecret`, because the store never mounts the application's Secret — that one carries mailbox
      # passwords, and the object store is the process that must not be able to read them. `ca.crt` is the key
      # cert-manager writes the issuing authority to in the same Secret, so an issued certificate usually already
      # carries it. It is required with `replicas` above one and unused with a single node, which talks to nobody.
      tls:
        existingSecret: ""
        certificateSecretKey: tls.crt
        privateKeySecretKey: tls.key
        certificateAuthoritySecretKey: ""

      # **The store's root credential, in a Secret of its own that the application never mounts** — the line the
      # database's superuser password is on the other side of, and for the same reason. `secrets.existingSecret` is
      # mounted whole into the application pod, because the keys MailFathom reads are named by your configuration rather
      # than by this chart, so a credential placed there is readable by the process that parses untrusted mail. The root
      # credential administers the whole server: it creates buckets, issues access keys, and reads every object.
      #
      # What MailFathom itself presents is a different credential entirely — an access key scoped to the one bucket,
      # which you create with the root credential once and put into `secrets.existingSecret` under the two
      # `...SecretKey` names above. docs/operations/deployment-kubernetes.md has the commands.
      #
      # Both halves arrive as files rather than as environment entries, read by the server's own `MINIO_ROOT_USER_FILE`
      # and `MINIO_ROOT_PASSWORD_FILE`.
      rootCredentialSecret: ""
      rootAccessKeyIdSecretKey: silo-root-access-key-id
      rootSecretAccessKeySecretKey: silo-root-secret-access-key

      # Where the payloads land, as one claim per pod. The claim outlives the release, like the database's:
      # `helm uninstall` deletes neither, so removing the release does not remove the mail, and neither does scaling the
      # set down. Size it against what the mailboxes hold — this is the raw MIME of every message written while the
      # object backend is selected, and it is the same volume of bytes PostgreSQL would otherwise have carried. A pool
      # spreads that across its pods and spends part of it on parity, so `size` is what each pod gets rather than what
      # the pool holds.
      persistence:
        size: 20Gi
        accessMode: ReadWriteOnce
        storageClassName: ""

      # The S3 API, and the only port anything is routed to by default. ClusterIP, and no value makes it anything else:
      # what answers here holds every message this deployment has stored.
      service:
        port: 9000

      # **The administrative console, and it is off.** It is a full management interface over every object the store
      # holds — bucket contents, access keys, the server's own configuration — so it is a second surface onto the mail
      # rather than a convenience. With it off the server does not listen for it at all, and no port on the Service
      # routes to one.
      #
      # Turning it on starts that listener and adds the port below to the Service. It is still a ClusterIP port and the
      # chart publishes no ingress for it, so reaching it is a deliberate `kubectl port-forward` — and anything you put
      # in front of it is yours to authenticate. It authenticates with the root credential above, which is the whole
      # server rather than the one bucket.
      console:
        enabled: false
        port: 9001

      # Modest. The server holds no index in memory and streams what it serves; what it wants is disk and file
      # descriptors rather than heap.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 1Gi

      # Restricted Pod Security Standard, and unlike the spam scanner this workload meets it: the server binds its port
      # as whatever account it was started as and drops no privilege of its own, so nothing has to begin as root. The
      # account is stated here rather than left to the image, which declares none and would otherwise run as root.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # What makes the mounted claim writable by that account without an entrypoint needing to be root to chown it.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      nodeSelector: {}
      tolerations: []
      affinity: {}

### Secrets
#
# The chart creates no Secret and templates no credential. It mounts one the operator has already created, read-only,
# at /etc/mailfathom/secrets — one file per key. Every credential MailFathom reads is a `file:` reference into that
# directory: mailbox passwords, MCP API keys, and a private trust anchor alike. A Secrets Store CSI driver needs no
# support beyond this, because it mounts files too.
#
# This Secret is mounted whole, because the keys MailFathom reads are the ones your own configuration names and the
# chart cannot know them. A deployed database therefore reads one key of it — the database password — and nothing else,
# and takes the superuser password from a second Secret the application never mounts.
secrets:
  existingSecret: ""
  mountPath: /etc/mailfathom/secrets

### Configuration
#
# Rendered into a ConfigMap and mounted as a directory of JSON files, which MailFathom layers in file-name order beneath
# the environment block. Nothing here may be a secret: a ConfigMap is readable by anything with `get` on it.
config:
  # Map of file name to file contents. The name must end in `.json`; anything else is ignored by the loader and would
  # be a setting that silently never applied, so the schema rejects it.
  files: {}
  mountPath: /etc/mailfathom/config

  # Appended to the environment block, which outranks every mounted file. Use it for a per-deployment override of one
  # setting rather than for a whole configuration. The schema rejects a name that reads like a credential, because an
  # environment variable is visible to anything that can read /proc and cannot be erased from process memory.
  extraEnvironment: {}

  # `FileSystemWatcher` does not observe the symlink swap the kubelet performs when it updates a mounted ConfigMap, so
  # polling is what makes an edited value reach the running process. Leave this on unless a deployment has decided
  # that a restart is how configuration changes.
  pollForChanges: true

### The client
#
# MailFathom's own client, served by the application as a page from the same address its client surface answers on. A
# bundle travels inside the container image, so turning this on pulls nothing, renders no second workload, and publishes
# no second host — it is one setting, and what it exposes is the application's own code rather than any mail.
#
# Three things have to be true before it is useful, and the chart can see one of them:
#
#   * `ClientEndpoint:Enabled` in `config.files`, because the page is served on that surface's listeners and calls it.
#     This on and that off is refused at startup, naming both. The reverse is not: an endpoint serving its routes
#     with no page in front of them is the ordinary deployment.
#   * A path published for the page, if the ingress below is what people reach it at: `/` for the application itself,
#     beside the `/api/client` the page calls.
#   * Transport encryption. The page and every token it then presents cross a public hop, so MailFathom refuses to
#     serve the client over plain HTTP unless a deployment has said that something in front of it terminates TLS. This
#     pod never does — it speaks plain HTTP by design — so the chart states that permission on your behalf exactly when
#     it can see the ingress below terminating TLS. Where TLS terminates somewhere the chart cannot see — a service
#     mesh, a gateway, a load balancer — the application refuses to start and names the setting; add
#     `ClientEndpoint__Application__AllowClearText: "true"` to `config.extraEnvironment` once you have confirmed that
#     the hop a browser actually makes is HTTPS.
#
# Authorization is unchanged by any of this. A browser is an untrusted client wherever it was served from, so whatever
# `ClientEndpoint:Authentication` requires is still required of the page.
client:
  enabled: false

### Signals between replicas
#
# A client's live updates arrive over one connection, and above one replica the replica that synchronized an account is
# routinely not the one holding that connection. A RESP pub/sub endpoint is what carries a signal from the first to the
# second. It is off, and off is the supported shape for every deployment running a single replica: nothing is rendered,
# no configuration key is written, and no connection is opened.
#
# **This is the one option the chart refuses to let you skip.** With `replicaCount` above 1 and the client surface
# served, a deployment that configures no backplane renders nothing wrong and serves correctly — and its clients stop
# being told anything. So `helm install` refuses that combination rather than leaving it to be found from a mailbox
# that stopped updating. A deployment that serves no client surface is never refused over this, whatever its replica
# count, because nothing raises a signal there.
#
# **The contract is RESP, not a product.** MailFathom reaches the backplane through StackExchange.Redis and uses
# `PUBLISH`, `SUBSCRIBE`, and `PSUBSCRIBE` and nothing else, so any endpoint answering that protocol serves — Valkey,
# Redis, Garnet, or a managed equivalent. Valkey is what this repository deploys, pins, and tests against; it is the
# default rather than a requirement.
#
# Turning it on has two shapes, and `valkey.deploy` below is which one:
#
#   * **The chart runs Valkey**, on no claim and nothing that outlives a pod, because pub/sub keeps nothing. Its two
#     volumes are memory-backed scratch the server needs. This is the default once the block is on, exactly as the
#     analyzer and the spam scanner are deployed by default once theirs are.
#   * **You point it at a RESP endpoint you already operate** — Redis, Garnet, Valkey, or a managed cache — so you run
#     one such service rather than two.
#
# Either way the connection string is yours to write, as a key inside `secrets.existingSecret`, and that is deliberate
# rather than an omission: MailFathom reads one connection string, it carries the password, and this chart templates no
# credential. For a Valkey the chart runs, what to write is the Service it renders and the password you gave it —
# the release's full name with `-valkey` appended, which is `<release>-mailfathom-valkey` unless the release name
# already contains `mailfathom`, then a colon and `valkey.service.port` below, then `,password=…`. It is the same
# string whether or not the server is replicated, because the Service names the instance clients talk to either way.
# The install notes print it, resolved.
#
# **Anyone who can subscribe on that endpoint reads every signal of every user of this deployment**, so it belongs
# inside the same confidentiality boundary as the database. An endpoint somebody else operates owes `ssl=true` in the
# connection string, a credential of its own, and a channel prefix no other deployment on it uses. Nothing rests there:
# pub/sub delivers to whoever is subscribed at that moment and keeps nothing.
signalBackplane:
  enabled: false

  # The key inside `secrets.existingSecret` holding the whole connection string, which is how MailFathom reads every
  # other credential too: a `file:` reference into the Secret the pod already mounts. It is required once this block is
  # on, and it is the same key in both shapes below.
  connectionStringSecretKey: mailfathom-signal-backplane-connection-string

  # What every channel this deployment publishes to and subscribes to begins with. Two MailFathom deployments sharing
  # one endpoint at the same prefix receive each other's statements, so a shared endpoint needs this set to something
  # of its own; a MailFathom beside somebody else's application never does.
  channelPrefix: mailfathom

  valkey:
    # Whether the chart runs the RESP server, exactly as `spamScanning.scanner.deploy` decides whether it runs the
    # daemon. On, the chart creates a StatefulSet and two Services for it, and the address your connection string names
    # is the Service the release installed. Off, nothing of the sort is rendered and the connection string names
    # whatever you already operate.
    deploy: true

    # The key inside `secrets.existingSecret` holding the bare password the server is started with — the same password
    # the connection string above carries, written once as a password and once inside a connection string because those
    # are the two forms the two programs read.
    #
    # It is in that Secret rather than in one of its own, which is the opposite of the database's superuser password and
    # the object store's root credential, and for a reason those two do not have: this credential is one the application
    # pod already holds. It is inside the connection string MailFathom reads, so keeping it out of that Secret would
    # protect nothing and would add a second Secret to create. The server's pod reads this one key and mounts nothing
    # else of it.
    passwordSecretKey: mailfathom-signal-backplane-password

    # A digest rather than a tag. This is a dependency the chart operates rather than a version a deployment chooses,
    # like the database and the analyzer images — and unlike those two, Valkey's release tags are published beside
    # moving `9`, `9.1`, and `latest` tags, so the digest is what names one artifact rather than a line. It resolves to
    # Valkey 9.1.2, which is BSD-3-Clause and carries an unprivileged `valkey` account in its own image;
    # THIRD_PARTY_LICENSES.md records both.
    image:
      registry: docker.io
      repository: valkey/valkey
      digest: sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
      pullPolicy: IfNotPresent
      pullSecrets: []

    service:
      port: 6379

    # **Standbys beside the one instance, and nothing that promotes them.** Off is one instance, which is what a
    # backplane needs to work: pub/sub delivers to whoever is subscribed at that moment, so a second instance buys
    # availability rather than throughput. On, the chart starts `replicas` further instances that follow the first
    # one's stream and carry every message published on it, so an instance is already running and in step when the
    # first one is lost.
    #
    # **Promotion is an operator's act, and this chart offers nothing that automates it.** The Service the connection
    # string names selects the first instance by name, so a standby serves clients only after `REPLICAOF NO ONE` on it
    # and a change to that selector. Sentinel would be what automates this, and it is deliberately not offered:
    # StackExchange.Redis — the RESP client the SignalR backplane package resolves, current release included —
    # recognizes a Sentinel by the `redis_mode` line in its `INFO` reply, and Valkey answers with `server_mode`, so a
    # `serviceName=` connection string against a Valkey Sentinel refuses to connect at all. Issue 1917 measured it and
    # issue 1924 records what would turn it on.
    #
    # **Read what this is worth before turning it on.** ADR 0032 makes the client's own re-read the guarantee a signal
    # is not, so a backplane outage is already a delay rather than a loss. Replication shortens the part of that delay
    # an operator spends bringing a second instance up; it does not make a signal reliable, it promotes nothing on its
    # own, and nothing here is a reason to treat a signal as delivered.
    replication:
      enabled: false

      # Instances beside the first one. One standby is what a hand-run promotion needs, and more is for an operator who
      # wants a second one in step as well.
      replicas: 1

    # Modest, and sized by what the server reserves rather than by what this deployment asks of it. Valkey is a
    # key-value store being used as a pipe: no key is ever written, so what it holds is one subscription per MailFathom
    # replica and the allocator's own arenas. Persistence is off, so nothing here has to cover a fork that copies a
    # dataset — there is none to copy.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi

    # Restricted Pod Security Standard, met without anything having to be relaxed: the image carries an unprivileged
    # `valkey` account at uid and gid 999, and its `/data` is world-writable, so the server needs neither root nor a
    # claim it owns. The account is stated here so the cluster enforces it rather than trusting the image's own
    # entrypoint, which would otherwise start as root and drop privilege itself.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    nodeSelector: {}
    tolerations: []
    affinity: {}

### Personal-data scanning
#
# MailFathom can hide personal data before mail is copied into a derived store or handed out, and doing that beyond the
# fixed-format identifiers needs a language model — which MailFathom never loads into its own process. It reaches a
# Presidio analyzer instead, and this block is the only place the chart decides anything about it.
#
# `enabled` is off, which is the product's default and what makes this cost nothing: the chart renders no analyzer
# workload, no Service for one, and sets no configuration key, so an opt-in you did not take pulls no image and holds no
# memory. Turning it on writes `SensitiveContent:Pii:Enabled` into the application's environment and points it at the
# analyzer, so the switch lives in one place rather than in this file and a config file that could disagree.
#
# The category list and any rule suppressions are ordinary configuration and belong in `config.files` — they name what
# is hidden rather than what is deployed, and the chart renders nothing from them. The defaults are the strong
# identifiers alone; adding a personal name or a postal address to them is a decision documented in
# docs/features/sensitive-content-scanning.md, because it also empties the chunk store of the terms a search runs on.
personalDataScanning:
  enabled: false

  analyzer:
    # Whether the chart runs the analyzer, exactly as `database.deploy.enabled` decides whether it runs PostgreSQL. On,
    # the chart creates a Deployment and a Service for it and derives `endpoint` below from the release name, which must
    # then be left empty. Off, nothing of the sort is rendered and `endpoint` is required.
    deploy: true

    # Where the analyzer is, when the chart is not the thing running it. **Keep it inside your own network**: the whole
    # point of scanning is that content is inspected before it leaves the trust boundary, so an analyzer reached across
    # the public internet hands the mail to a third party in order to establish whether it may be handed to one. Nothing
    # refuses it — one analyzer serving several services inside a cluster is a legitimate arrangement — and
    # docs/features/sensitive-content-scanning.md states what is given up.
    endpoint: ""

    # The two-letter codes of the languages the analyzer is asked in — one set per release, with no per-account or
    # per-message language and no detection. A mailbox is mixed by nature, so naming several is what makes the
    # identifiers of every language it carries findable; a scan then asks once per language and merges what came back,
    # inside the one budget it is allowed, and at most eight are accepted. The image below carries an English model and
    # an English recognizer registry, so naming another means supplying an analyzer built for it in the same edit: the
    # pod reports unready for as long as the analyzer recognises nothing in one of these, rather than falling back to
    # English. Which identifiers each language reaches, and what building such an image takes, is in
    # docs/operations/personal-data-analyzer-languages.md.
    languages:
      - en

    # How sure the analyzer must be before a finding is redacted, from 0 to 1. Redaction acts on every finding whatever
    # its confidence, so this floor is the only thing between a deployment and the analyzer's weakest guesses: with no
    # floor at all an eight-digit build number is reported as a bank account number at 0.05 and a contract reference of a
    # letter and seven digits as a driving licence at 0.3. The default is the one value that drops every measured false
    # positive while leaving every category detectable — a passport number and a bank routing number both score exactly
    # 0.4, so raising it at all stops two of the five default categories from being found.
    minimumConfidence: 0.4

    # An immutable tag naming the analyzer release, like the database image above and unlike the application image: this
    # is a dependency the chart operates rather than a version a deployment chooses. It is the same pin the Compose
    # deployment and the integration suite use, so an analyzer reviewed against one is the analyzer running in the others.
    # It is also where an image built for another language is named, since a model is installed while an analyzer image
    # is built rather than while it starts, and this Deployment mounts no analyzer configuration.
    image:
      registry: ghcr.io
      repository: data-privacy-stack/presidio-analyzer
      tag: 2.2.364
      pullPolicy: IfNotPresent
      pullSecrets: []

    # Generous by the standards of everything else this chart runs, because the container loads a spaCy language model
    # into memory before it serves anything and holds it for the life of the pod. Below roughly a gigabyte it is killed
    # while loading, which reaches MailFathom as an analyzer that never became ready.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

    service:
      port: 3000

    # The analyzer runs as an unprivileged user in its own image and needs no more than MailFathom does. Its root
    # filesystem stays writable, unlike MailFathom's: the Python runtime writes bytecode caches under its own
    # installation, and a read-only root would make the container fail while starting rather than protect anything the
    # analyzer holds — it stores nothing, receives text, and answers offsets.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    nodeSelector: {}
    tolerations: []
    affinity: {}

### Spam classification with a scanner
# `enabled` is off, and with it off the chart renders no scanner workload, no Service for one, and sets no configuration
# key: an opt-in you did not take pulls no image and holds no memory.
#
# Turning it on switches classification on **and** points it at a scanner, because the two are one decision when made
# here: `SpamClassification:Enabled` and `SpamClassification:UseScanner` are written together with the daemon's address,
# so a values file cannot switch a scanner on and leave it pointing nowhere. Classification without a scanner is the
# other half of the feature and needs nothing from this block — set `SpamClassification:Enabled` in `config.files` and
# leave this off, and mail is classified from the headers it already carries.
#
# Which folders are classified and what threshold a score is judged by are ordinary configuration and belong in
# `config.files`: they say what is classified rather than what is deployed, and the chart renders nothing from them.
spamScanning:
  enabled: false

  scanner:
    # Whether the chart runs the daemon, exactly as `personalDataScanning.analyzer.deploy` decides whether it runs the
    # analyzer. On, the chart creates a Deployment and a Service for it and derives `host` below from the release name,
    # which must then be left empty. Off, nothing of the sort is rendered and `host` is required.
    deploy: true

    # Where the daemon is, when the chart is not the thing running it. **Keep it inside your own network**: a scan sends
    # the whole message, unredacted, to whatever answers here, so a daemon reached across the public internet hands the
    # mail to a third party in order to find out whether it is spam. Nothing refuses it — one daemon serving several
    # services inside a cluster is a legitimate arrangement — and docs/features/spam-classification.md states what is
    # given up. A host name or address on its own, with no scheme and no path: this is a line protocol on a TCP port
    # rather than HTTP.
    host: ""

    # The port that daemon listens on, when the chart is not the thing running it.
    port: 783

    # How long one scan may take before the message keeps the verdict its headers reached. A scan runs a whole rule
    # corpus, so this is seconds rather than milliseconds; a message that exceeds it is not a failure, it is one
    # classification without its second opinion.
    scanTimeoutSeconds: 30

    # The largest message that is sent to the daemon at all. The default is the size SpamAssassin's own client truncates
    # at, which is the size its corpus was tuned against: rules read headers and the readable part of a body, and a
    # megabyte of base64 attachment past that changes no score.
    maximumMessageBytes: 512000

    # How many scans MailFathom runs at once. The default matches the number of children the daemon spawns by default,
    # because sending more at once does not scan more at once — it queues them inside the daemon, where MailFathom's own
    # timeout cannot see the wait. Raise both together or neither.
    maximumConcurrentScans: 5

    # **Whether the daemon resolves DNS blocklists, and it is off.** SpamAssassin's DNSBL and URIBL rules send the
    # sending addresses and the URI host names out of the user's mail to third-party blocklists, which is the one thing
    # scanning inside the trust boundary exists to avoid; the free tiers of those lists also answer a shared public
    # resolver with a blocked marker rather than an answer, so the common arrangement leaks without contributing. Off,
    # the daemon runs local rules only — header and body tests, HTML tests, and the corpus `sa-update` fetches. Turn it
    # on if you operate a resolver of your own and accept what it sends; docs/features/spam-classification.md says what
    # each choice costs.
    dnsChecks: false

    # A digest rather than a tag, because the image publishes no immutable version tag of its own — the digest is the
    # only pin that names one artifact, and it is the same pin the Compose deployment and the integration suite use.
    # The image runs Apache SpamAssassin 4.0.2 on Alpine and bundles no plugin that sends anything anywhere: no Razor2,
    # no Pyzor, no DCC. THIRD_PARTY_LICENSES.md records what is in it.
    image:
      registry: docker.io
      repository: axllent/spamassassin
      digest: sha256:9bea393891c92a3531cb7081e9b2c478a654a048c9a6fa6f9d1df4300bf3ab8b
      pullPolicy: IfNotPresent
      pullSecrets: []

    # Modest: the daemon holds its compiled rule corpus in memory and forks a child per scan. Below roughly 256Mi it is
    # killed while compiling rules, which reaches MailFathom as a scanner that never answered.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

    service:
      port: 783

    # **This pod starts as root and cannot be made not to**, which is the one place it differs from everything else this
    # chart runs: the daemon binds its port and then calls `setuid` to run every scan as `nobody`, so it needs to begin
    # with the privilege it drops. The mail is therefore parsed by an unprivileged process, but the pod will be refused
    # by a namespace enforcing the `restricted` Pod Security Standard — deploy it into a `baseline` namespace, or run a
    # daemon of your own and set `deploy: false`. Everything else is dropped: the two capabilities below are what
    # `setuid` and `setgid` need and nothing more, and no privilege can be regained.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - SETUID
          - SETGID

    nodeSelector: {}
    tolerations: []
    affinity: {}

### Networking
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# MailFathom speaks plain HTTP and terminates no TLS of its own. TLS belongs to the ingress, which is also the only place
# a certificate has to exist — the chart never templates, issues, or stores certificate material. Name a Secret the
# cluster already holds, whether an operator created it or cert-manager did.
#
# The paths below are what the ingress publishes, and each one belongs to a surface the application serves only if its
# own configuration section enabled it: `/mcp` to `McpEndpoint`, `/api/admin` to `AdminEndpoint`, and `/api/client` to
# `ClientEndpoint`. Publishing a path whose section is off routes to a listener that answers 404, and enabling a section
# without publishing its path leaves it reachable only inside the cluster — which is a legitimate posture for the
# administrative surface and never one for the client, whose caller is somebody's own machine. Every client but the page
# this deployment serves itself also needs `ClientEndpoint:Cors:AllowedOrigins` to name the origin it calls from, since
# the ingress answers no preflight on the application's behalf: a page served elsewhere by its own origin, and a
# downloaded desktop or Android head by `tauri://localhost` or `http://tauri.localhost`, which its webview enforces
# exactly as a browser would. The deployment's own page is same origin and therefore no preflight at all.
#
# With `client.enabled` on, publish `/` as well: that is where the page is, on the same host it calls.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mailfathom.example.test
      paths:
        - path: /mcp
          pathType: Prefix
  tls: []
  #  - secretName: mailfathom-tls
  #    hosts:
  #      - mailfathom.example.test

### Workload
#
# How many MailFathom processes serve this deployment. One is the default and asks nothing of you; more than one is
# supported, and what it gives is request capacity and an upgrade with nothing down — never a second copy of any work.
# A mail account is synchronized by whichever replica holds its lease and by no other, a deployment-wide sweep by
# whichever holds the sweep's, and a request, a tool call, or a page is answered by whichever replica the Service
# routed it to.
#
# **Two things have to hold above one replica, and the chart refuses the one it can see.** A client's live updates need
# `signalBackplane` above, because the replica that raised a signal is routinely not the replica holding the connection
# that has to hear about it — so a values document serving the client surface with more than one replica and no
# backplane is refused rather than installed. A signed-in session needs nothing at all: it is a row in PostgreSQL, so
# every replica accepts one any other replica minted and honours its revocation, and no session affinity is asked of
# whatever balances the traffic. What that load balancer does owe the client's one standing connection — the WebSocket
# upgrade passed, and no idle timeout shorter than a connection MailFathom keeps alive — is stated on the page named
# below, because it is a requirement of your ingress rather than a value here.
#
# **What several replicas do not give.** They are not availability for the database: one the chart deploys is a single
# StatefulSet on a ReadWriteOnce claim whatever this number says. They do not divide one account's synchronization,
# which is one lease and therefore one replica's at a time, so a single large mailbox is not synchronized faster by
# raising this. And they multiply every ceiling worded as one process's rather than the deployment's —
# `Jobs:MaxConcurrentJobs`, `MailSynchronization:MaxInFlightRawMimeBytes`, `Embeddings:MaxQueuedEmails`,
# `Resilience:AiProviderInvocation:ConcurrencyLimit`, and every endpoint's `RateLimiting` block are each replica's own,
# so a deployment of *n* replicas runs up to *n* times them and both a provider's concurrency and an endpoint's burst
# are respected by dividing rather than by restating. Every ceiling worded
# as the deployment's is a row each replica shares and stays the figure it names; the configuration reference says
# which of the two each setting is, per setting.
#
# docs/operations/deployment-kubernetes.md holds the operator's reading of all of it, under *Running more than one
# replica*.
replicaCount: 1

# **How an upgrade replaces the pods, stated by the chart rather than inherited from Kubernetes.** The default below
# starts a replacement pod before any running pod is taken away and waits for it to pass its probes, so at every
# instant of a rollout at least `replicaCount` pods are serving — which is what makes the schema step's order hold: a
# new pod that refuses the schema it finds never becomes ready, and the pods already serving keep serving rather than
# having been replaced by it.
#
# Two versions therefore run together for the length of a rollout, and that is safe rather than tolerated: leased work
# moves to the replacement when the pod being stopped releases its lease, a claim reaches only the job types the
# claiming replica's own build registers a handler for, and two replicas reaching one scheduled occasion compose the
# same idempotency key. `Recreate` is the other type Kubernetes accepts and stops every pod before starting one; the
# chart renders no `rollingUpdate` block beside it, so selecting it here produces a manifest the API server accepts
# rather than one it refuses.
#
# Either half may be zero on its own and both may not, because a rollout allowed neither a pod below the replica count
# nor a pod above it can never replace anything. The chart refuses that pair itself — a values document is *merged*
# into the defaults above rather than replacing them, so writing `maxSurge: 0` alone keeps the zero underneath and
# would otherwise install a Deployment the API server rejects.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# **What a drain may take at once.** A PodDisruptionBudget is the only thing that makes a node upgrade evict these pods
# one at a time; without one, a drain that reaches two nodes takes every replica on them together, and work held under
# a lease then waits out the lease rather than being handed over — up to `MailSynchronization:LeaseDuration` per
# account, two minutes by default, with nothing synchronizing in between.
#
# It is expressed as how many pods may be missing rather than how many must remain, deliberately: `maxUnavailable: 1`
# reads the same at every replica count, while a budget demanding one pod remain would block every drain of the
# single-replica default forever — a cluster upgrade that never finishes, reported as a node that will not cordon.
# Turn it off where something else in your cluster owns disruption policy for this workload.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# Restricted Pod Security Standard. Every value below is what that standard requires, and the chart's schema keeps the
# ones that cannot be relaxed without leaving the standard from being turned off by accident.
podSecurityContext:
  runAsNonRoot: true
  # The unprivileged account the .NET base images define, and the account the image already runs as. Stated here as
  # well so the cluster enforces it rather than trusting the image's own `USER`.
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # MailFathom calls no Kubernetes API. A projected token in the pod would be a credential with nothing to authenticate
  # to, so it is not mounted.
  automountToken: false

# The runtime writes to /tmp and to nothing else, which is what makes a read-only root filesystem workable. The size
# bounds it, so a runaway temporary file cannot consume node memory.
temporaryDirectory:
  sizeLimit: 64Mi

# Longer than the host's own shutdown budget, which MailFathom derives from `MailSynchronization:ShutdownDrainTimeout`,
# so a synchronization run drains and the process exits rather than being killed part-way. Raise both together.
terminationGracePeriodSeconds: 60

probes:
  # The port the probes are served on, which is never the port the MCP endpoint is. It is set here once and reaches
  # both the container port the kubelet dials and the `HealthEndpoints:Port` the host binds, so the two cannot drift.
  # The Service publishes 8080 alone, so nothing outside the node reaches this listener: an unauthenticated endpoint
  # reporting dependency state is exposed by which network its port is on, and by nothing else.
  port: 8081
  # Startup reports whether MailFathom has finished coming up — every secret reference resolved, the database schema
  # verified, and only with spamScanning.enabled the spam daemon answering. Its budget is what a slow first start is
  # allowed, and it holds the liveness probe off until it succeeds. The personal-data analyzer is deliberately not among
  # them: it is a sidecar that may become ready after this pod, so it is a readiness question and is asked below.
  startup:
    path: /started
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  # Readiness consults the dependencies a request needs — the database, and only with personalDataScanning.enabled the
  # analyzer answering for every configured category — so a pod that cannot serve leaves the Service's endpoints instead
  # of answering requests it cannot fulfil. The pod is not restarted for either: it rejoins when the dependency answers.
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # Liveness consults only the checks that report the process itself, so a database outage never becomes a restart
  # loop that cannot fix what is actually broken.
  liveness:
    path: /alive
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

### Scheduling
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podAnnotations: {}
podLabels: {}

### The schema
#
# The chart applies none and renders nothing that could. MailFathom never applies a schema change while starting — it
# verifies the schema and refuses to serve against one it does not recognize — and the reviewed artifact that answers
# that refusal is the idempotent SQL file each release ships. The chart renders no Job and no command that applies it,
# so establish the schema before installing this chart; `docs/operations/deployment-kubernetes.md` describes the step.
