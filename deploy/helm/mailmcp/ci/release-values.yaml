# The values the repository's own verification renders the chart with, standing in for a deployment on the supported
# release channel. Nothing here names a real image or a real database: no MailMcp release exists, and the point of
# this file is to give `helm lint` and `helm template` a values document that satisfies the schema so the templates
# themselves are what gets checked.
image:
  channel: release
  registry: docker.io
  repository: example/mailmcp
  tag: 0.1.0-verification
  allowVersionMismatch: true

database:
  host: postgres.mailmcp.svc.cluster.local
  name: mailmcp
  user: mailmcp

secrets:
  existingSecret: mailmcp-secrets

config:
  files:
    10-mailmcp.json: |
      {
        "McpEndpoint": {
          "Enabled": true,
          "Authentication": "ApiKey",
          "ApiKeys": [
            {
              "Name": "workstation",
              "SecretReference": "file:/etc/mailmcp/secrets/mcp-workstation-key"
            }
          ]
        }
      }

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: mailmcp.example.test
      paths:
        - path: /mcp
          pathType: Prefix
  tls:
    - secretName: mailmcp-tls
      hosts:
        - mailmcp.example.test
