{{- if .Values.migrations.enabled }}
{{- include "mailmcp.validate" . -}}
{{- $secretsMountPath := trimSuffix "/" .Values.secrets.mountPath -}}
{{- $passwordSecretKey := default .Values.database.passwordSecretKey .Values.migrations.passwordSecretKey -}}
apiVersion: batch/v1
kind: Job
metadata:
  {{- /*
    Named with the release revision, so re-enabling this creates a new Job rather than colliding with the completed
    one — a Job's pod template is immutable, and a same-named apply would fail rather than run again.
  */}}
  name: {{ printf "%s-migrate-%d" (include "mailmcp.fullname" .) .Release.Revision | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "mailmcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migration
  {{- /*
    No `helm.sh/hook` annotation, deliberately. A hook would run this on every install and upgrade, which is exactly
    the automatic migration MailMcp's explicit model exists to prevent: the host verifies the schema and refuses to
    serve against one it does not recognize, and answering that refusal is an operator's decision with a backup taken
    before it. This Job renders only while `migrations.enabled` is true, and is meant to be switched off again after.
  */}}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "mailmcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "mailmcp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "mailmcp.migrationsImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            {{- /*
              The migration may connect as a more privileged role than the service: installing the `vector` extension
              is not something PostgreSQL permits an ordinary role to do. `migrations.user` names that role when the
              deployment provisions one; leaving it empty reuses the service's.
            */}}
            - name: PGUSER
              value: {{ default .Values.database.user .Values.migrations.user | quote }}
            {{- /* A file, never an environment value: a password in the environment block is readable through /proc
                   by anything in the pod and stays in memory for the life of the process. */}}
            - name: MAILMCP_MIGRATION_PASSWORD_FILE
              value: {{ printf "%s/%s" $secretsMountPath $passwordSecretKey | quote }}
            {{- if ne (default .Values.database.user .Values.migrations.user) .Values.database.user }}
            {{- /*
              Only when the two roles differ. PostgreSQL makes the role that runs the DDL the owner of every table and
              sequence it creates, and ownership grants nothing to anyone else, so without this the Job would succeed
              and MailMcp would then fail on permissions against a schema that exists. The entrypoint grants rather
              than transfers, so the migrator can still alter these objects next time.
            */}}
            - name: MAILMCP_RUNTIME_ROLE
              value: {{ .Values.database.user | quote }}
            {{- end }}
            {{- /*
              libpq reads these directly. `database.extraConnectionParameters` configures Npgsql and reaches only the
              application's connection, so a database behind verified TLS would accept the service and refuse — or,
              worse, silently not verify — the connection that applies privileged DDL. The chart's validation refuses
              to render when the application configures TLS and this does not.
            */}}
            {{- with .Values.migrations.sslMode }}
            - name: PGSSLMODE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.migrations.sslRootCertSecretKey }}
            - name: PGSSLROOTCERT
              value: {{ printf "%s/%s" $secretsMountPath . | quote }}
            {{- end }}
          volumeMounts:
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
            - name: temporary
              mountPath: /tmp
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0400
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
{{- end }}
