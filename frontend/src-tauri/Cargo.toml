# The native shell's crate — the desktop head and, under ADR 0027, the Android one — and the third toolchain ADR 0021
# accepted when it chose Tauri.
#
# It carries no `version`. Tauri falls back to this one only when the configuration names none, and `run-tauri.ts`
# always merges `<VersionPrefix>` from `Version.props` in, so a number written here would be a second declaration free
# to disagree with the one the service reports. Cargo defaults an omitted version to `0.0.0`, which is what a build
# run without that wrapper is then honestly labelled.
#
# Every pin is exact. Cargo reads a bare `"2"` as a caret range, and this repository floats no pin in either stack:
# `Cargo.lock` beside this file fixes the closure the way `pnpm-lock.yaml` and the `packages.lock.json` files do, and
# the manifest states what was reviewed rather than what was compatible.
#
# The empty `features` lists are the Tauri CLI's, not a style choice: it rewrites the entries to the table form on
# every `dev` and `build` because it owns which Tauri features a given command needs. Written any other way, the first
# desktop build leaves a modified manifest behind and the full gate refuses the working tree.
[package]
name = "mailfathom-desktop"
edition = "2024"
publish = false

# The shell is a library so that Android can start it, and `src/main.rs` is the three lines that start it on the desktop.
# The three crate types are what each head links: `cdylib` is the shared object the Android application loads and calls
# the generated JNI entry point in, `staticlib` is what an iOS head would link were one built, and `rlib` is what the
# desktop binary beside it depends on. The `_lib` suffix is Tauri's mobile template convention, which keeps a library's
# artifacts from overwriting a binary's where a toolchain derives both file names from one crate name; Cargo permits a
# library and a binary sharing a name, so nothing here required it, and it is written the template's way so a
# regeneration finds what it expects.
[lib]
name = "mailfathom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
keyring = "=4.2.0"
tauri = { version = "=2.11.5", features = [] }

# The one operation the application asks of this shell, per ADR 0024: a link in a message is followed in the system
# browser rather than in the WebView, because a WebView that navigates to a sender's page has replaced the application
# with it. Nothing in the bundle branches on the head — it asks for a link to be opened, and this is what answers on
# the desktop. What the webview may ask for is narrowed in `capabilities/` rather than by the plugin's own default set.
tauri-plugin-opener = { version = "=2.5.5", features = [] }
