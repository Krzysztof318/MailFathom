# What the product does, from the mail arriving to the tool call answering. The `description` beside a page is the
# line the published map carries for it; `docs/toc.yml` records why it lives here.
- name: The scope of the first release
  href: initial-scope.md
  description: What the first release implements, slice by slice, and what is deliberately still pending.
- name: IMAP synchronization
  href: imap-synchronization.md
  description: How a mailbox is reconciled read-only — what starts a pass, how folder identity survives a rename, and what a remote deletion does locally.
- name: Mail delivery
  href: mail-delivery.md
  description: Where an account's mail would be submitted, and what opening a session against that server establishes — the transport rules it is judged by, what it reports the server will accept, and how a refusal is classified.
- name: Mailbox queries
  href: mailbox-queries.md
  description: What a listing filters on, how a page is bounded and continued, and how it reports the freshness of the local copy it answers from.
- name: Email search
  href: email-search.md
  description: What a search matches, how results are ranked and bounded, and what each hit carries back beside the summary.
- name: Email content
  href: email-content.md
  description: What the content of a named message returns — normalized headers, body, attachments — and the limits every part of it is bounded by.
- name: Message chunks
  href: message-chunks.md
  description: Why a message is cut into overlapping passages, how a chunk is identified, and what is stored beside it.
- name: Embedding generation
  href: embedding-generation.md
  description: What a deployment declares to turn a passage into a vector, what one call may spend, and how a failing call is classified.
- name: Automatic embedding
  href: automatic-embedding.md
  description: What decides that a passage is embedded, when it happens, and what an operator sees when it falls behind.
- name: Embedding backfill
  href: embedding-backfill.md
  description: How mail stored before a profile existed is embedded afterwards, and what a backfill reports while it runs.
- name: Chat generation
  href: chat-generation.md
  description: What a deployment declares to make a chat call, what one call is allowed to spend, and how an operator sees whether the provider is working.
- name: Mail answering
  href: mail-answering.md
  description: How a question about the mailbox is answered from mail the model looks up while answering, and how much of it leaves the process.
- name: Sensitive-content scanning
  href: sensitive-content-scanning.md
  description: How a credential that arrived in a mailbox is kept out of a provider's context window, a retrieval snippet, and a log line.
- name: Sender authentication
  href: sender-authentication.md
  description: How the domain that actually sent a message is established from what the receiving server authenticated — or, where it wrote nothing, from verifying the message's own DKIM signatures — rather than from the From header anybody can write, and whether the message's author is one this deployment recognizes.
- name: Machine authorship
  href: machine-authorship.md
  description: How much a message's own text reads as machine written, read from characters the message already carries — including the invisible ones a payload is hidden in — and published as an observation rather than a warning.
- name: Spam classification
  href: spam-classification.md
  description: How mail written to deceive a reader is recognized from what the receiving server already decided, and what that changes downstream.
- name: Mail rules
  href: mail-rules.md
  description: How a rule selects mail and what a match may change, written in the configuration a deployment already carries.
- name: Contacts
  href: contacts.md
  description: What the contact book holds about a person, when two addresses are the same address, who may amend which record, and what erasing somebody removes.
- name: The presentation plan
  href: presentation-plan.md
  description: The typed contract an answer about a mailbox takes — the nine block types it may hold, how every fact leads back to a message, how it says what it cannot support, and how a client behind the service reads one.
- name: MCP tools
  href: mcp-tools.md
  description: The conventions every tool follows, the contract of each tool that exists, and what a client reads when a call fails.
