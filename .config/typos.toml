# Configuration for `typos`, which the `Typo check` workflow is the only thing to run.
#
# It sits here rather than at the repository root, beside the other files that decide what a check
# rejects, restores, measures, or accepts. Nothing finds it on its own at this path — the workflow
# names it, and the step that does argues why — so a `typos` run started by hand needs
# `--config .config/typos.toml` or it applies none of what follows.
#
# Three unlike kinds of entry live here. The vocabulary has tables of its own, because a word is
# accepted wherever it appears; the other two share `extend-ignore-re`, because each is a decision
# about one string in one place rather than about a spelling. What keeps them from collapsing into
# one list is the comment above each entry, which says which kind it is and why.
#
# **Vocabulary** is the first kind: spellings MailFathom uses on purpose and would go on using if a
# dictionary disagreed. `unparseable` is how this repository has consistently described input a
# parser refuses, `requeueing` is how one comment describes a loop putting work back on a queue, and
# `HashiCorp` is a company's name that word splitting reads as `Hashi` followed by `Corp`. Correcting
# any of them would be a repository-wide rename in service of a dictionary rather than of a reader.
#
# **Fixtures** are the second kind, and they are misspelled precisely because that is their job.
# Every security-sensitive configuration section in MailFathom binds strictly, so a key nobody
# defined fails startup instead of binding silently and leaving a setting reading as one nobody made.
# The tests that prove it and the documentation that explains it have to name the misspelling the
# rule catches, so correcting one of them deletes the example and, in a test, the assertion with it.
#
# **Non-prose literals** are the third kind, and they are the one kind that is not English at all: a
# regular expression that recognises a credential format, an encoded sample built out of the Latin
# alphabet, and a rule name reproduced verbatim from the corpus it was taken from. A dictionary reads
# a two-letter run out of a base64 fragment and reports it as a word, which it never was. Rewriting
# one would change what an expression matches or what an operator has to type to suppress a rule, so
# the entry says the string is data rather than that the spelling was reviewed and kept.
#
# The three are worth separating because they age differently. A word joins the vocabulary when the
# project adopts it and leaves when the project stops using it. A fixture arrives when a test or a
# document is written around it, and it leaves with that test. A non-prose literal arrives with the
# expression or the sample it belongs to, and it leaves when that data does — which for the corpus
# means a refresh that drops a rule, not a change of mind about a spelling.
#
# None of the three is a place to put a genuine typo that is inconvenient to fix. An entry here says
# the string is correct, is deliberate, or is not prose, and a reader has to be able to trust that it
# means one of them.

[files]
# Hidden files are checked, which is not the default. Most of the prose that decides how this
# repository works lives behind a leading dot — the workflows under `.github/`, the skills under
# `.agents/`, `.editorconfig` — and skipping it would leave the check blind to the files a workflow
# change consists of. Version-control metadata under `.git/` is excluded ahead of the hidden-file
# rule, so it stays excluded whatever this says.
ignore-hidden = false

[default]
extend-ignore-re = [
  # Misspelled configuration keys that the strict-binding tests and their documentation are about.
  # Each is quoted somewhere as the key an operator might type by mistake, next to the failure it
  # produces. `MaxAttemps` is written whole because the misspelling sits inside a camel-cased key
  # rather than at its start, so a word boundary in front of `Attemps` would match nothing.
  '\bMaxAttemps\b',
  '\bAuthentcation\b',
  '\bDirectroy\b',
  '\bEnabeld\b',
  '\bPasswrod\b',
  # `mis-categorized`, in ADR 0003. A hyphen ends a word for `typos`, which leaves `mis` looking like
  # a truncated `miss`; the prefix is correct English and the hyphen is the ADR's own style.
  '\bmis-categorized\b',
  # The argument of a `[GeneratedRegex]` attribute, which is an expression that recognises a
  # credential format rather than anything a reader reads. The secret corpus carries a hundred and
  # more of them, and their alternations hold provider prefixes and base64 fragments that word
  # splitting turns into two-letter words: `fo1_` opens one vendor's token and a fragment of an
  # encoded JWT header contains `Iy`. Ignoring the argument rather than each run keeps a refresh of
  # the corpus from having to add an entry here every time upstream adds a rule. The run excludes a
  # newline so a greedy match cannot leave the attribute it started in and ignore the rest of a file.
  '\[GeneratedRegex\(@"(?:[^"\n]|"")*"',
  # `airtable-personnal-access-token`, and the matcher named after it. The misspelling is the rule's
  # own name in the gitleaks corpus, and the name is what an operator writes to suppress the rule, so
  # correcting it here would mean the entry they looked up and the entry MailFathom answers to are
  # different strings.
  '\bairtable-personnal-access-token\b',
  '\bAirtablePersonnalAccessToken\b',
  # The base64 of the Latin alphabet, which the synthetic secrets are padded and built out of so that
  # no committed line carries a string shaped like a live credential. Encoding a run of letters is
  # what puts `Iz` in the middle of it.
  '\bQUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo\w*',
]

[default.extend-identifiers]
HashiCorp = "HashiCorp"

[default.extend-words]
requeueing = "requeueing"
unparseable = "unparseable"
