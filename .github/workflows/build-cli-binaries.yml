name: Build the CLI binaries

# The one place the `mfctl` command is published as a downloadable binary. A release calls it and attaches the
# result; nothing else does yet, and this workflow gates nothing and publishes nothing itself, for the reason
# `Build the schema artifact` does not either.
#
# One runner builds every platform. These are self-contained trimmed single files rather than native-AOT images, so the
# build is ordinary IL publishing with a runtime identifier and needs no cross-compiler and no Windows runner. That is
# the reason for the shape: a matrix across runners would buy nothing here and would make the checksum file harder to
# produce as one artifact.
on:
  workflow_call:
    inputs:
      ref:
        description: 'The commit SHA to build. Resolved by the caller, so what is published is never re-resolved from a moving ref.'
        required: true
        type: string
      version:
        description: 'The full stamped version the binaries are named after, for example `0.2.0`.'
        required: true
        type: string
    outputs:
      artifact:
        description: 'The name of the uploaded artifact holding every binary and the checksum file.'
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.publish.outputs.artifact }}
    steps:
      - name: Check out the commit being released
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore backend/src/Cli/Cli.csproj --locked-mode

      # The publish-time shape lives here rather than in the project file, because a project marked self-contained
      # cannot be referenced by the test host. Trimming is safe because of how little backend/src/Cli reaches: Common, and
      # Domain through it, neither of which opens a database or speaks a mail protocol, so no EF Core model and no
      # MailKit keeps reflection alive and every JSON read goes through a source-generated contract.
      #
      # That last condition is the one a change can break without noticing, because this job is the only thing that
      # evaluates it and the soonest it runs is the next nightly. `.config/BannedSymbols.txt` refuses the
      # reflection-based read overloads for that reason, so the ordinary build is what says so.
      - name: Publish every platform
        id: publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          mkdir -p artifacts/cli

          for rid in linux-x64 linux-arm64 win-x64 win-arm64; do
            dotnet publish backend/src/Cli/Cli.csproj \
              --configuration Release \
              --runtime "$rid" \
              --self-contained true \
              --output "publish/$rid" \
              -p:PublishSingleFile=true \
              -p:PublishTrimmed=true \
              -p:TrimMode=full \
              -p:DebugType=none

            case "$rid" in
              win-*) binary="mfctl.exe"; name="mfctl-${VERSION}-${rid}.exe" ;;
              *)     binary="mfctl";     name="mfctl-${VERSION}-${rid}" ;;
            esac

            cp "publish/$rid/$binary" "artifacts/cli/$name"
          done

          # One checksum file covering every binary, so an operator verifies whichever they downloaded with one command
          # from the directory they downloaded into. Nothing rewrites a binary between here and the release page, so
          # these are the checksums of the file somebody downloads and they are the only thing that verifies it: no
          # binary published here carries a code signature.
          ( cd artifacts/cli && sha256sum ./* > "mfctl-${VERSION}.sha256" )

          echo "artifact=cli-binaries" >> "$GITHUB_OUTPUT"

      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: cli-binaries
          path: artifacts/cli
          if-no-files-found: error
