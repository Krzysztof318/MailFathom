name: dotnet format

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: dotnet format
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Versions are pinned centrally and NuGet.config decides which sources they may come from, so
      # the key covers both. A key that ignored source policy would keep serving packages obtained
      # under the previous one; NuGet.config does not exist yet, and hashing an absent path simply
      # contributes nothing until it does.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'NuGet.config', '.config/dotnet-tools.json') }}

      - name: Restore dependencies
        run: dotnet restore MailMcp.slnx

      - name: Verify formatting
        run: dotnet format MailMcp.slnx --verify-no-changes --verbosity diagnostic
