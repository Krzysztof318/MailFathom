name: Publish the documentation

# The published documentation site, rebuilt in full on every merge to the default branch and served from GitHub Pages.
#
# The whole site is a function of the repository rather than of the deployments that preceded it. Each run builds
# `latest` from the default branch and one version from each release tag that carries the site definition, composes
# them into one tree, and deploys that tree — so nothing accumulates, a version that stops being documented disappears
# on the next publish, and a site rebuilt from the same tags is the same site. Publishing through the repository's own
# Pages deployment rather than by pushing to a branch is what makes that possible: there is no second history to keep
# consistent, and the run needs no secret and no token beyond the one GitHub gives it.
#
# docs/operations/documentation-site.md is the page a reader reaches for; it records what the site carries, why the
# architectural decision records are not on it, and what enabling Pages took.
on:
  # Two pushes change what the site would carry, and both publish: a merge to the default branch moves `latest`, and a
  # release tag adds a version to the selector. Without the second, a release's version would first appear on whatever
  # merged next — which is what the release that found this did, reaching the site only because the version-bump pull
  # request happened to merge a minute after the tag. #407 records it.
  #
  # It is the tag rather than the release, and that is not a preference. `scripts/list-documented-versions.sh` answers
  # from the tags in the checkout rather than from GitHub's releases, so the tag is what the site is a function of — and
  # a `release: published` trigger could not start this workflow anyway, because `Release` creates the release with
  # `GITHUB_TOKEN` and GitHub starts no workflow run from an event that token generated. This workflow carried one for
  # exactly that purpose and it never once fired.
  #
  # A tag is pushed before the publication it starts has finished, so the site can briefly carry a version whose image
  # and release do not exist yet. That resolves itself rather than needing handling: every run rebuilds the whole site
  # from the tags it can see, so a tag deleted after a failed publication is gone from the selector on the next one.
  #
  # The tag filter is narrowed to a leading `v` followed by three dot-separated groups each opening with a digit, rather
  # than to `v*`, which would also start a publish for `vnext` or any other tag somebody spells with a leading v. A
  # filter pattern is a glob and not a regular expression, so the exact `v<major>.<minor>.<patch>` shape is not
  # expressible here and a prerelease or a fourth group still matches. That costs a rebuild and never a wrong version:
  # `scripts/list-documented-versions.sh` decides what the site carries, and it does apply that exact expression — so
  # this filter chooses when a rebuild runs, never what it publishes, and a spurious one rebuilds the same site.
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  # The site definition is verified on a pull request that changes it, and deploys nothing. A change under `backend/src/`
  # cannot break this build — an XML comment docfx dislikes is a warning — so the filter deliberately leaves it out
  # rather than adding a multi-minute job to nearly every pull request the repository sees.
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docfx/**'
      - 'scripts/build-docs-site.sh'
      - 'scripts/compose-docs-site.sh'
      - 'scripts/list-documented-versions.sh'
      - 'scripts/write-docs-agent-artifacts.sh'
      - 'scripts/rebase-markdown-links.sh'
      - '.github/workflows/publish-documentation.yml'
  workflow_dispatch:

# A pull request's builds supersede each other; a deployment does not. Cancelling a publish half-way would leave the
# live site describing whichever run last finished, which is the one state this workflow exists to make impossible.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  versions:
    name: Resolve the versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve which versions the site carries
        id: resolve
        env:
          # A pull request verifies the definition it changes, so it builds the one version that definition belongs to.
          BUILD_RELEASES: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail

          {
            echo latest

            if [ "$BUILD_RELEASES" = 'true' ]; then
              bash scripts/list-documented-versions.sh
            fi
          } > versions.txt

          cat versions.txt
          echo "versions=$(jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))' versions.txt)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One red version is worth seeing next to the others that succeeded, because the answer to a version that stops
      # building may well be to stop publishing it.
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - name: Check out ${{ matrix.version }}
        uses: actions/checkout@v7
        with:
          # `latest` is this run's commit; every other version is built from its own tag, with the site definition,
          # the navigation, and the API surface that release actually shipped.
          ref: ${{ matrix.version == 'latest' && github.sha || matrix.version }}
          persist-credentials: false

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the site
        run: bash scripts/build-docs-site.sh "site/${{ matrix.version }}"

      - name: Upload ${{ matrix.version }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-${{ matrix.version }}
          path: site
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What a Pages deployment takes and no more: the write scope that creates the deployment, and the OIDC token the
      # deployment is claimed with. Nothing here writes to the repository.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download every built version
        uses: actions/download-artifact@v8
        with:
          pattern: docs-site-*
          # Each artifact holds one directory named after its version, so merging them is what produces the tree the
          # site is composed from.
          merge-multiple: true
          path: site

      - name: Compose the site
        run: bash scripts/compose-docs-site.sh site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # `.nojekyll` is the one file the archive would otherwise drop, and it is the file that would matter if this
          # site were ever served by a Pages build rather than deployed as an artifact.
          include-hidden-files: true

      # A deployment that is merely slow must not fail, because a failed one cannot be re-run: the artifact
      # `actions/upload-pages-artifact` writes is named `github-pages`, a re-run adds a second under the same run, and
      # `actions/deploy-pages` refuses when it finds more than one. That asymmetry is what sizes the wait. Waiting
      # longer costs runner minutes and nothing else; giving up costs a publish, and the recovery is a fresh run
      # dispatched by hand rather than another attempt at this one.
      #
      # So the default of ten minutes is not above what a slow queue reaches — it is inside it. Deployment ordinarily
      # takes between five and twenty seconds here, and on the day this was raised the queue degraded: one publish
      # spent four and a half minutes in it, and the two after it were still `deployment_queued` when the default
      # cancelled them at exactly ten. Thirty minutes is chosen against that rather than against the ordinary case,
      # which it is roughly two orders of magnitude above.
      # docs/operations/documentation-site.md records what a run that exhausts even this needs.
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
