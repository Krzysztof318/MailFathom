name: Build and unit test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '.config/**'
      - '.editorconfig'
      - '.github/workflows/build-and-unit-test.yml'
      - 'BannedSymbols.txt'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'MailMcp.slnx'
      - 'NuGet.config'
      - 'global.json'
      - 'testconfig.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: Build and unit test
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore MailMcp.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build MailMcp.slnx --configuration Release --no-restore

      - name: Run unit tests and enforce code coverage
        run: dotnet msbuild .config/CodeCoverage.proj -t:Collect

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: 'artifacts/coverage/raw/**/*.trx'
          if-no-files-found: ignore

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            artifacts/coverage/raw/**/*.cobertura.*.xml
            artifacts/coverage/report/**
          if-no-files-found: ignore
