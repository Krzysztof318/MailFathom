name: Build and unit test

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '.config/dotnet-tools.json'
      - '.editorconfig'
      - '.github/workflows/build-and-unit-test.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'MailMcp.slnx'
      - 'NuGet.config'
      - 'eng/**'
      - 'global.json'
      - 'testconfig.json'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '.config/dotnet-tools.json'
      - '.editorconfig'
      - '.github/workflows/build-and-unit-test.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'MailMcp.slnx'
      - 'NuGet.config'
      - 'eng/**'
      - 'global.json'
      - 'testconfig.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  code-quality: write

jobs:
  build-and-unit-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore MailMcp.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build MailMcp.slnx --configuration Release --no-restore

      - name: Run unit tests and collect code coverage
        run: dotnet msbuild eng/CodeCoverage.proj -t:Collect

      - name: Upload coverage to GitHub Code Quality
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: artifacts/coverage/report/Cobertura.xml
          language: 'C#'
          label: MailMcp

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: 'artifacts/coverage/raw/**/*.trx'
          if-no-files-found: ignore

      - name: Upload code coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            artifacts/coverage/raw/**/*.cobertura.*.xml
            artifacts/coverage/report/**
          if-no-files-found: ignore
