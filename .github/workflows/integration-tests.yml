name: Integration tests

# Never runs on a pull request. The suite starts a PostgreSQL container, applies the baseline
# migration to it, and asserts against the result, so it is minutes of runner time rather than the
# seconds a pull-request check is worth. Nothing here is a required status check; the owner asks for
# a run when the change is one this suite can speak to.
#
# It is reachable two ways, and both are deliberate acts rather than a schedule: a manual dispatch,
# and the `Release` workflow, which builds nothing at all from the commit it is about to release —
# not the image, not the schema script, not the command binaries — until this suite has passed on it.
# A nightly does not call it, which is the difference between the channels rather than an omission;
# `Nightly` says why.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to run the suite against'
        required: false
        type: string
      # Off by default, because embedding is the first thing MailFathom does that costs money per
      # unit of mail and a paid call is never the default. Turning it on without the repository
      # secrets below configured fails the run rather than skipping the tests: a run somebody asked
      # for and which then quietly proved nothing is worse than one that never started.
      run_provider_contract_tests:
        description: 'Call the real embedding provider. Spends provider credit; needs the EMBEDDING_PROVIDER_* secrets'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to run the suite against'
        required: false
        type: string

concurrency:
  # One run at a time per ref. The suite names its container and its volume deterministically so a
  # killed run leaves something the next one can find and remove, which two concurrent runs on the
  # same runner would turn into a collision.
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Versions are pinned centrally, NuGet.config decides which sources they may come from, and the
      # lock files fix the resolved transitive closure, so the key covers all three. A key that
      # ignored source policy would keep serving packages obtained under the previous one.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'NuGet.config', '.config/dotnet-tools.json', '**/packages.lock.json') }}

      # The same script a developer runs, so the suite has one way to be started rather than two that
      # can drift. It restores tools and packages, builds, removes anything a previous run left behind,
      # runs the suite, and reports coverage over the classes marked [RequiresIntegrationCoverage].
      # Docker is present on GitHub-hosted Ubuntu runners, which is what the orchestration needs;
      # `dotnet-ef` is fetched by the migration resource itself and needs no install here.
      - name: Run integration tests
        run: bash scripts/run-integration-tests.sh
        env:
          # Absent on every run that did not ask, which is what makes the provider-contract tests
          # skip and cost nothing. The `Release` workflow calls this one without the input, so a
          # release never spends provider credit either.
          MAILFATHOM_EMBEDDING_CONTRACT_TESTS: ${{ inputs.run_provider_contract_tests || 'false' }}
          MAILFATHOM_EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_PROVIDER_API_KEY }}
          MAILFATHOM_EMBEDDING_ADDRESS: ${{ vars.EMBEDDING_PROVIDER_ADDRESS }}
          MAILFATHOM_EMBEDDING_MODEL: ${{ vars.EMBEDDING_PROVIDER_MODEL }}
          MAILFATHOM_EMBEDDING_ROUTED_MODEL: ${{ vars.EMBEDDING_PROVIDER_ROUTED_MODEL }}
          MAILFATHOM_EMBEDDING_DIMENSION: ${{ vars.EMBEDDING_PROVIDER_DIMENSION }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: 'artifacts/integration-tests/raw/**/*.trx'
          if-no-files-found: ignore

      # Uploaded, never enforced. The report says how far the suite has got through the classes that
      # carry the marker; the only coverage threshold this repository has is the unit-test one.
      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: |
            artifacts/integration-tests/raw/**/*.cobertura*.xml
            artifacts/integration-tests/report/**
          if-no-files-found: ignore
