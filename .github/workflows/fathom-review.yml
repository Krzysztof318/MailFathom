name: Fathom review

# A second reviewer, next to the Codex review that already comments here, in the same P1/P2/P3
# vocabulary so one pass over the threads answers both. It reports no status check and is not in the
# `main` ruleset: it advises, and nothing waits on it.
#
# Every trigger here runs the workflow file from the default branch, never from the branch under
# review. `pull_request_target` and `issue_comment` both do that by definition, and there is
# deliberately no `workflow_dispatch`, because a dispatch takes a ref and would let a branch supply
# the job that receives the Claude credential.
#
# The branch under review is never checked out and nothing from it is executed. The workspace holds
# the base commit, which is code that already merged; the change itself arrives as data through the
# GitHub API and is written to files the reviewer only reads. Claude runs with no shell, no editor,
# and no network tool, and it posts nothing: it writes findings to a file, and the deterministic step
# after it validates every anchor against the frozen diff and submits one review. That split is what
# keeps a prompt injection in the diff, in a comment, or in the linked issue from reaching an
# authenticated API call.
#
# What that step posts, it posts as the `Fathom reviewer` GitHub App rather than as `github-actions`.
# The App is the owner's, so the review carries an identity that says what produced it, and the
# workflow token it replaces drops to read-only: the only credential in this file that can write to
# a pull request is minted from the App's private key, held by one step, and expires with the job.
#
# A run that finds nothing above the bar approves the pull request, and one that finds something
# submits `event: COMMENT`. The verdict is the whole content of an all-clear, so it is said in the
# one place GitHub renders as a verdict rather than as a wall of threads that each read "this is
# fine". Either body opens with that verdict as a heading of its own — `APPROVED` or
# `NEEDS CHANGES` — so what the run concluded is legible before the summary under it is read, and
# a reader scrolling a long pull request does not have to infer it from whether threads appeared.
#
# `NEEDS CHANGES` is a heading and nothing more. `REQUEST_CHANGES` is deliberately never used:
# this reviewer advises and gates nothing, so it must not be able to block a merge either.
#
# The approval cannot merge anything on its own. The `main` ruleset requires one approving review
# *from a code owner*, `CODEOWNERS` makes the repository owner the code owner of every path, and a
# GitHub App cannot be a code owner — so the owner's own approval is still required, and this one
# sits beside it as a signal. `dismiss_stale_reviews_on_push` then discards it on the next push, so
# an approval never outlives the commit it was given for, and that same push starts the review that
# replaces it.
on:
  # `synchronize` is what reviews a push. The branch that will merge is the one worth a verdict, and
  # the `main` ruleset sets `dismiss_stale_reviews_on_push`, so a commit landing on an approved pull
  # request discards the approval — without a re-review it would then carry no verdict at all, which
  # is the state a reader is most likely to misread as one.
  #
  # It costs subscription usage per push, and the gate below is where that cost is contained: a
  # draft is not reviewed, so a branch still being written spends nothing however often it is pushed
  # to, and marking it ready is the deliberate act that opts every later push in.
  #
  # `closed` is the one action here that never starts a review. It is listed so that a merge — a
  # ruleset bypass included — or a close reaches the concurrency group below and ends the review
  # still running against the pull request. Without it a merge taken mid-run leaves the reviewer
  # reading the rest of a change that has already landed, which is subscription usage spent on a
  # verdict nobody can act on. The gate refuses the event, so it costs one short `decide` job and
  # no model call.
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - labeled
      - closed
    branches:
      - main
  issue_comment:
    types:
      - created

concurrency:
  # One run per pull request, so two reviews never post to the same change at once. What decides
  # whether an arriving run cancels the one already running is not which event is newer but whether
  # the head being read has stopped being the head worth a verdict, and exactly two events do that.
  #
  # A push replaces the head. The review still running describes code nobody will merge and would
  # anchor threads to lines that have moved, so it is cancelled. A merge or a close removes the
  # whole pull request from consideration, and it is the reason `closed` is a trigger at all: that
  # run reviews nothing and exists only to enter this group. Cancelling is safe in both cases and
  # worth the saved usage, because the review is one POST at the end of the job — a run stopped
  # before it posts nothing at all, and a run stopped after it has already finished.
  #
  # **Every other event asks for a review rather than invalidating one, so it waits.** A comment, a
  # label, and a pull request marked ready all leave the head alone: what is running is still
  # reading the code that will merge, and its verdict is still worth having. They queue on this
  # group instead, which costs a pending run and produces two verdicts in order rather than one
  # verdict thrown away.
  #
  # That distinction is the whole reason `cancel-in-progress` is an expression. `issue_comment`
  # fires for *any* comment on a pull request, including one written by a bot with no interest in
  # this workflow — the code-scanning notice is the one that found this — and the gate below is the
  # only thing that can tell such a comment apart from a request. The gate runs inside the run, and
  # the run enters this group before the gate can speak, so an unconditional `true` here means a
  # comment cancels a review in flight several minutes in and then declines to start one, which is
  # the entire cost of a review spent to publish nothing.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && (github.event.action == 'synchronize' || github.event.action == 'closed') }}

permissions:
  contents: read

jobs:
  decide:
    name: Decide whether to review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.gate.outputs.review }}
      pull_request_number: ${{ steps.gate.outputs.pull_request_number }}
      model: ${{ steps.gate.outputs.model }}
    steps:
      - name: Decide whether this event asks for a review
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ADDED_LABEL: ${{ github.event.label.name }}
          IS_PULL_REQUEST_COMMENT: ${{ github.event.issue.pull_request.url != '' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          GH_TOKEN: ${{ github.token }}
          # The account the App's reviews are authored by, which the per-pull-request ceiling below
          # counts, and the same login the prompt names when it tells the reviewer which previous
          # verdicts are its own. It is the App's slug and not its display name — `Fathom reviewer`
          # publishes as `fathom-reviewer[bot]` — so anything that touches the App's identity means
          # re-reading this from the API rather than deriving it from the settings page.
          REVIEWER_LOGIN: 'fathom-reviewer[bot]'
        run: |
          set -euo pipefail

          review='false'
          # Whether somebody asked for this run in so many words. A label or a comment is a person
          # with write access deciding the pass is worth its cost; every other path is the workflow
          # deciding for them, and only that one is bounded below.
          explicit='false'
          # Sonnet 5 by default, at the exact identifier rather than the `sonnet` alias: an alias
          # silently re-points at whatever ships next, and a review's findings are only comparable
          # across runs when the model that produced them is the one this file names. The prompt is
          # written for this model, so a run on another one is a deliberate exception.
          model='claude-sonnet-5'
          reason='no rule matched this event'

          case "$EVENT_NAME" in
            pull_request_target)
              if [[ "$EVENT_ACTION" == 'closed' ]]; then
                # There is nothing left to advise on: the change has either merged or been
                # abandoned. What this event accomplishes it accomplished before this job started,
                # by entering the concurrency group and cancelling the review that was still
                # reading a pull request nobody will act on again.
                reason='the pull request is closed'
              elif [[ "$EVENT_ACTION" == 'labeled' ]]; then
                # The label is the maintainer's explicit ask, which is the only way a fork's pull
                # request reaches this workflow and the only way a draft does.
                if [[ "$ADDED_LABEL" == 'fathom-review' ]]; then
                  review='true'
                  explicit='true'
                  reason='a maintainer applied the fathom-review label'
                else
                  reason="the applied label is '${ADDED_LABEL}'"
                fi
              elif [[ "$PULL_REQUEST_DRAFT" == 'true' ]]; then
                # This is the one check that contains what `synchronize` costs: a draft is pushed
                # to while it is being written, and none of those pushes is reviewed.
                reason='the pull request is a draft; label it fathom-review or comment fathom-review to review it anyway'
              elif [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
                # A fork's own pull request never starts a review by being opened or pushed to. The
                # label does, and the action's own write-permission check on the actor agrees: on a
                # `labeled` event the actor is the maintainer who applied it.
                reason="the head branch is in ${HEAD_REPOSITORY}; a maintainer applies the fathom-review label to review a fork"
              elif [[ "$EVENT_ACTION" == 'synchronize' ]]; then
                review='true'
                reason='the branch was pushed to'
              else
                review='true'
                reason="the pull request was ${EVENT_ACTION}"
              fi
              ;;
            issue_comment)
              # The comment path deliberately applies none of the checks above. A draft is reviewed
              # this way — it is the escape hatch the draft branch above names — and so is a fork's
              # pull request, because somebody with write access typing the phrase has already
              # decided this run is worth its cost. Author association is the whole guard here.
              #
              # `fathom-review` rather than `@claude`: an at-mention collides with GitHub Copilot's
              # own trigger.
              #
              # The phrase has to begin a line, which is stricter than matching it anywhere in the
              # body and is the whole reason this is a variable rather than a literal pattern.
              # `fathom-review` names this pipeline, so it is exactly the word somebody writes when
              # they discuss it — "I'll rerun the fathom-review workflow", "see the fathom-review
              # docs" — and an anywhere-match would spend subscription usage on a run nobody asked
              # for every time that sentence appears on a pull request. Somebody asking for a review
              # types the phrase as an instruction, at the start of a line; somebody talking about
              # it does not. The trailing `[^a-z-]` keeps `fathom-reviewer` from counting.
              #
              # A `-`, `*`, or `+` list marker may precede the phrase, because a request written as
              # one of several bullet points is still a request. A `>` may not: on GitHub that is
              # the quote-reply marker, so accepting it would make answering a thread that contains
              # the phrase start a second run — a citation is not an instruction. The marker has to
              # be followed by whitespace, so a hyphenated word such as `-fathom-review` still does
              # not count.
              #
              # The `@` is optional because every other reviewer on the market is summoned with one,
              # so it is the first thing a hand types, and a trigger that silently ignores the
              # obvious spelling is a trap rather than a guard. It addresses no account here — the
              # App is named `Fathom reviewer` — so GitHub renders it as plain text, and accepting it
              # weakens nothing: `@fathom-review` is not a phrase that turns up in prose about the
              # workflow, so the line-start rule above still carries the whole guard.
              trigger_pattern=$'(^|\n)[[:space:]]*([-*+][[:space:]]+)?@?fathom-review([^a-z-]|$)'

              if [[ "$IS_PULL_REQUEST_COMMENT" != 'true' ]]; then
                reason='the comment is on an issue rather than a pull request'
              elif [[ ! "${COMMENT_BODY,,}" =~ $trigger_pattern ]]; then
                reason='the comment does not ask for fathom-review'
              elif [[ "$COMMENT_ASSOCIATION" != 'OWNER' && "$COMMENT_ASSOCIATION" != 'MEMBER' && "$COMMENT_ASSOCIATION" != 'COLLABORATOR' ]]; then
                reason="the comment author is ${COMMENT_ASSOCIATION} and cannot spend review usage"
              else
                review='true'
                explicit='true'
                reason='a maintainer asked for fathom-review in a comment'
                # The escape hatch to the more expensive model, for a change where the default
                # reviewer's verdict is worth a second, costlier opinion.
                if [[ "${COMMENT_BODY,,}" == *opus* ]]; then
                  model='claude-opus-5'
                fi
              fi
              ;;
          esac

          # What the subscription pays for is bounded per pull request, not per period. Every push to
          # a published branch starts a review, so a branch pushed to forty times is reviewed forty
          # times, and past some number of passes over the same pull request another one is spending
          # usage to repeat what it already said.
          #
          # The count is the reviews this App has already submitted here rather than a quota read from
          # run history. A run that decided *not* to review — a draft push, a comment about the
          # workflow — is indistinguishable from one that did in the runs endpoint, so counting runs
          # would bound the wrong number, and a calendar quota would bound a busy month rather than
          # the pathological pull request that is the actual failure.
          #
          # What is counted is every review the App has submitted here, including the ones somebody
          # asked for, because the question is how many passes this pull request has already had
          # rather than which of them were unprompted. Only the automatic path is refused by the
          # answer: somebody with write access asking has already made the decision this ceiling
          # exists to make when nobody made it, so a label and a comment still work afterwards.
          automatic_review_limit=10

          if [[ "$review" == 'true' && "$explicit" != 'true' ]]; then
            # `--paginate` runs `--jq` once per page, so the per-page counts are summed rather than
            # read as one number. The login reaches jq through the environment rather than through
            # string interpolation, so the `[bot]` brackets never arrive as filter syntax.
            #
            # A failed count reads as zero and the review proceeds. This is a cost guard rather than
            # a security one, so one extra review is a better outcome than failing a run over a
            # transient API error — and the workflow gates nothing, so a red run here would be noise
            # a reader has to dismiss rather than a signal.
            submitted_reviews=$(
              gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews?per_page=100" --paginate \
                --jq '[.[] | select(.user.login == env.REVIEWER_LOGIN)] | length' \
                | jq -s 'add // 0'
            ) || submitted_reviews='0'

            if (( submitted_reviews >= automatic_review_limit )); then
              review='false'
              reason="the automatic review ceiling of ${automatic_review_limit} is reached; ${REVIEWER_LOGIN} has ${submitted_reviews} reviews on this pull request, so label it fathom-review or comment fathom-review to review it again"
            fi
          fi

          {
            echo "review=${review}"
            echo "pull_request_number=${PULL_REQUEST_NUMBER}"
            echo "model=${model}"
          } >> "$GITHUB_OUTPUT"

          echo "Review: ${review} (${reason})."

  fathom-review:
    name: Fathom review
    needs:
      - decide
    if: needs.decide.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Read-only throughout. The workflow token collects the change and nothing else; every write
      # this job performs is made with the `Fathom reviewer` App's installation token, minted below.
      # That is what lets this block stay narrower than the job's behavior suggests: `write` here
      # would also permit closing or relabelling a pull request, which nothing in this file does.
      pull-requests: read
      # The pull request's body names the issue it closes, and that issue is the change's stated
      # contract. `contents: read` does not reach an issue, so the scope is stated rather than
      # inherited — and stating it keeps the read from depending on the repository staying public.
      issues: read
      # No `actions: write`, which is why every run logs `Cache reservation failed: cache write
      # denied: token has no writable scopes`. `claude-code-action` installs Bun through
      # `setup-bun`, which tries to cache the binary, and caching is a write. The warning is the
      # expected outcome rather than a defect: it costs one download of a runner-local binary per
      # run, while the scope that would silence it also permits cancelling workflow runs and
      # deleting artifacts and caches — from a job that `pull_request_target` starts. Nothing here
      # is worth that, and `setup-bun`'s own `no-cache` input is not one the action forwards.
    steps:
      # The identity the review is published under. `create-github-app-token` exchanges the App's
      # client id and private key for an installation token scoped to this repository, valid for an
      # hour and revoked when the job ends, so the long-lived credential in the secret store is a
      # signing key rather than something that can call the API on its own. The App needs exactly
      # one permission: `Pull requests: Read and write`, which covers both submitting a review and
      # commenting on a pull request.
      - name: Mint the reviewer App's token
        id: reviewer
        uses: actions/create-github-app-token@v3
        with:
          # `client-id` rather than `app-id`: the action deprecated the numeric App id in v3 and
          # warns on every run that still passes it. Both end up as the issuer of the same JWT, so
          # this is the identifier GitHub now expects rather than a different credential.
          #
          # A variable rather than a secret, because a client id is not one: it is visible on the
          # App's own page and in every installation. Only the private key is a credential, and
          # keeping the identifier out of the secret store is what makes a failed run say which App
          # it tried to authenticate as instead of printing `***`.
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      # The base commit, which is code that already merged, and never the branch under review. It
      # supplies the repository's own instructions — `AGENTS.md`, the `review-change` skill, the
      # specifications and ADRs — so the reviewer measures the change against the contract as it
      # stands on `main` rather than as the branch would rewrite it.
      - name: Check out the base commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      # A push and the replies that answer the previous pass are one act split across two APIs, and
      # only the push arrives as an event. `address-review` fixes the code, pushes, and then writes
      # a reply into each thread, so the answers land in the seconds *after* the event that starts
      # this run. On #223 the collection below closed at 18:31:40 and the two replies disputing the
      # previous pass's findings were written at 18:31:52 and 18:32:07; the reviewer then spent five
      # minutes on a snapshot that could not contain them and reported both findings again, stating
      # that neither thread had received a reply. No wording in the prompt recovers an answer that
      # is not in the data, so the fix is here rather than there.
      #
      # The snapshot is therefore not frozen until the conversation has stopped moving: a minimum
      # window, then however much longer it takes for the newest comment to be quiet, and a ceiling
      # on the whole wait so somebody typing steadily cannot hold a run open. A pull request nobody
      # has commented on has nothing to settle and waits not at all, which is every first review.
      #
      # The minimum only has to reach the *first* reply, because the quiet window carries the rest
      # of the burst from there. On #223 that reply arrived one second into this step on one pass
      # and six on the other, so a minute is the measured margin rather than a guess; a run whose
      # author writes nothing for a minute after pushing is one where nothing was in flight.
      #
      # This costs runner time and no subscription usage: the model is not running yet. The windows
      # are `env` values rather than literals in the body so the workflow states them in one place
      # and the contract suite can run the same loop against short ones.
      - name: Let the conversation settle before it is collected
        id: settle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          SETTLE_MINIMUM_SECONDS: '60'
          SETTLE_QUIET_SECONDS: '45'
          SETTLE_LIMIT_SECONDS: '300'
          SETTLE_POLL_SECONDS: '15'
        run: |
          set -euo pipefail

          started_at="$(date -u +%s)"

          # The newest comment of either kind, because a finding is answered in its thread and a
          # change is answered in the conversation, and both are written in the same minute as the
          # push. Only the timestamps are read; the question is when somebody last wrote, never
          # what they wrote.
          #
          # Every timestamp is streamed and the largest wins, rather than asking either endpoint
          # for the newest record. `sort` and `direction` are not parameters of the per-issue
          # comment list — only the repository-wide one accepts them — and GitHub ignores an
          # unrecognized query parameter silently, so asking for the newest returns the oldest and
          # a reply posted seconds ago reads as a conversation that went quiet hours back. That is
          # the very race this step exists to close, so the shape that cannot express the mistake
          # is worth a page of records the loop then reduces to one number.
          newest_comment_epoch() {
            local newest=0 timestamp epoch

            while IFS= read -r timestamp; do
              [[ -n "$timestamp" ]] || continue

              epoch="$(date -u -d "$timestamp" +%s)"

              if (( epoch > newest )); then
                newest="$epoch"
              fi
            done < <(
              gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/comments?per_page=100" \
                --paginate --jq '.[].created_at'
              gh api "repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100" \
                --paginate --jq '.[].created_at'
            )

            printf '%s\n' "$newest"
          }

          while true; do
            # A lookup that fails reads as no comment, which ends the wait and collects. This is a
            # latency guard rather than a correctness one, so a transient API error must not cost
            # the review; the collection below calls the same API and fails loudly if it is really
            # unreachable.
            newest="$(newest_comment_epoch)" || newest='0'

            if (( newest == 0 )); then
              echo 'Nothing to settle: no comment was found on the pull request.'
              break
            fi

            now="$(date -u +%s)"
            waited=$(( now - started_at ))
            quiet_for=$(( now - newest ))

            if (( waited >= SETTLE_LIMIT_SECONDS )); then
              printf 'The conversation was still moving after %ss, so it is collected as it stands.\n' "$waited"
              break
            fi

            if (( waited >= SETTLE_MINIMUM_SECONDS && quiet_for >= SETTLE_QUIET_SECONDS )); then
              printf 'Settled: nobody has written for %ss, after waiting %ss.\n' "$quiet_for" "$waited"
              break
            fi

            sleep "$SETTLE_POLL_SECONDS"
          done

      - name: Collect the change as data
        id: collect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          # What the reviewer is given, and what it produces, are separate directories on purpose.
          # The collected inputs are made read-only once they are complete, so the only writable
          # path the reviewer has is its own output and it cannot rewrite the anchor list that
          # validates it. Both paths are declared per step rather than once for the job, because
          # `runner` is not one of the contexts a job-level `env` block may read and a workflow that
          # names it there fails validation before a job exists.
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          FINDINGS_FILE: ${{ runner.temp }}/findings/findings.json
        run: |
          set -euo pipefail

          # Every ceiling below is deliberate. The reviewer's context, the subscription usage a run
          # spends, and the job timeout are all finite, and a pull request large enough to exhaust
          # them would otherwise produce a silently partial review that still looks complete. What
          # is dropped is recorded and ends up in the review body.
          file_limit=100
          head_content_file_limit=60
          head_content_byte_limit=131072
          comment_limit=100
          comment_body_limit=2000
          thread_limit=100
          thread_comment_limit=20
          closing_reference_limit=5

          mkdir -p "$REVIEW_DIRECTORY/head" "$(dirname "$FINDINGS_FILE")"

          # Every ceiling in this step appends what it dropped here, so it is created empty before
          # the first one can run rather than written once at the end by whichever ceiling happens
          # to be last. The submission step reads the whole file into the review body.
          : > "$REVIEW_DIRECTORY/truncation.txt"

          # Taken before the first read rather than after the last, so it is a bound the reviewer
          # can rely on: nothing written after this instant is in what follows. The step above
          # exists to make that instant late enough, and the prompt states it, because a reviewer
          # that treats a snapshot as the whole record reports a thread as unanswered on the
          # strength of not having been given the answer.
          snapshot_taken="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "snapshot_taken=${snapshot_taken}" >> "$GITHUB_OUTPUT"

          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" \
            --jq '{number, title, body, draft, author: .user.login, head_sha: .head.sha, base_sha: .base.sha, base_ref: .base.ref, changed_files, additions, deletions}' \
            > "$REVIEW_DIRECTORY/pull-request.json"

          head_sha="$(jq -r '.head_sha' "$REVIEW_DIRECTORY/pull-request.json")"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          # `--paginate` runs `--jq` once per page, so every collection here emits one record per
          # line and `jq -s` gathers them into the single array the reviewer and the submission step
          # both read. A filter that built an array per page would leave a stream of arrays as soon
          # as a pull request passed one page: `lines.json` below would inherit that shape, and the
          # submission step's `--slurpfile` would then validate every anchor against the first
          # page's files alone and push every other finding into the review body.
          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/files?per_page=100" --paginate \
            --jq '.[] | {filename, previous_filename, status, additions, deletions, patch}' \
            | jq -s --argjson limit "$file_limit" '.[0:$limit]' \
            > "$REVIEW_DIRECTORY/files.json"

          # The lines a review comment may anchor to, taken from the same patches the review is
          # judged against, so the reviewer chooses an anchor that exists instead of guessing one
          # from a diff that may have moved on. Every added or context line on the right side of a
          # hunk is commentable; a removed line is not.
          jq '[.[] | select(.patch != null) | {
                filename,
                lines: (
                  .patch
                  | split("\n")
                  | map(select(. != ""))
                  | reduce .[] as $line ({next: 0, lines: []};
                      if ($line | startswith("@@")) then
                        .next = ($line | capture("\\+(?<start>[0-9]+)") | .start | tonumber)
                      elif ($line | startswith("-")) or ($line | startswith("\\")) then
                        .
                      else
                        .lines += [.next] | .next += 1
                      end)
                  | .lines
                )
              }]' "$REVIEW_DIRECTORY/files.json" > "$REVIEW_DIRECTORY/lines.json"

          # The resulting file, not just the hunk. A hunk states what moved; whether the change is
          # correct is a property of the file it leaves behind. Content is fetched as bytes and read
          # as bytes: nothing here is executed, imported, or built.
          fetched=0
          while IFS= read -r path; do
            if (( fetched >= head_content_file_limit )); then
              break
            fi

            destination="$REVIEW_DIRECTORY/head/${path}"
            mkdir -p "$(dirname "$destination")"

            if gh api "repos/${REPOSITORY}/contents/${path}?ref=${head_sha}" \
                 -H 'Accept: application/vnd.github.raw' > "$destination" 2>/dev/null; then
              if (( $(stat -c '%s' "$destination") > head_content_byte_limit )); then
                rm -f "$destination"
              else
                fetched=$(( fetched + 1 ))
              fi
            else
              rm -f "$destination"
            fi
          done < <(jq -r '.[] | select(.status != "removed") | .filename' "$REVIEW_DIRECTORY/files.json")

          # What other reviewers have already said, so the same finding is not raised twice, and the
          # governing issue, which is where the change's contract is written down.
          #
          # On a re-review these are also this reviewer's own previous threads and the replies to
          # them, which is the only record a run has of what it already reported: the job keeps no
          # state between runs, and a push arrives as a whole diff rather than as an increment.
          #
          # They come from GraphQL rather than from the REST comment list, for the one field REST
          # does not carry: whether a thread is resolved. Resolving is how this repository closes a
          # finding out — reply, then resolve, and never one without the other — so it is the
          # author's clearest statement that a thread is settled, and a reviewer that cannot see it
          # re-opens what the pull request already closed. GraphQL returns the comments already
          # grouped into their threads as well, so a reply sits beside the finding it answers
          # instead of being reassembled from `in_reply_to_id`, and `isOutdated` states directly
          # what `position == null` only implied: GitHub can no longer place the thread on the
          # current diff, because the line it was written against has moved or gone.
          #
          # `last` on both connections rather than `first`. They are returned in creation order and
          # every other collection here keeps the newest entries, so `first` would silently drop
          # the most recent threads and the most recent replies within a thread once a pull request
          # passed the ceiling — which is to say it would drop this reviewer's own last pass and the
          # answers to it, the exact records a re-review is collecting them for.
          gh api graphql \
            -F owner="${REPOSITORY%/*}" \
            -F name="${REPOSITORY#*/}" \
            -F number="$PULL_REQUEST_NUMBER" \
            -F threads="$thread_limit" \
            -F threadComments="$thread_comment_limit" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!,
                    $threads: Int!, $threadComments: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewThreads(last: $threads) {
                      nodes {
                        isResolved
                        isOutdated
                        path
                        line
                        comments(last: $threadComments) {
                          nodes { author { login } createdAt body }
                        }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes' \
            | jq --argjson bytes "$comment_body_limit" \
                 '[.[] | {path, line, resolved: .isResolved, outdated: .isOutdated,
                          comments: [.comments.nodes[]
                                     | {author: .author.login, created_at: .createdAt,
                                        body: (.body // "")[0:$bytes]}]}]' \
            > "$REVIEW_DIRECTORY/review-threads.json"

          # The submitted reviews, which is where a verdict lives: an inline comment carries a
          # finding, but `APPROVED`, `NEEDS CHANGES`, and every other summary is the review body,
          # and it is reachable from no other endpoint. `commit_id` says which head each verdict was
          # given for, so a run can tell its own previous pass from one given before the last push,
          # and `state` distinguishes a review that still stands from one `dismiss_stale_reviews_on_push`
          # discarded.
          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews?per_page=100" --paginate \
            --jq '.[] | {author: .user.login, state, commit_id, submitted_at, body}' \
            | jq -s --argjson limit "$comment_limit" --argjson bytes "$comment_body_limit" \
                 '[.[-$limit:][] | .body |= .[0:$bytes]]' \
            > "$REVIEW_DIRECTORY/reviews.json"

          gh api "repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100" --paginate \
            --jq '.[] | {author: .user.login, created_at, body}' \
            | jq -s --argjson limit "$comment_limit" --argjson bytes "$comment_body_limit" \
                 '[.[-$limit:][] | .body |= .[0:$bytes]]' \
            > "$REVIEW_DIRECTORY/issue-comments.json"

          # Every issue the body closes, not the first one. Merging closes all of them, so a review
          # that read one can approve a change that finishes it and leaves another open with a
          # closing reference pointing at it. The parsing is a script of its own under `.github/`,
          # where `Protected paths` covers it and `scripts/test-agent-workflow.sh` can run it
          # against a body without a `gh` stub: which keywords and which spellings count is a
          # decision, and matching fewer of them than GitHub acts on is how an issue closes unread.
          jq -r '.body // ""' "$REVIEW_DIRECTORY/pull-request.json" > "$REVIEW_DIRECTORY/body.txt"

          : > "$REVIEW_DIRECTORY/issues.ndjson"

          # The ceiling lives in the script rather than in this loop so that what it cuts is
          # reported by the same code that cuts it, and so the contract suite can exercise both
          # without standing up a `gh` stub for the whole collection. The list arrives on standard
          # output and the note about what was dropped on standard error, which is why the two are
          # redirected apart here.
          "${GITHUB_WORKSPACE}/.github/fathom-review/collect-closing-references.sh" \
            "$REVIEW_DIRECTORY/body.txt" "$REPOSITORY" "$closing_reference_limit" \
            > "$REVIEW_DIRECTORY/closing-references.txt" \
            2>> "$REVIEW_DIRECTORY/truncation.txt"

          while IFS= read -r issue_number; do
            [[ -n "$issue_number" ]] || continue

            # A reference to an issue that cannot be fetched — deleted, or in a repository this
            # token does not reach — is recorded as the number alone rather than dropped, so the
            # reviewer can say the contract was unreadable instead of silently reviewing without it.
            gh api "repos/${REPOSITORY}/issues/${issue_number}" --jq '{number, title, body}' \
              >> "$REVIEW_DIRECTORY/issues.ndjson" \
              || jq -nc --argjson number "$issue_number" \
                   '{number: $number, title: null, body: null}' \
                   >> "$REVIEW_DIRECTORY/issues.ndjson"
          done < "$REVIEW_DIRECTORY/closing-references.txt"

          jq -s . "$REVIEW_DIRECTORY/issues.ndjson" > "$REVIEW_DIRECTORY/issues.json"
          rm -f "$REVIEW_DIRECTORY/issues.ndjson" "$REVIEW_DIRECTORY/body.txt" \
            "$REVIEW_DIRECTORY/closing-references.txt"

          changed_files="$(jq -r '.changed_files' "$REVIEW_DIRECTORY/pull-request.json")"
          collected_files="$(jq -r 'length' "$REVIEW_DIRECTORY/files.json")"
          if (( changed_files > collected_files )); then
            printf 'The pull request changes %s files and this review covers the first %s.\n' \
              "$changed_files" "$collected_files" >> "$REVIEW_DIRECTORY/truncation.txt"
          fi

          echo "Collected ${collected_files} changed files and ${fetched} head-content files."

      # What the change obliges the rest of the repository to do, which is the part of a review no
      # diff contains. A `.cs` file that changed while no test followed it, a page under `docs/`
      # that still describes the behavior this change replaced, and a moved pin with no row in
      # `THIRD_PARTY_LICENSES.md` are each a rule in `AGENTS.md`, and each of them is invisible in a
      # diff because the defect *is* the absence of a second file from it.
      #
      # This calls no API. It reads the base checkout — code that already merged — and the
      # `files.json` the step above froze, which is what lets `scripts/test-agent-workflow.sh` run
      # the same script against a fixture tree with no `gh` stub, the way it runs the gate and the
      # settle loop today.
      #
      # The script lives under `.github/` rather than in `scripts/` because `Protected paths`
      # refuses a change from anyone but the owner there, and this decides what a reviewer is told
      # to look for. It is read from the workspace, which holds the base commit, so a pull request
      # cannot supply the index that judges it — the same reason the prompt is read from there.
      - name: Index the obligations the change triggers
        id: obligations
        shell: bash
        env:
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          INDEX_SCRIPT: ${{ github.workspace }}/.github/fathom-review/index-obligations.sh
        run: |
          set -euo pipefail

          "$INDEX_SCRIPT" \
            "$GITHUB_WORKSPACE" \
            "$REVIEW_DIRECTORY/files.json" \
            "$REVIEW_DIRECTORY/obligations.json"

          # Read-only from here on. The reviewer reads these files and the submission step trusts
          # them — `lines.json` in particular is what makes an anchor valid — so nothing that runs
          # in between may rewrite them. Removing write permission from the directories as well as
          # the files is what stops an entry being replaced rather than modified. It happens here
          # rather than at the end of the collection above because this is the last step that
          # writes into the directory.
          chmod -R a-w "$REVIEW_DIRECTORY"

      # The reviewer's instructions live in `.github/fathom-review/reviewer-prompt.md` rather than
      # in a block scalar here, because GitHub compiles any string holding a `${{ }}` expression
      # into a single `format(...)` expression and refuses a workflow whose expression passes 21000
      # characters. The instructions passed it, which invalidated this whole file — every trigger
      # included, so nothing ran at all. Substituting the run's values into a template keeps the
      # expressions in this file, where they are a handful of short lines, and leaves the
      # instructions as prose that no length limit reaches.
      #
      # The template is read from the workspace, which holds the base commit, so a pull request
      # cannot supply the prompt that reviews it — the same reason the workflow itself runs from
      # the base rather than from the branch.
      - name: Compose the reviewer prompt
        id: prompt
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          HEAD_SHA: ${{ steps.collect.outputs.head_sha }}
          SNAPSHOT_TAKEN: ${{ steps.collect.outputs.snapshot_taken }}
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          FINDINGS_FILE: ${{ runner.temp }}/findings/findings.json
          TEMPLATE_FILE: ${{ github.workspace }}/.github/fathom-review/reviewer-prompt.md
          PROMPT_FILE: ${{ runner.temp }}/reviewer-prompt.md
        run: |
          set -euo pipefail

          sed \
            -e "s|{{REPOSITORY}}|${REPOSITORY}|g" \
            -e "s|{{PULL_REQUEST_NUMBER}}|${PULL_REQUEST_NUMBER}|g" \
            -e "s|{{HEAD_SHA}}|${HEAD_SHA}|g" \
            -e "s|{{SNAPSHOT_TAKEN}}|${SNAPSHOT_TAKEN}|g" \
            -e "s|{{REVIEW_DIRECTORY}}|${REVIEW_DIRECTORY}|g" \
            -e "s|{{FINDINGS_FILE}}|${FINDINGS_FILE}|g" \
            "$TEMPLATE_FILE" > "$PROMPT_FILE"

          # A placeholder that survived substitution reaches the model as literal text, which is a
          # review that reads the wrong paths rather than a run that fails, so it fails here.
          if grep -nE '\{\{[A-Z_]+\}\}' "$PROMPT_FILE" >&2; then
            echo 'The reviewer prompt still holds an unsubstituted placeholder.' >&2
            exit 1
          fi

          {
            echo 'prompt<<FATHOM_REVIEW_PROMPT'
            cat "$PROMPT_FILE"
            echo 'FATHOM_REVIEW_PROMPT'
          } >> "$GITHUB_OUTPUT"
      - name: Review the change
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          # A Claude Code OAuth token rather than an API key: the review runs on the owner's Claude
          # subscription. Generate it with `claude setup-token` and store it as the
          # `CLAUDE_CODE_OAUTH_TOKEN` repository secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Explicit, so the action uses the workflow token with the permissions declared above
          # rather than exchanging an OIDC token for a GitHub App installation token whose scopes
          # this workflow does not state.
          github_token: ${{ github.token }}
          # The buffered inline comments this step would post are the mechanism this workflow
          # replaces with a validated submission of its own.
          classify_inline_comments: 'false'
          # The reviewer reads and writes one file. It has no shell, no editor, no network tool, and
          # no MCP tool, so no path exists from the untrusted text it reads to an authenticated call
          # or to the runner. The deny rules cover the places a credential still sits despite that:
          # the workspace git configuration, where the action writes the workflow token for its own
          # use; `/proc`, where a process can read its own environment as a file; and `.claude`,
          # where the CLI keeps its own configuration. This input is written to the user settings
          # file, which is why every path pattern is absolute.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Bash",
                  "Edit",
                  "WebFetch",
                  "WebSearch",
                  "mcp__*",
                  "Read(//proc/**)",
                  "Read(//**/.git/**)",
                  "Read(//**/.claude/**)",
                  "Read(//**/.ssh/**)",
                  "Read(//**/.npmrc)",
                  "Read(//**/.netrc)"
                ]
              }
            }
          prompt: ${{ steps.prompt.outputs.prompt }}
          # `--setting-sources user` keeps the deny list above as the only settings the session
          # loads. The action would otherwise load `user`, `project`, and `local`, and a project
          # source means settings and hooks read out of the working directory. Nothing untrusted is
          # in that directory today, and this is what keeps that true if a later change puts
          # something there.
          #
          # `--effort high` is what buys the two-pass sweep the prompt asks for. Effort decides how
          # much the model thinks and how much work it does before answering, and a review is the
          # shape of task where that matters most: the cheap failure is a reviewer that reads the
          # first few files closely, finds something, and coasts.
          #
          # It is stated because it is a decision, and because it is not the value that would apply
          # otherwise: Claude Code runs `xhigh` by default. `high` is the deliberate step down —
          # this workflow spends a personal subscription with no per-run ceiling anywhere in it, and
          # the extra depth `xhigh` buys has not been measured against that cost here. Raise it if a
          # missed finding ever justifies the measurement.
          #
          # `--model` and `--effort` are not inputs the action declares. It forwards a flag it does
          # not recognize to the CLI unchanged, which is the documented way to reach a CLI option
          # from here.
          claude_args: |
            --model ${{ needs.decide.outputs.model }}
            --effort high
            --allowedTools "Read,Grep,Glob,Write"
            --setting-sources user

      # The action hides everything the reviewer produced, which is right: that output is model
      # text derived from an untrusted diff. It hides the run's own error string with it, and that
      # string is the only place the cause of a failure is written — an expired credential, an
      # exhausted subscription, a model the plan cannot use. Without it a failed run is a red job
      # with nothing to act on, and the only alternative the action offers is `show_full_output`,
      # which would print the whole review into the log to recover one sentence. The saved
      # execution log holds that sentence, so this reads it and prints nothing else.
      - name: Report why the reviewer stopped
        if: failure() && steps.review.outcome == 'failure'
        shell: bash
        env:
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
          WORKFLOW_TOKEN: ${{ github.token }}
          CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! -s "$EXECUTION_FILE" ]]; then
            echo '::error::The reviewer wrote no execution log, so it stopped before the model answered.'
            exit 0
          fi

          # The error text of the last result message, flattened to one line because an annotation
          # is one line, and bounded because a model can be made to say a great deal.
          reason="$(
            jq -r '[.[] | select(.type == "result")]
                   | last
                   | (.result // .error // "the result message carried no error text")' \
              "$EXECUTION_FILE" 2>/dev/null || true
          )"
          reason="${reason//$'\n'/ }"
          reason="${reason:0:500}"

          if [[ -z "$reason" || "$reason" == 'null' ]]; then
            reason='the execution log holds no result message, so the run ended before the model answered'
          fi

          # The reviewer holds no credential and this text comes from the service rather than from
          # the change, so a match here is not expected. It is still checked, because printing is
          # publishing and this is the one step that prints anything the model produced. An empty
          # secret is reported rather than compared: `grep -F ''` matches everything, which would
          # turn a missing secret into a permanent false positive.
          if [[ -z "$CLAUDE_CREDENTIAL" ]]; then
            echo '::error::CLAUDE_CODE_OAUTH_TOKEN is not set, which is why the reviewer could not run.'
            exit 0
          fi

          if grep -qE 'gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{16,}' <<< "$reason" \
            || grep -qF "$WORKFLOW_TOKEN" <<< "$reason" \
            || grep -qF "$CLAUDE_CREDENTIAL" <<< "$reason"; then
            echo '::error::The reviewer stopped, and its reason is shaped like a credential, so it is not printed.'
            exit 0
          fi

          printf '::error::The reviewer stopped: %s\n' "$reason"

      # `!cancelled()` rather than `always()`, which GitHub documents as running a step even when the
      # run was cancelled. This step must still run after a reviewer that failed, because a run that
      # died holding findings has something worth posting — but a cancelled run has the opposite
      # property: it was cancelled because the head was superseded or the pull request closed, and
      # `always()` would let it publish the very verdict the cancellation was meant to prevent. The
      # `${{ }}` is required, because a YAML scalar may not begin with `!`.
      - name: Submit the review
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        shell: bash
        env:
          # The App's installation token, not the workflow token: this is the step that publishes,
          # and what it publishes is attributed to whatever minted this. It is also the only write
          # credential in the job, held by the one step that makes no model call.
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          HEAD_SHA: ${{ steps.collect.outputs.head_sha }}
          WORKFLOW_TOKEN: ${{ github.token }}
          REVIEWER_TOKEN: ${{ steps.reviewer.outputs.token }}
          # Held only by this step, which runs no model output and makes one API call, so that a
          # credential the reviewer was never able to read still cannot be published if it somehow
          # reaches the findings.
          CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Whether the reviewer got as far as an answer, which decides whether a missing findings
          # file is this step's failure to report or the previous step's, already reported.
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          # The two paths the collection step wrote, restated here for the reason given there.
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          FINDINGS_FILE: ${{ runner.temp }}/findings/findings.json
        run: |
          set -euo pipefail

          payload_file="$(mktemp)"

          if [[ ! -s "$FINDINGS_FILE" ]] || ! jq -e '.' "$FINDINGS_FILE" > /dev/null 2>&1; then
            # A reviewer that never answered has already failed and said why, and repeating the
            # consequence as a second error buries the cause. A reviewer that answered and still
            # produced nothing valid is this workflow's own defect, and fails here.
            if [[ "$REVIEW_OUTCOME" != 'success' ]]; then
              echo '::notice::The reviewer did not finish, so there are no findings to submit.'
              exit 0
            fi

            echo "::error::The reviewer finished but produced no valid ${FINDINGS_FILE}, so there is nothing to submit."
            exit 1
          fi

          # A credential in the payload would be published by the very call that posts it. The
          # reviewer is denied the paths that hold one, and this refuses the review outright if one
          # appears anyway, because a redacted review is not worth the risk of a wrong redaction.
          # An unset secret is refused rather than compared: `grep -F ''` matches every file, so
          # comparing against it would reject every review this workflow ever produced.
          if [[ -z "$CLAUDE_CREDENTIAL" ]]; then
            echo '::error::CLAUDE_CODE_OAUTH_TOKEN is not set, so the findings cannot be checked against it.'
            exit 1
          fi

          # Refused rather than compared, for the reason given above: an empty pattern matches every
          # file. An empty token also means the step is about to call the API unauthenticated, which
          # would fail later and less clearly than this does.
          if [[ -z "$REVIEWER_TOKEN" ]]; then
            echo '::error::The reviewer App minted no token, so there is nothing to publish the review with.'
            exit 1
          fi

          # The App's own token is compared literally as well as by shape. Its `ghs_` prefix already
          # matches the pattern below, but this is the credential the step is about to authenticate
          # with, and a literal comparison does not depend on the pattern continuing to describe it.
          if grep -qE 'gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{16,}' "$FINDINGS_FILE" \
            || grep -qF "$WORKFLOW_TOKEN" "$FINDINGS_FILE" \
            || grep -qF "$REVIEWER_TOKEN" "$FINDINGS_FILE" \
            || grep -qF "$CLAUDE_CREDENTIAL" "$FINDINGS_FILE"; then
            echo '::error::The findings contain something shaped like a credential and were not posted.'
            exit 1
          fi

          # Nothing found is a verdict, so it is delivered as one: an approval carrying the summary
          # and no inline comments. The alternative shapes are both worse. `event: COMMENT` with an
          # empty `comments` array records that a review happened without saying what it concluded,
          # and an ordinary issue comment says it in the timeline where nothing reads it as a
          # verdict at all.
          #
          # `commit_id` ties the approval to the head the reviewer actually saw. With
          # `dismiss_stale_reviews_on_push` set on the `main` ruleset, the next push dismisses it,
          # so an approval can never describe code that has since changed.
          #
          # This cannot merge anything by itself: the ruleset requires an approving review from a
          # code owner, and a GitHub App cannot be one. `REQUEST_CHANGES` is never used in either
          # branch — a reviewer that gates nothing must not be able to block a merge either.
          # An empty findings array means two different things depending on how the reviewer ended.
          # From a run that finished, it means nothing was found. From one that died after its
          # `Write` call — an exhausted subscription, a transport error, a model that stopped — it
          # means the search never completed, and the file is a snapshot rather than a verdict.
          # Findings from such a run are still worth posting, because a defect it did name is real;
          # an approval is not, because it asserts the absence of what the run stopped looking for.
          # So the affirmative branch is the one gated on the reviewer having succeeded.
          if [[ "$(jq '(.findings // []) | length' "$FINDINGS_FILE")" == '0' ]] \
            && [[ "$REVIEW_OUTCOME" != 'success' ]]; then
            echo '::notice::The reviewer did not finish and found nothing before stopping, so no approval was posted.'
            exit 0
          fi

          if [[ "$(jq '(.findings // []) | length' "$FINDINGS_FILE")" == '0' ]]; then
            jq --arg commit "$HEAD_SHA" \
               --arg truncation "$(cat "$REVIEW_DIRECTORY/truncation.txt")" '
              {
                commit_id: $commit,
                event: "APPROVE",
                body: (
                  ["# APPROVED", ""]
                  + [((.summary // "") | if . == "" then "The review found nothing above the bar in this change." else . end)]
                  + (if $truncation == "" then [] else ["", $truncation] end)
                  | join("\n")
                )
              }' "$FINDINGS_FILE" > "$payload_file"

            gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews" \
              --method POST --input "$payload_file" --silent

            echo 'Approved: the review found nothing above the bar.'
            exit 0
          fi

          # Anchors are checked against the same patches the reviewer was given, so a line that has
          # since moved cannot make the API reject the whole review. A finding whose anchor does not
          # survive is not discarded; it moves into the body, where it still reaches the author.
          #
          # A finding that never had an anchor takes the same path deliberately. Some defects are
          # properties of the change rather than of a line — a body that claims something the diff
          # does not do, an issue the change closes without finishing — and the reviewer writes those
          # with a null `path`. Routing them here rather than into the summary is what makes them
          # count: the verdict is decided by whether `findings` is empty, so a concern that lived
          # only in the summary would arrive under an `APPROVED` heading.
          #
          # Every finding is rendered here rather than by the reviewer, from the separate fields it
          # wrote. A thread then always answers the same three questions in the same order — what
          # breaks, what to change, and which rule says so — so an author reading a column of them
          # can skip to the part they need instead of parsing a paragraph per finding, and a
          # reviewer that skipped a field leaves a visible gap rather than a plausible-looking
          # sentence. The same rendering serves the unanchored findings in the body, so a finding
          # does not change shape because its line moved.
          jq --slurpfile lines "$REVIEW_DIRECTORY/lines.json" \
             --arg commit "$HEAD_SHA" \
             --arg truncation "$(cat "$REVIEW_DIRECTORY/truncation.txt")" '
            def allowed($path): $lines[0] | map(select(.filename == $path)) | .[0].lines // [];
            def anchored($finding):
              (allowed($finding.path) | index($finding.line)) != null
              and (($finding.start_line == null)
                   or ((allowed($finding.path) | index($finding.start_line)) != null));

            def details($finding):
              (if ($finding.impact // "") == "" then []
               else ["", "**Impact**", "", $finding.impact] end)
              + (if ($finding.correction // "") == "" then []
                 else ["", "**Correction**", "", $finding.correction] end)
              + (if ($finding.rule // "") == "" then []
                 else ["", "**Rule** — \($finding.rule)"] end);

            # The counts are stated here rather than by the reviewer, because a tally written by
            # hand can disagree with the threads that were actually posted. A severity outside the
            # three the prompt defines counts toward the total rather than vanishing from it, so a
            # reviewer that invented one leaves a visible discrepancy instead of a shorter tally.
            def tally($findings):
              (["P1", "P2", "P3"]
               | map(. as $severity
                     | ($findings | map(select(.severity == $severity)) | length) as $count
                     | select($count > 0)
                     | "\($severity): \($count)")) as $counted
              | if ($counted | length) == 0
                then "\($findings | length)"
                else ($counted | join(", ")) end;

            (.findings // [])[0:20] as $findings
            | ($findings | map(select(anchored(.)))) as $kept
            | ($findings - $kept) as $dropped
            | {
                commit_id: $commit,
                event: "COMMENT",
                body: (
                  ["# NEEDS CHANGES", ""]
                  + [(.summary // "")]
                  + ["", "**Findings** — \(tally($findings))"]
                  + (if $truncation == "" then [] else ["", $truncation] end)
                  + (if ($dropped | length) == 0 then [] else
                      ["", "### Findings with no line to sit on"]
                      + ($dropped
                         | map(["",
                                "**\(.severity) — \(.title)**"
                                + (if (.path // "") == "" then "" else " — `\(.path)`" end)]
                               + details(.))
                         | add)
                    end)
                  | join("\n")
                ),
                comments: ($kept | map(
                  {
                    path,
                    line,
                    side: "RIGHT",
                    body: (["**\(.severity) — \(.title)**"] + details(.) | join("\n"))
                  }
                  + (if .start_line == null then {} else {start_line, start_side: "RIGHT"} end)
                ))
              }' "$FINDINGS_FILE" > "$payload_file"

          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews" \
            --method POST --input "$payload_file" --silent

          printf 'Posted a review with %s inline findings.\n' \
            "$(jq -r '.comments | length' "$payload_file")"
