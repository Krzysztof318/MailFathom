name: Fathom review

# A second reviewer, next to the Codex review that already comments here, in the same P1/P2/P3
# vocabulary so one pass over the threads answers both. It reports no status check and is not in the
# `main` ruleset: it advises, and nothing waits on it.
#
# Every trigger here runs the workflow file from the default branch, never from the branch under
# review. `pull_request_target` and `issue_comment` both do that by definition, and there is
# deliberately no `workflow_dispatch`, because a dispatch takes a ref and would let a branch supply
# the job that receives the Claude credential.
#
# The branch under review is never checked out and nothing from it is executed. The workspace holds
# the base commit, which is code that already merged; the change itself arrives as data through the
# GitHub API and is written to files the reviewer only reads. Claude runs with no shell, no editor,
# no writer, and no network tool, and it posts nothing: its findings are the run's own answer, held
# to a schema, and the deterministic step after it validates every anchor against the frozen diff
# and submits one review. That split is what keeps a prompt injection in the diff, in a comment, or
# in the linked issue from reaching an authenticated API call.
#
# A review is four jobs, and which job does what is the load-bearing part of the design rather than
# an arrangement of steps. `collect` freezes the change as data and splits it into groups, holding no
# credential that writes anything. `read` runs one session per group, concurrently, and each returns
# candidates under a schema of its own — that is the first pass, and it is the run rather than a
# model that decides who reads what, so an 88-file change is six readers of fifteen files instead of
# one session of 88. `judge` performs the second pass: it confirms every candidate against the file
# it concerns, reads what no reader could — the obligations index, the change's own account of
# itself, the previous passes — and is the one job that holds the App token and publishes. `board`
# records the verdict.
#
# What that buys is a run whose length follows the largest group rather than the whole change, and a
# coverage list composed from what the readers reported opening rather than claimed by the reviewer
# about itself. The measurement that argued for it is in the `collect` job below.
#
# What that step posts, it posts as the `Fathom reviewer` GitHub App rather than as `github-actions`.
# The App is the owner's, so the review carries an identity that says what produced it, and the
# workflow token it replaces drops to read-only: the only credential in this file that can write to
# a pull request is minted from the App's private key, held by one step, and expires with the job.
#
# A run that finds nothing above the bar approves the pull request, and one that finds something
# submits `event: COMMENT`. The verdict is the whole content of an all-clear, so it is said in the
# one place GitHub renders as a verdict rather than as a wall of threads that each read "this is
# fine". Either body opens with that verdict as a heading of its own — `APPROVED` or
# `NEEDS CHANGES` — so what the run concluded is legible before the summary under it is read, and
# a reader scrolling a long pull request does not have to infer it from whether threads appeared.
#
# `NEEDS CHANGES` is a heading and nothing more. `REQUEST_CHANGES` is deliberately never used:
# this reviewer advises and gates nothing, so it must not be able to block a merge either.
#
# The approval cannot merge anything on its own. The `main` ruleset requires one approving review
# *from a code owner*, `CODEOWNERS` makes the repository owner the code owner of every path, and a
# GitHub App cannot be a code owner — so the owner's own approval is still required, and this one
# sits beside it as a signal. `dismiss_stale_reviews_on_push` then discards it on the next push, so
# an approval never outlives the commit it was given for, and that same push starts the review that
# replaces it.
on:
  # `synchronize` is what reviews a push. The branch that will merge is the one worth a verdict, and
  # the `main` ruleset sets `dismiss_stale_reviews_on_push`, so a commit landing on an approved pull
  # request discards the approval — without a re-review it would then carry no verdict at all, which
  # is the state a reader is most likely to misread as one.
  #
  # It costs subscription usage per push, and the gate below is where that cost is contained: a
  # draft is not reviewed, so a branch still being written spends nothing however often it is pushed
  # to, and marking it ready is the deliberate act that opts every later push in.
  #
  # `closed` is the one action here that never starts a review. It is listed so that a merge — a
  # ruleset bypass included — or a close reaches the concurrency group below and ends the review
  # still running against the pull request. Without it a merge taken mid-run leaves the reviewer
  # reading the rest of a change that has already landed, which is subscription usage spent on a
  # verdict nobody can act on. The gate refuses the event, so it costs one short `decide` job and
  # no model call.
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - labeled
      - closed
    branches:
      - main
  issue_comment:
    types:
      - created

concurrency:
  # One run per pull request, so two reviews never post to the same change at once. What decides
  # whether an arriving run cancels the one already running is not which event is newer but whether
  # the head being read has stopped being the head worth a verdict, and exactly two events do that.
  #
  # A push replaces the head. The review still running describes code nobody will merge and would
  # anchor threads to lines that have moved, so it is cancelled. A merge or a close removes the
  # whole pull request from consideration, and it is the reason `closed` is a trigger at all: that
  # run reviews nothing and exists only to enter this group. Cancelling is safe in both cases and
  # worth the saved usage, because the review is one POST at the end of the job — a run stopped
  # before it posts nothing at all, and a run stopped after it has already finished.
  #
  # **Every other event asks for a review rather than invalidating one, so it waits.** A comment, a
  # label, and a pull request marked ready all leave the head alone: what is running is still
  # reading the code that will merge, and its verdict is still worth having. They queue on this
  # group instead, which costs a pending run and produces two verdicts in order rather than one
  # verdict thrown away.
  #
  # That distinction is the whole reason `cancel-in-progress` is an expression. `issue_comment`
  # fires for *any* comment on a pull request, including one written by a bot with no interest in
  # this workflow — the code-scanning notice is the one that found this — and the gate below is the
  # only thing that can tell such a comment apart from a request. The gate runs inside the run, and
  # the run enters this group before the gate can speak, so an unconditional `true` here means a
  # comment cancels a review in flight several minutes in and then declines to start one, which is
  # the entire cost of a review spent to publish nothing.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && (github.event.action == 'synchronize' || github.event.action == 'closed') }}

permissions:
  contents: read

# How a published review says what started it, which is the one thing the reviews endpoint does not
# record and the per-pull-request ceiling has to know. It is written into the body by the step that
# submits and read back by the gate two jobs earlier, so it is declared here rather than twice: a
# marker the two halves spelled differently would silently stop counting and the ceiling would stop
# holding, with nothing red to say so.
#
# It renders as nothing. A Markdown comment is invisible in the review GitHub displays and survives
# the round trip through the API, which an invisible character or a trailing convention would not.
#
# Which Claude subscription pays for a review is the second thing declared here, and for a related
# reason: three steps name the credential and they have to name the same one. `CLAUDE_CODE_PROFILE`
# is a repository variable rather than a secret, because the name of a profile is not one — keeping
# it out of the secret store is what lets a run say which subscription it selected instead of `***`.
# Set it to `secondary` to spend the second profile's subscription; unset, or set to anything else,
# means the first and `CLAUDE_CODE_OAUTH_TOKEN`. Both tokens live in the secret store at once, so
# switching back is a variable change rather than a token regenerated over one that was overwritten.
#
# What is declared here is the secret's *name*, which the annotations that report a missing
# credential print. The value is read per step, by the same condition, because a secret in a
# workflow-level `env` is in the environment of every step of every job — including the two that
# never touch a Claude credential and the one that runs the model — and this file's whole posture is
# that the credential is held by the fewest steps that can do the work. `scripts/test-agent-workflow.sh`
# fails when the four spellings of the condition stop agreeing, which is the one failure this split
# can produce and the one nothing else would report: a leak check comparing findings against a token
# no run spends passes every review it is given.
env:
  AUTOMATIC_REVIEW_MARKER: '<!-- fathom-review: automatic -->'
  REQUESTED_REVIEW_MARKER: '<!-- fathom-review: requested -->'
  CLAUDE_CREDENTIAL_SECRET: ${{ vars.CLAUDE_CODE_PROFILE == 'secondary' && 'CLAUDE_CODE_OAUTH_TOKEN_SECONDARY' || 'CLAUDE_CODE_OAUTH_TOKEN' }}

jobs:
  decide:
    name: Decide whether to review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Whether `Apply pull request rules` is still deciding this head's labels, which the step
      # below waits on before it reads them. Listing a workflow's runs is `actions`, and it is read
      # rather than write: nothing here starts, cancels, or reruns anything.
      actions: read
    outputs:
      review: ${{ steps.gate.outputs.review }}
      pull_request_number: ${{ steps.gate.outputs.pull_request_number }}
      # Whether somebody asked for this review rather than a push starting it. The submission step is
      # what records it on the review it publishes, and the gate of a later run is what reads it back.
      explicit: ${{ steps.gate.outputs.explicit }}
      # How many automatic reviews this pull request already carries, which is how many passes it has
      # had before this one. The submission step reads it to decide whether a pass this late may
      # still withhold approval over findings that are paid for later.
      automatic_reviews: ${{ steps.gate.outputs.automatic_reviews }}
      # The gate picks the default and the step that reads the labels may raise it, so the answer is
      # the second value where one exists. A skipped step has no output at all, which GitHub renders
      # as the empty string and this expression treats as *nothing was decided here* — the same shape
      # the gate itself relies on when it declines to review and no model is ever read.
      model: ${{ steps.security.outputs.model || steps.gate.outputs.model }}
    steps:
      # This job used to check out nothing, because it only reads the event and asks the API two
      # questions. It checks out now for one file: `call-github-api.sh`, which every read in this
      # workflow goes through and which has to be one script rather than a loop pasted into each
      # step. The base commit for the reason every other checkout here names — the branch under
      # review must not supply the code that decides whether it is reviewed — and the cost is a
      # shallow clone on an event that already starts a runner.
      - name: Check out the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Decide whether this event asks for a review
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ADDED_LABEL: ${{ github.event.label.name }}
          IS_PULL_REQUEST_COMMENT: ${{ github.event.issue.pull_request.url != '' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          GH_TOKEN: ${{ github.token }}
          # The account the App's reviews are authored by, which the per-pull-request ceiling below
          # counts, and the same login the prompt names when it tells the reviewer which previous
          # verdicts are its own. It is the App's slug and not its display name — `Fathom reviewer`
          # publishes as `fathom-reviewer[bot]` — so anything that touches the App's identity means
          # re-reading this from the API rather than deriving it from the settings page.
          REVIEWER_LOGIN: 'fathom-reviewer[bot]'
          # The updater whose pull requests the gate below declines to review, named the way it
          # authors them. It appears only through the repository's `Dependabot security updates`
          # setting, because no version updates are configured here. It is the only
          # account here that opens a pull request without a person having written the diff, which
          # is the whole of why it is singled out; a second bot would earn its own line and its own
          # argument rather than a widened match on `[bot]`.
          UPDATER_LOGIN: 'dependabot[bot]'
          # Every read in this workflow goes through it, so a dropped connection costs a wait rather
          # than the run that contains it. What it retries and what it refuses to is written there.
          GITHUB_API_SCRIPT: ${{ github.workspace }}/.github/pull-request/call-github-api.sh
        run: |
          set -euo pipefail

          review='false'
          # Whether somebody asked for this run in so many words. A label or a comment is a person
          # with write access deciding the pass is worth its cost; every other path is the workflow
          # deciding for them, and only that one is bounded below.
          explicit='false'
          # Sonnet 5 by default, at the exact identifier rather than the `sonnet` alias: an alias
          # silently re-points at whatever ships next, and a review's findings are only comparable
          # across runs when the model that produced them is the one this file names. The prompt is
          # written for this model, so a run on another one is a deliberate exception. Exactly two
          # are taken: a maintainer writing `opus` in the request below, and the step after this one
          # when the pull request carries the `security` label.
          model='claude-sonnet-5'
          reason='no rule matched this event'

          case "$EVENT_NAME" in
            pull_request_target)
              if [[ "$EVENT_ACTION" == 'closed' ]]; then
                # There is nothing left to advise on: the change has either merged or been
                # abandoned. What this event accomplishes it accomplished before this job started,
                # by entering the concurrency group and cancelling the review that was still
                # reading a pull request nobody will act on again.
                reason='the pull request is closed'
              elif [[ "$EVENT_ACTION" == 'labeled' ]]; then
                # The label is the maintainer's explicit ask, which is the only way a fork's pull
                # request reaches this workflow and the only way a draft does.
                if [[ "$ADDED_LABEL" == 'fathom-review' ]]; then
                  review='true'
                  explicit='true'
                  reason='a maintainer applied the fathom-review label'
                else
                  reason="the applied label is '${ADDED_LABEL}'"
                fi
              elif [[ "$PULL_REQUEST_AUTHOR" == "$UPDATER_LOGIN" ]]; then
                # A version bump is not a change this reviewer can advise on. What decides one is
                # whether the upstream release renamed an input or dropped a runner, and whether
                # `THIRD_PARTY_LICENSES.md` still names the version the workflow pins — both read
                # from upstream release notes and from the register, neither of them present in the
                # diff. The diff itself is a version number in a `uses:` line, and it is reviewed
                # again on every rebase the updater performs.
                #
                # This is the one skip that is about the author rather than about the change's
                # state, so it is placed with the other checks the label escapes rather than
                # anywhere earlier: a major bump worth a second opinion is still one label away.
                reason="the pull request is authored by ${UPDATER_LOGIN}; label it fathom-review or comment fathom-review to review a bump anyway"
              elif [[ "$PULL_REQUEST_DRAFT" == 'true' ]]; then
                # This is the one check that contains what `synchronize` costs: a draft is pushed
                # to while it is being written, and none of those pushes is reviewed.
                reason='the pull request is a draft; label it fathom-review or comment fathom-review to review it anyway'
              elif [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
                # A fork's own pull request never starts a review by being opened or pushed to. The
                # label does, and the action's own write-permission check on the actor agrees: on a
                # `labeled` event the actor is the maintainer who applied it.
                reason="the head branch is in ${HEAD_REPOSITORY}; a maintainer applies the fathom-review label to review a fork"
              elif [[ "$EVENT_ACTION" == 'synchronize' ]]; then
                review='true'
                reason='the branch was pushed to'
              else
                review='true'
                reason="the pull request was ${EVENT_ACTION}"
              fi
              ;;
            issue_comment)
              # The comment path deliberately applies none of the checks above. A draft is reviewed
              # this way — it is the escape hatch the draft branch above names — and so is a fork's
              # pull request, because somebody with write access typing the phrase has already
              # decided this run is worth its cost. Author association is the whole guard here.
              #
              # `fathom-review` rather than `@claude`: an at-mention collides with GitHub Copilot's
              # own trigger.
              #
              # The phrase has to begin a line, which is stricter than matching it anywhere in the
              # body and is the whole reason this is a variable rather than a literal pattern.
              # `fathom-review` names this pipeline, so it is exactly the word somebody writes when
              # they discuss it — "I'll rerun the fathom-review workflow", "see the fathom-review
              # docs" — and an anywhere-match would spend subscription usage on a run nobody asked
              # for every time that sentence appears on a pull request. Somebody asking for a review
              # types the phrase as an instruction, at the start of a line; somebody talking about
              # it does not. The trailing `[^a-z-]` keeps `fathom-reviewer` from counting.
              #
              # A `-`, `*`, or `+` list marker may precede the phrase, because a request written as
              # one of several bullet points is still a request. A `>` may not: on GitHub that is
              # the quote-reply marker, so accepting it would make answering a thread that contains
              # the phrase start a second run — a citation is not an instruction. The marker has to
              # be followed by whitespace, so a hyphenated word such as `-fathom-review` still does
              # not count.
              #
              # The `@` is optional because every other reviewer on the market is summoned with one,
              # so it is the first thing a hand types, and a trigger that silently ignores the
              # obvious spelling is a trap rather than a guard. It addresses no account here — the
              # App is named `Fathom reviewer` — so GitHub renders it as plain text, and accepting it
              # weakens nothing: `@fathom-review` is not a phrase that turns up in prose about the
              # workflow, so the line-start rule above still carries the whole guard.
              trigger_pattern=$'(^|\n)[[:space:]]*([-*+][[:space:]]+)?@?fathom-review([^a-z-]|$)'

              if [[ "$IS_PULL_REQUEST_COMMENT" != 'true' ]]; then
                reason='the comment is on an issue rather than a pull request'
              elif [[ ! "${COMMENT_BODY,,}" =~ $trigger_pattern ]]; then
                reason='the comment does not ask for fathom-review'
              elif [[ "$COMMENT_ASSOCIATION" != 'OWNER' && "$COMMENT_ASSOCIATION" != 'MEMBER' && "$COMMENT_ASSOCIATION" != 'COLLABORATOR' ]]; then
                reason="the comment author is ${COMMENT_ASSOCIATION} and cannot spend review usage"
              else
                review='true'
                explicit='true'
                reason='a maintainer asked for fathom-review in a comment'
                # The escape hatch to the more expensive model, for a change where the default
                # reviewer's verdict is worth a second, costlier opinion.
                if [[ "${COMMENT_BODY,,}" == *opus* ]]; then
                  model='claude-opus-5'
                fi
              fi
              ;;
          esac

          # What the subscription pays for is bounded per pull request, not per period. Every push to
          # a published branch starts a review, so a branch pushed to forty times is reviewed forty
          # times, and past some number of passes over the same pull request another one is spending
          # usage to repeat what it already said.
          #
          # The count is the reviews this App has already submitted here rather than a quota read from
          # run history. A run that decided *not* to review — a draft push, a comment about the
          # workflow — is indistinguishable from one that did in the runs endpoint, so counting runs
          # would bound the wrong number, and a calendar quota would bound a busy month rather than
          # the pathological pull request that is the actual failure.
          #
          # What is counted is the reviews this App published from an automatic run, which each carry
          # the marker the submission step writes into their body. A review somebody asked for is not
          # counted and is never refused: a maintainer with write access has already made the decision
          # this ceiling exists to make when nobody made it, so asking must neither be rationed nor
          # consume the budget a later push draws on.
          #
          # Counting every review instead — the arrangement this replaces — spent the budget on the
          # requested passes as well, so a pull request somebody had reviewed by hand a few times
          # stopped being reviewed on push while the number of unprompted passes was still small.
          #
          # Six is the ceiling because it is past where a pass stops paying for itself. #811 took six
          # rounds and the last two of them each moved two findings, both of which were fixes to
          # earlier findings rather than anything the first pass had missed; a seventh automatic pass
          # over the same pull request is usage spent to repeat what has been said. Past it the work
          # is answering the review rather than asking for another, and a maintainer who disagrees
          # says so with a label or a comment.
          automatic_review_limit=6

          # Counted whenever a review is going to happen rather than only when the ceiling could
          # refuse it, because two decisions read this number now. The ceiling is one; the other is
          # the settling threshold in the submission step, which needs to know how many passes this
          # pull request has already had in order to stop a late pass withholding approval over
          # findings that are paid for later. A requested review is still never refused by the
          # ceiling below, and it still never joins the count.
          automatic_reviews='0'

          if [[ "$review" == 'true' ]]; then
            # `--paginate` runs `--jq` once per page, so the per-page counts are summed rather than
            # read as one number. The login reaches jq through the environment rather than through
            # string interpolation, so the `[bot]` brackets never arrive as filter syntax.
            #
            # A failed count reads as zero and the review proceeds. This is a cost guard rather than
            # a security one, so one extra review is a better outcome than failing a run over a
            # transient API error — and the workflow gates nothing, so a red run here would be noise
            # a reader has to dismiss rather than a signal. The retries in front of that fallback
            # are what keep the ceiling from being lifted by a single dropped connection.
            # The marker is matched as the body's last line rather than anywhere in it. A review body
            # carries the reviewer's summary and findings, which are model text derived from the
            # diff, so a requested review of a change to *this file* — whose finding quotes the
            # marker — would otherwise count as an automatic pass and spend a budget the requested
            # path never spends. The submission step writes the marker as the final line, which is
            # the position asserted here; carriage returns and trailing blank lines are stripped
            # first, so a round trip that normalizes line endings cannot silently stop the count.
            #
            # Both the login and the marker reach jq through the environment rather than through
            # string interpolation: the login carries `[bot]` brackets and the marker carries `<!--`,
            # and either arriving as filter syntax would be a broken filter rather than a wrong count.
            automatic_reviews=$(
              "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews?per_page=100" --paginate \
                --jq '[.[]
                       | select(.user.login == env.REVIEWER_LOGIN)
                       | select(((.body // "")
                                 | split("\n")
                                 | map(sub("\r$"; ""))
                                 | map(select(. != ""))
                                 | last // "") == env.AUTOMATIC_REVIEW_MARKER)] | length' \
                | jq -s 'add // 0'
            ) || automatic_reviews='0'

            if [[ "$explicit" != 'true' ]] && (( automatic_reviews >= automatic_review_limit )); then
              review='false'
              reason="the automatic review ceiling of ${automatic_review_limit} is reached; ${REVIEWER_LOGIN} has published ${automatic_reviews} automatic reviews on this pull request, so label it fathom-review or comment fathom-review to review it again"
            fi
          fi

          {
            echo "review=${review}"
            echo "pull_request_number=${PULL_REQUEST_NUMBER}"
            echo "model=${model}"
            echo "explicit=${explicit}"
            echo "automatic_reviews=${automatic_reviews}"
          } >> "$GITHUB_OUTPUT"

          echo "Review: ${review} (${reason})."

      # `security` says this change needs a security review before it merges. It is written on the
      # issue — `docs/operations/issue-tracking.md` § "Labels" — and `Apply pull request rules`
      # carries it onto the pull request, which is the only place this workflow reads it from. That
      # split is deliberate: which conditions put which label on a pull request is one decision, it
      # is going to grow more conditions than this one, and a reviewer that re-derived the answer
      # would be a second implementation of it that can disagree with the label a reader sees.
      #
      # What it decides here is who performs the review. The prompt applies the security rubric to
      # every file rather than to the ones whose diff invites it, and this hands that pass to the
      # costlier model: the same shape of exception as the `opus` request in the gate above, taken by
      # the project rather than by a hand, because the change whose defect would be a security defect
      # is the one a second opinion most repays. Nothing else escalates, so an ordinary change is
      # reviewed by the default model exactly as before.
      #
      # It waits for that workflow rather than racing it. Both start from the same event when a pull
      # request is opened, reopened, or marked ready, so the label is being decided at the moment
      # this runs, and reading too early would review a security change with the default model and
      # no pass. Only a run that is still going is waited for, which is why a push waits not at all:
      # the labelling does not run on one — a label follows from the body and the issues it names
      # rather than from the diff — so what is already on the pull request is the answer.
      #
      # What is waited for is a run of the whole rules workflow, so the wait is only as short as its
      # slowest job on this event. That is what the board half of it is kept off `pull_request`
      # events for: on the events this waits on, the labelling is the only job that runs.
      - name: Read the labels the change carries
        id: security
        if: steps.gate.outputs.review == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ steps.gate.outputs.pull_request_number }}
          MODEL: ${{ steps.gate.outputs.model }}
          # The costlier model, at its exact identifier for the reason the gate names the default at
          # one: a review's findings are comparable across runs only when the model is the one this
          # file states.
          SECURITY_MODEL: 'claude-opus-5'
          SECURITY_LABEL: security
          LABELLING_WORKFLOW: apply-pull-request-rules.yml
          # A short wait, because the labelling run reads a body and a handful of issues and posts
          # one label. Past the ceiling the review proceeds on the labels the pull request carries
          # now: this decides which model reviews rather than whether a review happens, so a stuck
          # labelling run must not hold a review open or fail one.
          LABELLING_LIMIT_SECONDS: '120'
          LABELLING_POLL_SECONDS: '10'
          GITHUB_API_SCRIPT: ${{ github.workspace }}/.github/pull-request/call-github-api.sh
        run: |
          set -euo pipefail

          # Every read here leaves the default in place when it fails rather than failing the step.
          # Nothing downstream survives a failed `decide`, so an unreachable API would cost the whole
          # review to answer a question about which model performs it.
          head_sha="$("$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq '.head.sha')" \
            || head_sha=''

          # Every run for this head that has not concluded, asked for without a `status` filter and
          # counted here. The filter looks like the shorter way to ask and is the wrong one:
          # `queued`, `waiting`, `requested`, and `pending` are values of that parameter in their own
          # right rather than phases of `in_progress`, so `status=in_progress` answers zero for a run
          # that has been created and not yet started — which is exactly the case this wait exists
          # for, since both workflows are started by one event and the labelling is the one whose
          # runner is still being found. The label would then be read before it was applied, and a
          # security change would be reviewed by the default model with nothing saying so.
          #
          # A failed query, an empty answer, and a head nobody could read all mean *nothing to wait
          # for*, for the same reason the ceiling exists.
          labelling_in_flight() {
            local pending

            [[ -n "$head_sha" ]] || return 1

            pending="$(
              "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/actions/workflows/${LABELLING_WORKFLOW}/runs?head_sha=${head_sha}&per_page=100" \
                --jq '[.workflow_runs[] | select(.status != "completed")] | length'
            )" || pending='0'

            [[ -n "$pending" && "$pending" != '0' ]]
          }

          # Wall clock rather than a count of sleeps, as the settle loop below does. Summing the poll
          # interval held while a poll was one request and does not now: a read that fails before it
          # answers spends its retry budget inside `labelling_in_flight`, and a counter blind to that
          # runs the ceiling this step declares out to several times its stated length before saying
          # the labelling was "still running after 120s".
          started_at="$(date -u +%s)"
          waited=0

          while labelling_in_flight; do
            waited=$(( $(date -u +%s) - started_at ))

            if (( waited >= LABELLING_LIMIT_SECONDS )); then
              printf 'The labelling of %s was still running after %ss, so the labels are read as they stand.\n' \
                "$head_sha" "$waited"
              break
            fi

            sleep "$LABELLING_POLL_SECONDS"
          done

          security_review='false'
          model="$MODEL"
          reason="the pull request carries no ${SECURITY_LABEL} label"

          # Read first, match second, rather than piping the read into `grep -q`. That reader exits
          # the moment it matches, so the writer upstream is killed by `SIGPIPE` if it has not
          # finished — and under `pipefail` the pipeline then reports 141 however well the read went,
          # which reads here as *no label* and reviews a security change with the default model,
          # saying nothing. The race is real either way and this step's own contract caught it: a
          # script between `gh` and the match is one more process still running when the match lands.
          pull_request_labels="$(
            "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq '.labels[].name'
          )" || pull_request_labels=''

          if grep -qxF "$SECURITY_LABEL" <<< "$pull_request_labels"; then
            security_review='true'
            model="$SECURITY_MODEL"
            reason="the pull request carries the ${SECURITY_LABEL} label"
          fi

          {
            echo "security_review=${security_review}"
            echo "model=${model}"
          } >> "$GITHUB_OUTPUT"

          echo "Security review: ${security_review}, model: ${model} (${reason})."

  # The board says a review is running, from the moment it starts rather than when it concludes. A
  # review takes minutes, and until this job existed the column said whatever the last event left
  # there for that whole time — most often `In progress`, which is the state the work was in before
  # the pull request existed at all. The verdict job below then answers the same question the other
  # way round, so between them the field never describes a moment that has passed.
  #
  # It preserves the same two statuses the verdict does, and for the same reason: `Done` is the
  # merge and the close, `Blocked` is the one status a hand writes about something outside the
  # project, and a review that starts on either says nothing that entitles it to erase them. The
  # verdict then writes over this value a few minutes later, and a run that publishes none leaves
  # the item where a reader can see a review was asked for and produced nothing.
  #
  # It runs beside the reviewer rather than before it, because nothing in the review depends on the
  # board: making it a dependency would let a project API failure delay or skip a review.
  announce:
    name: Announce the review on the board
    needs:
      - decide
    if: needs.decide.outputs.review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The base commit, for the two scripts below and for the reason every other read of this
      # repository in this file uses it: the branch under review must not supply the code that
      # decides which issues its own merge closes.
      - name: Check out the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Move the issues this pull request closes into review
        id: in-review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ secrets.BOARD_PROJECT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          BOARD_OWNER: Krzysztof318
          BOARD_NUMBER: '4'
          STATUS_FIELD: Status
          CLOSING_ISSUES_SCRIPT: ${{ github.workspace }}/.github/pull-request/collect-closing-issues.sh
          CLOSING_ISSUE_LIMIT: '5'
          BOARD_STATUS_SCRIPT: ${{ github.workspace }}/.github/pull-request/write-board-status.sh
          IN_REVIEW_STATUS: In review
          PRESERVED_STATUSES: Done,Blocked
        run: |
          set -euo pipefail

          "$BOARD_STATUS_SCRIPT" "$IN_REVIEW_STATUS" "$PRESERVED_STATUSES"

  # The change as data, and the split that decides who reads what. Nothing here runs a model, which
  # is why it holds no Claude credential and no App token: it calls the API the workflow token
  # already reaches, freezes what it collected, and hands the result to the jobs that do.
  #
  # Reading used to happen in the same job as this, in one session, and the prompt asked that session
  # to spread the reading over subagents. Nothing enforced it. Measured over the 39 runs that reached
  # the model between 2026-08-16 and 2026-08-18: a change of 60 files or more took a median of 24.7
  # minutes against a 30-minute ceiling, twelve runs of the 39 passed twenty minutes and every one of
  # them was a change of 42 files or more, and three runs ended early having read a fraction of the
  # change — 8 of 42 files in 2.7 minutes, 27 of 51 in 4.7, 15 of 21 in 6.3 — each publishing a
  # verdict shaped exactly like a complete one. Those are one defect: coverage and duration were both
  # properties of what the model chose rather than of how the run was built.
  #
  # `group-changed-files.sh` is where that choice stops being the model's. Every collected file is
  # assigned to exactly one group before a model starts, and the `read` job below runs one reader per
  # group, concurrently. What that buys is a run whose length follows the largest group rather than
  # the whole change, and a coverage list the run composes from what the readers actually opened
  # instead of one the reviewer writes about itself.
  collect:
    name: Collect the change
    needs:
      - decide
    if: needs.decide.outputs.review == 'true'
    runs-on: ubuntu-latest
    # The model-free half of the run, and the sum of its own bounds: the settle wait ends at five
    # minutes, the head-content loop at two, the closing-issue loop at two, and each of the two loops
    # may spend one further call's retry budget past its window. Twelve is that with room for the
    # checkout, and it fails loudly rather than eating into what the readers have.
    #
    # The three jobs together are what has to land inside twenty minutes, and they do so by their
    # measured cost rather than by their ceilings: about two minutes here, eight in the slowest
    # reader, and nine in the judge. A ceiling reached is a job that hung, and the timeout is what
    # ends it rather than a budget anything plans against.
    timeout-minutes: 12
    outputs:
      head_sha: ${{ steps.collect.outputs.head_sha }}
      snapshot_taken: ${{ steps.collect.outputs.snapshot_taken }}
      # The matrix the readers run as: one entry per group, as the group's index. The files each
      # index stands for are in `groups.json` inside the collected inputs rather than in this
      # output, because a matrix is rendered into the job name and a list of paths would make one
      # unreadable — and because the split is data the readers read rather than a value they are
      # configured with.
      groups: ${{ steps.split.outputs.groups }}
      group_count: ${{ steps.split.outputs.group_count }}
      changed_files: ${{ steps.split.outputs.changed_files }}
    permissions:
      contents: read
      # Read-only throughout, and here that is the whole of what the job can do: no credential in
      # this job writes anything. The App token that publishes the review is minted in `judge`
      # below, which is the one job that publishes.
      pull-requests: read
      # The pull request's body names the issue it closes, and that issue is the change's stated
      # contract. `contents: read` does not reach an issue, so the scope is stated rather than
      # inherited — and stating it keeps the read from depending on the repository staying public.
      issues: read
    steps:
      # The base commit, which is code that already merged, and never the branch under review. It
      # supplies the repository's own instructions — `AGENTS.md`, the `review-change` skill, and the
      # ADRs — so the reviewer measures the change against the contract as it stands on `main`
      # rather than as the branch would rewrite it.
      - name: Check out the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      # A push and the replies that answer the previous pass are one act split across two APIs, and
      # only the push arrives as an event. `address-review` fixes the code, pushes, and then writes
      # a reply into each thread, so the answers land in the seconds *after* the event that starts
      # this run. On #223 the collection below closed at 18:31:40 and the two replies disputing the
      # previous pass's findings were written at 18:31:52 and 18:32:07; the reviewer then spent five
      # minutes on a snapshot that could not contain them and reported both findings again, stating
      # that neither thread had received a reply. No wording in the prompt recovers an answer that
      # is not in the data, so the fix is here rather than there.
      #
      # The snapshot is therefore not frozen until the conversation has stopped moving: a minimum
      # window, then however much longer it takes for the newest comment to be quiet, and a ceiling
      # on the whole wait so somebody typing steadily cannot hold a run open. A pull request nobody
      # has commented on has nothing to settle and waits not at all, which is every first review.
      #
      # The minimum only has to reach the *first* reply, because the quiet window carries the rest
      # of the burst from there. On #223 that reply arrived one second into this step on one pass
      # and six on the other, so a minute is the measured margin rather than a guess; a run whose
      # author writes nothing for a minute after pushing is one where nothing was in flight.
      #
      # This costs runner time and no subscription usage: the model is not running yet. The windows
      # are `env` values rather than literals in the body so the workflow states them in one place
      # and the contract suite can run the same loop against short ones.
      - name: Let the conversation settle before it is collected
        id: settle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          SETTLE_MINIMUM_SECONDS: '60'
          SETTLE_QUIET_SECONDS: '45'
          SETTLE_LIMIT_SECONDS: '300'
          SETTLE_POLL_SECONDS: '15'
          GITHUB_API_SCRIPT: ${{ github.workspace }}/.github/pull-request/call-github-api.sh
        run: |
          set -euo pipefail

          started_at="$(date -u +%s)"

          # The newest comment of either kind, because a finding is answered in its thread and a
          # change is answered in the conversation, and both are written in the same minute as the
          # push. Only the timestamps are read; the question is when somebody last wrote, never
          # what they wrote.
          #
          # Every timestamp is streamed and the largest wins, rather than asking either endpoint
          # for the newest record. `sort` and `direction` are not parameters of the per-issue
          # comment list — only the repository-wide one accepts them — and GitHub ignores an
          # unrecognized query parameter silently, so asking for the newest returns the oldest and
          # a reply posted seconds ago reads as a conversation that went quiet hours back. That is
          # the very race this step exists to close, so the shape that cannot express the mistake
          # is worth a page of records the loop then reduces to one number.
          newest_comment_epoch() {
            local newest=0 timestamp epoch

            while IFS= read -r timestamp; do
              [[ -n "$timestamp" ]] || continue

              epoch="$(date -u -d "$timestamp" +%s)"

              if (( epoch > newest )); then
                newest="$epoch"
              fi
            done < <(
              "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/comments?per_page=100" \
                --paginate --jq '.[].created_at'
              "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100" \
                --paginate --jq '.[].created_at'
            )

            printf '%s\n' "$newest"
          }

          while true; do
            # A lookup that fails reads as no comment, which ends the wait and collects. This is a
            # latency guard rather than a correctness one, so a transient API error must not cost
            # the review; the collection below calls the same API and fails loudly if it is really
            # unreachable.
            newest="$(newest_comment_epoch)" || newest='0'

            if (( newest == 0 )); then
              echo 'Nothing to settle: no comment was found on the pull request.'
              break
            fi

            now="$(date -u +%s)"
            waited=$(( now - started_at ))
            quiet_for=$(( now - newest ))

            if (( waited >= SETTLE_LIMIT_SECONDS )); then
              printf 'The conversation was still moving after %ss, so it is collected as it stands.\n' "$waited"
              break
            fi

            if (( waited >= SETTLE_MINIMUM_SECONDS && quiet_for >= SETTLE_QUIET_SECONDS )); then
              printf 'Settled: nobody has written for %ss, after waiting %ss.\n' "$quiet_for" "$waited"
              break
            fi

            sleep "$SETTLE_POLL_SECONDS"
          done

      - name: Collect the change as data
        id: collect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          # The collected inputs are made read-only once they are complete, and the reviewer holds
          # no tool that writes: its findings are the run's own answer rather than a file it
          # produces, so it cannot rewrite the anchor list that validates them. The path is
          # declared per step rather than once for the job, because `runner` is not one of the
          # contexts a job-level `env` block may read and a workflow that names it there fails
          # validation before a job exists.
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          GITHUB_API_SCRIPT: ${{ github.workspace }}/.github/pull-request/call-github-api.sh
          # How long each of the two loops below that call once per record may spend in total. They
          # are declared here rather than written into the body for the reason the settle windows
          # are: the contract suite runs the real loops against windows it can reach, and a bound no
          # contract can take is a bound a later change can delete with every contract still green.
          HEAD_CONTENT_LIMIT_SECONDS: '120'
          CLOSING_ISSUE_LIMIT_SECONDS: '120'
          # The same login the gate counts by, restated here because this step asks the same question
          # of a different endpoint: which of the reviews on this pull request are this App's own.
          REVIEWER_LOGIN: 'fathom-reviewer[bot]'
          # Whether somebody asked for this review. A requested pass is deliberately unbounded — a
          # maintainer asking for one wants the change looked at again rather than only the part of
          # it that moved — so the narrowing list below is written for an automatic pass alone.
          EXPLICIT: ${{ needs.decide.outputs.explicit }}
        run: |
          set -euo pipefail

          # Every ceiling below is deliberate. The reviewer's context, the subscription usage a run
          # spends, and the job timeout are all finite, and a pull request large enough to exhaust
          # them would otherwise produce a silently partial review that still looks complete. What
          # is dropped is recorded and ends up in the review body.
          file_limit=100
          head_content_file_limit=60
          head_content_byte_limit=131072
          comment_limit=100
          comment_body_limit=2000
          thread_limit=100
          thread_comment_limit=20
          closing_reference_limit=5

          mkdir -p "$REVIEW_DIRECTORY/head"

          # Every ceiling in this step appends what it dropped here, so it is created empty before
          # the first one can run rather than written once at the end by whichever ceiling happens
          # to be last. The submission step reads the whole file into the review body.
          : > "$REVIEW_DIRECTORY/truncation.txt"

          # Taken before the first read rather than after the last, so it is a bound the reviewer
          # can rely on: nothing written after this instant is in what follows. The step above
          # exists to make that instant late enough, and the prompt states it, because a reviewer
          # that treats a snapshot as the whole record reports a thread as unanswered on the
          # strength of not having been given the answer.
          snapshot_taken="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "snapshot_taken=${snapshot_taken}" >> "$GITHUB_OUTPUT"

          # The labels come with it because one of them changes how the change is read: `security`
          # says a security review is owed before this merges, and `Apply pull request rules` is
          # what puts it here. The prompt turns it into a pass over every file, and the job above
          # reads the same label to decide which model performs that pass — one label, read twice,
          # written once.
          "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" \
            --jq '{number, title, body, draft, author: .user.login, labels: [.labels[].name], head_sha: .head.sha, base_sha: .base.sha, base_ref: .base.ref, changed_files, additions, deletions}' \
            > "$REVIEW_DIRECTORY/pull-request.json"

          head_sha="$(jq -r '.head_sha' "$REVIEW_DIRECTORY/pull-request.json")"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          # `--paginate` runs `--jq` once per page, so every collection here emits one record per
          # line and `jq -s` gathers them into the single array the reviewer and the submission step
          # both read. A filter that built an array per page would leave a stream of arrays as soon
          # as a pull request passed one page: `lines.json` below would inherit that shape, and the
          # submission step's `--slurpfile` would then validate every anchor against the first
          # page's files alone and push every other finding into the review body.
          #
          # A page that fails restarts the whole call rather than resuming, which is why the helper
          # buffers the answer instead of streaming it: a retry that appended to what the first
          # attempt already printed would produce exactly the duplicated stream described above.
          "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/files?per_page=100" --paginate \
            --jq '.[] | {filename, previous_filename, status, additions, deletions, patch}' \
            | jq -s --argjson limit "$file_limit" '.[0:$limit]' \
            > "$REVIEW_DIRECTORY/files.json"

          # The lines a review comment may anchor to, taken from the same patches the review is
          # judged against, so the reviewer chooses an anchor that exists instead of guessing one
          # from a diff that may have moved on. Every added or context line on the right side of a
          # hunk is commentable; a removed line is not.
          jq '[.[] | select(.patch != null) | {
                filename,
                lines: (
                  .patch
                  | split("\n")
                  | map(select(. != ""))
                  | reduce .[] as $line ({next: 0, lines: []};
                      if ($line | startswith("@@")) then
                        .next = ($line | capture("\\+(?<start>[0-9]+)") | .start | tonumber)
                      elif ($line | startswith("-")) or ($line | startswith("\\")) then
                        .
                      else
                        .lines += [.next] | .next += 1
                      end)
                  | .lines
                )
              }]' "$REVIEW_DIRECTORY/files.json" > "$REVIEW_DIRECTORY/lines.json"

          # The resulting file, not just the hunk. A hunk states what moved; whether the change is
          # correct is a property of the file it leaves behind. Content is fetched as bytes and read
          # as bytes: nothing here is executed, imported, or built.
          #
          # This is the one call made in a loop, so the retry budget is per path rather than per
          # step: a contents endpoint that has started failing costs every remaining path its whole
          # budget, and `fetched` advances only on a successful under-limit fetch, so the count
          # ceiling bounds successes rather than iterations. A hundred paths each spending seconds
          # of backoff would burn the job's thirty minutes before the reviewer starts — killing the
          # run and leaving no verdict, which is the failure the retries exist to remove.
          #
          # A wall-clock bound over the whole loop is what stops that, under every mix of causes.
          # It is tested before a fetch rather than during one, so what it bounds is the path the
          # loop *starts*: the real ceiling is the window plus one call's whole budget, which the
          # per-attempt deadline makes about 140 seconds. A later change picking a value here is
          # choosing the first of those two numbers, not the total.
          #
          # Both ceilings write a line, because a path missing from `head/` reads to the reviewer as
          # content too large to collect — so a gap left by an unreachable API, or by a ceiling,
          # would otherwise arrive as a statement about the file.
          head_content_started_at="$(date -u +%s)"

          fetched=0
          while IFS= read -r path; do
            # The count ceiling reports too, for the same reason the window does and against the
            # same sentence in the prompt: on a pull request of sixty-one to a hundred changed
            # files the paths past this point are absent from `head/`, and without a line here the
            # reviewer is told that means too large or binary when nobody fetched them at all.
            #
            # It states `fetched` rather than a position, exactly as the window's note does and for
            # the same reason: a file dropped for size is read and left out, so the files with
            # content need not be the first sixty paths.
            if (( fetched >= head_content_file_limit )); then
              printf 'Reading the changed files at the head reached its ceiling, so the content of the changed files after that point was not read; %s of them have content here.\n' \
                "$fetched" >> "$REVIEW_DIRECTORY/truncation.txt"
              break
            fi

            # What the note states is `fetched`, which counts the files whose content is in the
            # bundle rather than the paths the loop reached: a file dropped for size leaves it
            # behind, so calling it "the first N" would name a prefix that does not exist — this
            # repository routinely carries files past the byte limit, `scripts/test-agent-workflow.sh`
            # among them.
            if (( $(date -u +%s) - head_content_started_at >= HEAD_CONTENT_LIMIT_SECONDS )); then
              printf 'Reading the changed files at the head took longer than %ss, so the content of the changed files after that point was not read; %s of them have content here.\n' \
                "$HEAD_CONTENT_LIMIT_SECONDS" "$fetched" >> "$REVIEW_DIRECTORY/truncation.txt"
              break
            fi

            destination="$REVIEW_DIRECTORY/head/${path}"
            mkdir -p "$(dirname "$destination")"

            # The one read here whose stderr is thrown away, because a file the head does not carry
            # is an ordinary outcome of this loop rather than a failure to report, and sixty paths
            # would otherwise each write a line about it. A reply saying the file is not there costs
            # one attempt rather than a budget, since it is not transient.
            #
            # What that discards is the notice for a path dropped after four failed attempts, which
            # then leaves the same gap as one the head never had. The bound above is what answers
            # for it: the loop cannot spend more than its window, and the note it writes says the
            # content of the later files is missing whatever the reason.
            if "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/contents/${path}?ref=${head_sha}" \
                 -H 'Accept: application/vnd.github.raw' > "$destination" 2>/dev/null; then
              if (( $(stat -c '%s' "$destination") > head_content_byte_limit )); then
                rm -f "$destination"
              else
                fetched=$(( fetched + 1 ))
              fi
            else
              rm -f "$destination"
            fi
          done < <(jq -r '.[] | select(.status != "removed") | .filename' "$REVIEW_DIRECTORY/files.json")

          # What other reviewers have already said, so the same finding is not raised twice, and the
          # governing issue, which is where the change's contract is written down.
          #
          # On a re-review these are also this reviewer's own previous threads and the replies to
          # them, which is the only record a run has of what it already reported: the job keeps no
          # state between runs, and a push arrives as a whole diff rather than as an increment.
          #
          # They come from GraphQL rather than from the REST comment list, for the one field REST
          # does not carry: whether a thread is resolved. Resolving is how this repository closes a
          # finding out — reply, then resolve, and never one without the other — so it is the
          # author's clearest statement that a thread is settled, and a reviewer that cannot see it
          # re-opens what the pull request already closed. GraphQL returns the comments already
          # grouped into their threads as well, so a reply sits beside the finding it answers
          # instead of being reassembled from `in_reply_to_id`, and `isOutdated` states directly
          # what `position == null` only implied: GitHub can no longer place the thread on the
          # current diff, because the line it was written against has moved or gone.
          #
          # `last` on both connections rather than `first`. They are returned in creation order and
          # every other collection here keeps the newest entries, so `first` would silently drop
          # the most recent threads and the most recent replies within a thread once a pull request
          # passed the ceiling — which is to say it would drop this reviewer's own last pass and the
          # answers to it, the exact records a re-review is collecting them for.
          "$GITHUB_API_SCRIPT" graphql \
            -F owner="${REPOSITORY%/*}" \
            -F name="${REPOSITORY#*/}" \
            -F number="$PULL_REQUEST_NUMBER" \
            -F threads="$thread_limit" \
            -F threadComments="$thread_comment_limit" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!,
                    $threads: Int!, $threadComments: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewThreads(last: $threads) {
                      nodes {
                        isResolved
                        isOutdated
                        path
                        line
                        comments(last: $threadComments) {
                          nodes { author { login } createdAt body }
                        }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes' \
            | jq --argjson bytes "$comment_body_limit" \
                 '[.[] | {path, line, resolved: .isResolved, outdated: .isOutdated,
                          comments: [.comments.nodes[]
                                     | {author: .author.login, created_at: .createdAt,
                                        body: (.body // "")[0:$bytes]}]}]' \
            > "$REVIEW_DIRECTORY/review-threads.json"

          # The submitted reviews, which is where a verdict lives: an inline comment carries a
          # finding, but `APPROVED`, `NEEDS CHANGES`, and every other summary is the review body,
          # and it is reachable from no other endpoint. `commit_id` says which head each verdict was
          # given for, so a run can tell its own previous pass from one given before the last push,
          # and `state` distinguishes a review that still stands from one `dismiss_stale_reviews_on_push`
          # discarded.
          "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews?per_page=100" --paginate \
            --jq '.[] | {author: .user.login, state, commit_id, submitted_at, body}' \
            | jq -s --argjson limit "$comment_limit" --argjson bytes "$comment_body_limit" \
                 '[.[-$limit:][] | .body |= .[0:$bytes]]' \
            > "$REVIEW_DIRECTORY/reviews.json"

          # What has moved since this App last published a review here, which is the whole of what a
          # later pass is for. Without it every pass judges the entire change again and a fourth one
          # reports a file no fix touched, which is what #839 did: rounds one to three stayed in the
          # changelog, and rounds four, five, and six each opened a page nothing in the change had
          # moved and raised a P1 there. The reviewer still *reads* everything — the coverage ledger
          # is unchanged and a file it cannot see is a file it cannot judge in context — but what it
          # may conclude is bounded by this list.
          #
          # The comparison is three-dot against the last reviewed head, so a branch rebased between
          # passes reports what arrived from the base as moved too. That is not noise: the code the
          # previous pass gave a verdict on is genuinely not the code in front of this one.
          #
          # The file is absent rather than empty when there is no previous review, and the prompt
          # reads that as the first pass, where nothing is out of scope. A failed comparison takes the
          # same path deliberately: a bound derived from an API error would silence findings on files
          # that did move, so a run that cannot establish the bound reviews without it.
          last_reviewed_head="$(
            jq -r --arg reviewer "$REVIEWER_LOGIN" '
              [.[] | select(.author == $reviewer) | .commit_id // ""]
              | map(select(. != "")) | last // ""
            ' "$REVIEW_DIRECTORY/reviews.json"
          )" || last_reviewed_head=''

          if [[ "$EXPLICIT" != 'true' && -n "$last_reviewed_head" ]]; then
            "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/compare/${last_reviewed_head}...${head_sha}" \
              --jq '.files[]?.filename' \
              > "$REVIEW_DIRECTORY/changed-since-last-review.txt" \
              || rm -f "$REVIEW_DIRECTORY/changed-since-last-review.txt"
          fi

          "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100" --paginate \
            --jq '.[] | {author: .user.login, created_at, body}' \
            | jq -s --argjson limit "$comment_limit" --argjson bytes "$comment_body_limit" \
                 '[.[-$limit:][] | .body |= .[0:$bytes]]' \
            > "$REVIEW_DIRECTORY/issue-comments.json"

          # Every issue merging closes, not the first one. Merging closes all of them, so a review
          # that read one can approve a change that finishes it and leaves another open with a
          # closing reference pointing at it. Which issues those are is asked of GitHub rather than
          # read out of the body here: the list the merge will act on is the list the change is held
          # to, and the same script answers it for the board write, so the contract and the column
          # cannot come to disagree about what this change closes.
          : > "$REVIEW_DIRECTORY/issues.ndjson"

          # The ceiling lives in the script rather than in this loop so that what it cuts is
          # reported by the same code that cuts it. The list arrives on standard output and the note
          # about what was dropped on standard error, which is why the two are redirected apart here.
          "${GITHUB_WORKSPACE}/.github/pull-request/collect-closing-issues.sh" \
            "$REPOSITORY" "$PULL_REQUEST_NUMBER" "$closing_reference_limit" \
            > "$REVIEW_DIRECTORY/closing-references.txt" \
            2>> "$REVIEW_DIRECTORY/truncation.txt"

          # The second loop that makes one call per record, and so the second that needs a window
          # rather than only a count: five closing references each spending a whole retry budget is
          # minutes of a job whose thirty are mostly meant for the model, and the settle wait and the
          # head-content window are already ahead of it. What the window cuts is recorded as the
          # unreadable-contract record the failed fetch below already writes, because to the reviewer
          # the two mean the same thing — the number was referenced and what it asks for is unknown.
          issues_started_at="$(date -u +%s)"
          unread_issues=0

          while IFS= read -r issue_number; do
            [[ -n "$issue_number" ]] || continue

            if (( $(date -u +%s) - issues_started_at >= CLOSING_ISSUE_LIMIT_SECONDS )); then
              unread_issues=$(( unread_issues + 1 ))

              jq -nc --argjson number "$issue_number" \
                '{number: $number, title: null, body: null, labels: null}' \
                >> "$REVIEW_DIRECTORY/issues.ndjson"

              continue
            fi

            # The labels come with the body because they are where the pull request's own labels
            # came from: `security` is on the pull request because an issue here carries it, and the
            # reviewer that has both can say which contract asked for the pass it performed. What it
            # keys off is still the pull request's label, for the reason the job above gives.
            #
            # A reference to an issue that cannot be fetched — deleted, or in a repository this
            # token does not reach — is recorded as the number alone rather than dropped, so the
            # reviewer can say the contract was unreadable instead of silently reviewing without it.
            # Its labels are `null` for the same reason its title is: an empty array would say this
            # issue carries no `security` label, which is the one thing the run does not know.
            "$GITHUB_API_SCRIPT" "repos/${REPOSITORY}/issues/${issue_number}" \
              --jq '{number, title, body, labels: [.labels[].name]}' \
              >> "$REVIEW_DIRECTORY/issues.ndjson" \
              || jq -nc --argjson number "$issue_number" \
                   '{number: $number, title: null, body: null, labels: null}' \
                   >> "$REVIEW_DIRECTORY/issues.ndjson"
          done < "$REVIEW_DIRECTORY/closing-references.txt"

          if (( unread_issues > 0 )); then
            printf 'Reading the issues this pull request closes took longer than %ss, so %s of them are here as their number alone.\n' \
              "$CLOSING_ISSUE_LIMIT_SECONDS" "$unread_issues" >> "$REVIEW_DIRECTORY/truncation.txt"
          fi

          jq -s . "$REVIEW_DIRECTORY/issues.ndjson" > "$REVIEW_DIRECTORY/issues.json"
          rm -f "$REVIEW_DIRECTORY/issues.ndjson" "$REVIEW_DIRECTORY/closing-references.txt"

          changed_files="$(jq -r '.changed_files' "$REVIEW_DIRECTORY/pull-request.json")"
          collected_files="$(jq -r 'length' "$REVIEW_DIRECTORY/files.json")"
          if (( changed_files > collected_files )); then
            printf 'The pull request changes %s files and this review covers the first %s.\n' \
              "$changed_files" "$collected_files" >> "$REVIEW_DIRECTORY/truncation.txt"
          fi

          echo "Collected ${collected_files} changed files and ${fetched} head-content files."

      # What the change obliges the rest of the repository to do, which is the part of a review no
      # diff contains. A `.cs` file that changed while no test followed it, a page under `docs/`
      # that still describes the behavior this change replaced, and a moved pin with no row in
      # `THIRD_PARTY_LICENSES.md` are each a rule in `AGENTS.md`, and each of them is invisible in a
      # diff because the defect *is* the absence of a second file from it.
      #
      # This calls no API. It reads the base checkout — code that already merged — and the
      # `files.json` the step above froze, which is what lets `scripts/test-agent-workflow.sh` run
      # the same script against a fixture tree with no `gh` stub, the way it runs the gate and the
      # settle loop today.
      #
      # The script lives under `.github/` rather than in `scripts/` because `Protected paths`
      # refuses a change from anyone but the owner there, and this decides what a reviewer is told
      # to look for. It is read from the workspace, which holds the base commit, so a pull request
      # cannot supply the index that judges it — the same reason the prompt is read from there.
      - name: Index the obligations the change triggers
        id: obligations
        shell: bash
        env:
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          INDEX_SCRIPT: ${{ github.workspace }}/.github/fathom-review/index-obligations.sh
        run: |
          set -euo pipefail

          "$INDEX_SCRIPT" \
            "$GITHUB_WORKSPACE" \
            "$REVIEW_DIRECTORY/files.json" \
            "$REVIEW_DIRECTORY/obligations.json"

      # Who reads what, decided here and not by a model. `group-changed-files.sh` holds the reasoning
      # and the balance rule; this states the two bounds it is given and why each is that number.
      - name: Split the change between the readers
        id: split
        shell: bash
        env:
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          GROUP_SCRIPT: ${{ github.workspace }}/.github/fathom-review/group-changed-files.sh
          # How many readers may run at once. Every one of them is a session on the owner's personal
          # Claude subscription, so this is a decision about that subscription rather than about any
          # one change: six concurrent readers is the ceiling the owner set, and a change large
          # enough to want more gets larger groups instead of more sessions.
          MAX_GROUPS: '6'
          # What a group holds while the ceiling is not binding. Measured from the runs this replaces:
          # a session reading 16 to 30 files took a median of 8.1 minutes, and 6 to 15 took 5.8, so a
          # dozen files is a reader that finishes inside the time the judge still needs after it.
          TARGET_GROUP_SIZE: '12'
        run: |
          set -euo pipefail

          # The last argument is what bounds a later pass. The collection step writes
          # `changed-since-last-review.txt` only for an automatic pass that has a previous review to
          # compare against, so its absence is what puts every group in scope — a first pass, a
          # review somebody asked for, and a comparison the API refused all take that path.
          "$GROUP_SCRIPT" \
            "$REVIEW_DIRECTORY/files.json" \
            "$REVIEW_DIRECTORY/groups.json" \
            "$MAX_GROUPS" \
            "$TARGET_GROUP_SIZE" \
            "$REVIEW_DIRECTORY/changed-since-last-review.txt"

          # The matrix is the indices alone, and only of the groups this pass re-reads. A matrix
          # value is rendered into the job name, and a list of twenty paths would make one
          # unreadable; the files each index stands for are in `groups.json`, which every reader
          # has, along with which groups were left out and why.
          {
            echo "groups=$(jq -c '[.[] | select(.read_this_pass) | .index]' "$REVIEW_DIRECTORY/groups.json")"
            echo "group_count=$(jq '[.[] | select(.read_this_pass)] | length' "$REVIEW_DIRECTORY/groups.json")"
            echo "changed_files=$(jq 'length' "$REVIEW_DIRECTORY/files.json")"
          } >> "$GITHUB_OUTPUT"

          # Read-only from here on. The readers and the judge read these files and the submission
          # step trusts them — `lines.json` in particular is what makes an anchor valid — so nothing
          # that runs afterwards may rewrite them. Removing write permission from the directories as
          # well as the files is what stops an entry being replaced rather than modified, and it
          # happens here because this is the last step that writes into the directory.
          #
          # It does not survive the handoff, which is why each job that downloads the artifact
          # applies it again: `upload-artifact` documents that file permissions are not maintained
          # and that every downloaded directory is `755` and every file `644`. A property asserted
          # only in the job that asserts it would be no property at all.
          chmod -R a-w "$REVIEW_DIRECTORY"

      # The collected change, handed to the jobs that read it. Everything in it is public already —
      # a diff, the conversation on a public pull request, the issues it closes — so the artifact
      # discloses nothing the pull request does not, and it carries the shortest retention the
      # setting allows because its only readers are two jobs in this same run.
      #
      # This is what lets the readers run concurrently at all: collecting once and sharing the result
      # keeps six readers from making six copies of the same hundred API calls, and it means every
      # reader and the judge are looking at the same frozen snapshot rather than at six snapshots
      # taken minutes apart.
      - name: Publish the collected change
        uses: actions/upload-artifact@v7
        with:
          name: fathom-review-inputs
          path: ${{ runner.temp }}/review
          if-no-files-found: error
          retention-days: 1
          # `head/` mirrors the repository's own paths, so a change under `.github/`, `.config/`, or
          # `.agents/` is a hidden path to this action, which ignores those by default. Without this
          # the reviewer would silently lose the head content of exactly the files this repository
          # protects most closely — including this workflow.
          include-hidden-files: true

  # One reader per group, all at once. This is the first pass over the change, and the concurrency
  # is the whole point: the run now takes as long as the largest group rather than as long as the
  # change, so an 88-file pull request is six readers of about fifteen files instead of one session
  # of 88 that measured 24.7 minutes at the median and 28.1 at the worst.
  #
  # A reader holds the Claude credential and nothing else. It has no App token, no write permission
  # of any kind, and it checks out the base commit exactly as every other job here does — nothing
  # from the branch under review is fetched, built, or executed, so the posture argued under
  # *Why `pull_request_target` is the trigger* is unchanged by there being six of these instead of
  # one session with subagents. What a reader produces is text validated against a schema and
  # published as an artifact for the judge, which treats it as untrusted input on the same terms as
  # the diff that produced it.
  read:
    name: Read group ${{ matrix.group }}
    needs:
      - decide
      - collect
    if: needs.decide.outputs.review == 'true' && needs.collect.outputs.group_count != '0'
    runs-on: ubuntu-latest
    # A reader reads a dozen files and writes one object. Fifteen minutes is roughly twice the
    # median a session of that size measured, so a reader that hits this was not slow but stuck —
    # and one stuck reader must not hold the review open, which is what `fail-fast: false` and the
    # judge's own condition below make survivable.
    timeout-minutes: 15
    strategy:
      # A reader that fails takes its group's coverage with it and nothing else. The judge still
      # runs, the coverage line states which files nobody opened, and the review is published saying
      # so — a partial review that admits what it missed is worth more than no review at all.
      fail-fast: false
      # The ceiling the split was computed against, restated here because a matrix is what actually
      # bounds the concurrency. `group-changed-files.sh` never emits more groups than this, so the
      # two agreeing is an invariant rather than a coincidence — but a later change to one that
      # forgot the other would spend more of the subscription at once than the owner agreed to,
      # which is the failure this line exists to make loud rather than silent.
      max-parallel: 6
      matrix:
        group: ${{ fromJSON(needs.collect.outputs.groups) }}
    permissions:
      # Everything this job needs and nothing else. It reads the base checkout and an artifact from
      # its own run; it calls no API, so it holds neither `pull-requests` nor `issues`.
      contents: read
    steps:
      - name: Check out the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Take the collected change
        uses: actions/download-artifact@v8
        with:
          name: fathom-review-inputs
          path: ${{ runner.temp }}/review

      - name: Compose the reader's prompt and the answer schema
        id: reader_prompt
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
          SNAPSHOT_TAKEN: ${{ needs.collect.outputs.snapshot_taken }}
          GROUP_INDEX: ${{ matrix.group }}
          GROUP_COUNT: ${{ needs.collect.outputs.group_count }}
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          TEMPLATE_FILE: ${{ github.workspace }}/.github/fathom-review/reader-prompt.md
          RUBRICS_FILE: ${{ github.workspace }}/.github/fathom-review/review-rubrics.md
          SCHEMA_FILE: ${{ github.workspace }}/.github/fathom-review/candidates-schema.json
          PROMPT_FILE: ${{ runner.temp }}/reader-prompt.md
        run: |
          set -euo pipefail

          # The modes the collection step set, applied again because the artifact did not carry
          # them. The reader holds no tool that writes, so this is defence in depth rather than the
          # only thing stopping a write — but `lines.json` is what makes an anchor valid and
          # `files.json` is what the coverage is measured against, and neither may be rewritten by
          # anything that runs after they were frozen.
          chmod -R a-w "$REVIEW_DIRECTORY"

          group_files="$(
            jq -r --argjson index "$GROUP_INDEX" \
              '.[] | select(.index == $index) | .files[] | "- `\(.)`"' \
              "$REVIEW_DIRECTORY/groups.json"
          )"

          # A reader with no files is a split this workflow cannot produce — `group-changed-files.sh`
          # emits no empty group and the matrix comes from the same file — so reaching this means the
          # two have come apart, and a session given no files would return an empty answer that reads
          # exactly like a clean group.
          if [[ -z "$group_files" ]]; then
            printf 'Group %s holds no files, so the split and the matrix disagree.\n' "$GROUP_INDEX" >&2
            exit 1
          fi

          # `awk` rather than `sed` for the two placeholders that stand for a whole file. `sed`
          # substitutes a pattern into a line and would need every `&`, `\`, and newline in the
          # rubrics escaped; reading the replacement as a file and printing it whole cannot be
          # confused by its content.
          awk -v group_files="$group_files" -v rubrics_file="$RUBRICS_FILE" '
            $0 == "{{GROUP_FILES}}" { print group_files; next }
            $0 == "{{RUBRICS}}" { while ((getline line < rubrics_file) > 0) print line; next }
            { print }
          ' "$TEMPLATE_FILE" \
            | sed \
              -e "s|{{REPOSITORY}}|${REPOSITORY}|g" \
              -e "s|{{PULL_REQUEST_NUMBER}}|${PULL_REQUEST_NUMBER}|g" \
              -e "s|{{HEAD_SHA}}|${HEAD_SHA}|g" \
              -e "s|{{SNAPSHOT_TAKEN}}|${SNAPSHOT_TAKEN}|g" \
              -e "s|{{GROUP_INDEX}}|${GROUP_INDEX}|g" \
              -e "s|{{GROUP_COUNT}}|${GROUP_COUNT}|g" \
              -e "s|{{REVIEW_DIRECTORY}}|${REVIEW_DIRECTORY}|g" \
              > "$PROMPT_FILE"

          # A placeholder that survived substitution reaches the model as literal text, which is a
          # reader that opens the wrong paths rather than a run that fails, so it fails here.
          if grep -nE '\{\{[A-Z_]+\}\}' "$PROMPT_FILE" >&2; then
            echo "The reader prompt still holds an unsubstituted placeholder." >&2
            exit 1
          fi

          schema="$(jq -c . "$SCHEMA_FILE")"

          if [[ "$schema" == *"'"* ]]; then
            echo 'The candidates schema contains an apostrophe, which the reader flag cannot quote.' >&2
            exit 1
          fi

          {
            echo 'prompt<<FATHOM_READER_PROMPT'
            cat "$PROMPT_FILE"
            echo 'FATHOM_READER_PROMPT'
            echo "schema=${schema}"
          } >> "$GITHUB_OUTPUT"

      - name: Read the group
        id: read
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ vars.CLAUDE_CODE_PROFILE == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          classify_inline_comments: 'false'
          # The same deny list the judge runs under, for the same reasons, stated here rather than
          # shared because a workflow has no mechanism to share one and a reader that quietly ran
          # under a wider one would be the only place in this file where untrusted text meets a
          # permission nobody argued.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Bash",
                  "Edit",
                  "Write",
                  "WebFetch",
                  "WebSearch",
                  "mcp__*",
                  "Read(//proc/**)",
                  "Read(//**/.git/**)",
                  "Read(//**/.claude/**)",
                  "Read(//**/.ssh/**)",
                  "Read(//**/.npmrc)",
                  "Read(//**/.netrc)"
                ]
              }
            }
          prompt: ${{ steps.reader_prompt.outputs.prompt }}
          # No `Agent`. The fan-out this workflow used to ask a session for is now the matrix that
          # started this job, and a reader holding a dozen files has nothing left to split: a second
          # layer of it would put the same non-determinism back one level down, where nothing counts
          # the groups or notices a subagent that returned early.
          #
          # The model is whatever the gate chose for this run, so a `security` change is read by the
          # costlier one in the readers as well as in the judge — the label widens what is read, and
          # the reading is here.
          claude_args: |
            --model ${{ needs.decide.outputs.model }}
            --effort high
            --allowedTools "Read,Grep,Glob"
            --setting-sources user
            --json-schema '${{ steps.reader_prompt.outputs.schema }}'

      # What the reader returned, written to a file the judge downloads. A reader that failed
      # publishes nothing, which is exactly how the judge and the coverage step tell an unread group
      # apart from a clean one.
      - name: Publish what the group produced
        if: success()
        shell: bash
        env:
          CANDIDATES: ${{ steps.read.outputs.structured_output }}
          GROUP_INDEX: ${{ matrix.group }}
          CANDIDATES_DIRECTORY: ${{ runner.temp }}/candidates
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          # Where `claude-code-action` writes what the session did. It is read here for the numbers
          # alone — how long, how many turns — and never for what the session said, which is model
          # text derived from an untrusted diff and belongs in no artifact.
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          set -euo pipefail

          mkdir -p "$CANDIDATES_DIRECTORY"

          printf '%s' "$CANDIDATES" > "$CANDIDATES_DIRECTORY/group-${GROUP_INDEX}.json"

          # An answer that is not JSON cannot have come back from the action, which validates it
          # against the schema and fails its own step otherwise. It is checked anyway, because the
          # judge reads this file as data and a malformed one would reach it as a group that looks
          # read and holds nothing.
          if ! jq -e '.covered | type == "array"' "$CANDIDATES_DIRECTORY/group-${GROUP_INDEX}.json" > /dev/null; then
            printf 'Group %s returned no coverage list, so its answer is not usable.\n' "$GROUP_INDEX" >&2
            exit 1
          fi

          printf 'Group %s covered %s files and raised %s candidates.\n' \
            "$GROUP_INDEX" \
            "$(jq '.covered | length' "$CANDIDATES_DIRECTORY/group-${GROUP_INDEX}.json")" \
            "$(jq '.candidates | length' "$CANDIDATES_DIRECTORY/group-${GROUP_INDEX}.json")"

          # What this reader cost, beside what it produced. The judge gathers these into the run's
          # metrics, and they are the reason a later adjustment to this workflow can be judged
          # against a measurement: before this existed, the only signals a change here could be read
          # by were the wall-clock duration of the whole job and a coverage notice, which is how
          # successive adjustments produced impressions rather than comparable numbers.
          jq -n \
            --argjson group "$GROUP_INDEX" \
            --argjson files_given "$(jq --argjson index "$GROUP_INDEX" \
              '[.[] | select(.index == $index) | .files[]] | length' "$REVIEW_DIRECTORY/groups.json")" \
            --argjson covered "$(jq '.covered | length' "$CANDIDATES_DIRECTORY/group-${GROUP_INDEX}.json")" \
            --argjson candidates "$(jq '.candidates | length' "$CANDIDATES_DIRECTORY/group-${GROUP_INDEX}.json")" \
            --argjson session "$(jq '[.[] | select(.type == "result")] | last
                                     | {duration_ms: .duration_ms, turns: .num_turns}
                                     | if . == null then {} else . end' \
                                  "$EXECUTION_FILE" 2>/dev/null || echo '{}')" \
            '{group: $group, files_given: $files_given, covered: $covered,
              candidates: $candidates, session: $session}' \
            > "$CANDIDATES_DIRECTORY/metrics-${GROUP_INDEX}.json"

      - name: Hand the candidates to the judge
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fathom-review-candidates-${{ matrix.group }}
          path: ${{ runner.temp }}/candidates
          if-no-files-found: error
          retention-days: 1

  # The second pass, and the only job that publishes anything. It confirms every candidate against
  # the file it concerns, reads what no reader could — the obligations index, the pull request's own
  # account of itself, the previous passes and their threads — and answers with the findings that
  # survive.
  #
  # It runs whether or not every reader finished. A group that failed is a group nobody read, and
  # the coverage step states which files that leaves unopened; publishing a review that says so
  # beats losing the verdict along with the reader.
  judge:
    name: Fathom review
    needs:
      - decide
      - collect
      - read
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    # The judge no longer reads the change file by file, so its work is bounded by the number of
    # candidates rather than by the size of the diff. Twenty minutes is the whole run's budget minus
    # what collection and the readers spend before it.
    timeout-minutes: 20
    outputs:
      # What the submission step published, and nothing else: a run that posted no review states no
      # verdict, so the job below is skipped rather than left to infer one from a job result that is
      # green for several different reasons.
      verdict: ${{ steps.submit.outputs.verdict }}
    permissions:
      contents: read
      # Read-only throughout. The workflow token collects nothing here and reads nothing this job
      # writes; every write this job performs is made with the `Fathom reviewer` App's installation
      # token, minted below. That is what lets this block stay narrower than the job's behavior
      # suggests: `write` here would also permit closing or relabelling a pull request, which
      # nothing in this file does.
      pull-requests: read
      issues: read
      # No `actions: write`, which is why every run logs `Cache reservation failed: cache write
      # denied: token has no writable scopes`. `claude-code-action` installs Bun through
      # `setup-bun`, which tries to cache the binary, and caching is a write. The warning is the
      # expected outcome rather than a defect: it costs one download of a runner-local binary per
      # run, while the scope that would silence it also permits cancelling workflow runs and
      # deleting artifacts and caches — from a job that `pull_request_target` starts. Nothing here
      # is worth that, and `setup-bun`'s own `no-cache` input is not one the action forwards.
    steps:
      # The identity the review is published under. `create-github-app-token` exchanges the App's
      # client id and private key for an installation token scoped to this repository, valid for an
      # hour and revoked when the job ends, so the long-lived credential in the secret store is a
      # signing key rather than something that can call the API on its own. The App needs exactly
      # one permission: `Pull requests: Read and write`, which covers both submitting a review and
      # commenting on a pull request.
      #
      # It is minted in this job alone. The readers publish nothing and hold nothing that could,
      # which is what keeps the write credential in the one job that makes one API call with it.
      - name: Mint the reviewer App's token
        id: reviewer
        uses: actions/create-github-app-token@v3
        with:
          # `client-id` rather than `app-id`: the action deprecated the numeric App id in v3 and
          # warns on every run that still passes it. Both end up as the issuer of the same JWT, so
          # this is the identifier GitHub now expects rather than a different credential.
          #
          # A variable rather than a secret, because a client id is not one: it is visible on the
          # App's own page and in every installation. Only the private key is a credential, and
          # keeping the identifier out of the secret store is what makes a failed run say which App
          # it tried to authenticate as instead of printing `***`.
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      # The base commit, which is code that already merged, and never the branch under review. It
      # supplies the repository's own instructions — `AGENTS.md`, the `review-change` skill, and the
      # ADRs — so the reviewer measures the change against the contract as it stands on `main`
      # rather than as the branch would rewrite it.
      - name: Check out the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Take the collected change
        uses: actions/download-artifact@v8
        with:
          name: fathom-review-inputs
          path: ${{ runner.temp }}/review

      # Whatever the readers produced, merged into one directory beside the collected inputs. A
      # group that failed left no artifact, so what arrives here is exactly the set of groups that
      # were read — which is what the coverage step measures and what the prompt tells the judge to
      # read `groups.json` against.
      - name: Take what the readers produced
        uses: actions/download-artifact@v8
        with:
          pattern: fathom-review-candidates-*
          merge-multiple: true
          path: ${{ runner.temp }}/review/candidates
        continue-on-error: true

      # The reviewer's instructions live in `.github/fathom-review/reviewer-prompt.md` rather than
      # in a block scalar here, because GitHub compiles any string holding a `${{ }}` expression
      # into a single `format(...)` expression and refuses a workflow whose expression passes 21000
      # characters. The instructions passed it, which invalidated this whole file — every trigger
      # included, so nothing ran at all. Substituting the run's values into a template keeps the
      # expressions in this file, where they are a handful of short lines, and leaves the
      # instructions as prose that no length limit reaches.
      #
      # The answer's schema lives beside them, in `findings-schema.json`, and is emitted here as a
      # single line because `--json-schema` takes the schema itself rather than a path to one.
      # Keeping it a committed file is what makes it readable and reviewable; compacting it here is
      # what makes it passable.
      #
      # Both are read from the workspace, which holds the base commit, so a pull request can supply
      # neither the prompt that reviews it nor the shape of the verdict — the same reason the
      # workflow itself runs from the base rather than from the branch.
      - name: Compose the reviewer prompt and the answer schema
        id: prompt
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
          SNAPSHOT_TAKEN: ${{ needs.collect.outputs.snapshot_taken }}
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          TEMPLATE_FILE: ${{ github.workspace }}/.github/fathom-review/reviewer-prompt.md
          # The rubrics the readers were given, verbatim. They are one file because the judge
          # confirms candidates against the same bar the readers raised them against, and a second
          # copy of them here is exactly how the two would come to disagree about what a finding is.
          RUBRICS_FILE: ${{ github.workspace }}/.github/fathom-review/review-rubrics.md
          SCHEMA_FILE: ${{ github.workspace }}/.github/fathom-review/findings-schema.json
          PROMPT_FILE: ${{ runner.temp }}/reviewer-prompt.md
        run: |
          set -euo pipefail

          # The modes the collection step set, applied again for the reason the readers apply them:
          # the artifact does not carry them, and `lines.json` is what makes an anchor valid. It
          # happens here rather than after the download because the candidates land inside the same
          # directory, and they are model text — the one part of this tree that was not frozen when
          # the rest of it was.
          chmod -R a-w "$REVIEW_DIRECTORY"

          awk -v rubrics_file="$RUBRICS_FILE" '
            $0 == "{{RUBRICS}}" { while ((getline line < rubrics_file) > 0) print line; next }
            { print }
          ' "$TEMPLATE_FILE" \
            | sed \
              -e "s|{{REPOSITORY}}|${REPOSITORY}|g" \
              -e "s|{{PULL_REQUEST_NUMBER}}|${PULL_REQUEST_NUMBER}|g" \
              -e "s|{{HEAD_SHA}}|${HEAD_SHA}|g" \
              -e "s|{{SNAPSHOT_TAKEN}}|${SNAPSHOT_TAKEN}|g" \
              -e "s|{{REVIEW_DIRECTORY}}|${REVIEW_DIRECTORY}|g" \
              > "$PROMPT_FILE"

          # A placeholder that survived substitution reaches the model as literal text, which is a
          # review that reads the wrong paths rather than a run that fails, so it fails here.
          if grep -nE '\{\{[A-Z_]+\}\}' "$PROMPT_FILE" >&2; then
            echo 'The reviewer prompt still holds an unsubstituted placeholder.' >&2
            exit 1
          fi

          # The schema is quoted with `'` in `claude_args` below, because the action parses that
          # input with shell-quoting rules and the schema is full of `"`. A `'` inside the schema
          # would therefore end the quoting and hand the CLI a fragment, so it is refused here
          # rather than at the far end as an unparseable flag. Nothing else about the schema is
          # checked by hand: `jq` reads it, so a schema that is not JSON fails on the line above.
          schema="$(jq -c . "$SCHEMA_FILE")"

          if [[ "$schema" == *"'"* ]]; then
            echo 'The findings schema contains an apostrophe, which the reviewer flag cannot quote.' >&2
            exit 1
          fi

          {
            echo 'prompt<<FATHOM_REVIEW_PROMPT'
            cat "$PROMPT_FILE"
            echo 'FATHOM_REVIEW_PROMPT'
            echo "schema=${schema}"
          } >> "$GITHUB_OUTPUT"
      - name: Review the change
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          # A Claude Code OAuth token rather than an API key: the review runs on the owner's Claude
          # subscription. Generate it with `claude setup-token` and store it as the repository
          # secret the profile declared at the top of this file selects — `CLAUDE_CODE_OAUTH_TOKEN`,
          # or `CLAUDE_CODE_OAUTH_TOKEN_SECONDARY` where `CLAUDE_CODE_PROFILE` is `secondary`.
          #
          # A `&&`/`||` expression yields its right operand whenever the middle one is empty, so a
          # `secondary` profile whose secret was never stored falls back to the first profile's
          # token rather than authenticating with nothing. That is the better of the two outcomes —
          # a review that runs on the other subscription beats one that cannot run at all — and it
          # is the reason the two steps below still refuse an unset credential outright: both
          # secrets missing is the case no fallback covers.
          claude_code_oauth_token: ${{ vars.CLAUDE_CODE_PROFILE == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Explicit, so the action uses the workflow token with the permissions declared above
          # rather than exchanging an OIDC token for a GitHub App installation token whose scopes
          # this workflow does not state.
          github_token: ${{ github.token }}
          # The buffered inline comments this step would post are the mechanism this workflow
          # replaces with a validated submission of its own.
          classify_inline_comments: 'false'
          # The reviewer only reads. It has no shell, no editor, no writer, no network tool, and no
          # MCP tool, so no path exists from the untrusted text it reads to an authenticated call,
          # to the runner, or to the collected inputs the submission step trusts. `Write` is denied
          # here as well as absent from `--allowedTools` below, so the property survives a later
          # change to either one. The remaining deny rules cover the places a credential still sits:
          # the workspace git configuration, where the action writes the workflow token for its own
          # use; `/proc`, where a process can read its own environment as a file; and `.claude`,
          # where the CLI keeps its own configuration. This input is written to the user settings
          # file, which is why every path pattern is absolute.
          #
          # The same list governs every reader job above. It is written twice because a workflow has
          # no mechanism to share one, and the two must not drift: a reader reads the same untrusted
          # diff this job does, and a session of this file running under a wider rule than the other
          # would be the one place that property was never argued.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Bash",
                  "Edit",
                  "Write",
                  "WebFetch",
                  "WebSearch",
                  "mcp__*",
                  "Read(//proc/**)",
                  "Read(//**/.git/**)",
                  "Read(//**/.claude/**)",
                  "Read(//**/.ssh/**)",
                  "Read(//**/.npmrc)",
                  "Read(//**/.netrc)"
                ]
              }
            }
          prompt: ${{ steps.prompt.outputs.prompt }}
          # `--setting-sources user` keeps the deny list above as the only settings the session
          # loads. The action would otherwise load `user`, `project`, and `local`, and a project
          # source means settings and hooks read out of the working directory. Nothing untrusted is
          # in that directory today, and this is what keeps that true if a later change puts
          # something there.
          #
          # `--effort high` decides how much the model thinks and how much work it does before
          # answering. Confirming a candidate is the shape of task where that matters: the cheap
          # failure is a judge that takes a plausible-sounding report on trust.
          #
          # This was `xhigh` for a day, on #811's argument that a round finding nothing new costs
          # more than the depth that would have avoided it. The measurement over the day that
          # followed went the other way, and it is in `docs/operations/agent-workflow.md` § *What a
          # review costs*: median run 5.1 minutes to 8.7, longest 16.8 to 29.2, eleven of
          # thirty-five runs past twenty minutes where none had been, and approvals falling from 47%
          # of reviews to 29%. The depth did not buy earlier convergence; it bought a reviewer with
          # the budget to keep finding one more thing, which the coverage ledger then pointed at the
          # whole change every pass.
          #
          # No `Agent`, in this job or in a reader. The fan-out it used to provide is the `read`
          # matrix, which is the same idea with the parts this file can count: the groups are formed
          # before a model starts, every changed file is in exactly one of them, a reader that dies
          # is a missing artifact rather than a subagent nobody notices, and the coverage the review
          # publishes is composed from what the readers reported opening. What the tool bought was
          # never the parallelism alone — it was a second reader of the same files — and that is
          # what the matrix supplies, with the count, the assignment, and the failure all visible to
          # the run rather than to the session.
          #
          # `--json-schema` is what makes the verdict the run's own answer rather than a side effect
          # of the session. Under it the model's final message is validated against the schema and
          # published as this step's `structured_output`, and a run that ends without one fails here
          # naming that as the cause. The alternative this replaces was an instruction to call
          # `Write`, which nothing enforced: on #306 the reviewer twice read the whole change, spent
          # four minutes and 34 turns on it, ended cleanly, and never made the call — a verdict that
          # existed and reached nobody. The schema takes JSON rather than a path, which is why the
          # step above compacts the committed file into one line.
          #
          # `--model`, `--effort`, and `--json-schema` are not inputs the action declares. It
          # forwards a flag it does not recognize to the CLI unchanged, which is the documented way
          # to reach a CLI option from here.
          claude_args: |
            --model ${{ needs.decide.outputs.model }}
            --effort high
            --allowedTools "Read,Grep,Glob"
            --setting-sources user
            --json-schema '${{ steps.prompt.outputs.schema }}'

      # The action hides everything the reviewer produced, which is right: that output is model
      # text derived from an untrusted diff. It hides the run's own error string with it, and that
      # string is the only place the cause of a failure is written — an expired credential, an
      # exhausted subscription, a model the plan cannot use, or a reviewer that answered without
      # conforming to the schema, where the last result message holds what it said instead. Without
      # it a failed run is a red job with nothing to act on, and the only alternative the action
      # offers is `show_full_output`, which would print the whole review into the log to recover one
      # sentence. The saved execution log holds that sentence — the action writes it before it
      # refuses a non-conforming answer — so this reads it and prints nothing else.
      - name: Report why the reviewer stopped
        if: failure() && steps.review.outcome == 'failure'
        shell: bash
        env:
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
          WORKFLOW_TOKEN: ${{ github.token }}
          # The credential the step above actually authenticated with, selected by the same
          # condition rather than by a second reading of the profile: this compares printed text
          # against it, so a comparison against the token the run did not spend would be no
          # comparison at all. `CLAUDE_CREDENTIAL_SECRET` names it and arrives from the
          # workflow-level `env`, which every step already carries.
          CLAUDE_CREDENTIAL: ${{ vars.CLAUDE_CODE_PROFILE == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! -s "$EXECUTION_FILE" ]]; then
            echo '::error::The reviewer wrote no execution log, so it stopped before the model answered.'
            exit 0
          fi

          # The error text of the last result message, flattened to one line because an annotation
          # is one line, and bounded because a model can be made to say a great deal.
          reason="$(
            jq -r '[.[] | select(.type == "result")]
                   | last
                   | (.result // .error // "the result message carried no error text")' \
              "$EXECUTION_FILE" 2>/dev/null || true
          )"
          reason="${reason//$'\n'/ }"
          reason="${reason:0:500}"

          if [[ -z "$reason" || "$reason" == 'null' ]]; then
            reason='the execution log holds no result message, so the run ended before the model answered'
          fi

          # The reviewer holds no credential and this text comes from the service rather than from
          # the change, so a match here is not expected. It is still checked, because printing is
          # publishing and this is the one step that prints anything the model produced. An empty
          # secret is reported rather than compared: `grep -F ''` matches everything, which would
          # turn a missing secret into a permanent false positive.
          if [[ -z "$CLAUDE_CREDENTIAL" ]]; then
            printf '::error::%s is not set, which is why the reviewer could not run.\n' "$CLAUDE_CREDENTIAL_SECRET"
            exit 0
          fi

          if grep -qE 'gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{16,}' <<< "$reason" \
            || grep -qF "$WORKFLOW_TOKEN" <<< "$reason" \
            || grep -qF "$CLAUDE_CREDENTIAL" <<< "$reason"; then
            echo '::error::The reviewer stopped, and its reason is shaped like a credential, so it is not printed.'
            exit 0
          fi

          printf '::error::The reviewer stopped: %s\n' "$reason"

      # What the readers actually opened, against what the change contains. Each reader names the
      # paths of its own group that it read, and this gathers those lists, compares them against
      # `files.json`, and states the difference where the verdict is read.
      #
      # The coverage is no longer a claim the reviewer makes about itself. It used to be: the answer
      # carried a `covered` array, and a run that had read a fifth of the change could name every
      # file in it and publish a verdict shaped exactly like a complete one — three of the 39 runs
      # measured before this change did read a fraction, 8 of 42 files being the worst. Now the list
      # comes from the jobs that did the reading, one per group, and a group that failed leaves no
      # report at all: what is unread is visible here because of how the run is built rather than
      # because a model owned up to it.
      #
      # It reports and never gates, exactly as before. A partial review that says what it missed is
      # worth more than no review, so the gap is published beside the findings and the verdict still
      # stands.
      #
      # Every path it prints comes from `files.json` rather than from a report. A reader's list is
      # untrusted model text derived from the diff and this step publishes into a review body, so
      # what it names is the *difference* — paths the collection step wrote — and a name in a report
      # matching nothing in `files.json` is reported as a count and never quoted.
      - name: Compare what the readers opened with what changed
        id: coverage
        if: ${{ !cancelled() && needs.collect.result == 'success' }}
        shell: bash
        env:
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          COVERAGE_FILE: ${{ runner.temp }}/coverage.txt
          GROUP_COUNT: ${{ needs.collect.outputs.group_count }}
          # How many unread paths are named before the rest become a count. A review body is read by
          # a person, and a change of three hundred files would otherwise put three hundred lines of
          # it above the findings.
          NAME_CEILING: '10'
        run: |
          set -euo pipefail

          : > "$COVERAGE_FILE"

          candidates_directory="$REVIEW_DIRECTORY/candidates"
          reports_file="$(mktemp)"

          # Every report that arrived, as one array. A group whose reader failed published nothing,
          # so it is absent here rather than empty — and the two mean different things, which is why
          # the count of reports is compared against the number of groups below.
          if compgen -G "$candidates_directory/group-*.json" > /dev/null; then
            jq -s '[.[] | select(type == "object")]' "$candidates_directory"/group-*.json > "$reports_file"
          else
            echo '[]' > "$reports_file"
          fi

          reports="$(jq 'length' "$reports_file")"
          group_count="${GROUP_COUNT:-0}"
          [[ "$group_count" =~ ^[0-9]+$ ]] || group_count='0'

          unread_file="$(mktemp)"

          # `unique` on both sides, so a path two reports name counts once and the difference stays
          # set arithmetic over two normalized lists. A report of the wrong shape contributes
          # nothing rather than failing the step: the action validates every answer against the
          # schema, so reaching here with something else is unreachable, and the cost of being wrong
          # about that is a red job on a review that was otherwise ready to post.
          jq -r --slurpfile reports "$reports_file" '
            ([$reports[0][] | .covered | select(type == "array") | .[] | select(type == "string")]
             | unique) as $named
            | ((map(.filename) | unique) - $named)[]
          ' "$REVIEW_DIRECTORY/files.json" > "$unread_file"

          changed_count="$(jq 'map(.filename) | unique | length' "$REVIEW_DIRECTORY/files.json")"

          # What this pass was asked to read, which is the whole change on a first pass and the
          # groups that moved on a later one. A file in a group nobody re-read is not an unread file:
          # it is one the previous review already covered and nothing has touched since, and stating
          # the two the same way would report every later pass as a review with a hole in it.
          not_re_read="$(mktemp)"
          jq -r '.[] | select(.read_this_pass | not) | .files[]' \
            "$REVIEW_DIRECTORY/groups.json" | sort -u > "$not_re_read"

          in_scope_unread="$(mktemp)"
          comm -23 <(sort -u "$unread_file") "$not_re_read" > "$in_scope_unread"
          mv "$in_scope_unread" "$unread_file"

          not_re_read_count="$(wc -l < "$not_re_read" | tr -d ' ')"
          unread_count="$(wc -l < "$unread_file" | tr -d ' ')"
          scope_count=$(( changed_count - not_re_read_count ))
          read_count=$(( scope_count - unread_count ))

          # A name a report carries that `files.json` does not. It means the list was composed from
          # something other than the group the reader was given — a path invented, or one spelled
          # the way the working directory spells it — so it is worth a sentence, and the names
          # themselves are not printed.
          unknown_count="$(jq --slurpfile files "$REVIEW_DIRECTORY/files.json" '
            ([.[] | .covered | select(type == "array") | .[] | select(type == "string")] | unique)
            - ($files[0] | map(.filename) | unique)
            | length
          ' "$reports_file")"

          # Said first and separately, because it is the one line that explains the rest: a missing
          # report is a part of the change no session ever opened, and the unread paths below are
          # its consequence rather than a second, independent gap.
          if (( reports < group_count )); then
            printf 'The change was split between %s readers and %s reported back, so one part of it was not read.\n' \
              "$group_count" "$reports" >> "$COVERAGE_FILE"
          fi

          if (( unread_count > 0 )); then
            # `jq` rather than `paste -sd ', '`, which takes its argument as a *list* of delimiters
            # used circularly and would join three paths as `a`,`b` `c`. Reading the lines as strings
            # also means a path is quoted and joined as a value rather than as text, so a comma in a
            # file name cannot become a separator.
            listed="$(head -n "$NAME_CEILING" "$unread_file" \
              | jq -R -s -r 'split("\n") | map(select(. != "")) | map("`\(.)`") | join(", ")')"

            if (( unread_count > NAME_CEILING )); then
              listed="${listed}, and $(( unread_count - NAME_CEILING )) more"
            fi

            printf 'The readers opened %s of the %s changed files this pass covers. Not opened: %s.\n' \
              "$read_count" "$scope_count" "$listed" >> "$COVERAGE_FILE"
          fi

          # Said whenever a later pass bounded itself, including when everything in scope was read.
          # An approval on a change of eighty files that re-read six of them is exactly the verdict a
          # reader has to be able to see the shape of.
          if (( not_re_read_count > 0 )); then
            printf 'This pass re-read the %s of the %s changed files that moved since the last review; the other %s have not moved since and carry that review'"'"'s verdict.\n' \
              "$scope_count" "$changed_count" "$not_re_read_count" >> "$COVERAGE_FILE"
          fi

          if (( unknown_count > 0 )); then
            printf 'A reader also named %s path(s) that the collected change does not contain.\n' \
              "$unknown_count" >> "$COVERAGE_FILE"
          fi

          {
            echo "coverage_read=${read_count}"
            echo "coverage_changed=${changed_count}"
            echo "coverage_scope=${scope_count}"
            echo "coverage_reports=${reports}"
          } >> "$GITHUB_OUTPUT"

          if [[ -s "$COVERAGE_FILE" ]]; then
            echo "::notice::$(head -n 1 "$COVERAGE_FILE")"
          else
            printf 'Coverage: the readers opened every one of the %s changed files.\n' "$scope_count"
          fi

      # `!cancelled()` rather than `always()`, which GitHub documents as running a step even when the
      # run was cancelled. This step must still run after a reviewer that failed, so that the reason
      # is reported as a notice rather than as a second red step — but a cancelled run has the
      # opposite property: it was cancelled because the head was superseded or the pull request
      # closed, and `always()` would let it publish the very verdict the cancellation was meant to
      # prevent. The `${{ }}` is required, because a YAML scalar may not begin with `!`.
      - name: Submit the review
        id: submit
        if: ${{ !cancelled() && needs.collect.result == 'success' }}
        shell: bash
        env:
          # The App's installation token, not the workflow token: this is the step that publishes,
          # and what it publishes is attributed to whatever minted this. It is also the only write
          # credential in the job, held by the one step that makes no model call.
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
          WORKFLOW_TOKEN: ${{ github.token }}
          REVIEWER_TOKEN: ${{ steps.reviewer.outputs.token }}
          # Held only by this step, which runs no model output and makes one API call, so that a
          # credential the reviewer was never able to read still cannot be published if it somehow
          # reaches the findings. It is the credential the reviewer authenticated with, selected by
          # the same condition the action input above uses: what this refuses to publish has to be
          # the token the run spent rather than the one the other profile would have.
          CLAUDE_CREDENTIAL: ${{ vars.CLAUDE_CODE_PROFILE == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Whether the reviewer got as far as an answer. Two branches consult it: an empty answer
          # is a failure already reported when the step failed and this workflow's own defect when
          # it did not, and an empty findings array means one thing from a run that finished and
          # the opposite from one that died after answering.
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          # The reviewer's answer, validated against the schema by the action and published as this
          # output. It is model text derived from an untrusted diff, so it arrives through the
          # environment rather than through an expression in the script below, and every check this
          # step makes runs against it before anything is posted.
          FINDINGS: ${{ steps.review.outputs.structured_output }}
          # The path the collection step wrote, restated here for the reason given there.
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          # What the coverage step found, empty when the ledger named every changed file. It sits
          # outside `REVIEW_DIRECTORY`, which is read-only from the obligations step onwards, and it
          # is read defensively below because this step still runs when the one that writes it did
          # not.
          COVERAGE_FILE: ${{ runner.temp }}/coverage.txt
          # What started this run, written into the review as the invisible marker declared at the
          # top of this file. It is the only record of that: the reviews endpoint reports who
          # submitted a review and when, never what asked for it, and the gate of a later run needs
          # exactly that to count the automatic passes without counting the requested ones.
          TRIGGER_MARKER: ${{ needs.decide.outputs.explicit == 'true' && env.REQUESTED_REVIEW_MARKER || env.AUTOMATIC_REVIEW_MARKER }}
        run: |
          set -euo pipefail

          payload_file="$(mktemp)"
          findings_file="$(mktemp)"

          printf '%s' "$FINDINGS" > "$findings_file"

          if [[ ! -s "$findings_file" ]] || ! jq -e '.' "$findings_file" > /dev/null 2>&1; then
            # A reviewer that never answered has already failed and said why, and repeating the
            # consequence as a second error buries the cause. That is the path this takes today for
            # every empty answer, because the action fails its own step when no structured answer
            # comes back.
            if [[ "$REVIEW_OUTCOME" != 'success' ]]; then
              echo '::notice::The reviewer did not finish, so there are no findings to submit.'
              exit 0
            fi

            # A reviewer that finished and still produced nothing is unreachable while the action
            # keeps that promise, and this is what makes the workflow stop depending on it. If a
            # later version renames the output or stops failing on a missing one, every review would
            # otherwise post nothing under a green job — a pipeline that has silently stopped
            # reviewing, which is the failure this whole change exists to remove.
            echo '::error::The reviewer finished but returned no valid findings, so there is nothing to submit.'
            exit 1
          fi

          # A credential in the payload would be published by the very call that posts it. The
          # reviewer is denied the paths that hold one, and this refuses the review outright if one
          # appears anyway, because a redacted review is not worth the risk of a wrong redaction.
          # An unset secret is refused rather than compared: `grep -F ''` matches every file, so
          # comparing against it would reject every review this workflow ever produced.
          if [[ -z "$CLAUDE_CREDENTIAL" ]]; then
            printf '::error::%s is not set, so the findings cannot be checked against it.\n' "$CLAUDE_CREDENTIAL_SECRET"
            exit 1
          fi

          # Refused rather than compared, for the reason given above: an empty pattern matches every
          # file. An empty token also means the step is about to call the API unauthenticated, which
          # would fail later and less clearly than this does.
          if [[ -z "$REVIEWER_TOKEN" ]]; then
            echo '::error::The reviewer App minted no token, so there is nothing to publish the review with.'
            exit 1
          fi

          # The App's own token is compared literally as well as by shape. Its `ghs_` prefix already
          # matches the pattern below, but this is the credential the step is about to authenticate
          # with, and a literal comparison does not depend on the pattern continuing to describe it.
          if grep -qE 'gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{16,}' "$findings_file" \
            || grep -qF "$WORKFLOW_TOKEN" "$findings_file" \
            || grep -qF "$REVIEWER_TOKEN" "$findings_file" \
            || grep -qF "$CLAUDE_CREDENTIAL" "$findings_file"; then
            echo '::error::The findings contain something shaped like a credential and were not posted.'
            exit 1
          fi

          # Nothing found is a verdict, so it is delivered as one: an approval carrying the summary
          # and no inline comments. The alternative shapes are both worse. `event: COMMENT` with an
          # empty `comments` array records that a review happened without saying what it concluded,
          # and an ordinary issue comment says it in the timeline where nothing reads it as a
          # verdict at all.
          #
          # `commit_id` ties the approval to the head the reviewer actually saw. With
          # `dismiss_stale_reviews_on_push` set on the `main` ruleset, the next push dismisses it,
          # so an approval can never describe code that has since changed.
          #
          # This cannot merge anything by itself: the ruleset requires an approving review from a
          # code owner, and a GitHub App cannot be one. `REQUEST_CHANGES` is never used in either
          # branch — a reviewer that gates nothing must not be able to block a merge either.
          # An empty findings array means two different things depending on how the reviewer ended.
          # From a run that finished, it means nothing was found. From one that answered and then
          # failed anyway, it means the search never completed and the answer is a snapshot rather
          # than a verdict. Findings from such a run are still worth posting, because a defect it
          # did name is real; an approval is not, because it asserts the absence of what the run
          # stopped looking for. So the affirmative branch is the one gated on the reviewer having
          # succeeded.
          if [[ "$(jq '(.findings // []) | length' "$findings_file")" == '0' ]] \
            && [[ "$REVIEW_OUTCOME" != 'success' ]]; then
            echo '::notice::The reviewer did not finish and found nothing before stopping, so no approval was posted.'
            exit 0
          fi

          if [[ "$(jq '(.findings // []) | length' "$findings_file")" == '0' ]]; then
            jq --arg commit "$HEAD_SHA" \
               --arg truncation "$(cat "$REVIEW_DIRECTORY/truncation.txt")" \
               --arg coverage "$(cat "$COVERAGE_FILE" 2>/dev/null || true)" \
               --arg marker "$TRIGGER_MARKER" '
              {
                commit_id: $commit,
                event: "APPROVE",
                body: (
                  ["# APPROVED", ""]
                  + [((.summary // "") | if . == "" then "The review found nothing above the bar in this change." else . end)]
                  + (if $truncation == "" then [] else ["", $truncation] end)
                  + (if $coverage == "" then [] else ["", $coverage] end)
                  + ["", $marker]
                  | join("\n")
                )
              }' "$findings_file" > "$payload_file"

            # Bare `gh api`, and one of the two calls in this workflow that deliberately does not go
            # through `call-github-api.sh`. Every read there may be repeated because asking twice
            # returns the same answer; this creates a record. A reply lost in transit after the
            # review was already accepted would, on a retry, publish a second review of the same
            # pass — and since the per-pull-request ceiling counts submitted reviews, spend a second
            # automatic pass on one push. A submission that fails leaves the run red with the cause
            # in the log, which is the outcome to keep.
            gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews" \
              --method POST --input "$payload_file" --silent

            # The verdict is stated here rather than derived again downstream, because this is the
            # only place that knows a review was actually published: every branch above returns
            # without one, and the job that records it on the board must not move an item on the
            # strength of a review that was never posted.
            echo 'verdict=approved' >> "$GITHUB_OUTPUT"

            echo 'Approved: the review found nothing above the bar.'
            exit 0
          fi

          # A P3 never withholds approval, at any pass. A P1 breaks something and a P2 is owed by a
          # rule, so either holds the change however late it arrives; a P3 is paid for later by
          # definition, and holding a change for one spends a round on work its own severity says can
          # wait. The findings are still published — as inline comments under the approval, where the
          # thread-resolution rule the `main` ruleset carries still makes each one answerable — so
          # nothing is hidden and nothing is postponed silently. What changes is only which verdict
          # they arrive under.
          #
          # This used to start at the fourth pass, on the reasoning that an early P3 was worth one
          # round. The measurement says it was not worth the rule: across 106 published reviews on 36
          # pull requests, 72 withheld approval and exactly **one** of them carried nothing but P3
          # findings. What the threshold actually bought was a rule with two states to reason about,
          # a pass counter threaded into the submission, and a verdict that depended on which round a
          # finding happened to be noticed in — for one review. P3s themselves are not rare (95 of
          # 326 findings), which is the other half of the reading: they arrive beside P1s and P2s,
          # where the verdict was never theirs to decide anyway.
          #
          # What this does not change is that the finding is reported. A P3 is a thread the author
          # answers and resolves like any other, and the ceiling on findings still applies to it.
          verdict_event='COMMENT'
          verdict_heading='# NEEDS CHANGES'
          verdict_output='changes_requested'
          settled_note=''

          if [[ "$(jq '[(.findings // [])[] | select(.severity != "P3")] | length' "$findings_file")" == '0' ]]; then
            verdict_event='APPROVE'
            verdict_heading='# APPROVED'
            verdict_output='approved'
            settled_note='Nothing above P3 is left, so the change is approved carrying the findings below rather than held for them.'
          fi

          # Anchors are checked against the same patches the reviewer was given, so a line that has
          # since moved cannot make the API reject the whole review. A finding whose anchor does not
          # survive is not discarded; it moves into the body, where it still reaches the author.
          #
          # A finding that never had an anchor takes the same path deliberately. Some defects are
          # properties of the change rather than of a line — a body that claims something the diff
          # does not do, an issue the change closes without finishing — and the reviewer writes those
          # with a null `path`. Routing them here rather than into the summary is what makes them
          # count: the verdict is decided by whether `findings` is empty, so a concern that lived
          # only in the summary would arrive under an `APPROVED` heading.
          #
          # Every finding is rendered here rather than by the reviewer, from the separate fields it
          # wrote. A thread then always answers the same three questions in the same order — what
          # breaks, what to change, and which rule says so — so an author reading a column of them
          # can skip to the part they need instead of parsing a paragraph per finding, and a
          # reviewer that skipped a field leaves a visible gap rather than a plausible-looking
          # sentence. The same rendering serves the unanchored findings in the body, so a finding
          # does not change shape because its line moved.
          jq --slurpfile lines "$REVIEW_DIRECTORY/lines.json" \
             --arg commit "$HEAD_SHA" \
             --arg truncation "$(cat "$REVIEW_DIRECTORY/truncation.txt")" \
             --arg coverage "$(cat "$COVERAGE_FILE" 2>/dev/null || true)" \
             --arg marker "$TRIGGER_MARKER" \
             --arg event "$verdict_event" \
             --arg heading "$verdict_heading" \
             --arg settled "$settled_note" '
            def allowed($path): $lines[0] | map(select(.filename == $path)) | .[0].lines // [];
            def anchored($finding):
              (allowed($finding.path) | index($finding.line)) != null
              and (($finding.start_line == null)
                   or ((allowed($finding.path) | index($finding.start_line)) != null));

            def details($finding):
              (if ($finding.impact // "") == "" then []
               else ["", "**Impact**", "", $finding.impact] end)
              + (if ($finding.correction // "") == "" then []
                 else ["", "**Correction**", "", $finding.correction] end)
              + (if ($finding.rule // "") == "" then []
                 else ["", "**Rule** — \($finding.rule)"] end);

            # The counts are stated here rather than by the reviewer, because a tally written by
            # hand can disagree with the threads that were actually posted. A severity outside the
            # three the prompt defines counts toward the total rather than vanishing from it, so a
            # reviewer that invented one leaves a visible discrepancy instead of a shorter tally.
            def tally($findings):
              (["P1", "P2", "P3"]
               | map(. as $severity
                     | ($findings | map(select(.severity == $severity)) | length) as $count
                     | select($count > 0)
                     | "\($severity): \($count)")) as $counted
              | if ($counted | length) == 0
                then "\($findings | length)"
                else ($counted | join(", ")) end;

            (.findings // [])[0:20] as $findings
            | ($findings | map(select(anchored(.)))) as $kept
            | ($findings - $kept) as $dropped
            | {
                commit_id: $commit,
                event: $event,
                body: (
                  [$heading, ""]
                  + [(.summary // "")]
                  + ["", "**Findings** — \(tally($findings))"]
                  + (if $settled == "" then [] else ["", $settled] end)
                  + (if $truncation == "" then [] else ["", $truncation] end)
                  + (if $coverage == "" then [] else ["", $coverage] end)
                  + (if ($dropped | length) == 0 then [] else
                      ["", "### Findings with no line to sit on"]
                      + ($dropped
                         | map(["",
                                "**\(.severity) — \(.title)**"
                                + (if (.path // "") == "" then "" else " — `\(.path)`" end)]
                               + details(.))
                         | add)
                    end)
                  + ["", $marker]
                  | join("\n")
                ),
                comments: ($kept | map(
                  {
                    path,
                    line,
                    side: "RIGHT",
                    body: (["**\(.severity) — \(.title)**"] + details(.) | join("\n"))
                  }
                  + (if .start_line == null then {} else {start_line, start_side: "RIGHT"} end)
                ))
              }' "$findings_file" > "$payload_file"

          # The second of the two submissions, excluded from the retry helper for the reason the
          # approval above gives: it creates a review rather than reading one.
          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews" \
            --method POST --input "$payload_file" --silent

          echo "verdict=${verdict_output}" >> "$GITHUB_OUTPUT"

          printf 'Posted a %s review with %s inline findings.\n' \
            "$verdict_event" "$(jq -r '.comments | length' "$payload_file")"

      # What this run cost and covered, as numbers a later run can be compared against.
      #
      # It exists because the adjustments to this workflow could not be told apart. `--effort` moved
      # to `xhigh` and back, the reading was narrowed, the settling threshold was added — and each
      # was judged by wall-clock duration on whichever pull requests happened to be open that day,
      # which is why the readings came back mixed: duration here is a function of how many files the
      # change has, and nothing recorded that alongside it. The action's own execution log is never
      # published, so this is the whole of what a run leaves behind.
      #
      # Numbers only. No summary, no finding, no path, no prose from any session — a metrics file
      # that carried model text would be a copy of the review in an artifact nobody redacts, and the
      # severities below are counts rather than the findings they count.
      - name: Record what the run cost
        if: ${{ !cancelled() && needs.collect.result == 'success' }}
        shell: bash
        env:
          REVIEW_DIRECTORY: ${{ runner.temp }}/review
          METRICS_DIRECTORY: ${{ runner.temp }}/metrics
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
          FINDINGS: ${{ steps.review.outputs.structured_output }}
          MODEL: ${{ needs.decide.outputs.model }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
          GROUP_COUNT: ${{ needs.collect.outputs.group_count }}
          CHANGED_FILES: ${{ needs.collect.outputs.changed_files }}
          COVERAGE_READ: ${{ steps.coverage.outputs.coverage_read }}
          COVERAGE_REPORTS: ${{ steps.coverage.outputs.coverage_reports }}
          AUTOMATIC_REVIEWS: ${{ needs.decide.outputs.automatic_reviews }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          VERDICT: ${{ steps.submit.outputs.verdict }}
        run: |
          set -euo pipefail

          mkdir -p "$METRICS_DIRECTORY"

          findings_file="$(mktemp)"
          printf '%s' "$FINDINGS" > "$findings_file"

          # The readers' own numbers, or none where every reader failed. `compgen` rather than
          # letting the glob reach `jq` unmatched, which would hand it a literal `metrics-*.json`
          # and fail the step over a file that was never expected to exist.
          readers_file="$(mktemp)"
          if compgen -G "$REVIEW_DIRECTORY/candidates/metrics-*.json" > /dev/null; then
            jq -s '.' "$REVIEW_DIRECTORY"/candidates/metrics-*.json > "$readers_file"
          else
            echo '[]' > "$readers_file"
          fi

          # A run that produced no answer still records everything else it did. The severities are
          # then absent rather than zero, which is the honest reading: nobody counted them.
          severities='null'
          if [[ -s "$findings_file" ]] && jq -e '.' "$findings_file" > /dev/null 2>&1; then
            severities="$(jq -c '[(.findings // [])[] | .severity]
                                 | group_by(.) | map({key: .[0], value: length}) | from_entries' \
                            "$findings_file")"
          fi

          jq -n \
            --arg model "$MODEL" \
            --arg head_sha "$HEAD_SHA" \
            --arg outcome "$REVIEW_OUTCOME" \
            --arg verdict "${VERDICT:-none}" \
            --argjson pull_request "$PULL_REQUEST_NUMBER" \
            --argjson automatic_reviews "${AUTOMATIC_REVIEWS:-0}" \
            --argjson changed_files "${CHANGED_FILES:-0}" \
            --argjson groups "${GROUP_COUNT:-0}" \
            --argjson reports "${COVERAGE_REPORTS:-0}" \
            --argjson covered "${COVERAGE_READ:-0}" \
            --argjson severities "$severities" \
            --slurpfile readers "$readers_file" \
            --argjson judge "$(jq '[.[] | select(.type == "result")] | last
                                   | {duration_ms: .duration_ms, turns: .num_turns}
                                   | if . == null then {} else . end' \
                                "$EXECUTION_FILE" 2>/dev/null || echo '{}')" \
            '{pull_request: $pull_request, head_sha: $head_sha, model: $model,
              automatic_reviews: $automatic_reviews, changed_files: $changed_files,
              groups: $groups, reader_reports: $reports, files_covered: $covered,
              readers: $readers[0], judge: $judge, outcome: $outcome, verdict: $verdict,
              findings_by_severity: $severities}' \
            > "$METRICS_DIRECTORY/run.json"

          cat "$METRICS_DIRECTORY/run.json"

      - name: Publish what the run cost
        if: ${{ !cancelled() && needs.collect.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: fathom-review-metrics
          path: ${{ runner.temp }}/metrics
          if-no-files-found: warn
          # Longer than the inputs and the candidates, which are consumed inside the run, because
          # this is read across runs: comparing a week of them is what the file is for.
          retention-days: 30

  # The verdict as the board reads it. `Status` is the lifecycle field the owner's views group by,
  # and until this job existed the two values a review decides had no writer at all: the built-in
  # `Code changes requested` workflow fires on a review submitted as `REQUEST_CHANGES`, which
  # nothing here produces — this reviewer submits `COMMENT` on purpose so that it cannot block a
  # merge, and GitHub does not let the author of a pull request request changes on their own. So the
  # column that says whether a change is waiting on the owner or on the agent answering it was
  # decided by a run whose conclusion reached the board through nobody.
  #
  # It is a job of its own rather than a step after the submission, for the credential. Writing a
  # field on a user-owned project needs a classic token with the `project` scope — no GitHub App
  # permission covers one and no fine-grained token carries the scope — and that scope is
  # account-wide. Keeping it in a job that checks out nothing from the branch, runs no model, and
  # receives the verdict as a string is what bounds where it can be read: the reviewer session never
  # shares a runner with it.
  #
  # Without the secret the job says so and ends green. The board write is then enabled by adding the
  # token rather than by another change to this file, and a fork's pull request — which reaches this
  # workflow only when a maintainer labels it — moves the board exactly as the owner's own does.
  board:
    name: Record the verdict on the board
    needs:
      - decide
      - judge
    # A verdict exists only where a review was published, so this asks the one question that
    # separates a run that concluded something from a run that ended for any of the other reasons
    # the submission step returns on. `!cancelled()` is what lets it still run after a reviewer that
    # failed *after* posting findings — that verdict is real and the board should carry it.
    if: ${{ !cancelled() && needs.judge.outputs.verdict != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # For `collect-closing-issues.sh` alone, from the base commit for the reason every other read
      # of this repository in this file is: the branch under review must not supply the code that
      # decides which issues its own merge closes.
      - name: Check out the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Move the issues this pull request closes
        id: board
        shell: bash
        env:
          # The workflow token reads the pull request body; the board token is used for the project
          # calls and nothing else, so the account-wide credential is named on each command that
          # cannot be made without it rather than on the whole step.
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ secrets.BOARD_PROJECT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ needs.decide.outputs.pull_request_number }}
          VERDICT: ${{ needs.judge.outputs.verdict }}
          # The board is the owner's rather than an organization's, which is the whole reason the
          # credential above is what it is. The number belongs to that login's namespace.
          BOARD_OWNER: Krzysztof318
          BOARD_NUMBER: '4'
          STATUS_FIELD: Status
          # The same script the collection step runs, so which issues this change closes is one
          # answer rather than two that can drift apart.
          CLOSING_ISSUES_SCRIPT: ${{ github.workspace }}/.github/pull-request/collect-closing-issues.sh
          CLOSING_ISSUE_LIMIT: '5'
          # The walk itself — collect what the pull request closes, resolve the field, move each
          # item — is shared with the job that announces the review and with `Apply pull request
          # rules`, because those writes differ only in the value and in the statuses they may act
          # on.
          BOARD_STATUS_SCRIPT: ${{ github.workspace }}/.github/pull-request/write-board-status.sh
          # The two values a review decides, and the two this job refuses to write over. `Done` is
          # the merge and the close, so a verdict arriving after one must not drag a finished item
          # back into review. `Blocked` is the one status a hand writes: it says the issue is
          # waiting on something outside the project, which a review verdict does not answer, and
          # overwriting it would erase the only statement on the board that nothing here can derive.
          APPROVED_STATUS: Ready to merge
          CHANGES_REQUESTED_STATUS: Changes requested
          PRESERVED_STATUSES: Done,Blocked
        run: |
          set -euo pipefail

          case "$VERDICT" in
            approved) status="$APPROVED_STATUS" ;;
            changes_requested) status="$CHANGES_REQUESTED_STATUS" ;;
            *)
              echo "::notice::The review published no verdict this run, so the board is unchanged."
              exit 0
              ;;
          esac

          "$BOARD_STATUS_SCRIPT" "$status" "$PRESERVED_STATUSES"
