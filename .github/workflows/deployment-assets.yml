name: Deployment assets

# Manual dispatch only, deliberately, and for the same reason the integration suite is: it builds two
# architectures of the image, brings the Compose deployment up, and creates a real kind cluster to install
# the chart into. That is minutes of runner time on a change that usually touches neither. Nothing here
# publishes: no registry credential is available to this workflow, and the release channels are #156's.
#
# The cheap half — everything scripts/verify-deployment-assets.sh can decide by reading the files — runs
# in the implementation loop instead, where a developer touching deploy/ gets the verdict in seconds.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to verify'
        required: false
        type: string
      scope:
        description: 'Which deployment shapes to smoke'
        required: false
        default: all
        type: choice
        options:
          - all
          - compose
          - kubernetes

concurrency:
  # One run at a time per ref. Both smokes name their project, their volume, and their cluster
  # deterministically, so two concurrent runs on one runner would tear down each other's state.
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployment-assets:
    name: Deployment assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      # The static half first, because it is seconds rather than minutes: a moving base-image tag or a schema
      # that stopped rejecting a nightly fails before anything is built.
      - name: Verify deployment assets
        run: bash scripts/verify-deployment-assets.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No QEMU step, deliberately. The application is published as portable IL on the build platform, so the
      # per-architecture stages only pull a base image and copy into it — nothing executes under emulation, and a
      # matrix that needed it would be paying minutes for a result this arrangement gets for free.
      # The version and the revision are supplied rather than defaulted, so this build produces the same self-identifying
      # image a release build would. It publishes nothing: naming an artifact and pushing one are separate, and pushing
      # belongs to #156.
      - name: Build the image for linux/amd64 and linux/arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target runtime \
            --file deploy/docker/Dockerfile \
            --build-arg "IMAGE_VERSION=$(bash scripts/read-declared-version.sh)" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha,scope=runtime \
            --cache-to type=gha,mode=max,scope=runtime \
            .

      - name: Create an ephemeral Kubernetes cluster
        if: inputs.scope != 'compose'
        uses: helm/kind-action@v1
        with:
          cluster_name: mailfathom-smoke
          # The script creates and deletes its own cluster; this step only installs kind and kubectl onto the runner.
          install_only: true

      # Starts the deployment for real: the image runs unprivileged on a read-only root filesystem, reads its
      # mounted configuration, resolves its mounted secret, reaches the database, and then refuses to serve
      # against a schema no reviewed artifact has applied yet. #126 owns that artifact and the step that runs it.
      - name: Smoke the deployment
        run: bash scripts/smoke-deployment.sh ${{ inputs.scope || 'all' }}
