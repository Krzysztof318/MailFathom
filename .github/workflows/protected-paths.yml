name: Protected paths

# Five directories decide how every other change is judged rather than being judged by it, which is
# what makes them one set:
#
#   `.github/`         who has to approve a change, which checks the `main` ruleset waits for, and
#                      which dependency updates open themselves
#   `.config/`         which API calls the build bans, what the coverage gate demands, which local
#                      tools restore, how the test runner is configured, and which spellings the
#                      typo check accepts
#   `.agents/`         the skills that define the task, review, verification, and completion contract
#   `.claude/`         the tracked entry points to those same skills
#   `docs/decisions/`  the architectural decisions every later change is written to be consistent
#                      with, the templates that shape the next record, and the process that admits
#                      one. An ADR is required reading before architecture, boundaries, persistence,
#                      configuration, or security-sensitive behavior move, so rewriting one moves
#                      what the next change is judged against rather than what the repository does.
#                      `docs/AGENTS.md` and `docs/decisions/README.md` both require the owner's
#                      approval for an ADR; this line is what asks for it before a reviewer does
#
# Six files decide the same thing from wherever they sit, so they are matched by name anywhere in
# the tree rather than at the repository root. A nested copy of each overrides the one above it for
# its own subtree, and that override — a rule relaxed for one directory, quietly — is the part worth
# catching:
#
#   `.editorconfig`     which analyzer and style diagnostics `TreatWarningsAsErrors` turns into build
#                       failures, and the file header IDE0073 requires of every source file
#   `.gitattributes`    how the diff a reviewer reads is produced: text and binary classification,
#                       line endings, merge drivers, `export-ignore`. A path reclassified as binary
#                       stops having reviewable content at all
#   `.worktreeinclude`  which gitignored files, local secrets among them, are copied into every
#                       worktree an agent works in
#   `AGENTS.md`         the architecture, conventions, verification gates, and workflow contract every
#                       agent-authored change is written and judged against. It is the same kind of
#                       instruction the skills under `.agents/` carry, written where an agent reads it
#                       first, so protecting one of the two and not the other protects neither
#   `CLAUDE.md`         the tracked entry point to those same instructions, which is what `.claude/`
#                       is to `.agents/`
#   `Directory.Build.props`
#                       the analyzer and warning policy every project beneath it inherits, and the
#                       SPDX and copyright metadata that ships inside the assemblies. It is matched by
#                       name rather than at one path because each stack owns one — `backend/` has the
#                       .NET build contract, and a second stack's copy decides the same thing for its
#                       own subtree
#
# The remaining entries are single repository-root files, matched whole. Each is either written by
# one deliberate flow, so every other edit to it is out of band, or states terms and pins that the
# rest of the repository is built and distributed against:
#
#   `CHANGELOG.md`            what a published release claims it shipped. It is written by the
#                             release pull request alone — the one whose merge commit is tagged and
#                             pushed to the container registries — so an edit arriving through
#                             ordinary work is, by construction, out of band. This job is what makes
#                             that visible while it is still a diff.
#   `CLA.md`                  the terms every contribution arrives under, and the clause that keeps
#                             MailFathom's own licensing decision available. A change narrowing it —
#                             the relicensing grant, the patent termination, the statement that the
#                             code was the contributor's to give — would be a change to what this
#                             repository may do with everything merged after it, proposed by
#                             somebody it would bind
#   `LICENSE`                 the grant MailFathom is distributed under. GitHub detects it by
#                             matching the file against the known AGPL-3.0 text, so any edit at all
#                             turns a detected `AGPL-3.0` into `NOASSERTION`
#   `NOTICE`                  the original-author attribution, which AGPL-3.0 section 7(b) permits a
#                             distribution to require be preserved
#   `NuGet.config`            which feeds a package may come from. It clears the inherited source
#                             list, so adding a source is a supply-chain and licensing decision
#                             rather than a configuration tweak
#   `Version.props`           the declared version every build is stamped with and every artifact is
#                             named after. It sits at the root because every stack imports it, so an
#                             edit here moves the number the whole product reports
#   `global.json`             the SDK pin every build, every gate, and every CI run resolves against
#
# A pull request that edits any of them is editing the gate it has to pass, the terms the project is
# published under, or the record a release stands on, so the repository owner is the only human author
# for whom that is ordinary work. The owner is whoever administers the repository, read from the
# permission the author holds on it rather than from the name of the account it belongs to; the step
# below carries why. `CODEOWNERS` says this to the reviewer; this job says it to the
# author, within seconds of the push and without a reviewer having to notice. One automated author is
# recognised beside the owner, for `.github/workflows/` alone; the step below carries the exception
# and the argument for why it removes a signal rather than an approval.
#
# The refusal is a first answer rather than a last one. Once the owner has read such a change and
# wants it, their approving review of the pull request's current head clears the check, which is why
# the job also runs when a review is submitted or dismissed. The approval names a commit, so the next
# push leaves it naming an older one and the check refuses again until the owner approves what
# arrived. That is the review the `main` ruleset already asks for, so accepting a change costs the
# owner no second step, and it keeps the merge inside the queue rather than bypassing the ruleset.
#
# Whichever way it decides, the job names the protected files the pull request touched, in the step
# log and in the job summary. The refusal needs that list to be actionable, and the pass needs it
# just as much: the owner is allowed to change these paths, not expected to have meant to, and an
# `.editorconfig` that arrived with a rebase is only visible if something says so.
#
# One case produces no list at all, because the changed-files endpoint stops at 3000 entries. It is
# refused for every author the list decides a verdict for, and allowed for the owner, for whom it
# decides none — the step says which of the two happened rather than passing or failing in silence.
#
# It is not a security boundary on its own. A `pull_request` run uses the workflow file as the pull
# request would leave it, so a change to this file changes the check that judges it. The pair is what
# holds: weakening the check means editing `.github/`, and a fork's pull request doing that cannot
# merge without a maintainer's approval, because `Fathom review` never approves one; and deleting or
# renaming this job leaves the required check permanently unreported, which the ruleset
# refuses to merge past. Both ways out are closed; neither of them is closed by this file alone.
#
# The set is a list rather than a pattern because each entry was added for a reason that had to be
# stated. A directory joins it when a change to it decides what the repository enforces on every
# other change; a dotted directory is not protected merely for being dotted, and `docs/decisions/`
# is the entry showing that a directory is not excluded merely for holding prose. A file joins it
# only when it is written by one deliberate flow and every other edit to it is out of band.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main
  # The owner's approval of the current head is the one thing besides a push that changes the verdict.
  # GitHub offers no branch filter for this event, and a run for a pull request against another base
  # reports a check nothing requires.
  pull_request_review:
    types:
      - submitted
      - dismissed
  # Who wrote a change is a property of the pull request, not of the tree the queue combines it into,
  # so the merge queue is handed the verdict the pull request's head already earned rather than a
  # second judgement. The queue admits no pull request whose required checks have not passed, so this
  # repeats a fact; it is here because a required check the queue never receives is one it waits on
  # until it gives up.
  merge_group:
    types:
      - checks_requested

# No `paths` filter, for the reason `ci.yml` records: GitHub instantiates no run for a workflow a path
# filter excluded, and a required check that was never created never arrives. This job takes seconds
# on a pull request that touches nothing protected, so it always runs and decides inside instead.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protected-paths:
    # No `if` condition of any kind, including the draft guard `ci.yml`'s expensive jobs carry. This
    # job costs seconds, and a required check that only starts reporting once a pull request is
    # marked ready withholds the one fact it exists to surface early.
    name: Protected paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The changed-file query reads the pull request through the REST API and never checks the
      # branch out, so this is the whole privilege it needs.
      pull-requests: read
      # On a merge group, the check run the pull request's head already carries.
      checks: read
    steps:
      # The queue names the pull request in its branch, `gh-readonly-queue/<base>/pr-<number>-<sha>`,
      # and that is the only place a merge group says which one it is.
      - name: Carry the verdict the pull request's head earned
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          CHECK_NAME: Protected paths
        run: |
          set -euo pipefail

          pull_request_number="$(sed -nE 's|^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$MERGE_GROUP_HEAD_REF")"
          if [[ -z "$pull_request_number" ]]; then
            echo "::error::The merge group ref ${MERGE_GROUP_HEAD_REF} names no pull request."
            exit 1
          fi

          head_sha="$(gh api "repos/${REPOSITORY}/pulls/${pull_request_number}" --jq '.head.sha')"
          conclusion="$(
            gh api --method GET "repos/${REPOSITORY}/commits/${head_sha}/check-runs" \
              -f check_name="$CHECK_NAME" -f filter=all -f per_page=100 \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // empty'
          )"

          if [[ "$conclusion" != 'success' ]]; then
            echo "::error::${CHECK_NAME} on pull request #${pull_request_number}'s head ${head_sha:0:12} is '${conclusion:-missing}', not 'success'."
            exit 1
          fi

          echo "${CHECK_NAME} passed on pull request #${pull_request_number}'s head ${head_sha:0:12}."

      - name: Verify who changed the repository configuration
        if: github.event_name != 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A review event carries a shorter pull request that has no file count, so the step reads
          # one when this arrives empty.
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          if [[ -z "$CHANGED_FILE_COUNT" ]]; then
            CHANGED_FILE_COUNT="$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq '.changed_files')"
          fi
          # Bash arithmetic reads an empty or non-numeric value as zero, which would wave a pull
          # request past the ceiling below rather than refuse it.
          if [[ ! "$CHANGED_FILE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::The number of files this pull request changes could not be read, so its protected paths cannot be verified."
            exit 1
          fi

          protected_prefixes=('.github/' '.agents/' '.claude/' '.config/' 'docs/decisions/')
          protected_names=(
            '.editorconfig'
            '.gitattributes'
            '.worktreeinclude'
            'AGENTS.md'
            'CLAUDE.md'
            'Directory.Build.props'
          )
          protected_files=(
            'CHANGELOG.md'
            'CLA.md'
            'LICENSE'
            'NOTICE'
            'NuGet.config'
            'Version.props'
            'global.json'
          )
          protected_paths="${protected_prefixes[*]} ${protected_names[*]} ${protected_files[*]}"
          reportable_file_limit=3000

          # The owner is whoever administers the repository, and that is read rather than inferred
          # from the account the repository belongs to. `github.repository_owner` names a person only
          # while a personal account holds the repository; under an organization it names the
          # organization, which never authors a pull request, so a comparison against it would refuse
          # the owner everything. `admin` is also the role the `main` ruleset names as its bypass
          # actor, which keeps this check and the ruleset agreeing on who that is.
          #
          # A read that failed is not an answer, and an author nobody could vouch for is not the
          # owner; the warning is what keeps that from reading as a verdict about the author. The
          # answer is resolved once, here, because both the ceiling below and the verdict at the end
          # of this step read it.
          authored_by_owner='no'
          if author_permission="$(
            gh api "repos/${REPOSITORY}/collaborators/${PULL_REQUEST_AUTHOR}/permission" --jq '.permission'
          )"; then
            if [[ "$author_permission" == 'admin' ]]; then
              authored_by_owner='yes'
            fi
          else
            echo "::warning::The permission ${PULL_REQUEST_AUTHOR} holds on ${REPOSITORY} could not be read, so this pull request is judged as one the repository owner did not author."
          fi

          # The changed-files endpoint stops at 3000 entries, so a larger pull request cannot be shown
          # to leave the protected paths alone. An answer that could not be computed is not an answer
          # that clears this check — for every author whose verdict that answer decides.
          #
          # The owner's it does not. Every protected path is theirs to change, so the enumeration
          # below can only ever tell them *which* ones they touched, and refusing them here withholds
          # that list and blocks the merge without there being a verdict the list could have altered.
          # What is lost is the list, so this says so rather than passing in silence. A tree-wide
          # rename is the change that reaches it: it moves more files than the endpoint reports while
          # touching a protected path only to correct a path written inside one.
          if (( CHANGED_FILE_COUNT > reportable_file_limit )); then
            if [[ "$authored_by_owner" == 'yes' ]]; then
              echo "This pull request changes ${CHANGED_FILE_COUNT} files, more than the ${reportable_file_limit} the changed-files endpoint reports, so the protected paths it touches cannot be listed. The repository owner authored it and every one of those paths is theirs to change, so there is no verdict that list would have decided."
              exit 0
            fi

            echo "::error::This pull request changes ${CHANGED_FILE_COUNT} files, more than the ${reportable_file_limit} the changed-files endpoint reports, so its changes under ${protected_paths} cannot be verified."
            exit 1
          fi

          # `previous_filename` is read alongside `filename`, so moving a file out of the protected
          # directory counts as changing it rather than as adding an unrelated one somewhere else.
          changed_paths="$(
            gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/files?per_page=100" \
              --paginate --jq '.[] | .filename, (.previous_filename // empty)'
          )"

          # Literal matching rather than a regular expression, so the leading dot of each entry is a
          # dot and a sibling whose name merely ends that way is not protected by accident. A
          # prefix ends in `/` and covers that directory and everything beneath it, so a sibling
          # whose name merely begins the same way — `docs/decisions-notes.md` — is not caught. A
          # protected name matches at the repository root or after a `/`, so `docs/.editorconfig` is
          # caught and `docs/my.editorconfig` is not. A protected file is matched whole, so a
          # differently placed file of the same name is not caught and a longer name beginning the
          # same way is not either.
          protected_changes=()
          while IFS= read -r changed_path; do
            for protected_prefix in "${protected_prefixes[@]}"; do
              if [[ "$changed_path" == "${protected_prefix}"* ]]; then
                protected_changes+=("$changed_path")
                continue 2
              fi
            done
            for protected_name in "${protected_names[@]}"; do
              if [[ "$changed_path" == "$protected_name" || "$changed_path" == *"/${protected_name}" ]]; then
                protected_changes+=("$changed_path")
                continue 2
              fi
            done
            for protected_file in "${protected_files[@]}"; do
              if [[ "$changed_path" == "$protected_file" ]]; then
                protected_changes+=("$changed_path")
                continue 2
              fi
            done
          done <<< "$changed_paths"

          # A rename reports two paths, and a pull request that both edits and moves a file within a
          # protected directory reports the same path twice, so the list is deduplicated before it is
          # counted or printed.
          if (( ${#protected_changes[@]} > 0 )); then
            mapfile -t protected_changes < <(printf '%s\n' "${protected_changes[@]}" | sort --unique)
          fi

          if (( ${#protected_changes[@]} == 0 )); then
            echo "This pull request changes nothing under ${protected_paths}."
            exit 0
          fi

          # The list goes to the job summary as well as to the log, so the paths are readable from
          # the pull request's checks tab without expanding a step.
          {
            echo "### Protected paths this pull request changes"
            echo
            printf -- '- `%s`\n' "${protected_changes[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "This pull request changes ${#protected_changes[@]} protected path(s):"
          printf '  %s\n' "${protected_changes[@]}"

          if [[ "$authored_by_owner" == 'yes' ]]; then
            echo "The repository owner authored this pull request, so those changes are allowed."
            exit 0
          fi

          # The owner accepts somebody else's change by approving it. A reviewer's verdict is their
          # newest review that approved, requested changes, or was dismissed — a comment leaves an
          # earlier verdict standing, exactly as GitHub reads it — and it counts here only when it is
          # an approval of the head this run is judging, from an account administering the
          # repository. Reviews arrive oldest first, so the last line per reviewer is that verdict.
          # A read that failed approves nothing, and the warning says so.
          approving_owner=''
          if reviews="$(
            gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews?per_page=100" --paginate \
              --jq '.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                    | "\(.user.login) \(.state) \(.commit_id)"'
          )"; then
            declare -A verdict_by_reviewer=()
            while read -r reviewer state commit_id; do
              [[ -n "$reviewer" ]] && verdict_by_reviewer["$reviewer"]="${state} ${commit_id}"
            done <<< "$reviews"

            for reviewer in "${!verdict_by_reviewer[@]}"; do
              [[ "${verdict_by_reviewer[$reviewer]}" == "APPROVED ${HEAD_SHA}" ]] || continue
              if reviewer_permission="$(
                gh api "repos/${REPOSITORY}/collaborators/${reviewer}/permission" --jq '.permission'
              )" && [[ "$reviewer_permission" == 'admin' ]]; then
                approving_owner="$reviewer"
                break
              fi
            done
          else
            echo "::warning::The reviews on this pull request could not be read, so no approval from the repository owner was found."
          fi

          if [[ -n "$approving_owner" ]]; then
            echo "The repository owner ${approving_owner} approved this pull request's head ${HEAD_SHA:0:12}, so those changes are allowed."
            exit 0
          fi

          # Dependabot is the one other author this check recognises, and it is recognised for
          # `.github/workflows/` alone. This repository configures no version updates, so that
          # author appears only when the owner acts on an advisory through the repository's
          # `Dependabot security updates` setting; a pull request arriving that way against an
          # action edits a workflow by definition, and without this it would arrive permanently
          # unmergeable against a required check.
          #
          # What the exception removes is one author-side signal — *you are editing the gate you
          # have to pass* — from an author that cannot read it. It removes no approval. The `main`
          # ruleset still requires an approving review on this pull request like on any other, and
          # `Required CI` still has to pass. A human contributor's verdict is unchanged, because
          # `user.login` is set by GitHub when the pull request is created and nothing in a
          # contribution can set it to this value.
          #
          # The path condition is what keeps this from meaning *this author may change anything*. An
          # action's version lives in `.github/workflows/`; a pull request arriving under this login
          # and proposing an ADR, a skill, or the license is not a dependency update whatever it
          # calls itself, and this author reaching a different protected path would be a second
          # argument to make rather than one this exception already made.
          if [[ "$PULL_REQUEST_AUTHOR" == 'dependabot[bot]' ]]; then
            outside_the_workflows=()
            for protected_change in "${protected_changes[@]}"; do
              if [[ "$protected_change" != .github/workflows/* ]]; then
                outside_the_workflows+=("$protected_change")
              fi
            done

            if (( ${#outside_the_workflows[@]} == 0 )); then
              echo "Dependabot authored this pull request and it changes nothing protected outside .github/workflows/, so those changes are allowed."
              exit 0
            fi

            echo "::error::This pull request is authored by ${PULL_REQUEST_AUTHOR} and changes ${#outside_the_workflows[@]} protected path(s) outside .github/workflows/: ${outside_the_workflows[*]}. The dependency updater is recognised for the workflows alone; anything else it proposes is the repository owner's to make, or to approve on this head."
            exit 1
          fi

          # A `file=` annotation attaches each path to its own entry in the pull request's Files
          # changed view, so the refusal is readable where the change is read rather than only in the
          # step log.
          for protected_change in "${protected_changes[@]}"; do
            echo "::error file=${protected_change}::${protected_change} decides how other changes are judged, what the project is published under, or what a release claims it shipped, and only the repository owner may change it in a pull request or approve the change."
          done

          echo "::error::This pull request is authored by ${PULL_REQUEST_AUTHOR} and changes ${#protected_changes[@]} protected path(s): ${protected_changes[*]}. Open that change separately, ask the repository owner to make it, or ask them to approve this head, which clears this check."
          exit 1
