name: CI

# One workflow, because the branch ruleset requires one check. A required check is identified by its
# job name, so two workflows cannot each publish a `Required CI` job without the ruleset becoming
# ambiguous about which one it is waiting for. The expensive jobs stay separate inside this workflow
# and keep the names they had.
#
# What this workflow owns is the pull request: which work a change can affect, whether the pull request
# is a draft, and the one required check. The work itself lives in `build-test-format-and-migrations.yml`, which the
# publishing pipeline calls too — so a release and a nightly are gated on the same build, unit-test,
# coverage, and formatting checks a pull request is, from one definition rather than from a copy.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main
  workflow_dispatch:

# No `paths` filter here, deliberately. GitHub reports a workflow the path filter excluded as neither
# successful nor failed, so a required check never arrives and a documentation-only pull request waits
# forever on a run that was never created. Change detection moved into `detect-changes` below, and the
# expensive jobs skip themselves through `if` conditions instead.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # The changed-file query reads the pull request through the REST API and never checks the branch
    # out, so this is the whole privilege it needs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build == 'true' }}
      format: ${{ github.event_name != 'pull_request' || steps.filter.outputs.format == 'true' }}
      model: ${{ github.event_name != 'pull_request' || steps.filter.outputs.model == 'true' }}
    steps:
      # A manual dispatch has no pull request to compare against, so the filter is skipped and both
      # outputs fall back to `true` above: an explicitly started run always does the work.
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - 'src/**'
              - 'tests/**'
              - '.config/**'
              - '.editorconfig'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'MailFathom.slnx'
              - 'NuGet.config'
              - 'global.json'
            # `dotnet format` without a subcommand runs the whitespace, style, and analyzer passes, so
            # its verdict depends on more than the files it rewrites: the analyzer packages pinned
            # centrally, the properties the shared build files set, the projects the solution lists,
            # and the SDK that supplies the formatter itself. A change to any of those can move the
            # verdict without touching a single C# file, which is why this is not just `src` and
            # `tests`. What stays out has no bearing on formatting: `.config/**` and `NuGet.config`
            # decide what is restored, rejected, run, and measured rather than how anything is
            # written.
            format:
              - 'src/**'
              - 'tests/**'
              - '.editorconfig'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'MailFathom.slnx'
              - 'global.json'
            # Production code is the only thing that can move the EF Core model, so it is the only
            # thing that can leave the committed model snapshot describing a schema no migration
            # produces. Tests do not participate in the model, and documentation cannot. The pins
            # that decide how a snapshot is written are in here too, through `Directory.Packages.props`,
            # because raising the EF Core version can change what the generator emits for an
            # unchanged model.
            model:
              - 'src/**'
              - '.config/dotnet-tools.json'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'Directory.Packages.props'

  # The build, the unit-test and coverage gate, `dotnet format`, and the pending-model-changes check live
  # in `build-test-format-and-migrations.yml`, which the publishing pipeline calls as well. What stays
  # here is the part that is about a pull request: which of them this change can affect, and whether the
  # pull request is still a draft.
  verify:
    name: Verify
    needs:
      - detect-changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-format-and-migrations.yml
    with:
      run-build: ${{ needs.detect-changes.outputs.build == 'true' }}
      run-format: ${{ needs.detect-changes.outputs.format == 'true' }}
      run-model: ${{ needs.detect-changes.outputs.model == 'true' }}

  # The one job here that reads the half of the repository the build, formatting, and model jobs cannot
  # see, and the only one that reports on a draft besides the two that cost seconds. `Detect changes`
  # routes `.github/**`, `docs/**`, `scripts/**`, and `.agents/**` to nothing, because none of them can
  # move a build, a formatting verdict, or the EF Core model. Without this job a pull request touching
  # only those would clear `Required CI` having verified nothing about them, and the contract suite would
  # run only where somebody remembered `scripts/verify-full.sh`.
  #
  # No path filter, and that is the point rather than an omission: the suite asserts the licensing header
  # in every `.yml`, `.sh`, Helm template, and `SKILL.md`, and the `describes:` marker on every page under
  # `docs/`, over the whole tree at once. Narrowing it to the changed files would report green on contracts
  # it never evaluated, which is worse than not running it.
  #
  # No draft condition either, unlike `verify` above. Every pull request here opens as a draft and stays
  # one until the owner asks for review, so a draft-exempt contract check would not run over the interval
  # during which the change is actually being written — which is the whole interval in which a broken
  # contract is cheap to fix. The job costs about a minute, so there is nothing to save by deferring it.
  workflow-contracts:
    name: Workflow contracts
    runs-on: ubuntu-latest
    steps:
      # The default shallow fetch is enough. Every contract that reads this repository rather than a
      # fixture reads its index through `git ls-files` or the file mode git recorded, never its history;
      # the suite builds the repositories whose history it tests under a temporary directory of its own.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Around 40 seconds, and nothing else is provisioned for it: the suite fakes `dotnet` with a symlink
      # to itself, so no SDK, no restore, and no NuGet cache, and it reaches no network. `jq` is the one
      # tool it needs beyond git and bash, and the runner image carries it.
      - name: Run the workflow contracts
        run: bash scripts/test-agent-workflow.sh

  required-ci:
    name: Required CI
    needs:
      - detect-changes
      - verify
      - workflow-contracts
    # `always()` rather than `success() || failure()`, because this job has to report on a run that was
    # cancelled as well as on one whose dependencies were skipped. Anything weaker leaves the required
    # check itself skipped, which is the state this whole arrangement exists to avoid.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The name of this check is the only thing the branch ruleset knows about this workflow, so it
      # must not depend on the event, the changed files, the source branch, or a matrix dimension.
      - name: Verify pipeline results
        shell: bash
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WORKFLOW_CONTRACTS_RESULT: ${{ needs.workflow-contracts.result }}
        run: |
          set -euo pipefail

          verdict=0

          # Change detection decides whether the other jobs were allowed to skip, so a run in which it
          # did not finish knows nothing about the change and cannot clear it.
          require_success() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" ]]; then
              echo "::error::${job_name} ended as '${result}' and must succeed."
              verdict=1
            fi
          }

          # Work the change did not concern reports `skipped`, which is a complete answer rather than a
          # missing one: a documentation-only pull request skips both halves of the verification and the
          # called workflow reports `skipped` as a whole. `failure` and `cancelled` never are.
          require_success_or_skipped() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::${job_name} ended as '${result}'; only 'success' or 'skipped' clear this check."
              verdict=1
            fi
          }

          require_success 'Detect changes' "$DETECT_CHANGES_RESULT"
          require_success_or_skipped 'Verify' "$VERIFY_RESULT"
          # Not `require_success_or_skipped`: the contract job has no `if` and no path filter, so it has
          # no way to skip that is not a job that failed to start.
          require_success 'Workflow contracts' "$WORKFLOW_CONTRACTS_RESULT"

          if [[ "$verdict" -eq 0 ]]; then
            echo "All pull-request checks completed or were not applicable to this change."
          fi

          exit "$verdict"
