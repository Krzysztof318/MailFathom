name: CI

# One workflow, because the branch ruleset requires one check. A required check is identified by its
# job name, so two workflows cannot each publish a `Required CI` job without the ruleset becoming
# ambiguous about which one it is waiting for. The expensive jobs stay separate inside this workflow
# and keep the names they had.
#
# What this workflow owns is the change: which work it can affect, whether the pull request carrying it
# is a draft, and the one required check. The work itself lives in one called workflow per stack —
# `build-test-format-and-migrations.yml` for the server, which the publishing pipeline calls too, so a release and a
# nightly are gated on the same build, unit-test, coverage, and formatting checks a pull request is, from one
# definition rather than from a copy; and `build-test-frontend.yml` for the client. The two stacks share this gate and
# nothing else: separate solutions, separate build contracts, separate package pins, and a change to either that
# cannot reach the other costs nothing in it.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main
  # `main` itself, once a merge has landed there: the build, the unit tests, the coverage gate, the
  # pending-model-changes check, and the workflow contracts. The `main` ruleset requires a branch to be
  # current with `main` before it merges, so a pull request is normally verified against the state its
  # merge produces — but the repository admin role bypasses the ruleset when merging, a break that
  # reached `main` would otherwise first be reported by that night's publication failing its own gate,
  # which names a run at 02:00 rather than the merge that caused it, and *is `main` green right now* is
  # otherwise not a fact that exists anywhere, only one inferred from the last pull request that closed.
  # `CodeQL` watches the branch this way for its own reasons already.
  #
  # No path filter here either, and for a different reason than the pull-request one stated below. That
  # one protects a required check, and nothing waits on a push conclusion, so it does not reach this
  # trigger. What does reach it is `Workflow contracts`, which reads the whole tree and therefore has no
  # path filter to inherit one from: `docs/`, `scripts/`, `.agents/`, `deploy/`, and the root Markdown
  # files are its subject matter rather than paths it can be told to ignore, so a filter naming them
  # would suppress precisely the run most likely to have something to report. Which part of a merge is
  # worth verifying is decided inside the run instead, by the same `Detect changes` job that decides it
  # for a pull request — so a merge moving nothing the build reads costs the contract job's twenty
  # seconds rather than a full build.
  push:
    branches:
      - main
  workflow_dispatch:

# No `paths` filter on the `pull_request` trigger, deliberately. GitHub reports a workflow the path
# filter excluded as neither successful nor failed, so a required check never arrives and a
# documentation-only pull request waits forever on a run that was never created. Change detection moved
# into `detect-changes` below, and the expensive jobs skip themselves through `if` conditions instead.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancellation is a pull-request behavior. There a superseded run is answering about a commit that is no
  # longer the head, which is what the group exists to stop paying for. A push to `main` is the opposite
  # case: every commit there is a state that was merged and that a nightly can be built from, and a run
  # the next merge cancelled would leave that commit carrying a conclusion which reads as a failure
  # everywhere while having verified nothing. Merges in quick succession therefore queue behind each
  # other, and a manual dispatch on `main` — which lands in the same group — queues rather than displacing
  # whichever of the two is running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # The changed-file query reads a pull request through the REST API and a push through git, so the
    # two events need different privileges and the job holds both. Neither exceeds read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.build == 'true' }}
      format: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.format == 'true' }}
      model: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.model == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      helm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.helm == 'true' }}
    steps:
      # Only a push needs a working copy. A pull request is compared through the REST API, which reads
      # none; a push is compared with `git diff` between the commit the branch carried before it and the
      # one it carries now. `fetch-depth: 0` is what puts the first of those in the clone: without it the
      # action fetches that commit by SHA from an origin the next line has just stripped the credentials
      # for, which works only for as long as this repository is public and GitHub keeps serving a bare
      # SHA to an anonymous client. The history is small and the fetch is the same one either way.
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A manual dispatch reaches this job but has neither a pull request to compare against nor a
      # commit the branch carried before it, so the filter is skipped and every output falls back
      # to `true` above: an explicitly started run always does the work.
      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # Empty on a pull request, where the action reads the base from the event and warns that a
          # `base` it will not use was supplied. On a push, naming the branch that was pushed is what
          # selects the comparison this job wants: against the commit `main` carried before the merge,
          # rather than against a merge base with itself.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            build:
              - 'backend/src/**'
              - 'backend/tests/**'
              # The development tooling under `backend/tools/` ships nowhere, but it is in `backend/MailFathom.slnx`
              # and is therefore built, analyzed, and unit-tested by exactly the same gates as everything else. Without
              # this line a change there would compile nowhere before it merged.
              - 'backend/tools/**'
              - '.config/**'
              - '.editorconfig'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Build.targets'
              - 'backend/Directory.Packages.props'
              - 'backend/MailFathom.slnx'
              - 'NuGet.config'
              - 'Version.props'
              - 'global.json'
            # `dotnet format` without a subcommand runs the whitespace, style, and analyzer passes, so
            # its verdict depends on more than the files it rewrites: the analyzer packages pinned
            # centrally, the properties the shared build files set, the projects the solution lists,
            # and the SDK that supplies the formatter itself. A change to any of those can move the
            # verdict without touching a single C# file, which is why this is not just `backend/src` and
            # `backend/tests`. What stays out has no bearing on formatting: `.config/**` and `NuGet.config`
            # decide what is restored, rejected, run, and measured rather than how anything is
            # written.
            format:
              - 'backend/src/**'
              - 'backend/tests/**'
              - 'backend/tools/**'
              - '.editorconfig'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Build.targets'
              - 'backend/Directory.Packages.props'
              - 'backend/MailFathom.slnx'
              - 'global.json'
            # Production code is the only thing that can move the EF Core model, so it is the only
            # thing that can leave the committed model snapshot describing a schema no migration
            # produces. Tests do not participate in the model, and documentation cannot. The pins
            # that decide how a snapshot is written are in here too, through `backend/Directory.Packages.props`,
            # because raising the EF Core version can change what the generator emits for an
            # unchanged model.
            model:
              - 'backend/src/**'
              - '.config/dotnet-tools.json'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'backend/Directory.Packages.props'
            # The client stack, which shares no solution, no build contract, and no package pins with the server —
            # so this filter names nothing under `backend/` and the three above name nothing under `frontend/`, which
            # is what makes a change to one stack cost nothing in the other. What it does name beside `frontend/**`
            # is everything above both stacks that the client build still reads: the SDK and the Uno SDK pin in
            # `global.json`, the version both stacks stamp from `Version.props`, the feeds `NuGet.config` permits, the
            # style rules `.editorconfig` turns into build failures through `EnforceCodeStyleInBuild`, and `.config/`,
            # which holds the banned-symbol list and the test-runner configuration the client's own build contract
            # links into every project.
            frontend:
              - 'frontend/**'
              - '.config/**'
              - '.editorconfig'
              - '.github/workflows/build-test-frontend.yml'
              - '.github/workflows/ci.yml'
              - 'NuGet.config'
              - 'Version.props'
              - 'global.json'
            # The chart, the values documents it is verified with, the manifests those render, and the script that
            # renders them. Nothing outside `deploy/helm/` reaches a rendering: the chart declares no dependency and
            # takes no version from the build — `helm package --app-version` supplies that at release time — so a
            # change to the application cannot move a manifest this job compares.
            helm:
              - 'deploy/helm/**'
              - 'scripts/render-helm-manifests.sh'
              - '.github/workflows/ci.yml'

  # The build, the unit-test and coverage gate, `dotnet format`, and the pending-model-changes check live
  # in `build-test-format-and-migrations.yml`, which the publishing pipeline calls as well. What stays
  # here is the part that is about the event: which of them this change can affect, and whether the pull
  # request carrying it is still a draft.
  #
  # The draft test is the whole condition, because `detect-changes` runs on every event this workflow
  # takes and the ordinary dependency semantics cover the rest: change detection that failed leaves this
  # job knowing nothing about the change, and skipping it is the right outcome. A pull request then fails
  # through the aggregate, which refuses a run whose change detection did not succeed, and a push through
  # the run's own conclusion.
  verify:
    name: Verify
    needs:
      - detect-changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-format-and-migrations.yml
    with:
      # `dotnet format` is the one input that still reads the event. Formatting is a property of the
      # files a change wrote, which is exactly what the pull request that wrote them already answered —
      # and it is the one verdict here that cannot be broken by two changes that merged without seeing
      # each other. The model check can be: one pull request moves the model and another adds the
      # migration, and neither run sees both, which is why that one is asked again on `main`.
      run-build: ${{ needs.detect-changes.outputs.build == 'true' }}
      run-format: ${{ github.event_name != 'push' && needs.detect-changes.outputs.format == 'true' }}
      run-model: ${{ needs.detect-changes.outputs.model == 'true' }}

  # The client stack's build and unit suite, in `build-test-frontend.yml` for the reason the server's work is in a
  # called workflow: the definition is one thing whatever comes to call it. What is here is the same pair of questions
  # the `verify` job above answers — can this change affect the client, and is the pull request carrying it still a
  # draft — with both asked in the job's own condition rather than one of them passed inward, because there is a single
  # job on the other side and nothing for a switch to select between.
  #
  # The draft exemption is the expensive-job rule rather than a copy of the server's: the browser head compiles native
  # WebAssembly assets through Emscripten, which is minutes of runner time on a cold cache, so a draft pays for it at
  # the moment it is marked ready like every other build here. `Workflow contracts` and `Helm chart` are the two jobs
  # that do run for a draft, and their argument — seconds of runner time, nothing installed — is the one this job
  # cannot make.
  frontend:
    name: Frontend
    needs:
      - detect-changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-frontend.yml

  # The one job here that reads the half of the repository the build, formatting, and model jobs cannot
  # see, and the only one that reports on a draft besides the two that cost seconds. `Detect changes`
  # routes `.github/**`, `docs/**`, `scripts/**`, and `.agents/**` to nothing, because none of them can
  # move a build, a formatting verdict, or the EF Core model. Without this job a pull request touching
  # only those would clear `Required CI` having verified nothing about them, and the contract suite would
  # run only where somebody remembered `scripts/verify-full.sh`.
  #
  # No path filter, and that is the point rather than an omission: the suite asserts the licensing header
  # in every `.yml`, `.sh`, Helm template, and `SKILL.md`, the `describes:` marker on every page under
  # `docs/`, and a table-of-contents entry behind every published page and a page behind every entry,
  # over the whole tree at once. Narrowing it to the changed files would report green on contracts it
  # never evaluated, which is worse than not running it.
  #
  # No draft condition either, unlike `verify` above. A draft-exempt contract check would not run over the
  # interval during which the change is actually being written — which is the whole interval in which a
  # broken contract is cheap to fix. The job costs about twenty seconds, so there is nothing to save by
  # deferring it.
  #
  # And no event condition, so a push to `main` runs it too. Every invariant above spans files that
  # different changes own, which makes the tree a merge produces the one tree no pull-request run was
  # ever shown: one pull request deletes a page while another adds the entry naming it, and both are
  # green while `main` is not. That is the argument keeping the model check on a push, applied to the
  # half of the repository the build cannot see.
  workflow-contracts:
    name: Workflow contracts
    runs-on: ubuntu-latest
    steps:
      # The default shallow fetch is enough. Every contract that reads this repository rather than a
      # fixture reads its index through `git ls-files` or the file mode git recorded, never its history;
      # the suite builds the repositories whose history it tests under a temporary directory of its own.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Fifteen seconds on a GitHub-hosted runner, and nothing else is provisioned for it: the suite fakes
      # `dotnet` with a symlink to itself, so no SDK, no restore, and no NuGet cache, and it reaches no
      # network. `jq` is the one tool it needs beyond git and bash, and the runner image carries it. The
      # suite takes rather longer than this on a developer machine, where it is one step of the full gate
      # and competes with everything else running there; the figure above is what the job costs a run,
      # which is the only cost this file is about.
      - name: Run the workflow contracts
        run: bash scripts/test-agent-workflow.sh

  # The deployment contract, which is one of the four public surfaces ADR 0004 names and the one no other job here can
  # see. Until this existed `helm lint` and `helm template` ran for the first time inside `Publish Helm chart` — after
  # the image had been published and with re-tagging a release meaning a registry deletion first — so a chart that
  # stopped rendering was found at the worst moment there is. The release run keeps its own lint and render: a release
  # gate that trusts an earlier run is not a gate.
  #
  # It runs when the change can reach a rendering and skips otherwise, through `Detect changes` rather than a `paths`
  # filter on the trigger, for the reason stated at the top of this file: a filtered-out workflow reports neither
  # success nor failure and the required check never arrives.
  #
  # No draft condition, like `Workflow contracts` and unlike `Verify`. The job installs nothing, restores nothing, and
  # costs seconds rather than the minutes an SDK, a restore, and a build cost, so there is nothing to save by deferring
  # it past the interval in which the chart is actually being written. Helm is the runner image's preinstalled copy,
  # which is what the release run uses as well;
  # the rendering the golden files are compared against is normalized so that the Helm version deciding the whitespace
  # between documents cannot decide the verdict.
  helm-chart:
    name: Helm chart
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the Helm version this run used
        run: helm version --template '{{ printf "Helm %s\n" .Version }}'

      - name: Lint the chart and render it against the committed manifests
        run: bash scripts/render-helm-manifests.sh

  required-ci:
    name: Required CI
    needs:
      - detect-changes
      - verify
      - frontend
      - workflow-contracts
      - helm-chart
    # `always()` rather than `success() || failure()`, because this job has to report on a run that was
    # cancelled as well as on one whose dependencies were skipped. Anything weaker leaves the required
    # check itself skipped, which is the state this whole arrangement exists to avoid.
    #
    # The push exclusion does not weaken that. This job exists to be the `main` ruleset's one required
    # check, and a ruleset evaluates a pull request; on a push there is nothing waiting for a conclusion.
    # The four results it reads all arrive on their own there — each of those jobs runs, and a failed
    # one fails the run, which is what the badge and the Actions list report — so a fifth job restating
    # that verdict under a fifth name would add a check rather than an answer. On every event the
    # ruleset does read, this job runs under exactly this name — which is the invariant the comment
    # below is about.
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # The name of this check is the only thing the branch ruleset knows about this workflow, so it
      # must not depend on the event, the changed files, the source branch, or a matrix dimension.
      - name: Verify pipeline results
        shell: bash
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          WORKFLOW_CONTRACTS_RESULT: ${{ needs.workflow-contracts.result }}
          HELM_CHART_RESULT: ${{ needs.helm-chart.result }}
        run: |
          set -euo pipefail

          verdict=0

          # Change detection decides whether the other jobs were allowed to skip, so a run in which it
          # did not finish knows nothing about the change and cannot clear it.
          require_success() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" ]]; then
              echo "::error::${job_name} ended as '${result}' and must succeed."
              verdict=1
            fi
          }

          # Work the change did not concern reports `skipped`, which is a complete answer rather than a
          # missing one: a documentation-only pull request skips both halves of the verification and the
          # called workflow reports `skipped` as a whole. `failure` and `cancelled` never are.
          require_success_or_skipped() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::${job_name} ended as '${result}'; only 'success' or 'skipped' clear this check."
              verdict=1
            fi
          }

          require_success 'Detect changes' "$DETECT_CHANGES_RESULT"
          require_success_or_skipped 'Verify' "$VERIFY_RESULT"
          # A change that reaches nothing the client build reads skips this one, exactly as a change that reaches no
          # server code skips the job above it.
          require_success_or_skipped 'Frontend' "$FRONTEND_RESULT"
          # A change that reaches no chart file skips this one, which is the same complete answer `Verify` gives a
          # documentation-only change.
          require_success_or_skipped 'Helm chart' "$HELM_CHART_RESULT"
          # Not `require_success_or_skipped`: the contract job has no `if` and no path filter, so it has
          # no way to skip that is not a job that failed to start.
          require_success 'Workflow contracts' "$WORKFLOW_CONTRACTS_RESULT"

          if [[ "$verdict" -eq 0 ]]; then
            echo "All pull-request checks completed or were not applicable to this change."
          fi

          exit "$verdict"
