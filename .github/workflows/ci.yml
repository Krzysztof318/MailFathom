name: CI

# One workflow, because the branch ruleset requires one check. A required check is identified by its
# job name, so two workflows cannot each publish a `Required CI` job without the ruleset becoming
# ambiguous about which one it is waiting for. The expensive jobs stay separate inside this workflow
# and keep the names they had.
#
# What this workflow owns is the change: which work it can affect, whether the pull request carrying it
# is a draft, and the one required check. The work itself lives in `build-test-format-and-migrations.yml`, which the
# publishing pipeline calls too — so a release and a nightly are gated on the same build, unit-test,
# coverage, and formatting checks a pull request is, from one definition rather than from a copy.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main
  # `main` itself, once a merge has landed there, and a deliberately smaller run than a pull request's:
  # the build, the unit tests, the coverage gate, and the pending-model-changes check, which are the
  # questions about the code. The `main` ruleset requires a branch to be current with `main` before it
  # merges, so a pull request is normally verified against the state its merge produces — but the
  # repository admin role bypasses the ruleset when merging, `Nightly` and `Release` both build from
  # `main` without verifying it first, and *is `main` green right now* is otherwise not a fact that
  # exists anywhere, only one inferred from the last pull request that closed. `CodeQL` watches the
  # branch this way for its own reasons already.
  push:
    branches:
      - main
    # A path filter here, and the reason the `pull_request` trigger above cannot have one does not apply.
    # What that reason protects is a required check: a run GitHub never instantiated reports no
    # conclusion, so a pull request would wait forever on it. Nothing waits on a push run — required
    # checks are a pull-request contract — so a run that could only rebuild what the merge cannot have
    # touched is worth not starting at all, and skipping it leaves the branch's last real verdict
    # standing rather than replacing it with one that means less.
    #
    # Everything listed is invisible to `dotnet build`, `dotnet test`, and the EF Core model: prose,
    # specifications, images, the deployment assets no job here renders, the scripts and skills that are
    # the local gate rather than the built one. `.github/**` is deliberately absent, because this
    # workflow and the one it calls decide what the run does.
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - 'assets/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.agents/**'
      - '.claude/**'
      - '*.md'
  workflow_dispatch:

# No `paths` filter on the `pull_request` trigger, deliberately. GitHub reports a workflow the path
# filter excluded as neither successful nor failed, so a required check never arrives and a
# documentation-only pull request waits forever on a run that was never created. Change detection moved
# into `detect-changes` below, and the expensive jobs skip themselves through `if` conditions instead.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancellation is a pull-request behavior. There a superseded run is answering about a commit that is no
  # longer the head, which is what the group exists to stop paying for. A push to `main` is the opposite
  # case: every commit there is a state that was merged and that a nightly can be built from, and a run
  # the next merge cancelled would leave that commit carrying a conclusion which reads as a failure
  # everywhere while having verified nothing. Merges in quick succession therefore queue behind each
  # other, and a manual dispatch on `main` — which lands in the same group — queues rather than displacing
  # whichever of the two is running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Not on a push. Deciding which part of a change to verify is a pull-request question, and on `main`
    # the trigger's `paths-ignore` above has already answered the only version of it that is asked there:
    # either the merge could move the build and the whole of it runs, or it could not and no run exists.
    # A second, finer decision inside the run would only reproduce the first one less legibly.
    if: github.event_name != 'push'
    # The changed-file query reads the pull request through the REST API and never checks the branch
    # out, so this is the whole privilege it needs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build == 'true' }}
      format: ${{ github.event_name != 'pull_request' || steps.filter.outputs.format == 'true' }}
      model: ${{ github.event_name != 'pull_request' || steps.filter.outputs.model == 'true' }}
    steps:
      # A manual dispatch reaches this job but has no pull request to compare against, so the filter is
      # skipped and all three outputs fall back to `true` above: an explicitly started run always does
      # the work.
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - 'src/**'
              - 'tests/**'
              - '.config/**'
              - '.editorconfig'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'MailFathom.slnx'
              - 'NuGet.config'
              - 'global.json'
            # `dotnet format` without a subcommand runs the whitespace, style, and analyzer passes, so
            # its verdict depends on more than the files it rewrites: the analyzer packages pinned
            # centrally, the properties the shared build files set, the projects the solution lists,
            # and the SDK that supplies the formatter itself. A change to any of those can move the
            # verdict without touching a single C# file, which is why this is not just `src` and
            # `tests`. What stays out has no bearing on formatting: `.config/**` and `NuGet.config`
            # decide what is restored, rejected, run, and measured rather than how anything is
            # written.
            format:
              - 'src/**'
              - 'tests/**'
              - '.editorconfig'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'MailFathom.slnx'
              - 'global.json'
            # Production code is the only thing that can move the EF Core model, so it is the only
            # thing that can leave the committed model snapshot describing a schema no migration
            # produces. Tests do not participate in the model, and documentation cannot. The pins
            # that decide how a snapshot is written are in here too, through `Directory.Packages.props`,
            # because raising the EF Core version can change what the generator emits for an
            # unchanged model.
            model:
              - 'src/**'
              - '.config/dotnet-tools.json'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'Directory.Packages.props'

  # The build, the unit-test and coverage gate, `dotnet format`, and the pending-model-changes check live
  # in `build-test-format-and-migrations.yml`, which the publishing pipeline calls as well. What stays
  # here is the part that is about the event: which of them this change can affect, and whether the pull
  # request carrying it is still a draft.
  #
  # `!cancelled()` rather than no condition at all, because `detect-changes` is skipped on a push and a
  # job whose dependency skipped would otherwise skip with it. The `result` test is what keeps that from
  # turning into *runs no matter what*: change detection failing means nothing here knows what the pull
  # request touched, and the aggregate refuses such a run anyway.
  verify:
    name: Verify
    needs:
      - detect-changes
    if: >-
      !cancelled()
      && needs.detect-changes.result != 'failure'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-format-and-migrations.yml
    with:
      # A push to `main` runs the build and the model check unconditionally, and never `dotnet format`.
      # Formatting is a property of the files a change wrote, which is exactly what the pull request that
      # wrote them already answered — and it is the one verdict here that cannot be broken by two changes
      # that merged without seeing each other. The model check can be: one pull request moves the model
      # and another adds the migration, and neither run sees both.
      run-build: ${{ github.event_name == 'push' || needs.detect-changes.outputs.build == 'true' }}
      run-format: ${{ github.event_name != 'push' && needs.detect-changes.outputs.format == 'true' }}
      run-model: ${{ github.event_name == 'push' || needs.detect-changes.outputs.model == 'true' }}

  # The one job here that reads the half of the repository the build, formatting, and model jobs cannot
  # see, and the only one that reports on a draft besides the two that cost seconds. `Detect changes`
  # routes `.github/**`, `docs/**`, `scripts/**`, and `.agents/**` to nothing, because none of them can
  # move a build, a formatting verdict, or the EF Core model. Without this job a pull request touching
  # only those would clear `Required CI` having verified nothing about them, and the contract suite would
  # run only where somebody remembered `scripts/verify-full.sh`.
  #
  # No path filter, and that is the point rather than an omission: the suite asserts the licensing header
  # in every `.yml`, `.sh`, Helm template, and `SKILL.md`, and the `describes:` marker on every page under
  # `docs/`, over the whole tree at once. Narrowing it to the changed files would report green on contracts
  # it never evaluated, which is worse than not running it.
  #
  # No draft condition either, unlike `verify` above. A draft-exempt contract check would not run over the
  # interval during which the change is actually being written — which is the whole interval in which a
  # broken contract is cheap to fix. The job costs about twenty seconds, so there is nothing to save by
  # deferring it.
  #
  # Not on a push, for the reason the whole set of contracts is written the way it is: what it asserts is a
  # property of the repository rather than of a change, so the answer on `main` is the answer the pull
  # request already got over the same tree. What a push run is for is the code, which is the one thing a
  # merge can break without any pull request having been wrong.
  workflow-contracts:
    name: Workflow contracts
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # The default shallow fetch is enough. Every contract that reads this repository rather than a
      # fixture reads its index through `git ls-files` or the file mode git recorded, never its history;
      # the suite builds the repositories whose history it tests under a temporary directory of its own.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Fifteen seconds on a GitHub-hosted runner, and nothing else is provisioned for it: the suite fakes
      # `dotnet` with a symlink to itself, so no SDK, no restore, and no NuGet cache, and it reaches no
      # network. `jq` is the one tool it needs beyond git and bash, and the runner image carries it. The
      # suite takes rather longer than this on a developer machine, where it is one step of the full gate
      # and competes with everything else running there; the figure above is what the job costs a pull
      # request, which is the only cost this file is about.
      - name: Run the workflow contracts
        run: bash scripts/test-agent-workflow.sh

  required-ci:
    name: Required CI
    needs:
      - detect-changes
      - verify
      - workflow-contracts
    # `always()` rather than `success() || failure()`, because this job has to report on a run that was
    # cancelled as well as on one whose dependencies were skipped. Anything weaker leaves the required
    # check itself skipped, which is the state this whole arrangement exists to avoid.
    #
    # The push exclusion does not weaken that. This job exists to be the `main` ruleset's one required
    # check, and a ruleset evaluates a pull request; on a push there is nothing waiting for a conclusion,
    # and two of the three results it reads are skipped by design there, which it would have to be taught
    # to forgive one event at a time. The run's own conclusion is what a push reports through, and
    # `Verify` is the whole of it. On every event the ruleset does read, this job runs under exactly this
    # name — which is the invariant the comment below is about.
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # The name of this check is the only thing the branch ruleset knows about this workflow, so it
      # must not depend on the event, the changed files, the source branch, or a matrix dimension.
      - name: Verify pipeline results
        shell: bash
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WORKFLOW_CONTRACTS_RESULT: ${{ needs.workflow-contracts.result }}
        run: |
          set -euo pipefail

          verdict=0

          # Change detection decides whether the other jobs were allowed to skip, so a run in which it
          # did not finish knows nothing about the change and cannot clear it.
          require_success() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" ]]; then
              echo "::error::${job_name} ended as '${result}' and must succeed."
              verdict=1
            fi
          }

          # Work the change did not concern reports `skipped`, which is a complete answer rather than a
          # missing one: a documentation-only pull request skips both halves of the verification and the
          # called workflow reports `skipped` as a whole. `failure` and `cancelled` never are.
          require_success_or_skipped() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::${job_name} ended as '${result}'; only 'success' or 'skipped' clear this check."
              verdict=1
            fi
          }

          require_success 'Detect changes' "$DETECT_CHANGES_RESULT"
          require_success_or_skipped 'Verify' "$VERIFY_RESULT"
          # Not `require_success_or_skipped`: the contract job has no `if` and no path filter, so it has
          # no way to skip that is not a job that failed to start.
          require_success 'Workflow contracts' "$WORKFLOW_CONTRACTS_RESULT"

          if [[ "$verdict" -eq 0 ]]; then
            echo "All pull-request checks completed or were not applicable to this change."
          fi

          exit "$verdict"
