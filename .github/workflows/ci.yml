name: CI

# One workflow, because the branch ruleset requires one check. A required check is identified by its
# job name, so two workflows cannot each publish a `Required CI` job without the ruleset becoming
# ambiguous about which one it is waiting for. The expensive jobs stay separate inside this workflow
# and keep the names they had.
#
# What this workflow owns is the change: which work it can affect, whether the pull request carrying it
# is a draft, and the one required check. The work itself lives in three called workflows —
# `build-test-format-and-migrations.yml` for the server, `build-test-frontend.yml` for the client, and
# `repository-contracts.yml` for what neither stack's build can see — and the publishing pipeline calls all three, so a
# release and a nightly are gated on the same build, unit-test, coverage, and contract checks a pull request is, from
# one definition rather than from a copy. Formatting is the one verdict no publication asks, for the reason the
# `run-format` switch below carries: a pull request settles it for good. The two stacks share this gate and nothing
# else: separate solutions, separate build contracts, separate package pins, and a change to either that cannot reach
# the other costs nothing in it.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main
  # `main` itself, once a merge has landed there: the build, the unit tests, the coverage gate, the
  # pending-model-changes check, and the workflow contracts. The `main` ruleset requires a branch to be
  # current with `main` before it merges, so a pull request is normally verified against the state its
  # merge produces — but the repository admin role bypasses the ruleset when merging, a break that
  # reached `main` would otherwise first be reported by that night's publication failing its own gate,
  # which names a run at 02:00 rather than the merge that caused it, and *is `main` green right now* is
  # otherwise not a fact that exists anywhere, only one inferred from the last pull request that closed.
  # `CodeQL` watches the branch this way for its own reasons already.
  #
  # No path filter here, and no changed-path narrowing inside the run either. The pull-request reason
  # stated below — a filtered-out workflow reports neither success nor failure, so a required check
  # never arrives — protects a required check, and nothing waits on a push conclusion, so it does not
  # reach this trigger. What replaces it is a stronger reason of its own: what a push is asked is *is
  # `main` green*, and a run that verified the part of the tree this merge happened to touch has not
  # answered that. Two changes that never saw each other are what a merge produces and are what neither
  # of their pull requests could have caught, and the paths one of them moved say nothing about which
  # half of the tree the pair broke. So every job below runs unconditionally on a push, at the cost of a
  # full build per merge, and `Detect changes` answers only the event that has a reason to ask.
  push:
    branches:
      - main
  workflow_dispatch:

# No `paths` filter on the `pull_request` trigger, deliberately. GitHub reports a workflow the path
# filter excluded as neither successful nor failed, so a required check never arrives and a
# documentation-only pull request waits forever on a run that was never created. Change detection moved
# into `detect-changes` below, and the expensive jobs skip themselves through `if` conditions instead.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancellation is a pull-request behavior. There a superseded run is answering about a commit that is no
  # longer the head, which is what the group exists to stop paying for. A push to `main` is the opposite
  # case: every commit there is a state that was merged and that a nightly can be built from, and a run
  # the next merge cancelled would leave that commit carrying a conclusion which reads as a failure
  # everywhere while having verified nothing. Merges in quick succession therefore queue behind each
  # other, and a manual dispatch on `main` — which lands in the same group — queues rather than displacing
  # whichever of the two is running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # The changed-file query reads a pull request through the REST API, which needs the read below and
    # nothing else: no working copy is checked out here, because the one event this job answers is the
    # one the action can answer without one.
    permissions:
      contents: read
      pull-requests: read
    # Skipping work a change cannot affect is a pull request's economy and only a pull request's. On a
    # push to `main` and on a manual dispatch the filter is skipped and every output falls back to
    # `true`: `main` is asked whether the whole tree is green, and an explicitly started run always does
    # the work. The job itself still runs on all three, because the jobs below read its outputs.
    outputs:
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build == 'true' }}
      format: ${{ github.event_name != 'pull_request' || steps.filter.outputs.format == 'true' }}
      model: ${{ github.event_name != 'pull_request' || steps.filter.outputs.model == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
    steps:
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - 'backend/src/**'
              - 'backend/tests/**'
              # The development tooling under `backend/tools/` ships nowhere, but it is in `backend/MailFathom.slnx`
              # and is therefore built, analyzed, and unit-tested by exactly the same gates as everything else. Without
              # this line a change there would compile nowhere before it merged.
              - 'backend/tools/**'
              - '.config/**'
              - '.editorconfig'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Build.targets'
              - 'backend/Directory.Packages.props'
              - 'backend/MailFathom.slnx'
              - 'NuGet.config'
              - 'Version.props'
              - 'global.json'
            # `dotnet format` without a subcommand runs the whitespace, style, and analyzer passes, so
            # its verdict depends on more than the files it rewrites: the analyzer packages pinned
            # centrally, the properties the shared build files set, the projects the solution lists,
            # and the SDK that supplies the formatter itself. A change to any of those can move the
            # verdict without touching a single C# file, which is why this is not just `backend/src` and
            # `backend/tests`. What stays out has no bearing on formatting: `.config/**` and `NuGet.config`
            # decide what is restored, rejected, run, and measured rather than how anything is
            # written.
            format:
              - 'backend/src/**'
              - 'backend/tests/**'
              - 'backend/tools/**'
              - '.editorconfig'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Build.targets'
              - 'backend/Directory.Packages.props'
              - 'backend/MailFathom.slnx'
              - 'global.json'
            # Production code is the only thing that can move the EF Core model, so it is the only
            # thing that can leave the committed model snapshot describing a schema no migration
            # produces. Tests do not participate in the model, and documentation cannot. The pins
            # that decide how a snapshot is written are in here too, through `backend/Directory.Packages.props`,
            # because raising the EF Core version can change what the generator emits for an
            # unchanged model.
            model:
              - 'backend/src/**'
              - '.config/dotnet-tools.json'
              - '.github/workflows/build-test-format-and-migrations.yml'
              - '.github/workflows/ci.yml'
              - 'backend/Directory.Packages.props'
            # The client stack, which shares no solution, no build contract, and no package pins with the server —
            # so this filter names nothing under `backend/` and the three above name nothing under `frontend/`, which
            # is what makes a change to one stack cost nothing in the other. What it does name beside `frontend/**` is
            # everything above both stacks a client build reads: the SDK pin in `global.json`, the version both stacks
            # stamp from `Version.props`, the feeds `NuGet.config` permits, the style rules `.editorconfig` turns into
            # build failures, and `.config/`, which holds the banned-symbol list and the test-runner configuration.
            # The list is kept whole while the client stack carries no build, because it is what the job it gates will
            # read again and `scripts/resolve-changed-stacks.sh` is held to it either way.
            frontend:
              - 'frontend/**'
              - '.config/**'
              - '.editorconfig'
              - '.github/workflows/build-test-frontend.yml'
              - '.github/workflows/ci.yml'
              - 'NuGet.config'
              - 'Version.props'
              - 'global.json'
            # The chart, the values documents it is verified with, the manifests those render, and the script that
            # renders them. Nothing outside `deploy/helm/` reaches a rendering: the chart declares no dependency and
            # takes no version from the build — `helm package --app-version` supplies that at release time — so a
            # change to the application cannot move a manifest this job compares.
            helm:
              - 'deploy/helm/**'
              - 'scripts/render-helm-manifests.sh'
              - '.github/workflows/ci.yml'

  # The build, the unit-test and coverage gate, `dotnet format`, and the pending-model-changes check live
  # in `build-test-format-and-migrations.yml`, which the publishing pipeline calls as well for everything
  # but the formatting pass. What stays here is the part that is about the event: which of them this
  # change can affect, and whether the pull request carrying it is still a draft.
  #
  # It is named after the stack it gates rather than after the act of gating, which is the whole of what
  # `Backend` buys over the `Verify` this job used to be called. A check arrives at a reader as one line —
  # `Backend / dotnet format`, `Frontend / Client stack, which carries no build yet` — and that line is
  # where a skipped job is either read as work the change could not reach or misread as a stack nobody
  # verified. Under the old name the two stacks were not comparable at a glance: `Verify` said which
  # question was asked and never which half of the repository it was asked about, so a client-only change
  # showed a skipped server formatting job beside a green client build and read as the client's formatting
  # having been skipped. Both jobs now carry the stack in front of the question.
  #
  # The draft test is the whole condition, because `detect-changes` runs on every event this workflow
  # takes and the ordinary dependency semantics cover the rest: change detection that failed leaves this
  # job knowing nothing about the change, and skipping it is the right outcome. A pull request then fails
  # through the aggregate, which refuses a run whose change detection did not succeed, and a push through
  # the run's own conclusion.
  backend:
    name: Backend
    needs:
      - detect-changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-format-and-migrations.yml
    with:
      # `dotnet format` is the one input that still reads the event. Formatting is a property of the
      # files a change wrote, which is exactly what the pull request that wrote them already answered —
      # and it is the one verdict here that cannot be broken by two changes that merged without seeing
      # each other. The model check can be: one pull request moves the model and another adds the
      # migration, and neither run sees both, which is why that one is asked again on `main`.
      run-build: ${{ needs.detect-changes.outputs.build == 'true' }}
      run-format: ${{ github.event_name != 'push' && needs.detect-changes.outputs.format == 'true' }}
      run-model: ${{ needs.detect-changes.outputs.model == 'true' }}

  # The client stack's build and unit suite, in `build-test-frontend.yml` for the reason the server's work is in a
  # called workflow: the definition is one thing whatever comes to call it. What is here is the same pair of questions
  # the `backend` job above answers — can this change affect the client, and is the pull request carrying it still a
  # draft — with both asked in the job's own condition rather than one of them passed inward, because there is a single
  # job on the other side and nothing for a switch to select between.
  #
  # What that workflow asserts today is the browser suite: it builds the client's bundle and drives it in a real
  # browser, which is the one check the client's own unit suite structurally cannot make. The linter, the type check,
  # and the unit suites join it there under #1400. The draft exemption is kept for the reason the server's build has
  # one — this is now an expensive job, downloading a browser and building a bundle — and the `frontend` filter above
  # is what keeps a change that cannot reach the client from paying either cost.
  frontend:
    name: Frontend
    needs:
      - detect-changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-frontend.yml
    with:
      # The same exemption the server's `run-format` gets above, and it is the whole of this switch rather than a repeat
      # of the change detection the job condition already applied: whether the client's formatting can have moved is a
      # question the `frontend` filter answers, and whether it is worth asking again on a merge is this one.
      run-format: ${{ github.event_name != 'push' }}

  # The two checks that read the half of the repository the build, formatting, and model jobs cannot see, in
  # `repository-contracts.yml` for the reason the two build workflows are called workflows: a nightly and a release
  # assert them against the tree they publish, from one definition rather than from a copy of these steps.
  #
  # `Workflow contracts` runs on every event and under every condition. `Detect changes` routes `.github/**`,
  # `docs/**`, `scripts/**`, and `.agents/**` to nothing, because none of them can move a build, a formatting verdict,
  # or the EF Core model, so without this a pull request touching only those would clear `Required CI` having verified
  # nothing about them. It takes no path filter, and that is the point rather than an omission: the suite asserts the
  # licensing header in every `.yml`, `.sh`, Helm template, and `SKILL.md`, the `describes:` marker on every page under
  # `docs/`, and a table-of-contents entry behind every published page and a page behind every entry, over the whole
  # tree at once. Narrowing it to the changed files would report green on contracts it never evaluated, which is worse
  # than not running it.
  #
  # `Helm chart` is the one of the two a change can fail to reach, so it is the one `run-helm` switches. What it
  # renders against is committed under `deploy/helm/mailfathom/ci/golden/`, which is why it can be narrowed where the
  # suite above cannot: a chart no file in the change touches renders to the manifests it already rendered to.
  #
  # No draft condition on either, unlike `backend` above. A draft-exempt contract check would not run over the interval
  # during which the change is actually being written — which is the whole interval in which a broken contract is cheap
  # to fix — and neither job installs anything or costs more than seconds, so there is nothing to save by deferring
  # them.
  contracts:
    name: Repository contracts
    needs:
      - detect-changes
    permissions:
      contents: read
    uses: ./.github/workflows/repository-contracts.yml
    with:
      run-helm: ${{ needs.detect-changes.outputs.helm == 'true' }}

  required-ci:
    name: Required CI
    needs:
      - detect-changes
      - backend
      - frontend
      - contracts
    # `always()` rather than `success() || failure()`, because this job has to report on a run that was
    # cancelled as well as on one whose dependencies were skipped. Anything weaker leaves the required
    # check itself skipped, which is the state this whole arrangement exists to avoid.
    #
    # The push exclusion does not weaken that. This job exists to be the `main` ruleset's one required
    # check, and a ruleset evaluates a pull request; on a push there is nothing waiting for a conclusion.
    # The results it reads all arrive on their own there — each of those jobs runs, and a failed one
    # fails the run, which is what the badge and the Actions list report — so a further job restating
    # that verdict under a further name would add a check rather than an answer. On every event the
    # ruleset does read, this job runs under exactly this name — which is the invariant the comment
    # below is about.
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # The name of this check is the only thing the branch ruleset knows about this workflow, so it
      # must not depend on the event, the changed files, the source branch, or a matrix dimension.
      - name: Verify pipeline results
        shell: bash
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          set -euo pipefail

          verdict=0

          # Change detection decides whether the other jobs were allowed to skip, so a run in which it
          # did not finish knows nothing about the change and cannot clear it.
          require_success() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" ]]; then
              echo "::error::${job_name} ended as '${result}' and must succeed."
              verdict=1
            fi
          }

          # Work the change did not concern reports `skipped`, which is a complete answer rather than a
          # missing one: a documentation-only pull request skips both halves of the verification and the
          # called workflow reports `skipped` as a whole. `failure` and `cancelled` never are.
          require_success_or_skipped() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::${job_name} ended as '${result}'; only 'success' or 'skipped' clear this check."
              verdict=1
            fi
          }

          require_success 'Detect changes' "$DETECT_CHANGES_RESULT"
          require_success_or_skipped 'Backend' "$BACKEND_RESULT"
          # A change that reaches nothing the client build reads skips this one, exactly as a change that reaches no
          # server code skips the job above it.
          require_success_or_skipped 'Frontend' "$FRONTEND_RESULT"
          # Not `require_success_or_skipped`: the called workflow holds the contract suite, which has no `if` and no
          # path filter and therefore no way to skip that is not a job which failed to start. Its chart job does skip
          # on a change reaching no chart file, and a called workflow whose remaining job succeeded reports `success`,
          # so that complete answer arrives here as one.
          require_success 'Repository contracts' "$CONTRACTS_RESULT"

          if [[ "$verdict" -eq 0 ]]; then
            echo "All pull-request checks completed or were not applicable to this change."
          fi

          exit "$verdict"
