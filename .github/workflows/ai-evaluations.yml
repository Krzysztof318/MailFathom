name: AI evaluations

# Measures what the agents answer, against the models a dispatch names — or `vars.EVALUATION_MODELS`
# where it names none, and `vars.CHAT_PROVIDER_MODEL` the integration tests use where neither does —
# judged by the one model `vars.JUDGE_PROVIDER_MODEL` pins. Dispatch is the only
# way it starts: a run calls real providers and spends credit, so what a run costs is asked for rather
# than arriving on a timer or with a pull request.
#
# What keeps a run cheap is the store `backend/tests/Evaluations` writes: every answer it paid for is
# cached by prompt, model, parameters, and the name, description, and schema of every tool the model
# was offered, and every verdict is kept so the report compares this run with the ones before it. The
# store travels from one run to the next as the `ai-evaluations-store` artefact — restored from the
# newest one that has not expired, uploaded again at the end — so an unchanged prompt costs nothing
# however many runs follow. An artefact expires after 90 days, and each run renews it; a store lost to
# a longer gap between runs costs one full run to rebuild and nothing else.
#
# The key is computed by `Microsoft.Extensions.AI`, which does not promise it stays the same across its
# releases, so a bump of that package can re-ask every case once. Anything else a run suspects the key
# misses is answered by the `discard_cached_answers` input: it starts the run with an empty cache,
# keeps the results the report compares against, and uploads a store holding only what that run paid
# for.
#
# The artefact is readable by anyone who can read this repository's runs, which is why nothing in the
# store is mail anybody received and why the judge is recorded only as `judge`: its model and the
# reasoning effort `vars.JUDGE_REASONING_EFFORT` declares for it never reach the store, the report, or
# a failure message. The one place both appear is the evaluation step's log header, which prints every
# `env:` value it is handed and masks only the secrets.
#
# Each case is asked of each model as many times as a dispatch's `repetitions` input — or
# `vars.EVALUATION_REPETITIONS` where it names none — declares, and once where neither does. A model's
# answer varies between calls, so a model is held to the share of those repetitions that passed rather
# than to one answer, and the report shows that share per case and per model beside what the
# repetitions cost together. Each repetition is its own cached answer, so a repeated run over an
# unchanged prompt still costs nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA, full or abbreviated, to evaluate'
        required: false
        type: string
      models:
        description: 'Models under test, separated by commas; defaults to the EVALUATION_MODELS variable, then to the one the integration tests reach'
        required: false
        type: string
      repetitions:
        description: 'How many times each case is asked of each model, from 1 to 20; defaults to the EVALUATION_REPETITIONS variable, or 1'
        required: false
        type: string
      reasoning_effort:
        description: 'Reasoning effort every model under test is asked for, such as low or high; unset sends none'
        required: false
        type: string
      embedding_models:
        description: 'Embedding models under test, separated by commas; defaults to the one the integration tests reach'
        required: false
        type: string
      embedding_dimension:
        description: 'Width every embedding is asked for and cut to; unset keeps each model at its own'
        required: false
        type: string
      discard_cached_answers:
        description: 'Start with an empty response cache, so every model and the judge are asked again; the result history is kept'
        required: false
        type: boolean
        default: false

# One run at a time for the whole workflow rather than per ref, because every run restores and
# replaces the same store: two at once would each start from the same artefact, and whichever uploaded
# last would discard what the other paid for.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate the agents
    runs-on: ubuntu-latest
    # The newest store is found and downloaded through the artefacts API, which a job reaches with
    # `actions: read`. Nothing here writes to the repository.
    permissions:
      contents: read
      actions: read
    # Every model under test and the judge answer one request per scenario, each with a two-minute
    # ceiling, and a cached one costs nothing. A run's length is that times the models and the
    # repetitions a dispatch declares — two models asked once take about half an hour — so the job
    # takes the six hours a hosted runner holds one for at most, and a request's own ceiling is what
    # bounds a run that has stopped answering.
    timeout-minutes: 360
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      # `actions/checkout` reads a ref as a branch or a tag name unless it is a full forty-character SHA, so an abbreviated
      # SHA handed to it straight would fail to fetch. The commits API resolves a branch, a tag, and a full or abbreviated SHA to
      # the one commit it names, and the checkout is then always of a full SHA. The input reaches the shell through the
      # environment rather than the script text, so a ref cannot write shell of its own.
      - name: Resolve the commit to evaluate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if [ -z "$REQUESTED_REF" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! sha=$(gh api "repos/$REPOSITORY/commits/$REQUESTED_REF" --jq .sha); then
            echo "::error::The ref '$REQUESTED_REF' names no commit in $REPOSITORY."
            exit 1
          fi

          echo "Evaluating $REQUESTED_REF at $sha."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'global.json', 'NuGet.config', '.config/dotnet-tools.json', '**/packages.lock.json') }}

      # The newest store any run of this workflow uploaded, from whichever ref it ran on: a store only
      # ever gains entries keyed by what was asked, so one from another ref costs nothing here and
      # saves whatever it already answered. None at all is the first run, not a failure. A dispatch
      # asking for fresh answers keeps the results and drops the cache, so the report still compares
      # this run with earlier ones and the store uploaded at the end holds only what this run paid for.
      - name: Restore the evaluation store
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISCARD_CACHED_ANSWERS: ${{ inputs.discard_cached_answers }}
        run: |
          set -euo pipefail

          store=artifacts/ai-evaluations/store
          mkdir -p "$store"

          artifact=$(gh api "repos/$REPOSITORY/actions/artifacts?name=ai-evaluations-store&per_page=1" \
            --jq '.artifacts[] | select(.expired == false) | .id')

          if [ -z "$artifact" ]; then
            echo "No earlier store to restore; this run starts an empty one."
            exit 0
          fi

          gh api "repos/$REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/store.zip"
          unzip -q "$RUNNER_TEMP/store.zip" -d "$store"
          echo "Restored the store from artefact $artifact."

          if [ "$DISCARD_CACHED_ANSWERS" = true ]; then
            rm -rf "$store/cache"
            echo "Discarded every cached answer and verdict; the results are kept."
          fi

      - name: Run the evaluations
        run: bash scripts/run-ai-evaluations.sh
        env:
          MAILFATHOM_AI_EVALUATIONS: 'true'
          # Where neither a dispatch nor `vars.EVALUATION_MODELS` names a model, the one the `Integration tests` workflow
          # already reaches is measured, so a repository configured for those tests can run this one as it stands.
          MAILFATHOM_EVALUATION_MODELS: ${{ inputs.models || vars.EVALUATION_MODELS || vars.CHAT_PROVIDER_MODEL }}
          MAILFATHOM_EVALUATION_REPETITIONS: ${{ inputs.repetitions || vars.EVALUATION_REPETITIONS }}
          # How hard every model under test reasons. Unset sends no reasoning parameter, which is how a deployment
          # declaring none calls a model; the judge's own effort is declared apart below.
          MAILFATHOM_EVALUATION_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          MAILFATHOM_CHAT_ADDRESS: ${{ vars.CHAT_PROVIDER_ADDRESS }}
          MAILFATHOM_CHAT_API_KEY: ${{ secrets.CHAT_PROVIDER_API_KEY }}
          # The judge answers from the same endpoint and the same key as the models under test, so the
          # model is the whole of what makes it the judge.
          MAILFATHOM_JUDGE_MODEL: ${{ vars.JUDGE_PROVIDER_MODEL }}
          # How hard the judge reasons. Unset sends no reasoning parameter and leaves the provider's default.
          MAILFATHOM_JUDGE_REASONING_EFFORT: ${{ vars.JUDGE_REASONING_EFFORT }}
          # The embedding models answer from the endpoint and key a deployment's embedding provider is reached with,
          # which the provider-contract tests already read, rather than from the chat endpoint.
          MAILFATHOM_EVALUATION_EMBEDDING_MODELS: ${{ inputs.embedding_models || vars.EMBEDDING_PROVIDER_ROUTED_MODEL || vars.EMBEDDING_PROVIDER_MODEL }}
          MAILFATHOM_EVALUATION_EMBEDDING_DIMENSION: ${{ inputs.embedding_dimension }}
          MAILFATHOM_EMBEDDING_ADDRESS: ${{ vars.EMBEDDING_PROVIDER_ADDRESS }}
          MAILFATHOM_EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_PROVIDER_API_KEY }}

      # Uploaded whether the run passed or not, because a failing run still paid for every answer it
      # received. A run that wrote nothing uploads nothing, which leaves the previous store the newest.
      - name: Keep the evaluation store
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-evaluations-store
          path: artifacts/ai-evaluations/store/
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-evaluations-report
          path: |
            artifacts/ai-evaluations/report.html
            artifacts/ai-evaluations/results/**/*.trx
          if-no-files-found: ignore
