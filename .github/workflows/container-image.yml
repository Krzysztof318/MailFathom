name: Container image

# Proves that the image still builds for both supported architectures, and nothing else. Testing the
# deployment it goes into, and publishing it, both belong to the release pipeline #156 owns; until that
# exists, this is what keeps a Dockerfile change from being discovered broken at release time.
#
# Manual dispatch only, deliberately, and for the same reason the integration suite is: a two-architecture
# build is minutes of runner time on a change that usually touches neither. Nothing here publishes — no
# registry credential is available to this workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No QEMU step, deliberately. The application is published as portable IL on the build platform, so the
      # per-architecture stages only pull a base image and copy into it — nothing executes under emulation, and a
      # matrix that needed it would be paying minutes for a result this arrangement gets for free.
      #
      # The version and the revision are supplied rather than defaulted, so this produces the same
      # self-identifying image a release build would, from the one file that declares a version.
      - name: Build the image for linux/amd64 and linux/arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target runtime \
            --file deploy/docker/Dockerfile \
            --build-arg "IMAGE_VERSION=$(bash scripts/read-declared-version.sh)" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha,scope=runtime \
            --cache-to type=gha,mode=max,scope=runtime \
            .
