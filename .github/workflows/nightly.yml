name: Nightly

# A published preview of `main`, and never a release. Every image this workflow produces carries a
# `-nightly.<n>-<short revision>` prerelease identifier and the `nightly` channel label, which is what separates the
# two channels — not the registry they sit in, and not the hostname of a reference somebody pasted. See
# docs/decisions/0004-versioning-and-release-policy.md.
#
# It runs at 00:00 UTC, which is 02:00 in Europe/Warsaw under CEST and 01:00 under CET; GitHub schedules are expressed
# in UTC only, and a run may start later than asked when the hosted queue is busy.
#
# **A run publishes nothing when `main` has not moved since the last published nightly.** The check reads the revision
# the published `nightly` image itself carries rather than any state stored beside it, so it stays right after a deleted
# tag, a re-run, or a package that was pruned. A `workflow_dispatch` is exempt: asking for a snapshot explicitly is a
# reason to build one.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build. Must be reachable from main. Defaults to the head of main.'
        required: false
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the published `nightly` image's labels is a registry read, and it is the whole reason this job
      # authenticates at all.
      packages: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      revision: ${{ steps.resolve.outputs.revision }}
      version: ${{ steps.resolve.outputs.version }}
      version-suffix: ${{ steps.resolve.outputs.version-suffix }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Check out the ref to preview
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      # A dispatch can name any ref, and this job goes on to hold a token that can write to a registry. Only history
      # that reached the protected branch is previewed, so a branch nobody reviewed cannot be published under a version
      # that looks like MailFathom's.
      - name: Resolve the commit and the nightly identifier
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          revision="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor "$revision" refs/remotes/origin/main; then
            echo "::error::${REQUESTED_REF:-HEAD} resolves to ${revision}, which is not reachable from main. A nightly previews the protected branch and nothing else."
            exit 1
          fi

          # The run number says which nightly this is and the short revision says what it was built from, so the tag
          # names its own source without anything having to be inspected. Both travel in one SemVer prerelease
          # identifier because the version has to survive as an OCI tag, which admits no `+build` metadata.
          version_suffix="nightly.${RUN_NUMBER}-${revision:0:7}"
          version="$(bash scripts/read-declared-version.sh "$version_suffix")"

          {
            printf 'revision=%s\n' "$revision"
            printf 'version=%s\n' "$version"
            printf 'version-suffix=%s\n' "$version_suffix"
            printf 'tags<<TAGS\n%s\nnightly\nTAGS\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether main has moved
        id: decide
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ steps.resolve.outputs.revision }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          publish() {
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' "$1"
            exit 0
          }

          if [[ "$IS_DISPATCH" == 'true' ]]; then
            publish 'Dispatched explicitly, so the snapshot is built whether or not main has moved.'
          fi

          # One registry answers this, because both carry the same digest under the same tag and a run that reached only
          # one of them is a failed publication rather than a state to reason about here. Asking the second would add a
          # login to a decision that has nothing to do with credentials.
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # Any failure to read the published nightly — an absent tag, a registry hiccup, a manifest shape that changed
          # — resolves to publishing. The cost of a wrong answer is one duplicate nightly; the cost of the opposite
          # default is a channel that quietly stops producing anything.
          if ! manifest="$(docker buildx imagetools inspect "${image}:nightly" --format '{{json .Image}}' 2>/dev/null)"; then
            publish "No nightly is published at ${image}:nightly yet."
          fi

          published_revision="$(printf '%s' "$manifest" |
            jq -r '[.. | objects | .config?.Labels?["org.opencontainers.image.revision"]? // empty] | unique | .[0] // empty')"

          if [[ -z "$published_revision" ]]; then
            publish 'The published nightly states no source revision, so it cannot be compared against main.'
          fi

          if [[ "$published_revision" != "$REVISION" ]]; then
            publish "main is at ${REVISION}; the published nightly is ${published_revision}."
          fi

          printf 'publish=false\n' >> "$GITHUB_OUTPUT"

          {
            printf '### No nightly published\n\n'
            printf 'main is still at `%s`, which is what `%s:nightly` already carries. ' "$REVISION" "$image"
            printf 'Nothing was built.\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # A nightly needs its schema script more than a release does, not less: its schema can be ahead of every published
  # migration, so no release's artifact covers it and there is nothing else to reach for. It is left on the run rather
  # than attached to anything, because a nightly is not a release and has nothing to attach to.
  #
  # It does not gate the push, which is the same rule the vulnerability scan follows on this channel. A nightly exists
  # to be tried, and refusing to publish one because a tool install failed tells nobody what broke; a release blocks on
  # exactly this, which is where the answer matters. What a failure here costs is a red run beside a published image,
  # which is legible — the image is out and its schema script is not — and is answered by generating the script from the
  # revision the image labels.
  schema-artifact:
    name: Schema artifact
    needs:
      - decide
    if: needs.decide.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-schema-artifact.yml
    with:
      ref: ${{ needs.decide.outputs.revision }}
      version: ${{ needs.decide.outputs.version }}

  # The administration command, on the same terms as the schema script above and left on the run for the same reason: a
  # nightly is not a release and has nothing to attach to. Somebody trying a nightly image downloads the binary from the
  # run that produced it, which is the only place the two are known to have been built from one revision.
  #
  # It gates nothing either. A nightly whose image published and whose command did not is legible from the run — the
  # image is out and its command is not — and the release channel is where a failure here has to stop the world.
  cli-binaries:
    name: CLI binaries
    needs:
      - decide
    if: needs.decide.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-cli-binaries.yml
    with:
      ref: ${{ needs.decide.outputs.revision }}
      version: ${{ needs.decide.outputs.version }}

  publish:
    name: Publish
    needs:
      - decide
    if: needs.decide.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-container-image.yml
    with:
      channel: nightly
      ref: ${{ needs.decide.outputs.revision }}
      version: ${{ needs.decide.outputs.version }}
      version-suffix: ${{ needs.decide.outputs.version-suffix }}
      tags: ${{ needs.decide.outputs.tags }}
      # Reported rather than enforced on this channel. A nightly exists to be tried, and a nightly that refuses to
      # publish because of a finding in a base image tells nobody what actually broke; the same finding blocks a
      # release, which is where the answer matters.
      block-on-vulnerabilities: false
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  prune:
    name: Prune superseded nightlies
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Retention is stated rather than left to accumulate: the newest nightly versions are kept and the rest are
      # deleted, so a channel that publishes every night does not grow without bound. It runs against both registries
      # and keeps the same window in each, because a nightly that survived in one of them is still a published nightly.
      #
      # Only versions whose every tag is a nightly identifier are considered — a version carrying `latest`, a release
      # number, or no tag at all is never touched, which is what keeps a released image and an attestation manifest out
      # of reach of this step. The moving `nightly` tag fails that test by construction and is never deleted.
      #
      # The two registries model retention differently and the steps below follow each rather than pretending they are
      # one: GHCR deletes a package *version*, which takes its tags with it, while Docker Hub deletes a *tag* and
      # collects the manifest it leaves unreferenced.
      - name: Delete nightly versions beyond the retained window on GHCR
        env:
          GH_TOKEN: ${{ secrets.GHCR_RETENTION_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          RETAINED_NIGHTLY_COUNT: '30'
        run: |
          set -euo pipefail

          package_name="$(printf '%s' "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          package_path="/users/${PACKAGE_OWNER}/packages/container/${package_name}"

          if ! versions="$(gh api --paginate "${package_path}/versions" 2>/dev/null)"; then
            echo "::warning::The package's versions could not be listed with this token, so nothing was pruned. Supply a GHCR_RETENTION_TOKEN with read:packages and delete:packages to enable retention."
            exit 0
          fi

          # Newest first, so the retained window is the head of the list.
          superseded="$(printf '%s' "$versions" | jq -r -s --argjson keep "$RETAINED_NIGHTLY_COUNT" '
            [ .[][]
              | select((.metadata.container.tags | length) > 0)
              | select(all(.metadata.container.tags[]; test("^[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]+-[0-9a-f]{7,}$")))
            ]
            | sort_by(.created_at) | reverse | .[$keep:] | .[] | "\(.id) \(.metadata.container.tags | join(","))"')"

          if [[ -z "$superseded" ]]; then
            echo "Nothing to prune: at most ${RETAINED_NIGHTLY_COUNT} nightly versions are published."
            exit 0
          fi

          while read -r version_id version_tags; do
            [[ -n "$version_id" ]] || continue

            if gh api --method DELETE "${package_path}/versions/${version_id}" > /dev/null 2>&1; then
              printf 'Deleted nightly %s.\n' "$version_tags"
            else
              echo "::warning::Nightly ${version_tags} could not be deleted with this token. Supply a GHCR_RETENTION_TOKEN with delete:packages to enable retention."
              exit 0
            fi
          done <<< "$superseded"

      # The same window on Docker Hub, which has no workflow token and therefore always uses the release credential.
      # Delete scope is part of what that token needs; a token without it fails here rather than at the push, which is
      # the right place for the failure because retention is the only thing that needs it.
      - name: Delete nightly tags beyond the retained window on Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RETAINED_NIGHTLY_COUNT: '30'
        run: |
          set -euo pipefail

          repository="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          namespace="${repository%%/*}"
          name="${repository##*/}"
          tags_path="https://hub.docker.com/v2/namespaces/${namespace}/repositories/${name}/tags"

          access_token="$(curl --silent --fail --show-error \
            --header 'Content-Type: application/json' \
            --data "$(jq --null-input --arg username "$namespace" --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}')" \
            'https://hub.docker.com/v2/users/login' | jq -r '.token')"

          if [[ -z "$access_token" || "$access_token" == 'null' ]]; then
            echo "::error::Docker Hub refused the credential, so nothing was pruned there."
            exit 1
          fi

          # Sorted here rather than by the server, which is what the GHCR step above does and for a stronger reason: on
          # this API `ordering=last_updated` returns newest first, the opposite of what that parameter name means
          # everywhere the convention comes from. A reader correcting it to what it looks like would invert the window
          # and delete the thirty newest nightlies instead of keeping them, so the order this step acts on is its own.
          #
          # One page is the whole window. Each run prunes back to the retained count, so the newest hundred tags always
          # contain every candidate unless a hundred nightlies were published between two runs.
          #
          # Only the immutable nightly identifiers are candidates; `nightly` and every release tag fail the pattern.
          superseded="$(curl --silent --fail --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "${tags_path}?page_size=100&ordering=last_updated" |
            jq -r --argjson keep "$RETAINED_NIGHTLY_COUNT" '
              [ .results[]
                | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]+-[0-9a-f]{7,}$"))
              ]
              | sort_by(.last_updated) | reverse | .[$keep:] | .[] | .name')"

          if [[ -z "$superseded" ]]; then
            echo "Nothing to prune: at most ${RETAINED_NIGHTLY_COUNT} nightly tags are published to Docker Hub."
            exit 0
          fi

          while read -r tag; do
            [[ -n "$tag" ]] || continue

            if curl --silent --fail --show-error --request DELETE \
              --header "Authorization: Bearer ${access_token}" \
              "${tags_path}/${tag}" > /dev/null; then
              printf 'Deleted nightly %s from Docker Hub.\n' "$tag"
            else
              echo "::warning::Nightly ${tag} could not be deleted from Docker Hub with this token. It needs delete scope for retention to run."
              exit 0
            fi
          done <<< "$superseded"
