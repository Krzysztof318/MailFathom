name: Build and test the frontend

# The client stack's half of the required check, and it asserts nothing today. The Uno Platform client this workflow
# compiled was withdrawn and the client is being rebuilt in React, so `frontend/` holds two placeholder directories and
# no build. What is kept is the wiring rather than the work: the `workflow_call` contract below, the `Frontend` job of
# `CI` that calls it, the `frontend` path filter that decides whether it runs, and the callers in `nightly.yml` and
# `release.yml` that gate a publication on it. Filling the job in for the new stack is then a change to this file
# alone, rather than a reconstruction of every caller that had learned to stop expecting one.
#
# `build-test-format-and-migrations.yml` is the same arrangement for the server, and the two deliberately share nothing
# but the `CI` workflow that calls them.
#
# The two inputs are kept for the same reason the job is. `ref` is what lets a release and a nightly check the revision
# they resolved once rather than whatever a ref points at by the time the job starts, and `run-format` is the switch
# every caller already passes to both stacks: formatting is the one verdict a pull request settles for good, so it is
# asked there and on no publication. Neither is read while the job below does nothing, and both are what the callers
# already send.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to check. Empty checks out whatever the caller''s event points at, which is what a pull request wants.'
        required: false
        type: string
        default: ''
      run-format:
        description: 'Whether to verify the client solution''s formatting.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-unit-test-client:
    name: Client stack, which carries no build yet
    runs-on: ubuntu-latest
    steps:
      # Nothing is checked out, no SDK is installed, and no toolchain is restored, because there is nothing under
      # `frontend/` for any of them to read. A job that succeeds having done nothing is the honest report while that
      # is true; a job removed instead would take the caller wiring with it.
      - name: Report that the client stack carries no build
        run: |
          echo 'The Uno Platform client was withdrawn and the React client has not landed yet, so there is nothing'
          echo 'under frontend/ to restore, build, test, or format. See frontend/src/README.md.'
