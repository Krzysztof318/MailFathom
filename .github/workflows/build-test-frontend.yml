name: Build and test the frontend

# The client stack's half of the required check, and it asks the client exactly what `scripts/verify-full.sh` asks it,
# in the same order: the linter, the type check, both packages' unit suites, the formatting pass, and the build. The
# browser suite is the one step that has no counterpart in either local gate — #1404 decided it runs here because it
# cannot affordably run anywhere else — and it sits last because it is the only step that downloads a browser.
#
# **The linting is held at the service's severity rather than at a lower one.** `frontend/eslint.config.ts` is to the
# client what `TreatWarningsAsErrors` and the analyzer set are to the server: every rule reports as an error and
# `pnpm lint` refuses a warning through `--max-warnings 0`. A type error and a formatting difference fail the job the
# same way. A client held to less than the service would make the repository's standard a property of which language a
# file happens to be written in.
#
# **Why a browser check is gated on a pull request rather than left local or deferred to a nightly.** What it covers is
# what jsdom structurally cannot answer — the built bundle rather than the source, a real document with a history, and
# the requests a browser actually issued — which is exactly the class of break nobody notices while writing a screen.
# A nightly finds it the morning after the merge and names a run at 02:00 rather than the change that caused it, and a
# local-only suite is a suite whoever is in a hurry does not run. It costs a browser download, which the cache below
# makes a one-off per lock file, and about a minute of runner time on a change that reaches the client at all — the
# `frontend` path filter in `ci.yml` is what keeps every other change from paying it.
#
# `build-test-format-and-migrations.yml` is the same arrangement for the server, and the two deliberately share nothing
# but the `CI` workflow that calls them.
#
# The two inputs keep the contract every caller already sends. `ref` is what lets a release and a nightly check the
# revision they resolved once rather than whatever a ref points at by the time the job starts, and `run-format` is the
# switch every caller passes to both stacks: formatting is the one verdict a pull request settles for good, so it is
# asked there and on no publication.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to check. Empty checks out whatever the caller''s event points at, which is what a pull request wants.'
        required: false
        type: string
        default: ''
      run-format:
        description: 'Whether to verify the client solution''s formatting.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check-build-and-test-the-client:
    name: Check, build, and test the client
    runs-on: ubuntu-latest
    steps:
      # A full checkout rather than a shallow one, because the client's build reads `Version.props` through
      # `scripts/read-declared-version.sh` and the browser suite asserts the number that reached the bundle.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # `engines.node` in the client's manifest is where the Node version is decided, so it is read from there rather
      # than restated here — a second copy is a second thing to move when the floor does.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json

      # Corepack no longer ships with Node, so pnpm is installed rather than shimmed, and `packageManager` in the
      # manifest is what says which version — the same field that says which pnpm wrote the lock file.
      - name: Install pnpm
        run: npm install --global "$(jq --raw-output .packageManager frontend/package.json)"

      # The store rather than `node_modules`, which is what pnpm hard-links from. The lock file is the whole key: it
      # fixes the resolved closure, so a key that ignored it would serve packages resolved under different pins.
      - name: Resolve the pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Restore the client workspace
        run: pnpm --dir frontend install --frozen-lockfile

      # The four checks the full gate runs before it builds, in the order it runs them, and ahead of the browser steps
      # because none of them needs a browser: a lint violation is answered here without the 300 MB download below. The
      # type check is the closest thing the client has to the Release build, because Vite strips types rather than
      # checking them, and the unit suites run behind it for the reason `dotnet test` runs behind `dotnet build`.
      - name: Lint the client
        run: pnpm --dir frontend run lint

      - name: Type-check the client
        run: pnpm --dir frontend run typecheck

      - name: Run both packages' unit suites
        run: pnpm --dir frontend run test

      # Verifying rather than repairing, which is what the same pass does in the full gate and the opposite of what it
      # does in the fast loop. `run-format` is what makes it a pull request's question: a publication checks a revision
      # whose formatting some pull request already settled.
      - name: Verify the client's formatting
        if: inputs.run-format
        run: pnpm --dir frontend run format:check

      # Which browser build Playwright downloads is decided by the Playwright version, which the lock file pins, so the
      # same key covers both. Without this the browser is fetched on every run of every client change.
      - name: Cache the browser Playwright downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # `--with-deps` installs the shared libraries the browser needs from apt, which the cache above does not hold and
      # which a GitHub-hosted runner does not carry. Chromium alone: `frontend/playwright.config.ts` says why.
      - name: Install the browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      # `pnpm test:browser` is `pnpm build` and then Playwright, so this is the build step as well as the browser one
      # and nothing here builds the bundle twice. Nothing is uploaded afterwards, by design rather than by omission: a
      # trace or a screenshot of a client is personal data the moment this drives a real deployment instead of the
      # stubbed transport, so a failure is read from this log and reproduced locally rather than downloaded from a run.
      - name: Build the client and check it in a real browser
        run: pnpm --dir frontend run test:browser
