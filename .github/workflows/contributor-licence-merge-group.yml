name: Contributor licence (merge group)

# `license/cla` is a required check, so the merge queue waits for it on the tree it combines. Whether
# the author accepted the agreement is a property of the pull request rather than of that tree, so
# the group is handed the status the pull request's head already carries, under the same App, which
# is the integration the ruleset requires the status from.
#
# A file of its own rather than a trigger in `contributor-licence.yml`: GitHub refuses to start a
# `merge_group` run from a workflow that also listens on `pull_request_target`, and the refusal is a
# startup failure that posts no status, so the queue holds the group until its timeout.
on:
  merge_group:
    types: [checks_requested]

# The workflow token is unused: the one call that writes carries the App's installation token.
permissions: {}

jobs:
  carry:
    name: Carry the pull request's licence status
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mint the licence App's token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LICENSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LICENSE_APP_PRIVATE_KEY }}

      # A read that fails still posts a status, as `error`, because a required check that never
      # arrives holds the queue until its timeout and removes the pull request without saying why.
      - name: Carry the pull request's licence status onto the merge group
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          number=$(printf '%s' "$MERGE_GROUP_HEAD_REF" | sed -nE 's|^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-[0-9a-f]+$|\1|p')
          state=error
          description='The merge group names no pull request, so no licence status could be carried'

          if [ -n "$number" ]; then
            head_sha=$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.head.sha') || head_sha=''
            read_failed=false
            carried=''
            if [ -z "$head_sha" ]; then
              read_failed=true
            elif ! carried=$(gh api "repos/$REPOSITORY/commits/$head_sha/status?per_page=100" \
                --jq '[.statuses[] | select(.context == "license/cla")][0].state // empty'); then
              read_failed=true
            fi

            if [ "$read_failed" = 'true' ]; then
              description="The licence status of pull request #$number could not be read; re-running the job carries it"
            elif [ "$carried" = 'success' ]; then
              state=success
              description="Carried from pull request #$number, whose author needs no agreement or has accepted it"
            else
              state=failure
              description="Pull request #$number carries license/cla as '${carried:-missing}', not 'success'"
            fi
          fi

          gh api "repos/$REPOSITORY/statuses/$MERGE_GROUP_HEAD_SHA" \
            -f state="$state" \
            -f context='license/cla' \
            -f description="$description" \
            >/dev/null

          printf 'license/cla = %s (%s)\n' "$state" "$description"
