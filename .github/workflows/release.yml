name: Release

# What turns a commit into a release: an annotated `v<major>.<minor>.<patch>` tag, and nothing else. A merge to `main`
# publishes nothing, a manual dispatch does not exist here, and no branch push reaches this workflow — so the decision
# that a version is real stays the owner's deliberate act, per
# docs/decisions/0004-versioning-and-release-policy.md.
#
# Everything that could make a release wrong is asserted before anything is built. A tag that disagrees with the version
# its own commit declares, that repeats or moves backwards on its line, that names a commit which never merged, or whose
# changelog says nothing, fails here — while deleting the tag is still the whole remedy.
on:
  push:
    tags:
      - 'v*'

# Never cancels a run in progress. Cancelling a publication half-way is exactly the state this pipeline is built to
# avoid, and two release tags pushed close together are two different versions rather than a race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert:
    name: Assert the release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.assert.outputs.version }}
      revision: ${{ steps.assert.outputs.revision }}
      tags: ${{ steps.assert.outputs.tags }}
    steps:
      # The whole history and every tag, because the assertions read them: reachability from `main` or from a release
      # branch, and the highest existing tag on this release's own line.
      - name: Check out the tagged commit with its history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout above brings the annotated tag object down and then destroys it: having resolved the ref, it
      # force-fetches the *commit* into the same ref name — `+<sha>:refs/tags/<tag>` — so `refs/tags/<tag>` ends up
      # pointing straight at the commit, which is what a lightweight tag is. The assertion below requires an annotated
      # tag, per ADR 0004, and would therefore reject every correctly pushed release tag there is.
      #
      # This restores what the tag actually is on the remote. `fetch-tags: true` does not do it: the tags are already
      # fetched by then and the overwrite happens after. Do not remove this as redundant with `fetch-depth: 0`.
      - name: Restore the annotated tag the checkout overwrote
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Assert the tag against the commit it names
        id: assert
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="$(bash scripts/assert-release-tag.sh "$RELEASE_TAG")"
          revision="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"

          # `latest` is what an operator gets by not choosing, so it moves only to the highest stable release — chosen
          # by taking the highest of the tags that carry no prerelease identifier, never by taking a maximum over every
          # tag present. A patch to an older line is a supported release and still not the newest one, and this is what
          # gives that answer without a rule of its own.
          highest_release="$(git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sed 's/^v//' |
            sort --version-sort |
            tail -n 1)"

          image_tags="$version"

          if [[ "$highest_release" == "$version" ]]; then
            image_tags="${image_tags}"$'\n'"latest"
            echo "${version} is the highest release, so it takes over 'latest'."
          else
            echo "${highest_release} is higher than ${version}, so 'latest' stays where it is."
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'revision=%s\n' "$revision"
            printf 'tags<<TAGS\n%s\nTAGS\n' "$image_tags"
          } >> "$GITHUB_OUTPUT"

  # The artifact a released installation applies, built from the definition both channels share. A release blocks its
  # image push on it; docs/operations/database-schema.md is what an operator then does with the file.
  schema-artifact:
    name: Schema artifact
    needs:
      - assert
    permissions:
      contents: read
    uses: ./.github/workflows/build-schema-artifact.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}

  # The command an operator administers this release with, built from the same commit. It blocks nothing: a release
  # whose binaries failed is still a release whose image is correct, and the failure is visible on the run.
  cli-binaries:
    name: CLI binaries
    needs:
      - assert
    permissions:
      contents: read
    uses: ./.github/workflows/build-cli-binaries.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}

  # Authenticode signatures for the two Windows binaries, and the attestation covering everything the release attaches.
  # It gates nothing either, and it skips on its own when the build above failed, because a job is skipped when a need
  # of it fails: no signing request is submitted for binaries that do not exist.
  #
  # It is switched off, and `announce` therefore attaches the build's artifact. The certificate this signs with does not
  # exist yet, so every release would submit a signing request that cannot be approved and publish no command binaries
  # at all — the arrangement below only ever attaches a signed artifact, and there is no signature to attach. The job,
  # the workflow it calls, and everything recorded about both stay in place rather than being removed and rediscovered
  # later: #390 turns this back on together with the release notes and the pages that describe it.
  sign-cli-binaries:
    name: Sign the CLI binaries
    if: false
    needs:
      - assert
      - cli-binaries
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/sign-cli-binaries.yml
    with:
      version: ${{ needs.assert.outputs.version }}
      artifact-id: ${{ needs.cli-binaries.outputs.artifact-id }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  publish:
    name: Publish
    needs:
      - assert
      # A release that cannot produce its schema artifact publishes no image. An operator handed an image and no way to
      # reach the schema it requires has a deployment that starts, fails the startup gate, and stays down.
      - schema-artifact
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-container-image.yml
    with:
      channel: release
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}
      tags: ${{ needs.assert.outputs.tags }}
      # A release publishes nothing while a fixable vulnerability is in it. The nightly channel reports the same finding
      # and publishes anyway; that difference is the channels' whole point.
      block-on-vulnerabilities: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The chart is published after the image and against the digest that publication produced, because a chart names the
  # image it deploys and a chart pointing at an artifact no release produced is worse than no chart at all. A failure
  # here leaves the release incomplete rather than half-published: the image is out, the chart is not, and re-running
  # the release publishes the chart without rebuilding or re-pushing anything.
  publish-chart:
    name: Publish the Helm chart
    needs:
      - assert
      - publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-helm-chart.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}
      image: ${{ needs.publish.outputs.image }}
      image-digest: ${{ needs.publish.outputs.digest }}

  announce:
    name: Publish the GitHub release
    needs:
      - assert
      - schema-artifact
      - publish
      - publish-chart
      - cli-binaries
    # cli-binaries is a need so that needs.cli-binaries.result exists to be read below — the context carries only a
    # job's declared dependencies, so a conditional step referring to a job that is not one is a condition that is
    # always false. While signing is switched off it is also the job producing what the release attaches, which is why
    # it is named here rather than the signing job that used to stand in front of it. The four gates that must pass are
    # named here instead of left to the default, because a job with an `if` is still skipped when a need fails unless
    # the condition tolerates it:
    # !cancelled() is what admits a failed or skipped command build, and the four equality checks are what keep
    # everything else gating exactly as before.
    if: >-
      ${{ !cancelled()
        && needs.assert.result == 'success'
        && needs.schema-artifact.result == 'success'
        && needs.publish.result == 'success'
        && needs.publish-chart.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the schema artifact
        uses: actions/download-artifact@v8
        with:
          name: schema-artifact
          path: artifacts/schema

      # Conditional rather than required: a failed command build must not withhold the release itself — the image, the
      # chart, and the schema script an operator is actually waiting for. A failure is a red job beside a published
      # release rather than no release at all.
      #
      # The artifact named here is the build's, because nothing signs while `Sign the CLI binaries` is switched off.
      # It carries the four binaries as built and the checksum file taken over exactly those bytes, so what a release
      # offers is self-consistent and verifiable by checksum; #390 restores the signed artifact in its place.
      - name: Download the CLI binaries
        if: needs.cli-binaries.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.cli-binaries.outputs.artifact }}
          path: artifacts/cli

      # The notes are the changelog section, not a list of pull-request titles: no arrangement of titles can state that
      # a release cannot be deployed over the previous release's data, which is the most important sentence a MailFathom
      # release note will ever carry.
      #
      # That section describes one version, so the link under it says where the rest is. It points at the tag rather
      # than at `main`, because an operator reading an older release wants the file as that release shipped it, not a
      # copy that has since grown the sections describing everything they have not upgraded to yet.
      #
      # The schema section beside it is the per-release record the artifact needs to be usable years from now: which
      # migrations it carries, the checksum that identifies the file, and the ordering and backup point applying it
      # assumes. The reasoning behind each of those lives once, in docs/operations/database-schema.md, and the notes link
      # to it rather than restating it per release.
      - name: Create or update the release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.assert.outputs.version }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DOCKER_HUB_IMAGE: ${{ needs.publish.outputs.docker-hub-image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          CHART: ${{ needs.publish-chart.outputs.chart }}
          SCHEMA_ARTIFACT: ${{ needs.schema-artifact.outputs.artifact }}
          SCHEMA_CHECKSUM: ${{ needs.schema-artifact.outputs.checksum }}
          SCHEMA_MIGRATIONS: ${{ needs.schema-artifact.outputs.migrations }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          schema_artifact_name="$(basename "$SCHEMA_ARTIFACT")"

          {
            bash scripts/read-changelog-section.sh "$VERSION"
            printf '\n[The full changelog at this tag](https://github.com/%s/blob/%s/CHANGELOG.md) ' \
              "$REPOSITORY" "$RELEASE_TAG"
            printf 'carries the releases before this one and the surfaces each of them broke.\n'

            printf '\n## The published image\n\n'
            printf 'Both registries carry the same manifest list under the same digest, so the one to pull from is '
            printf 'whichever your environment already reaches.\n\n'
            printf '```\ndocker pull %s:%s\ndocker pull %s@%s\n```\n\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST"
            printf '```\ndocker pull %s:%s\ndocker pull %s@%s\n```\n' \
              "$DOCKER_HUB_IMAGE" "$VERSION" "$DOCKER_HUB_IMAGE" "$DIGEST"

            printf '\n## The Helm chart\n\n```\nhelm install mailfathom oci://%s --version %s\n```\n' "$CHART" "$VERSION"
            printf '\nThe chart is published to GHCR alone, because Docker Hub has no repository path to hold it beside '
            printf 'the image. Its `appVersion` is this release, and it deploys the digest above.\n'

            printf '\n## The database schema\n\n'
            printf 'Apply `%s` before rolling this version out, and take a backup first. ' "$schema_artifact_name"
            printf 'MailFathom applies no schema change while starting and refuses to serve against a schema it does '
            printf 'not recognize, so the order is: back up, apply the script, then deploy the image.\n\n'
            printf '| | |\n| --- | --- |\n'
            printf '| Artifact | `%s` |\n' "$schema_artifact_name"
            printf '| SHA-256 | `%s` |\n' "$SCHEMA_CHECKSUM"
            printf '| Migrations | `%s` |\n\n' "$SCHEMA_MIGRATIONS"
            printf 'The script is idempotent, so an installation already carrying some of those migrations takes only '
            printf 'what it is missing. [Applying the database schema](https://github.com/%s/blob/%s/docs/operations/database-schema.md)' \
              "$REPOSITORY" "$RELEASE_TAG"
            printf ' states the privileges it needs, the locks it takes, and what each startup failure means.\n'

            printf '\n## The administration command\n\n'
            printf 'Download the binary for the machine you administer from, not for the machine the service runs on: '
            printf '`mfctl` reaches a deployment over HTTP and runs on Linux and Windows alike. Verify it against '
            printf '`mfctl-%s.sha256`, make it executable, and run `mfctl login --endpoint https://host:port`. ' "$VERSION"
            printf '[Administering a deployment](https://github.com/%s/blob/%s/docs/operations/admin-endpoint.md)' \
              "$REPOSITORY" "$RELEASE_TAG"
            printf ' states what the service has to have enabled before it will answer.\n\n'
            printf 'None of the binaries carries a code signature, so Windows warns about an unknown publisher and the '
            printf 'checksum file is what verifies a download. Authenticode signing of the two Windows binaries '
            printf 'through [SignPath Foundation](https://signpath.org/) is prepared and will be enabled once the '
            printf 'certificate is issued.\n'
          } > "$notes_file"

          # Idempotent, because a re-run of a release must not fail on the release it already created.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" --title "MailFathom $VERSION" --notes-file "$notes_file" --verify-tag
          fi

          # --clobber for the same reason the release itself is created idempotently: a re-run replaces the assets it
          # uploaded rather than failing on them.
          gh release upload "$RELEASE_TAG" \
            "artifacts/schema/${schema_artifact_name}" \
            "artifacts/schema/${schema_artifact_name}.sha256" \
            --clobber

          # Every published platform of the command, plus the one checksum file covering all of them. Guarded rather
          # than assumed, because this job runs whether or not the command built.
          if [ -d artifacts/cli ]; then
            gh release upload "$RELEASE_TAG" artifacts/cli/* --clobber
          fi
