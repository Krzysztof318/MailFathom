name: Release

# What turns a commit into a release: an annotated `v<major>.<minor>.<patch>` tag, and nothing else. A merge to `main`
# publishes nothing, a manual dispatch does not exist here, and no branch push reaches this workflow — so the decision
# that a version is real stays the owner's deliberate act, per
# docs/decisions/0004-versioning-and-release-policy.md.
#
# Everything that could make a release wrong is asserted before anything is built. A tag that disagrees with the version
# its own commit declares, that repeats or moves backwards on its line, that names a commit which never merged, or whose
# changelog says nothing, fails here — while deleting the tag is still the whole remedy.
#
# The filter is version-shaped rather than `v*`, which would start this workflow for `vnext`, `viewer`, or any other tag
# somebody spells with a leading v. That matters more here than anywhere else in the repository: these jobs hold write
# credentials for two container registries, an attestation signing identity, and the token that creates a release, so a
# tag nobody meant as one is better refused by never starting than by the assertion below.
#
# A filter pattern is a glob rather than a regular expression, so the exact shape is not expressible here — the `*`
# following each `[0-9]` leaves the digits in a group unbounded, which is what admits `v0.15.0` and `v16.34.234`, and
# also what leaves a prerelease and a fourth group matching. The assertion refuses both, and `$prepare-release` is what
# a release is cut with in the first place.
#
# What this gives up is the one case where a version-shaped typo is not version-shaped enough: `v0.4` for `v0.4.0` used
# to start a run and fail loudly, and now starts nothing at all. Read the absence of a run as the tag being malformed.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

# Never cancels a run in progress. Cancelling a publication half-way is exactly the state this pipeline is built to
# avoid, and two release tags pushed close together are two different versions rather than a race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert:
    name: Assert the release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.assert.outputs.version }}
      revision: ${{ steps.assert.outputs.revision }}
      tags: ${{ steps.assert.outputs.tags }}
    steps:
      # The whole history and every tag, because the assertions read them: reachability from `main` or from a release
      # branch, and the highest existing tag on this release's own line.
      - name: Check out the tagged commit with its history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout above brings the annotated tag object down and then destroys it: having resolved the ref, it
      # force-fetches the *commit* into the same ref name — `+<sha>:refs/tags/<tag>` — so `refs/tags/<tag>` ends up
      # pointing straight at the commit, which is what a lightweight tag is. The assertion below requires an annotated
      # tag, per ADR 0004, and would therefore reject every correctly pushed release tag there is.
      #
      # This restores what the tag actually is on the remote. `fetch-tags: true` does not do it: the tags are already
      # fetched by then and the overwrite happens after. Do not remove this as redundant with `fetch-depth: 0`.
      - name: Restore the annotated tag the checkout overwrote
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Assert the tag against the commit it names
        id: assert
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="$(bash scripts/assert-release-tag.sh "$RELEASE_TAG")"
          revision="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"

          # `latest` is what an operator gets by not choosing, so it moves only to the highest stable release — chosen
          # by taking the highest of the tags that carry no prerelease identifier, never by taking a maximum over every
          # tag present. A patch to an older line is a supported release and still not the newest one, and this is what
          # gives that answer without a rule of its own.
          highest_release="$(git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sed 's/^v//' |
            sort --version-sort |
            tail -n 1)"

          image_tags="$version"

          if [[ "$highest_release" == "$version" ]]; then
            image_tags="${image_tags}"$'\n'"latest"
            echo "${version} is the highest release, so it takes over 'latest'."
          else
            echo "${highest_release} is higher than ${version}, so 'latest' stays where it is."
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'revision=%s\n' "$revision"
            printf 'tags<<TAGS\n%s\nTAGS\n' "$image_tags"
          } >> "$GITHUB_OUTPUT"

  # Everything this release publishes waits behind the verification jobs below — every artifact behind the first three
  # of the four, and the image behind all four — and they are jobs here rather than steps inside the workflow that
  # pushes the image because more than the image is built from this commit. A gate
  # belonging to the image would gate the image: the schema script and the command binaries would start beside it, so a
  # commit a unit test rejects would still spend four `dotnet publish` invocations and a schema generation before the
  # failure was legible, and would start them minutes before the integration suite had said anything at all. Declared
  # here, the dependency is what a further artifact inherits by being added rather than by being reviewed.
  #
  # The same definition a pull request is verified by, against the tagged commit rather than against a branch, with
  # every switch at its default: `CI` skips work a pull request's changed files cannot affect, and a release skips
  # nothing.
  verify:
    name: Build, test, format, and migrations
    needs:
      - assert
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-format-and-migrations.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}

  # The client stack's half of the same gate, against the same commit and with every switch at its default. It is a
  # second job rather than a switch on the one above because the two stacks share no solution, no build contract, and
  # no package pins — and it blocks the image for a reason the two artifacts it produces make plain: the browser head
  # published into that image is built from this commit, so a client that does not compile is a release whose image
  # would carry the previous run's answer or none at all.
  verify-client:
    name: Build and test the client
    needs:
      - assert
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-frontend.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}

  # The half of the repository neither stack's build can see, against the same commit and with every switch at its
  # default: the contract suite, and the chart linted and rendered against the manifests committed beside it.
  # `Publish the Helm chart` lints and renders the chart again later, and that is a different question rather than a
  # repeat — it asks whether the packaged chart deploys the image this release just published, and this asks whether
  # the chart in the released tree still renders to what is committed beside it.
  #
  # A release blocks on both, unlike a nightly: a tag is one claim about one commit, and a released tree whose
  # deployment contract no longer holds is not one to put a digest behind.
  verify-contracts:
    name: Repository contracts
    needs:
      - assert
    permissions:
      contents: read
    uses: ./.github/workflows/repository-contracts.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}

  # The suite that starts PostgreSQL, applies the baseline migration, and asserts against the result. A release is the
  # one channel that runs it, and it runs *after* the gate above rather than beside it, so minutes of container time are
  # never spent on a commit a unit test would have rejected in seconds.
  integration-tests:
    name: Integration tests
    needs:
      - assert
      - verify
    permissions:
      contents: read
    uses: ./.github/workflows/integration-tests.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}

  # The artifact a released installation applies, built from the definition both channels share. A release blocks its
  # image push on it; docs/operations/database-schema.md is what an operator then does with the file.
  schema-artifact:
    name: Schema artifact
    needs:
      - assert
      - integration-tests
    permissions:
      contents: read
    uses: ./.github/workflows/build-schema-artifact.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}

  # The command an operator administers this release with, built from the same commit. It blocks nothing: a release
  # whose binaries failed is still a release whose image is correct, and the failure is visible on the run.
  cli-binaries:
    name: CLI binaries
    needs:
      - assert
      - integration-tests
    permissions:
      contents: read
    uses: ./.github/workflows/build-cli-binaries.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}

  # The client as something somebody downloads and runs on their own machine, built from the same commit. It blocks
  # nothing, on the same terms as the command binaries above and for the same reason.
  desktop-client:
    name: Desktop client
    needs:
      - assert
      # Both gates, for the reason the command binaries wait for them: a commit the service's tests or
      # the integration suite reject is not one to spend two self-contained publishes on. Its own
      # stack's gate is here as well, because a client that does not compile is answered faster by the
      # job that says so than by two publishes failing the same way.
      - verify
      - integration-tests
      - verify-client
    permissions:
      contents: read
    uses: ./.github/workflows/build-desktop-client.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}

  publish:
    name: Publish
    needs:
      - assert
      # A release that cannot produce its schema artifact publishes no image. An operator handed an image and no way to
      # reach the schema it requires has a deployment that starts, fails the startup gate, and stays down.
      - schema-artifact
      # Reached through `schema-artifact` already, and named anyway: what gates a publication is the sort of thing that
      # has to be readable off the job that publishes rather than followed through another job's dependencies.
      - integration-tests
      # The image carries the client's browser head, built from these sources by the image build itself, so a client
      # that does not compile fails the publication anyway — twenty minutes into a multi-platform build rather than
      # where the answer already is.
      - verify-client
      # Nothing above reaches this one, because it produces no artifact for a publishing job to inherit the dependency
      # through. It is named for what it holds rather than for what it builds: the chart this release goes on to
      # package is the chart it renders, and a release that publishes an image before that is answered has published
      # the harder half of the pair to withdraw.
      - verify-contracts
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-container-image.yml
    with:
      channel: release
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}
      tags: ${{ needs.assert.outputs.tags }}
      # A release publishes nothing while a fixable vulnerability is in it. The nightly channel reports the same finding
      # and publishes anyway; that difference is the channels' whole point.
      block-on-vulnerabilities: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The chart is published after the image and against the digest that publication produced, because a chart names the
  # image it deploys and a chart pointing at an artifact no release produced is worse than no chart at all. A failure
  # here leaves the release incomplete rather than half-published: the image is out, the chart is not, and re-running
  # the release publishes the chart without rebuilding or re-pushing anything.
  publish-chart:
    name: Publish the Helm chart
    needs:
      - assert
      - publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-helm-chart.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}
      image: ${{ needs.publish.outputs.image }}
      image-digest: ${{ needs.publish.outputs.digest }}

  announce:
    name: Publish the GitHub release
    needs:
      - assert
      - schema-artifact
      - publish
      - publish-chart
      - cli-binaries
      - desktop-client
    # cli-binaries and desktop-client are needs so that their `result` exists to be read below — the context carries
    # only a job's declared dependencies, so a conditional step referring to a job that is not one is a condition that
    # is always false. They are also the jobs producing what the release attaches. The four gates that must pass are named
    # here instead of left to the default, because a job with an `if` is still skipped when a need fails unless the
    # condition tolerates it:
    # !cancelled() is what admits a failed or skipped command build, and the four equality checks are what keep
    # everything else gating exactly as before.
    if: >-
      ${{ !cancelled()
        && needs.assert.result == 'success'
        && needs.schema-artifact.result == 'success'
        && needs.publish.result == 'success'
        && needs.publish-chart.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the schema artifact
        uses: actions/download-artifact@v8
        with:
          name: schema-artifact
          path: artifacts/schema

      # Conditional rather than required: a failed command build must not withhold the release itself — the image, the
      # chart, and the schema script an operator is actually waiting for. A failure is a red job beside a published
      # release rather than no release at all.
      #
      # The artifact carries the four binaries as built and the checksum file taken over exactly those bytes, so what
      # a release offers is self-consistent and verifiable by checksum. Nothing between the build and here rewrites a
      # binary, which is what keeps those two halves describing each other.
      - name: Download the CLI binaries
        if: needs.cli-binaries.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.cli-binaries.outputs.artifact }}
          path: artifacts/cli

      # Conditional for the same reason, and carrying its own notices: each archive holds the application with
      # MailFathom's own licence and attribution beside it. Nothing else is owed — every component that head
      # redistributes is permissive, and the one copyleft package its restore graph resolves is excluded from the
      # publish rather than shipped under conditions. THIRD_PARTY_LICENSES.md carries that verdict.
      - name: Download the desktop client
        if: needs.desktop-client.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-client.outputs.artifact }}
          path: artifacts/desktop

      # The notes are the changelog section, not a list of pull-request titles: no arrangement of titles can state that
      # a release cannot be deployed over the previous release's data, which is the most important sentence a MailFathom
      # release note will ever carry.
      #
      # That section describes one version, so the link under it says where the rest is. It points at the tag rather
      # than at `main`, because an operator reading an older release wants the file as that release shipped it, not a
      # copy that has since grown the sections describing everything they have not upgraded to yet.
      #
      # The schema section beside it is the per-release record the artifact needs to be usable years from now: which
      # migrations it carries, the checksum that identifies the file, and the ordering and backup point applying it
      # assumes. The reasoning behind each of those lives once, in docs/operations/database-schema.md, and the notes link
      # to it rather than restating it per release.
      - name: Create or update the release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.assert.outputs.version }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DOCKER_HUB_IMAGE: ${{ needs.publish.outputs.docker-hub-image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          CHART: ${{ needs.publish-chart.outputs.chart }}
          SCHEMA_ARTIFACT: ${{ needs.schema-artifact.outputs.artifact }}
          SCHEMA_CHECKSUM: ${{ needs.schema-artifact.outputs.checksum }}
          SCHEMA_MIGRATIONS: ${{ needs.schema-artifact.outputs.migrations }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          schema_artifact_name="$(basename "$SCHEMA_ARTIFACT")"

          {
            bash scripts/read-changelog-section.sh "$VERSION"
            printf '\n[The full changelog at this tag](https://github.com/%s/blob/%s/CHANGELOG.md) ' \
              "$REPOSITORY" "$RELEASE_TAG"
            printf 'carries the releases before this one and the surfaces each of them broke.\n'

            printf '\n## The published image\n\n'
            printf 'Both registries carry the same manifest list under the same digest, so the one to pull from is '
            printf 'whichever your environment already reaches.\n\n'
            printf '```\ndocker pull %s:%s\ndocker pull %s@%s\n```\n\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST"
            printf '```\ndocker pull %s:%s\ndocker pull %s@%s\n```\n' \
              "$DOCKER_HUB_IMAGE" "$VERSION" "$DOCKER_HUB_IMAGE" "$DIGEST"

            printf '\n## The Helm chart\n\n```\nhelm install mailfathom oci://%s --version %s\n```\n' "$CHART" "$VERSION"
            printf '\nThe chart is published to GHCR alone, because Docker Hub has no repository path to hold it beside '
            printf 'the image. Its `appVersion` is this release, and it deploys the digest above.\n'

            printf '\n## The database schema\n\n'
            printf 'Apply `%s` before rolling this version out, and take a backup first. ' "$schema_artifact_name"
            printf 'MailFathom applies no schema change while starting and refuses to serve against a schema it does '
            printf 'not recognize, so the order is: back up, apply the script, then deploy the image.\n\n'
            printf '| | |\n| --- | --- |\n'
            printf '| Artifact | `%s` |\n' "$schema_artifact_name"
            printf '| SHA-256 | `%s` |\n' "$SCHEMA_CHECKSUM"
            printf '| Migrations | `%s` |\n\n' "$SCHEMA_MIGRATIONS"
            printf 'The script is idempotent, so an installation already carrying some of those migrations takes only '
            printf 'what it is missing. [Applying the database schema](https://github.com/%s/blob/%s/docs/operations/database-schema.md)' \
              "$REPOSITORY" "$RELEASE_TAG"
            printf ' states the privileges it needs, the locks it takes, and what each startup failure means.\n'

            printf '\n## The administration command\n\n'
            printf 'Download the binary for the machine you administer from, not for the machine the service runs on: '
            printf '`mfctl` reaches a deployment over HTTP and runs on Linux and Windows alike. Verify it against '
            printf '`mfctl-%s.sha256`, make it executable, and run `mfctl login --endpoint https://host:port`. ' "$VERSION"
            printf '[Administering a deployment](https://github.com/%s/blob/%s/docs/operations/admin-endpoint.md)' \
              "$REPOSITORY" "$RELEASE_TAG"
            printf ' states what the service has to have enabled before it will answer.\n\n'
            printf 'On Linux there is a shorter path, which downloads the binary for the machine it runs on, checks '
            printf 'it against the checksum file above, and installs it into `~/.local/bin`:\n\n'
            printf '```bash\ncurl -fsSL https://raw.githubusercontent.com/%s/%s/scripts/install-mfctl.sh \\\n' \
              "$REPOSITORY" "$RELEASE_TAG"
            printf '  | bash -s -- --version %s\n```\n\n' "$VERSION"
            printf 'The script is fetched at the tag of this release, so what it installs is this version rather than '
            printf 'whatever is newest. Read it before you run it: it is one file and it is short.\n\n'
            printf 'None of the binaries carries a code signature, so Windows warns about an unknown publisher and '
            printf '`mfctl-%s.sha256` is what verifies a download — on every platform.\n' "$VERSION"

            printf '\n## The client\n\n'
            printf 'There are two ways to have it, and the deployment decides which. The **browser head** travels '
            printf 'inside the image above and is served by the deployment itself, from the same address its client '
            printf 'surface answers on — one setting turns it on, and '
            printf '[the client endpoint](https://github.com/%s/blob/%s/docs/operations/client-endpoint.md) ' \
              "$REPOSITORY" "$RELEASE_TAG"
            printf 'is the page. The **desktop head** is attached to this release for Windows, as '
            printf '`mailfathom-client-%s-win-x64.zip` and `mailfathom-client-%s-win-arm64.zip`; unpack one and run ' \
              "$VERSION" "$VERSION"
            printf '`MailFathom.Client.exe`. Verify a download against `mailfathom-client-%s.sha256`, which is the ' "$VERSION"
            printf 'only thing that verifies it: no artifact here is code-signed either.\n\n'
            printf 'Each archive carries `LICENSE` and `NOTICE` beside the application, which are the terms '
            printf 'MailFathom itself is under: everything else inside it is permissively licensed and owes no '
            printf 'notice of its own.\n'
          } > "$notes_file"

          # Idempotent, because a re-run of a release must not fail on the release it already created.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" --title "MailFathom $VERSION" --notes-file "$notes_file" --verify-tag
          fi

          # --clobber for the same reason the release itself is created idempotently: a re-run replaces the assets it
          # uploaded rather than failing on them.
          gh release upload "$RELEASE_TAG" \
            "artifacts/schema/${schema_artifact_name}" \
            "artifacts/schema/${schema_artifact_name}.sha256" \
            --clobber

          # Every published platform of the command, plus the one checksum file covering all of them. Guarded rather
          # than assumed, because this job runs whether or not the command built.
          if [ -d artifacts/cli ]; then
            gh release upload "$RELEASE_TAG" artifacts/cli/* --clobber
          fi

          # Every published head of the client, plus its own checksum file. Guarded like the command above, because
          # this job runs whether or not the client built.
          if [ -d artifacts/desktop ]; then
            gh release upload "$RELEASE_TAG" artifacts/desktop/* --clobber
          fi

  # The Windows Package Manager channel, offered from the assets the job above has just attached. It is paused, and the
  # condition below is where that is said; what follows is why the job has the shape it has, for whoever resumes it.
  #
  # It is last because it has to be: winget's validation downloads the installer the manifest names, and that URL is a
  # release asset which does not resolve until the release exists.
  #
  # It gates nothing, like the build it consumes. A submission that failed leaves every published artifact in place and
  # costs a Windows operator the packaged path to a command they can still download, which is the same trade the
  # command build already makes.
  submit-winget-manifest:
    name: Submit the winget manifest
    # Paused, per #791. The community repository's review is what accepts a submission, two of MailFathom's are open
    # against it and neither has been reached, and their one-pull-request-per-version rule means a release cannot
    # shorten that wait by submitting again — it can only add a version behind the ones already queued. So this stops
    # submitting until those are accepted, and the whole of what resumes it is deleting this condition.
    #
    # `false` rather than the job being deleted, because nothing about the channel is decided against: the reusable
    # workflow, the manifest renderer, and their tests all stay, and a paused job that reappears in the run graph as
    # skipped is what says so where a release is read. `docs/operations/release-procedure.md` carries the same pause,
    # in the section describing this submission, together with the pages resuming it obliges.
    if: false
    # The condition above is the only one. There is deliberately no `!cancelled()` beside it and there was none before
    # the pause either: a manifest is worth submitting only when the binaries were built and the release that carries
    # them exists, which is exactly what the default `needs` semantics already say, and writing that out would let a
    # cancelled release submit a manifest anyway.
    needs:
      - assert
      - cli-binaries
      - announce
    permissions:
      contents: read
    uses: ./.github/workflows/submit-winget-manifest.yml
    with:
      ref: ${{ needs.assert.outputs.revision }}
      version: ${{ needs.assert.outputs.version }}
      artifact: ${{ needs.cli-binaries.outputs.artifact }}
    secrets:
      WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
